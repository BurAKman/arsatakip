# Ihale avcisi kesif: resmi ihale sitelerine erisim testi (elle calistirilir, sadece okur)
name: ihale-kesif
on:
  workflow_dispatch: {}
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: bot
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node bot/ihale-kesif.js
