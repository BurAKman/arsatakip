const TB3  = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api";

let FN = null;                              // calisan fonksiyon adi
const FN_ADAYLARI = ["tkgm","quick-task"];

async function tkgm(u){
  const adaylar = FN ? [FN] : FN_ADAYLARI;
  let sonHata = null;
  for(const ad2 of adaylar){
    const { data, error } = await sb.functions.invoke(ad2, { body:{ u } });
    if(error){ sonHata = error; continue; }          // fonksiyon yok, digerini dene
    FN = ad2;
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  throw new Error(sonHata?.message || "aracıya ulaşılamadı");
}
const dizi = d => {
  if(Array.isArray(d)) return d;
  if(!d || typeof d !== "object") return [];
  if(Array.isArray(d.features)) return d.features;
  for(const k of ["data","liste","items","result","results","rows","value"])
    if(Array.isArray(d[k])) return d[k];
  const ilk = Object.values(d).find(v=>Array.isArray(v));
  return ilk || [];
};
const duz = o => (o && typeof o === "object" && o.properties) ? { ...o.properties, ...o } : o;
const ad = o => {
  if(typeof o === "string") return o;
  o = duz(o); if(!o || typeof o !== "object") return String(o ?? "");
  const g = Object.keys(o).find(k=>/^(text|ad|adi|ad_i|name|isim|label|title|.*Ad|.*Adi)$/i.test(k) && typeof o[k]==="string" && o[k].trim());
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="string" && v.trim() && !/^\d+$/.test(v) && !/id$/i.test(k));
  return h ? h[1] : "";
};
const kim = o => {
  o = duz(o); if(!o || typeof o !== "object") return "";
  const g = Object.keys(o).find(k=>/^(id|value|.*Id|kod|no)$/i.test(k) && (typeof o[k]==="number" || /^\d+$/.test(String(o[k]??""))));
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="number" || /^\d+$/.test(String(v??"")));
  return h ? h[1] : "";
};

const zamanAsimi = (p, ms=9000) => Promise.race([p,
  new Promise((_,r)=>setTimeout(()=>r(new Error("zaman aşımı")), ms))]);

// adaylari sirayla dener, dolu liste donen ilkini kullanir
async function ilkCalisan(adaylar){
  const hatalar = [];
  for(const u of adaylar){
    try{
      const d = dizi(await zamanAsimi(tkgm(u)));
      if(d.length) return { u, d };
      hatalar.push(`${u} → boş döndü`);
    }catch(e){ hatalar.push(`${u} → ${e.message||e}`); }
  }
  const hata = new Error("hiçbir uç cevap vermedi");
  hata.detay = hatalar.join("\n\n");
  throw hata;
}

async function idariKur(pre, sonrasi){
  const S = k => document.getElementById(pre + k);
  const doldur = (el, list, bos) => {
    const temiz = list.map(o=>({ a:String(ad(o)||"").trim(), k:String(kim(o)||"") }))
                      .filter(o=>o.a && o.k)
                      .sort((x,y)=>x.a.localeCompare(y.a,"tr"));
    if(!temiz.length) throw new Error("liste okunamadı");
    el.innerHTML = `<option value="">${bos}</option>` +
      temiz.map(o=>`<option value="${esc(o.k)}">${esc(o.a)}</option>`).join("");
    el.disabled = false;
  };
  const coz = () => {
    ["il","ilce","mah"].forEach(k=>{
      const el = S(k);
      el.outerHTML = `<input id="${pre}${k}" class="${el.className}" placeholder="${
        k==="il"?"İl":k==="ilce"?"İlçe":"Mahalle / köy"}">`;
    });
  };
  try{
    const { d:iller } = await ilkCalisan(IL_UCLARI);
    doldur(S("il"), iller, "İl seç");
    S("ilce").disabled = true; S("mah").disabled = true;

    S("il").onchange = async () => {
      S("ilce").innerHTML = `<option value="">yükleniyor…</option>`;
      S("mah").innerHTML = `<option value="">önce ilçe seç</option>`; S("mah").disabled = true;
      if(!S("il").value) return;
      try{
        const { d } = await ilkCalisan(ILCE_UCLARI(S("il").value));
        doldur(S("ilce"), d, "İlçe seç");
      }catch(e){
        S("ilce").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("İlçe listesi gelmedi", e.detay || e.message);
      }
    };
    S("ilce").onchange = async () => {
      S("mah").innerHTML = `<option value="">yükleniyor…</option>`;
      if(!S("ilce").value) return;
      try{
        const { d } = await ilkCalisan(MAH_UCLARI(S("ilce").value));
        doldur(S("mah"), d, "Mahalle / köy seç");
      }catch(e){
        S("mah").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("Köy listesi gelmedi", e.detay || e.message);
      }
    };
    if(sonrasi) S("mah").onchange = sonrasi;
  }catch(e){
    coz();
    taniYaz("İl listesi gelmedi, elle yazabilirsin", e.detay || e.message);
  }
}

function ciz(f){
  if(!f || !f.geometry) throw new Error("Parsel bulunamadı");
  SONPARSEL = f;
  const m = merkez(f);
  if(KATMAN) HARITA.removeLayer(KATMAN);
  KATMAN = L.geoJSON(f, { style:{ color:"#C9A227", weight:2.5, fillColor:"#C9A227", fillOpacity:.18 } }).addTo(HARITA);
  HARITA.fitBounds(KATMAN.getBounds(), { padding:[30,30], maxZoom:18 });
  const p = f.properties || {};
  document.getElementById("bilgi").innerHTML = `
    <div class="card">
      <div style="font-size:12px;color:var(--ink-3)">${esc(p.ilAd||"")} · ${esc(p.ilceAd||"")} · ${esc(p.mahalleAd||"")}</div>
      <div style="font-size:18px;font-weight:600;margin-top:3px">Ada ${esc(p.adaNo||"—")} · Parsel ${esc(p.parselNo||"—")}</div>
      <div class="kv" style="margin-top:10px"><span>Yüzölçümü</span><b class="mono">${esc(p.alan||"—")} m²</b></div>
      <div class="kv"><span>Niteliği</span><b>${esc(p.nitelik||"—")}</b></div>
      <div class="kv"><span>Mevkii</span><b>${esc(p.mevkii||"—")}</b></div>
      <div class="acts">
        <button onclick="kmlIndir()">KML indir</button>
        <a class="dis" href="${earthUrl(m.lat, m.lng)}" target="_blank" rel="noopener">Earth'te aç</a>
        <a class="dis yesilb" href="${yandexUrl(m.lat, m.lng)}" target="_blank" rel="noopener">Yandex uydu</a>
        <a class="dis yesilb" href="${yandexPanoUrl(m.lat, m.lng)}" target="_blank" rel="noopener">Sokak görünümü</a>
        ${ME.role==='admin'?`<button class="pri" onclick="haritadanKaydet()">Kaydet</button>`:""}
      </div>
    </div>`;
}

function merkez(f){
  const c = []; JSON.stringify(f.geometry.coordinates).replace(/\[(-?\d+\.?\d*),(-?\d+\.?\d*)\]/g,(m,a,b)=>{c.push([+a,+b]);return m;});
  const lng = c.reduce((s,p)=>s+p[0],0)/c.length, lat = c.reduce((s,p)=>s+p[1],0)/c.length;
  return { lat, lng };
}

function kmlMetni(f){
  const p = f.properties||{};
  const halka = g => (g.type==="Polygon"?[g.coordinates]:g.coordinates)
    .map(poly => poly[0].map(c=>`${c[0]},${c[1]},0`).join(" ")).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${p.ozet||"parsel"}</name>
<Style id="s"><LineStyle><color>ff27a2c9</color><width>3</width></LineStyle>
<PolyStyle><color>4027a2c9</color></PolyStyle></Style>
<Placemark><name>${p.mahalleAd||""} ${p.adaNo||""}/${p.parselNo||""}</name>
<description>${p.alan||""} m² · ${p.nitelik||""}</description><styleUrl>#s</styleUrl>
<Polygon><outerBoundaryIs><LinearRing><coordinates>${halka(f.geometry)}</coordinates>
</LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
}

function kmlIndir(){
  if(!SONPARSEL) return;
  const p = SONPARSEL.properties||{};
  const b = new Blob([kmlMetni(SONPARSEL)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${(p.mahalleAd||"parsel")}-${p.adaNo||0}-${p.parselNo||0}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

// dosyayi telefonun paylas menusune ver: whatsapp, mail, ne varsa
async function dosyaPaylas(yol, ad2){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 86400);
  if(error) return toast("Paylaşılamadı: " + error.message);
  try{
    if(navigator.canShare){
      const r = await fetch(data.signedUrl);
      const blob = await r.blob();
      const dosya = new File([blob], ad2, { type: blob.type || "application/octet-stream" });
      if(navigator.canShare({ files:[dosya] })){
        await navigator.share({ files:[dosya], title: ad2 });
        return;
      }
    }
    if(navigator.share){ await navigator.share({ title: ad2, url: data.signedUrl }); return; }
    await navigator.clipboard.writeText(data.signedUrl);
    toast("Bağlantı kopyalandı, yapıştırıp gönderebilirsin");
  }catch(e){
    if(String(e).includes("AbortError")) return;
    try{ await navigator.clipboard.writeText(data.signedUrl); toast("Bağlantı kopyalandı"); }
    catch(_){ toast("Paylaşılamadı"); }
  }
}

async function dosyaIndir(yol, ad2){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 3600, { download: ad2 });
  if(error) return toast("İndirilemedi: " + error.message);
  const a = document.createElement("a");
  a.href = data.signedUrl; a.download = ad2; a.click();
  toast("İndiriliyor");
}

let acikGrup = null;
// TR harflerini sadelestirip karsilastir: "MUHACİRKADI" ile "Muhacırkadı" ayni sayilsin
const sade = x => String(x||"")
  .replace(/[İIıi]/g,"i").replace(/[Şş]/g,"s").replace(/[Ğğ]/g,"g")
  .replace(/[Üü]/g,"u").replace(/[Öö]/g,"o").replace(/[Çç]/g,"c")
  .toLowerCase().replace(/[^a-z0-9]/g,"");
const anahtar = p => [sade(p.il), sade(p.ilce), sade(p.mahalle)].join("|");
const duzgun = x => String(x||"").trim().toLocaleLowerCase("tr")
  .replace(/(^|[\s\-\/])([a-zçğıöşü])/g, (m,a,b)=>a+b.toLocaleUpperCase("tr"));

// ayni koydeki parselleri tek baslik altinda topla
function grupla(rows){
  const g = {};
  rows.forEach(r=>{
    const p = r.parcels, k = anahtar(p);
    (g[k] ||= { il:duzgun(p.il), ilce:duzgun(p.ilce), mah:duzgun(p.mahalle), list:[] }).list.push(r);
  });
  return Object.entries(g).sort((a,b)=>a[1].mah.localeCompare(b[1].mah,"tr"));
}

function grupBasi(k, gr, acik, sayiEk){
  return `<button class="ghd grpBas${acik?" open":""}" onclick="acikGrup=${acik?"null":`'${k.replace(/'/g,"\\'")}'`};${sayiEk}()">
    <span class="chev">›</span>

    <span class="txt"><b>${esc(gr.mah)}</b><small>${esc(gr.il)} · ${esc(gr.ilce)}</small></span>

}

          ? { zemin:"rgba(111,176,245,.11)", cizgi:"rgba(111,176,245,.22)", ad:"#9CC8F7", alt:"rgba(156,200,247,.7)", tutar:"#6FB0F5" }
          : o.satilik
          ? { zemin:"rgba(95,215,154,.09)",  cizgi:"rgba(95,215,154,.2)",  ad:"#A8E4C4", alt:"rgba(168,228,196,.65)", tutar:"var(--gold)" }
          : { zemin:"rgba(170,178,184,.07)", cizgi:"rgba(170,178,184,.16)", ad:"#AEB6BC", alt:"rgba(174,182,188,.55)", tutar:"#8E969C" };
        return `<div style="display:flex;align-items:center;gap:9px;border:1px solid ${ton.cizgi};
          padding:9px 10px;margin-bottom:6px;border-radius:10px;background:${ton.zemin}">

            color:${renk};border:1px solid ${renk}55;border-radius:8px;padding:4px 6px">${esc(o.no||"")}</span>

            <b style="font-size:13.5px;font-weight:500;display:block;color:${ton.ad}">${esc(o.ad || (o.no + " nolu parça"))}</b>
            <small style="font-size:11.5px;color:${ton.alt};display:block">${nf2(o.m2||0)} m² · ${durum}${o.m2_fiyat ? " · " + nf(Math.round(o.m2_fiyat)) + " ₺/m²" : ""}</small>
            ${(o.m2 && (o.m2_fiyat || o.maliyet_m2)) ? (() => {
              const kr = (+o.m2||0)*((+o.m2_fiyat||0)-(+o.maliyet_m2||0));
              return `<small style="font-size:11.5px;color:${kr>=0?"var(--green)":"var(--red)"};display:block;margin-top:1px">
                Kâr: ${nf(Math.round(kr))} ₺${o.maliyet_m2 ? ` · maliyet ${nf(Math.round(o.maliyet_m2))} ₺/m²` : ""}</small>`; })() : ""}
            ${o.notu ? `<small style="font-size:11px;color:var(--ink-3);display:block;margin-top:2px">${esc(o.notu)}</small>` : ""}</div>
          ${o.m2 && o.m2_fiyat ? `<b class="mono" style="color:${ton.tutar};font-size:13px">${nf(Math.round(o.m2*o.m2_fiyat))} ₺</b>` : ""}
        </div>`;
      }).join("")}
      ${ME.role!=='uye' ? `<button class="btn ghost" style="margin-top:12px" onclick="go('parcalar','${id}')">Parçaları Düzenle</button>` : ""}
    </div>`; })() : ""}

    <div class="card">
      <div class="bolum"><span class="rz yesil">${svg("tag")}</span><b>Arazi özellikleri</b></div>
      ${etiketAd.length
        ? `<div style="display:flex;gap:7px;flex-wrap:wrap">${etiketAd.map(t=>`<span class="pill on">${esc(t)}</span>`).join("")}</div>`
        : `<div style="color:var(--ink-3);font-size:13px">Etiket eklenmemiş. Tapu bilgileri ekranından ekleyebilirsin.</div>`}
    </div>

    ${(kisiler||[]).filter(k=>k.parcel_id===id).length ? `<div class="card">
      <div class="bolum">
        <span class="rz mavi">${svg("file")}</span><b>Bu parsele bağlı belgeler</b></div>
      ${kisiler.filter(k=>k.parcel_id===id).map(k=>`<div style="border-top:1px solid var(--cizgi);padding:10px 0 4px">
        <div style="display:flex;align-items:center;gap:8px">
          <b style="font-size:14px;font-weight:500;flex:1">${esc(k.ad_soyad)}</b>
          ${k.gecerlilik_tarihi?`<span class="pill sade">${new Date(k.gecerlilik_tarihi).toLocaleDateString("tr-TR")}</span>`:""}</div>
        ${kisiBelge[k.vekalet_doc_id] ? dosyaSatiri({...kisiBelge[k.vekalet_doc_id], kind:"vekalet"}) : ""}
        ${kisiBelge[k.muvafakat_doc_id] ? dosyaSatiri({...kisiBelge[k.muvafakat_doc_id], kind:"muvafakat"}) : ""}
        ${!kisiBelge[k.vekalet_doc_id] && !kisiBelge[k.muvafakat_doc_id]
          ? `<div style="font-size:12px;color:var(--ink-3);padding:6px 0">Belge yüklenmemiş.</div>` : ""}
      </div>`).join("")}
    </div>` : ""}

    <div class="card">
      <div class="bolum"><span class="rz altin">${svg("photo")}</span><b>Belgeler ve görseller</b>
        <span class="sayi">${(belgeler||[]).length}</span></div>
      ${(belgeler||[]).length
        ? grupSira.filter(k=>grup[k]).map(k=>`
            <div style="border-top:1px solid var(--cizgi);padding:8px 0 2px">
              <div class="tur">${BELGE_AD[k]||k}</div>
              ${grup[k].map(b=>dosyaSatiri(b,
                  ME.role==='admin' ? `<button class="kirmizi" aria-label="Sil" onclick="belgeSilVeYenile('${b.id}','${esc(b.file_path)}','parsel','${id}')">${svg("trash")}</button>` : "",
                  (ME.role==='admin' && b.kind==='cap') ? `<button aria-label="Düzenle" onclick="go('capAyar','${id}|${b.id}')">${svg("kalem")}</button>` : ""
                )).join("")}</div>`).join("")
        : `<div style="color:var(--ink-3);font-size:13px">Henüz belge yok. Tapu bilgileri ekranından yükleyebilirsin.</div>`}
    </div>

    <div class="card">
      <div class="bolum"><span class="rz kirmizi">${svg("note")}</span><b>Notlar</b>
        <span class="sayi">${(notlar||[]).length}</span></div>
      ${ME.role!=='uye'?`<div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="not" placeholder="Not yaz…"><button class="btn" style="width:auto;padding:12px 18px" id="notEkle">Ekle</button></div>`:""}
      ${(notlar||[]).length? notlar.map(n=>{
          const kim2 = (n.profiles?.full_name||"").split("@")[0];
          return `<div style="border-top:1px solid var(--cizgi);padding:12px 0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
            <span style="width:26px;height:26px;border-radius:50%;background:var(--gold-soft);color:var(--gold);
              display:grid;place-items:center;font-size:11px;font-weight:700">${esc((kim2||"?").slice(0,2).toLocaleUpperCase("tr"))}</span>
            <b style="font-size:13px;font-weight:600;flex:1">${esc(kim2||"kullanıcı")}</b>
            <span style="font-size:11px;color:var(--ink-3)">${new Date(n.created_at).toLocaleString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>
          <div style="font-size:15px;line-height:1.5;color:#fff">${esc(n.content)}</div></div>`;}).join("")
        : `<div style="color:var(--ink-3);font-size:13px">Henüz not yok.</div>`}
    </div>`;

  const btn = document.getElementById("notEkle");
  if(btn) btn.onclick = async () => {
    const c = document.getElementById("not").value.trim();
    if(!c) return;
    const { error } = await sb.from("notes").insert({ team_id:ME.team_id, parcel_id:id, user_id:ME.id, content:c });
    if(error) return toast("Olmadı: "+error.message);
    parselDetay(id);
  };
}

async function belgeEkle(parselId, tur, donus, donusArg){
  const f = await dosyaSec(tur === "video" ? "video/*" : "image/*,application/pdf");
  if(!f) return;
  toast("Yükleniyor…");
  try{
    await dosyaYukle(f, tur, parselId);
    toast("Yüklendi");
    (ekranlar[donus||"parsel"] || parselDetay)(donusArg || parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

async function belgeSilVeYenile(belgeId, yol, donus, donusArg){
  if(await belgeSil(belgeId, yol)) (ekranlar[donus||"parsel"] || parselDetay)(donusArg);
}

/* ================= fiyat ve hisse ================= */

async function fiyat(){
  app.innerHTML = head("Tapu Bilgileri","go('ana')") + `
    <div class="bar"><select class="year" id="yil3">${yilSecenek()}</select></div>
    <div id="fl"><div class="spin"></div></div>`;
  document.getElementById("yil3").onchange = e => { YEAR = +e.target.value; fiyatListele(); };
  fiyatListele();
}

let FIYAT_PARCA = {};

async function fiyatListele(){
  const box = document.getElementById("fl");
  const { data, error } = await sb.from("parcel_years")
    .select("*,parcels(id,il,ilce,mahalle,ada,parsel,alan_m2,geojson)").eq("yil",YEAR);
  if(error) return box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  const rows = (data||[]).filter(r=>r.parcels);

  // parcalari topluca cek, satirlarda ozetlensin
  FIYAT_PARCA = {};
  try{
    const { data:pc } = await sb.from("parca").select("*")
      .in("parcel_id", rows.map(r=>r.parcels.id));
    (pc||[]).forEach(o=>(FIYAT_PARCA[o.parcel_id] ||= []).push(o));
  }catch(e){}
  if(!rows.length) return box.innerHTML = `<div class="empty"><b>${YEAR} boş</b>Önce haritadan parsel ekle.</div>`;
  box.innerHTML = grupla(rows).map(([k,gr])=>{
    const acik = acikGrup === k;
    return `<div class="grp">${grupBasi(k, gr, acik, "fiyatListele")}
      ${acik ? gr.list.map(fiyatSatir).join("") : ""}</div>`;
  }).join("");
}

function fiyatSatir(r){
  const p = r.parcels;
  const pc = (FIYAT_PARCA[p.id] || []);
  const alan = o => +o.m2 || 0, satis = o => (+o.m2||0)*(+o.m2_fiyat||0), mal = o => (+o.m2||0)*(+o.maliyet_m2||0);
  const topla = (l,f) => l.reduce((t,o)=>t+f(o),0);
  const satilik = pc.filter(o=>o.satilik && !o.satildi);
  const satilan = pc.filter(o=>o.satildi);
  const stAlan = topla(satilik,alan), stSatis = topla(satilik,satis);
  const kar = stSatis - topla(satilik,mal);

  return `<div style="border-top:1px solid var(--cizgi);background:var(--cam-2);padding:14px;${r.aktif?"":"opacity:.55"}">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="kod" style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);
        background:var(--gold-soft);border-radius:8px;padding:6px 10px">${esc(p.ada||"—")}/${esc(p.parsel)}</span>
      <span class="pill ${r.aktif?"on":"off"}">${r.yil} · ${r.aktif?"aktif":"pasif"}</span>
      <span style="flex:1"></span>
      ${pc.length?`<span class="pill sade">${pc.length} parça</span>`:""}
    </div>
    <div class="kv" style="margin-top:10px"><span>Yüzölçümü</span><b class="mono">${nf2(gercekAlan(p))} m²</b></div>
    ${pc.length ? `
      <div class="kv"><span>Satılık</span><b class="mono">${satilik.length} parça · ${nf2(stAlan)} m²</b></div>
      <div class="kv"><span>Ortalama m² fiyatı</span><b class="mono">${stAlan?nf(Math.round(stSatis/stAlan))+" ₺":"—"}</b></div>
      <div class="kv"><span>Satış bedeli</span><b class="mono">${nf(Math.round(stSatis))} ₺</b></div>
      <div class="kv"><span style="color:${kar>=0?"var(--green)":"var(--red)"}">Beklenen kâr</span>
        <b class="mono" style="color:${kar>=0?"var(--green)":"var(--red)"}">${nf(Math.round(kar))} ₺</b></div>
      ${satilan.length?`<div class="kv"><span>Satılan</span><b class="mono">${satilan.length} parça · ${nf(Math.round(topla(satilan,satis)))} ₺</b></div>`:""}
    ` : `
      <div class="kv"><span>m² fiyatı</span><b class="mono">${r.m2_fiyat?nf(r.m2_fiyat)+" ₺":"—"}</b></div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:8px">Parçalara ayrılmamış.</div>`}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${r.ilan_url?`<a class="pill gold" href="${esc(r.ilan_url)}" target="_blank" rel="noopener">ilan</a>`:""}
      <button class="pill sade" onclick="go('parcalar','${p.id}')">parçalar</button>
      ${ME.role!=='uye'?`<button class="pill gold" onclick="go('fiyatDuzen','${r.id}')">düzenle</button>`:""}
    </div></div>`;
}

let SONPARSELID = null;
async function fiyatDuzen(id){
  app.innerHTML = head("Tapu kaydı", SONPARSELID?`go('parsel','${SONPARSELID}')`:"go('fiyat')") + `<div class="spin"></div>`;
  const { data:r } = await sb.from("parcel_years")
    .select("*,parcels(id,il,ilce,mahalle,ada,parsel,alan_m2,nitelik,lat,lng)").eq("id",id).single();
  if(!r) return;
  const p = r.parcels;
  const { data:belgeler } = await sb.from("documents").select("*").eq("parcel_id", p.id).order("created_at",{ascending:false});

  app.innerHTML = head(`${p.ada||"—"}/${p.parsel}`, SONPARSELID?`go('parsel','${SONPARSELID}')`:"go('fiyat')") + `
    <div class="card">
      <div style="font-size:12px;color:var(--ink-3)">${esc(duzgun(p.il))} · ${esc(duzgun(p.ilce))} · ${esc(duzgun(p.mahalle))}</div>
      <div style="font-size:17px;font-weight:600;margin-top:3px">Ada ${esc(p.ada||"—")} · Parsel ${esc(p.parsel)}</div>
      <div class="kv" style="margin-top:8px"><span>Yüzölçümü</span><b class="mono">${nf2(gercekAlan(p))} m²</b></div>
      <div class="kv"><span>Niteliği</span><b>${esc(p.nitelik||"—")}</b></div>
      ${p.lat?`<button class="btn ghost" style="margin-top:12px" id="tazele">TKGM'den Tazele</button>`:""}
    </div>

    <div class="field" style="display:none"><label>Malik</label>
      <textarea id="mlk" rows="3">${esc(r.malik||"")}</textarea></div>

    <div class="card" id="parcaOzetKart"></div>

    <h3 style="font-size:14px;margin:20px 0 10px">Fiyat ve İlan</h3>
    <div class="field"><label>Genel m² fiyatı (₺) · parçalara ayırmadıysan</label>
      <input id="mf" inputmode="decimal" value="${ham(r.m2_fiyat)}" onfocus="this.select()"></div>
    <div class="field"><label>sahibinden ilan bağlantısı</label>
      <input id="il2" value="${esc(r.ilan_url||"")}" placeholder="https://..."></div>
    <div class="field"><label>Durum</label><select id="ak">
      <option value="1"${r.aktif?" selected":""}>Aktif · satışta</option>
      <option value="0"${!r.aktif?" selected":""}>Pasif · satışta değil</option></select></div>
    <button class="btn" id="kay">Bilgileri Kaydet</button>

    <h3 style="font-size:14px;margin:26px 0 10px">Arazi özellikleri</h3>
    <div class="card">
      <div id="etiketKutu" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px">
        <input id="etYeni" placeholder="yola cepheli, köye 800 m…">
        <button class="btn" style="width:auto;padding:12px 18px" id="etEkle">Ekle</button></div>
    </div>

    <h3 style="font-size:14px;margin:26px 0 10px">Belgeler ve görseller</h3>
    <div class="acts" style="margin:0 0 12px">
      <button onclick="belgeEkle('${p.id}','tapu','fiyatDuzen','${id}')">Tapu</button>
      <button onclick="belgeEkle('${p.id}','rayic','fiyatDuzen','${id}')">Rayiç</button>
      <button onclick="belgeEkle('${p.id}','resim','fiyatDuzen','${id}')">Fotoğraf</button>
      <button onclick="belgeEkle('${p.id}','video','fiyatDuzen','${id}')">Video</button>
      <button onclick="belgeEkle('${p.id}','sunum','fiyatDuzen','${id}')">İlan görseli</button>
      <button onclick="belgeEkle('${p.id}','diger','fiyatDuzen','${id}')">Diğer</button>
    </div>
    <div class="card">${belgeListesiHtml(belgeler, p.id, "fiyatDuzen", id)}</div>
    <p class="ipuc" style="margin-top:14px">Buraya yüklediğin her şey Araziler ekranında bu parselin altında toplu görünür.</p>`;

  etiketleriGoster(p.id);
  document.getElementById("etEkle").onclick = async () => {
    const ad2 = document.getElementById("etYeni").value.trim();
    if(!ad2) return;
    let { data:t } = await sb.from("tags").select("id").eq("team_id",ME.team_id).eq("name",ad2).maybeSingle();
    if(!t){
      const { data:yeni, error } = await sb.from("tags").insert({ team_id:ME.team_id, name:ad2 }).select().single();
      if(error) return toast("Olmadı: "+error.message);
      t = yeni;
    }
    const { error:e2 } = await sb.from("parcel_tags").insert({ parcel_id:p.id, tag_id:t.id, team_id:ME.team_id });
    if(e2 && !/duplicate/i.test(e2.message)) return toast("Olmadı: "+e2.message);
    document.getElementById("etYeni").value = "";
    etiketleriGoster(p.id);
  };

  const alan = gercekAlan(p);
  const g = k => document.getElementById(k);

  // parca ozeti: bu ekranda sadece gosterilir, duzenleme parcalar ekraninda
  (async () => {
    const { data:pc } = await sb.from("parca").select("*").eq("parcel_id", p.id).order("sira");
    FIYAT_PARCA[p.id] = pc || [];
    const kutu = g("parcaOzetKart");
    if(!kutu) return;
    const A = o => +o.m2 || 0, S = o => (+o.m2||0)*(+o.m2_fiyat||0), M = o => (+o.m2||0)*(+o.maliyet_m2||0);
    const T = (l,f) => l.reduce((t,o)=>t+f(o),0);
    const satilik = (pc||[]).filter(o=>o.satilik && !o.satildi);
    const satilan = (pc||[]).filter(o=>o.satildi);
    const stAlan = T(satilik,A), stSatis = T(satilik,S), kar = stSatis - T(satilik,M);

    kutu.innerHTML = `
      <div class="bolum"><span class="rz altin">${svg("vector")}</span><b>Parçalar / Hisseler</b>
        <span class="sayi">${(pc||[]).length} parça</span></div>
      ${(pc||[]).length ? `
        <div class="kv"><span>Satılık</span><b class="mono">${satilik.length} parça · ${nf2(stAlan)} m²</b></div>
        <div class="kv"><span>Ortalama m² fiyatı</span><b class="mono">${stAlan?nf(Math.round(stSatis/stAlan))+" ₺":"—"}</b></div>
        <div class="kv"><span>Satış bedeli</span><b class="mono">${nf(Math.round(stSatis))} ₺</b></div>
        <div class="kv"><span style="color:${kar>=0?"var(--green)":"var(--red)"}">Beklenen kâr</span>
          <b class="mono" style="color:${kar>=0?"var(--green)":"var(--red)"}">${nf(Math.round(kar))} ₺</b></div>
        ${satilan.length?`<div class="kv"><span>Satılan</span><b class="mono">${satilan.length} parça · ${nf(Math.round(T(satilan,S)))} ₺</b></div>`:""}`
      : `<div style="font-size:13px;color:var(--ink-3)">Bu parsel parçalara ayrılmamış.
          Çap çizdikten sonra parçaları oradan alabilirsin.</div>`}
      ${ME.role!=='uye'?`<button class="btn ghost" style="margin-top:12px" onclick="go('parcalar','${p.id}')">
        Parçaları Düzenle</button>`:""}`;
  })();

  const tz = g("tazele");
  if(tz) tz.onclick = async e => {
    e.target.disabled = true; e.target.textContent = "TKGM sorgulanıyor…";
    try{
      const f = await zamanAsimi(tkgm(`${TB3}/parsel/${p.lat}/${p.lng}`));
      if(!f || !f.geometry) throw new Error("parsel bulunamadı");
      const q = f.properties || {};
      await sb.from("parcels").update({
        il:q.ilAd||p.il, ilce:q.ilceAd||p.ilce, mahalle:q.mahalleAd||p.mahalle,
        ada:q.adaNo||p.ada, parsel:String(q.parselNo||p.parsel),
        alan_m2: alanCoz(q.alan), nitelik:q.nitelik||null, mevkii:q.mevkii||null, geojson:f
      }).eq("id", p.id);
      toast("Tazelendi"); fiyatDuzen(id);
    }catch(err){ e.target.disabled = false; e.target.textContent = "TKGM'den Tazele"; toast("Olmadı: "+(err.message||err)); }
  };

  g("kay").onclick = async e => {
    e.target.disabled = true;
    const birim = sayiCoz(g("mf").value) || null;
    const parcaToplam = (FIYAT_PARCA[p.id]||[])
      .filter(o=>o.satilik && !o.satildi)
      .reduce((t,o)=>t + (+o.m2||0)*(+o.m2_fiyat||0), 0);
    const { error } = await sb.from("parcel_years").update({
      malik: g("mlk").value.trim() || null,
      m2_fiyat: birim,
      toplam_fiyat: parcaToplam > 0 ? Math.round(parcaToplam)
        : (birim ? Math.round(birim * gercekAlan(p)) : null),
      ilan_url: g("il2").value.trim() || null,
      aktif: g("ak").value === "1",
      pasif_tarihi: g("ak").value === "1" ? null : (r.pasif_tarihi || new Date().toISOString())
    }).eq("id", id);
    e.target.disabled = false;
    if(error) return toast("Olmadı: "+error.message);
    toast("Kaydedildi");
    if(SONPARSELID){ const g2 = SONPARSELID; SONPARSELID = null; go("parsel", g2); }
  };
}

function belgeListesiHtml(belgeler, parselId, donus, donusArg){
  if(!belgeler || !belgeler.length) return `<div style="color:var(--ink-3);font-size:13px">Henüz belge yok.</div>`;
  return `<div id="topluCubuk" class="acts" style="display:none;margin:0 0 10px">
      <button class="pri" onclick="topluPaylas()">Seçilenleri Paylaş</button>

const seciliDosyalar = () => Array.from(document.querySelectorAll(".dosyaSec:checked"))
  .map(k=>({ yol:k.dataset.yol, ad:k.dataset.ad }));

function secimGuncelle(){
  const n = seciliDosyalar().length;
  const c = document.getElementById("topluCubuk"), sy = document.getElementById("secimSayi");
  if(c) c.style.display = n ? "flex" : "none";
  if(sy) sy.textContent = n ? n + " belge seçili" : "";

function secimTemizle(){
  document.querySelectorAll(".dosyaSec:checked").forEach(k=>{ k.checked = false; });
  secimGuncelle();

async function topluPaylas(){
  const secim = seciliDosyalar();
  if(!secim.length) return;
  if(secim.length === 1) return dosyaPaylas(secim[0].yol, secim[0].ad);
  toast(secim.length + " belge hazırlanıyor…");
  try{
    const dosyalar = [];
    for(const o of secim){
      const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(o.yol, 86400);
      if(error) continue;
      const r = await fetch(data.signedUrl);
      const bl = await r.blob();
      dosyalar.push(new File([bl], o.ad, { type: bl.type || "application/octet-stream" }));
    }
    if(!dosyalar.length) return toast("Belgeler alınamadı");
    if(navigator.canShare && navigator.canShare({ files: dosyalar })){
      await navigator.share({ files: dosyalar, title: "Belgeler" });
    }else{
      dosyalar.forEach((f,i)=>setTimeout(()=>{
        const u = URL.createObjectURL(f);
        const a = document.createElement("a");
        a.href = u; a.download = f.name; a.click();
        setTimeout(()=>URL.revokeObjectURL(u), 4000);
      }, i*400));
      toast("Paylaşım desteklenmiyor, indirildi");
    }
    secimTemizle();
  }catch(e){ if(e.name !== "AbortError") toast("Olmadı: " + (e.message||e)); }
}

async function topluIndir(){
  const secim = seciliDosyalar();
  if(!secim.length) return;
  toast(secim.length + " belge indiriliyor…");
  for(const o of secim){
    await dosyaIndir(o.yol, o.ad);
    await new Promise(r=>setTimeout(r, 400));
  }
  secimTemizle();
}

async function corineSinif(lat, lng){
  const d = 0.0009;
  const u = "https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer/identify"
    + `?f=json&geometryType=esriGeometryPoint&sr=4326&layers=all&tolerance=3&returnGeometry=false`
    + `&imageDisplay=400,400,96&mapExtent=${lng-d},${lat-d},${lng+d},${lat+d}`
    + `&geometry=${encodeURIComponent(JSON.stringify({ x:lng, y:lat, spatialReference:{ wkid:4326 } }))}`;
  const r = await zamanAsimi(tkgm(u), 15000);
  const sonuc = r?.results?.[0];
  if(!sonuc) return null;
  const oz = sonuc.attributes || {};
  const metin = Object.values(oz).map(v=>String(v)).join(" ");
  const kod = (metin.match(/\b([1-5]\d\d)\b/) || [])[1];
  return { kod, ad: (kod && CLC_AD[kod]) || sonuc.value || sonuc.layerName || null };
}

const OVER = "https://overpass-api.de/api/interpreter?data=";
let CEVRE_SON = null;   // son cikarilan cevre ozeti

function uzaklik(a, b){                       // metre
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b.lng-a.lng) * Math.cos(rad((a.lat+b.lat)/2));
  const df = rad(b.lat-a.lat);
  return Math.round(Math.sqrt(dl*dl + df*df) * R);
}
const km = m => m >= 1000 ? (m/1000).toFixed(1).replace(".",",") + " km" : m + " m";

const YOL_AD = { motorway:"Otoyol", trunk:"Devlet yolu", primary:"Ana yol", secondary:"Tali yol",
  tertiary:"Bağlantı yolu", unclassified:"Köy yolu", residential:"Yerleşim yolu", track:"Tarla yolu",
  service:"Servis yolu" };
const YER_AD = { city:"Şehir", town:"İlçe/kasaba", village:"Köy", hamlet:"Mezra", suburb:"Mahalle" };

const OVER_SUNUCU = [
  "https://overpass.kumi.systems/api/interpreter?data=",
  "https://overpass-api.de/api/interpreter?data=",
  "https://overpass.osm.ch/api/interpreter?data=",
  "https://overpass.private.coffee/api/interpreter?data="
];

// 0 = tam, 1 = orta, 2 = cok hafif
function cevreSorgusu(lat, lng, kademe){
  if(kademe === 2) return `[out:json][timeout:15];(
    node(around:9000,${lat},${lng})[place~"^(town|village)$"];
    way(around:900,${lat},${lng})[highway];
  );out center tags;`;
  if(kademe === 1) return `[out:json][timeout:20];(
    node(around:10000,${lat},${lng})[place~"^(city|town|village)$"];
    way(around:1200,${lat},${lng})[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|track)$"];
    way(around:1500,${lat},${lng})[waterway~"^(river|stream|canal)$"];
    way(around:1200,${lat},${lng})[landuse];
  );out center tags;`;
  return `[out:json][timeout:30];(
    node(around:12000,${lat},${lng})[place~"^(city|town|village|hamlet)$"];
    way(around:2000,${lat},${lng})[highway];
    way(around:2500,${lat},${lng})[waterway~"^(river|stream|canal|ditch)$"];
    way(around:2500,${lat},${lng})[natural=water];
    way(around:1800,${lat},${lng})[landuse];
    way(around:600,${lat},${lng})[building];
    node(around:8000,${lat},${lng})[amenity~"^(school|hospital|pharmacy|fuel)$"];
    way(around:4000,${lat},${lng})[power=line];
    node(around:8000,${lat},${lng})[man_made=water_well];
  );out center tags;`;
}

// sunucular ve sorgu kademeleri arasinda sirayla dener
async function cevreVerisi(lat, lng, bildir){
  const denemeler = [];
  [0,1,2].forEach(kademe=>{
    OVER_SUNUCU.forEach(s2=>denemeler.push({ s:s2, kademe }));
  });
  let sonHata = null;
  for(let i=0;i<denemeler.length;i++){
    const d = denemeler[i];
    if(bildir) bildir(i === 0 ? "Çevre taranıyor…"
      : `Sunucular meşgul, tekrar deneniyor (${i+1}/${denemeler.length})…`);
    try{
      const r = await zamanAsimi(tkgm(d.s + encodeURIComponent(cevreSorgusu(lat, lng, d.kademe))), 35000);
      if(r?.elements?.length) return r;
      sonHata = new Error("boş cevap");
    }catch(e){ sonHata = e; }
    await new Promise(r=>setTimeout(r, 800));
  }
  throw sonHata || new Error("çevre verisi alınamadı");
}

function cevreOzet(veri, merkezNokta){
  const ogeler = (veri?.elements || []).map(e=>{
    const nk = e.center ? { lat:e.center.lat, lng:e.center.lon } : { lat:e.lat, lng:e.lon };
    if(!isFinite(nk.lat)) return null;
    return { t:e.tags || {}, nk, u:uzaklik(merkezNokta, nk) };
  }).filter(Boolean).sort((a,b)=>a.u-b.u);

  const ilk = f => ogeler.find(f);
  const hepsi = f => ogeler.filter(f);

  const yerler = hepsi(o=>o.t.place && o.t.name).slice(0,5);
  const yollar = {};
  hepsi(o=>o.t.highway && YOL_AD[o.t.highway]).forEach(o=>{
    if(!yollar[o.t.highway]) yollar[o.t.highway] = o;
  });
  const su = ilk(o=>o.t.waterway || o.t.natural === "water");
  const okul = ilk(o=>o.t.amenity === "school");
  const saglik = ilk(o=>o.t.amenity === "hospital" || o.t.amenity === "pharmacy");
  const akaryakit = ilk(o=>o.t.amenity === "fuel");
  const elektrik = ilk(o=>o.t.power === "line");
  const kuyu = ilk(o=>o.t.man_made === "water_well");

  const kullanim = {};
  hepsi(o=>o.t.landuse).forEach(o=>{ kullanim[o.t.landuse] = (kullanim[o.t.landuse]||0)+1; });

  return { yerler, yollar, su, okul, saglik, akaryakit, elektrik, kuyu, kullanim };
}

const LANDUSE_AD = { farmland:"Tarım arazisi", meadow:"Çayır", forest:"Orman", orchard:"Meyve bahçesi",
  vineyard:"Bağ", residential:"Yerleşim", industrial:"Sanayi", commercial:"Ticaret", quarry:"Taş ocağı",
  cemetery:"Mezarlık", farmyard:"Çiftlik avlusu", grass:"Otlak", village_green:"Köy meydanı" };

// beyaz zemine kurumsal rapor cizer; satir ortadan bolunmez
const RAP = {
  kirmizi:"#B3232E", koyu:"#7E141C", acik:"#FBE9EA", metin:"#16181A",
  gri:"#5A6169", cizgi:"#E6E8EA", zebra:"#FAFAFB"
};

function raporPng(baslik, altBaslik, bolumler){
  const G = 1000;
  const SAYFA = Math.round(G * 277 / 190);
  const UST = 108, ALT = 118, satirY = 38;

  const yerlestir = (ciz) => {
    let sayfa = 0, y = 0;
    const dip = () => (sayfa+1)*SAYFA - ALT;
    const yeniSayfa = () => { sayfa++; y = sayfa*SAYFA + UST; };
    const yer = h => { if(y + h + 24 > dip()) yeniSayfa(); };

    y = 118;
    ciz && ciz.baslik(y);
    y = 300;

    bolumler.forEach(b2=>{
      if(b2.gorsel){
        const gy = (G-140) * b2.oran;
        yer(58 + gy);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        ciz && ciz.gorsel(b2.gorsel, y, gy);
        y += gy + 16;
      }else if(b2.metin){
        yer(58 + 44*2);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        yaziSar(b2.metin, G-150, 25).forEach(t=>{
          yer(40);
          ciz && ciz.paragraf(t, y);
          y += t === "" ? 18 : 40;
        });
      }else{
        yer(58 + satirY*2);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        (b2.satirlar||[]).forEach(([k,v],i)=>{
          yer(satirY);
          ciz && ciz.satir(k, v, y, i);
          y += satirY;
        });
      }
      y += 40;
    });
    return (sayfa+1) * SAYFA;
  };

  const Y = yerlestir(null);
  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);

  const sayfaSayisi = Math.round(Y/SAYFA);
  for(let i=0;i<sayfaSayisi;i++){
    const t = i*SAYFA;
    if(i === 0){
      const gr = x.createLinearGradient(0,0,G,240);
      gr.addColorStop(0, RAP.koyu); gr.addColorStop(1, RAP.kirmizi);
      x.fillStyle = gr; x.fillRect(0,0,G,240);
      x.fillStyle = "rgba(255,255,255,.16)";
      x.beginPath(); x.moveTo(G-330,0); x.lineTo(G,0); x.lineTo(G,240); x.closePath(); x.fill();
    }else{
      x.fillStyle = RAP.kirmizi; x.fillRect(0,t,G,12);
      x.fillStyle = RAP.gri; x.font = "400 19px Arial"; x.textAlign = "left";
      x.fillText(baslik, 60, t + 58);
    }
    // alt bant
    x.fillStyle = RAP.cizgi; x.fillRect(60, t + SAYFA - 74, G-120, 1);
    x.fillStyle = RAP.gri; x.font = "400 18px Arial";
    x.textAlign = "left";  x.fillText("Parsel Parsel · çapımız alayınıza yeter", 60, t + SAYFA - 44);
    x.textAlign = "right"; x.fillText(`${i+1} / ${sayfaSayisi}`, G-60, t + SAYFA - 44);
    x.textAlign = "left";
  }

  yerlestir({
    baslik: y => {
      x.textAlign = "left";
      x.fillStyle = "#FFFFFF"; x.font = "700 46px Arial";
      x.fillText(baslik, 60, y + 22);
      x.fillStyle = "rgba(255,255,255,.86)"; x.font = "400 23px Arial";
      altBaslik.split("\n").forEach((t,i)=> x.fillText(t, 60, y + 66 + i*32));
      x.fillStyle = RAP.gri; x.font = "400 19px Arial";
      x.fillText(new Date().toLocaleString("tr-TR"), 60, 282);
    },
    bolum: (ad2, y) => {
      x.fillStyle = RAP.acik;
      x.beginPath(); x.roundRect(60, y-34, G-120, 50, 8); x.fill();
      x.fillStyle = RAP.kirmizi;
      x.beginPath(); x.roundRect(60, y-34, 7, 50, 4); x.fill();
      x.fillStyle = RAP.koyu; x.font = "700 25px Arial"; x.textAlign = "left";
      x.fillText(ad2.toLocaleUpperCase("tr"), 82, y);
    },
    satir: (k, v, y, i) => {
      if(i % 2 === 0){ x.fillStyle = RAP.zebra; x.fillRect(60, y-26, G-120, satirY); }
      x.font = "400 23px Arial"; x.fillStyle = RAP.gri; x.textAlign = "left";
      x.fillText(String(k).slice(0,58), 78, y);
      x.font = "700 23px Arial"; x.fillStyle = RAP.metin; x.textAlign = "right";
      x.fillText(String(v), G-78, y);
      x.textAlign = "left";
    },
    gorsel: (im, y, gy) => {
      x.save();
      x.shadowColor = "rgba(0,0,0,.22)"; x.shadowBlur = 18; x.shadowOffsetY = 6;
      x.fillStyle = "#FFF";
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.fill();
      x.restore();
      x.save();
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.clip();
      try{ x.drawImage(im, 70, y, G-140, gy); }catch(e){}
      x.restore();
      x.strokeStyle = RAP.cizgi; x.lineWidth = 2;
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.stroke();
    },
    paragraf: (t, y) => {
      x.font = "400 25px Arial"; x.fillStyle = RAP.metin; x.textAlign = "left";
      x.fillText(t, 78, y);
    }
  });

  return { png: { dataUrl: c.toDataURL("image/png"), canvas: c, sayfaPx: SAYFA }, oran: Y/G };
}

// uzun metni satirlara bol
function yaziSar(metin, genislik, punto){
  OLCER.font = `400 ${punto}px Arial`;
  const cikti = [];
  String(metin).split("\n").forEach(parca=>{
    if(!parca.trim()){ cikti.push(""); return; }
    let satir = "";
    parca.split(" ").forEach(kelime=>{
      const deneme = satir ? satir + " " + kelime : kelime;
      if(OLCER.measureText(deneme).width > genislik){ cikti.push(satir); satir = kelime; }
      else satir = deneme;
    });
    if(satir) cikti.push(satir);
  });
  return cikti;
}

function pngToPdfBlob(kaynak, oran){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const gen = 190, c = kaynak.canvas, sayfaPx = kaynak.sayfaPx || c.height;

  for(let y = 0, i = 0; y < c.height; y += sayfaPx, i++){
    const h = Math.min(sayfaPx, c.height - y);
    const t = document.createElement("canvas");
    t.width = c.width; t.height = h;
    const tx = t.getContext("2d");
    tx.fillStyle = "#FFFFFF"; tx.fillRect(0,0,t.width,t.height);
    tx.drawImage(c, 0, y, c.width, h, 0, 0, c.width, h);
    if(i) pdf.addPage();
    pdf.addImage(t.toDataURL("image/png"), "PNG", 10, 10, gen, gen * (h/c.width));
  }
  return pdf.output("blob");
}

function dosyaAdi(p, ek){
  const t = `${p?.adaNo ?? p?.ada ?? 0}-${p?.parselNo ?? p?.parsel ?? 0}`;
  return `${t}-${ek}.pdf`.replace(/\s+/g,"");

  const yolSatir = Object.entries(o.yollar).map(([k,v])=>

      ["Mevkii", p.mevkii || "—"],
      ["Koordinat", `${m.lat.toFixed(6)}, ${m.lng.toFixed(6)}`]
    ]},
    { baslik:"Yerleşim yerlerine uzaklık", satirlar: yerSatir.length ? yerSatir : [["Yakında kayıtlı yerleşim yok",""]] },
    { baslik:"Yol durumu", satirlar: yolSatir.length ? yolSatir : [["Yakında kayıtlı yol yok",""]] },
    { baslik:"Altyapı ve su", satirlar:[
      ["En yakın su kaynağı", o.su ? `${o.su.t.name || (o.su.t.waterway ? "akarsu" : "su yüzeyi")} · ${km(o.su.u)}` : "kayıt yok"],
      ["Su kuyusu", o.kuyu ? km(o.kuyu.u) : "kayıt yok"],
      ["Elektrik hattı", o.elektrik ? km(o.elektrik.u) : "kayıt yok"],
      ["Akaryakıt istasyonu", o.akaryakit ? km(o.akaryakit.u) : "kayıt yok"]
    ]},
    { baslik:"Sosyal donatı", satirlar:[
      ["En yakın okul", o.okul ? `${o.okul.t.name||"okul"} · ${km(o.okul.u)}` : "kayıt yok"],
      ["Sağlık tesisi", o.saglik ? `${o.saglik.t.name||"sağlık"} · ${km(o.saglik.u)}` : "kayıt yok"]
    ]},
    { baslik:"Çevredeki arazi kullanımı", satirlar: kullanimSatir.length ? kullanimSatir : [["Kayıt yok",""]] },
    { baslik:"Resmî arazi örtüsü (CORINE)", satirlar: clc
        ? [["Parselin bulunduğu sınıf", clc.ad || "—"], ["CORINE kodu", clc.kod || "—"],
           ["Kaynak", "Copernicus CLC 2018"]]
        : [["Sınıf bilgisi alınamadı", "—"]] },
    { baslik:"İmar durumu", satirlar:[
      ["e-Plan sorgusu", "Uygulamadaki İmar planı tuşundan"],
      ["Not", "Yürürlükteki ve askıdaki planlar e-Plan'da görüntülenir"]
    ]}
  ];

  const { png, oran } = raporPng(
    `Çevre raporu · ${p.adaNo||"—"}/${p.parselNo||"—"}`,
    `${p.mahalleAd||""} — ${p.ilceAd||""} / ${p.ilAd||""}\n2 km yarıçapındaki yollar, 12 km yarıçapındaki yerleşimler taranmıştır.`,
    bolumler);

  const blob = pngToPdfBlob(png, oran);
  const ad2 = dosyaAdi(p, "cevre-raporu");
  indirBlob(blob, ad2);
  await parseleIliskilendir(p, blob, ad2, "arastirma");
  return CEVRE_SON;
}

function indirBlob(blob, ad2){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = ad2; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

// parsel zaten kayitliysa raporu belgelerine de ekle
async function parseleIliskilendir(p, blob, ad2, tur){
  if(ME.role === 'uye') return;
  const { data } = await sb.from("parcels").select("id")
    .eq("parsel", String(p.parselNo ?? p.parsel ?? "")).eq("mahalle", p.mahalleAd ?? p.mahalle ?? "").limit(1);
  const id = data?.[0]?.id;
  if(!id) return;
  try{ await dosyaYukle(new File([blob], ad2, { type:"application/pdf" }), tur, id);
       toast("Rapor parselin belgelerine de eklendi"); }catch(e){}
}

function parcaKur(toplam, mevcut){
  PARCA.toplam = toplam;
  PARCA.bloklar = (mevcut && mevcut.length) ? mevcut.map(b=>({
    tip: b.tip === "yol" ? "yol" : "tam",
    parcalar: (b.parcalar||[]).map(o=>({ id:++PSAYAC, no:o.no||"", m2:+o.m2||1, renk:o.renk||"#C6D9A7" })),
    sol: (b.sol||[]).map(o=>({ id:++PSAYAC, no:o.no||"", m2:+o.m2||1, renk:o.renk||"#C6D9A7" })),
    sag: (b.sag||[]).map(o=>({ id:++PSAYAC, no:o.no||"", m2:+o.m2||1, renk:o.renk||"#C6D9A7" }))
  })) : [];
  if(!PARCA.bloklar.length)
    PARCA.bloklar = [{ tip:"tam", parcalar:[yeniParca(Math.round(toplam*0.5))], sol:[], sag:[] }];

  numaralariTazele();
  const g = k => document.getElementById(k);

  if(g("blokTam")) g("blokTam").onclick = () => {
    PARCA.bloklar.push({ tip:"tam", parcalar:[yeniParca(Math.round(PARCA.toplam*0.15))], sol:[], sag:[] });
    numaralariTazele(); bloklariCiz();
  };
  if(g("blokYol")) g("blokYol").onclick = () => {
    // kalan alani iki yana esit dagit
    const toplam = isFinite(PARCA.toplam) && PARCA.toplam > 0 ? PARCA.toplam : 1000;
    const kullanilan = PARCA.bloklar.flatMap(blokParcalari).reduce((t,o)=>t + (isFinite(+o.m2) ? +o.m2 : 0), 0);
    const pay = Math.max(50, Math.round(Math.max(200, toplam - kullanilan)/4));
    PARCA.bloklar.push({ tip:"yol", parcalar:[],
      sol:[yeniParca(pay), yeniParca(pay)], sag:[yeniParca(pay), yeniParca(pay)] });
    numaralariTazele(); bloklariCiz();
  };
  const yg = g("pyg"), yk2 = g("pyk");
  if(yg) yg.oninput = () => { PARCA.enAzYol = Math.max(1, Math.min(12, sayiCoz(yg.value) || 3)); ozetCiz(); };
  if(yk2) yk2.oninput = () => { PARCA.yolKaydir = (+yk2.value)/100; ozetCiz(); };

  const rg = g("prg"), rk = g("prk");
  if(rg){ rg.value = String(PARCA.resmiGenislik || 0);
    rg.onchange = () => { PARCA.resmiGenislik = +rg.value; ozetCiz(); }; }
  if(rk){ rk.value = PARCA.resmiKenar || "alt";
    rk.onchange = () => { PARCA.resmiKenar = rk.value; ozetCiz(); }; }

  const ol = g("polcu"), yt = g("pyoltip"), yk = g("pyolkonum"), tr = g("pters");
  if(ol){ ol.value = PARCA.olculer === false ? "0" : "1";
    ol.onchange = () => { PARCA.olculer = ol.value === "1"; ozetCiz(); }; }
  if(yt){ yt.value = PARCA.yolTipi || "parsel"; yt.onchange = () => { PARCA.yolTipi = yt.value; ozetCiz(); }; }
  if(yk){ yk.value = PARCA.yolKonum || "oto"; yk.onchange = () => { PARCA.yolKonum = yk.value; ozetCiz(); }; }
  if(tr){ tr.value = PARCA.ters ? "1" : "0"; tr.onchange = () => { PARCA.ters = tr.value === "1"; ozetCiz(); }; }

  bloklariCiz();
}

function blokParcalari(b){ return b.tip === "yol" ? b.sol.concat(b.sag) : b.parcalar; }

// parselin yonune gore iki yanin adi: dikey parselde sol/sag, yatay parselde alt/ust
function yanAdlari(){
  try{
    const M = PARCA.geometri;
    if(!M) return { sol:"SOL", sag:"SAĞ" };
    let ana = anaYon(M);
    if(PARCA.ters) ana = [-ana[0], -ana[1]];
    const dik = [-ana[1], ana[0]];
    return Math.abs(dik[0]) >= Math.abs(dik[1])
      ? { sol:"SOL", sag:"SAĞ" } : { sol:"ALT", sag:"ÜST" };
  }catch(e){ return { sol:"SOL", sag:"SAĞ" }; }
}

function numaralariTazele(){
  let n = 0;
  PARCA.bloklar.forEach(b=>blokParcalari(b).forEach(o=>{ n++; if(!String(o.no||"").trim()) o.no = String(n); }));
}

function bloklariCiz(){
  const kutu = document.getElementById("bloklar");
  if(!kutu) return;
  kutu.innerHTML = PARCA.bloklar.map((b,i)=>{
    const bas = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">

        <span style="flex:1"></span>
        ${i>0?`<button class="pill sade" onclick="blokTasi(${i},-1)">↑</button>`:""}
        ${i<PARCA.bloklar.length-1?`<button class="pill sade" onclick="blokTasi(${i},1)">↓</button>`:""}
        <button class="sil" onclick="blokSil(${i})">${svg("trash")}</button></div>`;
    const baslik = `<div style="display:flex;gap:7px;font-size:10.5px;color:var(--ink-3);padding:0 2px 4px">
        <span style="width:52px">NO</span><span style="flex:1">METREKARE</span>
        <span style="width:44px;text-align:center">RENK</span><span style="width:32px"></span></div>`;

    if(b.tip === "tam"){
      return `<div class="card" style="padding:12px">${bas}${baslik}
        ${b.parcalar.map((o,j)=>parcaSatirHtml(o,i,"parcalar",j)).join("")}
        <button class="pill sade" onclick="parcaEkle(${i},'parcalar')">+ parça</button>
        <div class="ipuc" style="margin:8px 2px 0">Yol bu bloğun kenarından geçer, parçalar tam genişlikte dizilir.</div>
      </div>`;
    }
    const sutun = (yer, ad2) => `
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:11px;color:var(--gold);letter-spacing:.1em;font-weight:600">${ad2} TARAF</span>
          <span style="font-size:11px;color:var(--ink-3)">${b[yer].length} parça · ${nf2(b[yer].reduce((t,o)=>t+(+o.m2||0),0))} m²</span>
          <span style="flex:1"></span>
          <button class="pill sade" onclick="tarafEsitle(${i},'${yer}')">eşit böl</button></div>
        ${b[yer].map((o,j)=>parcaSatirHtml(o,i,yer,j)).join("")}
        <button class="pill sade" onclick="parcaEkle(${i},'${yer}')">+ parça</button>
      </div>`;
    return `<div class="card" style="padding:12px">${bas}
      ${(()=>{ const y = yanAdlari();
        return sutun("sol", y.sol) + `<div style="height:10px"></div>` + sutun("sag", y.sag); })()}
      <div class="ipuc" style="margin:10px 2px 0">Yol bu bloğun ortasından geçer; sol ve sağ kendi içinde dizilir.</div>
    </div>`;
  }).join("");

  PARCA.bloklar.forEach(b=>blokParcalari(b).forEach(o=>{
    const n = document.getElementById("pn"+o.id), m = document.getElementById("pm"+o.id), c = document.getElementById("pr"+o.id);
    if(n) n.oninput = () => { o.no = n.value; onizlemeCiz(); };
    if(m) m.oninput = () => {
      const v = sayiCoz(m.value);
      o.m2 = isFinite(v) ? Math.round(v*100)/100 : 0;
      ozetCiz();
    };
    if(c) c.oninput = () => { o.renk = c.value; onizlemeCiz(); };
  }));
  ozetCiz();
}

// bir tarafin parcalarini kendi toplami icinde esitle
function tarafEsitle(i, yer){
  const liste = PARCA.bloklar[i][yer];
  if(!liste.length) return;
  const toplam = liste.reduce((t,o)=>t + (isFinite(+o.m2) ? +o.m2 : 0), 0) || (PARCA.toplam/2);
  const pay = Math.round((toplam/liste.length)*100)/100;
  liste.forEach((o,j)=>{ o.m2 = j === liste.length-1
    ? Math.round((toplam - pay*(liste.length-1))*100)/100 : pay; });
  bloklariCiz();
}

function parcaEkle(i, yer){
  const liste = PARCA.bloklar[i][yer];
  const son = liste[liste.length-1];
  const varsayilan = (son && isFinite(+son.m2) && +son.m2 > 0) ? +son.m2
    : (isFinite(PARCA.toplam) ? Math.round(PARCA.toplam*0.05) : 200);
  liste.push(yeniParca(varsayilan));
  numaralariTazele(); bloklariCiz();
}
function parcaSil(i, yer, j){
  PARCA.bloklar[i][yer].splice(j,1);
  if(!blokParcalari(PARCA.bloklar[i]).length) PARCA.bloklar.splice(i,1);
  bloklariCiz();
}
function blokSil(i){ PARCA.bloklar.splice(i,1); bloklariCiz(); }
function blokTasi(i, yon){
  const j = i + yon;
  if(j < 0 || j >= PARCA.bloklar.length) return;
  const t = PARCA.bloklar[i]; PARCA.bloklar[i] = PARCA.bloklar[j]; PARCA.bloklar[j] = t;
  bloklariCiz();
}

async function resmiYolBul(){
  const not = document.getElementById("resmiNot");
  if(!PARCA.p) return;
  const yaz = t => { if(not) not.textContent = t; };
  yaz("Komşu parseller sorgulanıyor…");
  try{
    const kenarlar = await resmiYolKenarlari(PARCA.p, yaz);
    if(!kenarlar.length){ yaz("Yola cepheli kenar bulunamadı. Elle seçebilirsin."); return; }

    // kenari alt/ust/sol/sag'a cevir
    const M = PARCA.geometri;
    let ana = anaYon(M); if(PARCA.ters) ana = [-ana[0], -ana[1]];
    let dik = [-ana[1], ana[0]];
    const yatay = Math.abs(dik[0]) >= Math.abs(dik[1]);
    if((yatay && dik[0] < 0) || (!yatay && dik[1] < 0)) dik = [-dik[0], -dik[1]];
    const izdA = M.map(p=>p[0]*ana[0]+p[1]*ana[1]);
    const izdD = M.map(p=>p[0]*dik[0]+p[1]*dik[1]);
    const aMin = Math.min(...izdA), aMax = Math.max(...izdA);
    const dMin = Math.min(...izdD), dMax = Math.max(...izdD);

    const k = kenarlar[0];
    const i = k.i, j = (i+1) % M.length;
    const oa = (izdA[i]+izdA[j])/2, od = (izdD[i]+izdD[j])/2;
    const uzakliklar = [
      ["alt", oa - aMin], ["ust", aMax - oa], ["sol", od - dMin], ["sag", dMax - od]
    ].sort((x,y)=>x[1]-y[1]);
    PARCA.resmiKenar = uzakliklar[0][0];
    if(!PARCA.resmiGenislik) PARCA.resmiGenislik = 7;

    const g2 = document.getElementById("prg"), k2 = document.getElementById("prk");
    if(g2) g2.value = String(PARCA.resmiGenislik);
    if(k2) k2.value = PARCA.resmiKenar;
    const ad = { alt:"alt", ust:"üst", sol:"sol", sag:"sağ" }[PARCA.resmiKenar];
    yaz(`Resmî yol ${ad} kenarda bulundu · komşu kaydı: ${k.nitelik} · ${k.uzunluk} m cephe. Genişliği değiştirebilirsin.`);
    ozetCiz();
  }catch(e){ yaz("Sorgu başarısız: " + (e.message||e)); }
}

function ozetCiz(){
  const hepsi = PARCA.bloklar.flatMap(blokParcalari);
  const parcaAlan = hepsi.reduce((t,o)=>t+(+o.m2||0), 0);
  let yolGen = 0, yolAlan = 0, resmiAlan = 0, kucultme = 0;
  if(PARCA.geometri){
    try{
      const y = capYerlesim(PARCA.geometri, parcaCfg());
      yolGen = y.yolGenislik || 0; yolAlan = y.yolAlan || 0;
      resmiAlan = y.resmiAlan || 0; kucultme = y.kucultme || 0;
    }catch(e){}
  }
  PARCA.yolGenislik = yolGen; PARCA.yolAlan = yolAlan; PARCA.resmiAlan = resmiAlan;
  const satilabilir = PARCA.toplam - yolAlan;   // resmi yol parselin disinda, dusulmez
  const kalan = satilabilir - parcaAlan;

  const o = document.getElementById("capOzet");
  if(o) o.innerHTML = `
    <div class="kv"><span>Parselin alanı</span><b class="mono">${nf2(PARCA.toplam)} m²</b></div>
    ${resmiAlan ? `<div class="kv"><span>Resmî yol · parsel dışı</span>
      <b class="mono" style="color:var(--ink-2)">${nf2(resmiAlan)} m²</b></div>` : ""}
    <div class="kv"><span>Parsel yolu payı · ${yolGen ? yolGen.toFixed(1).replace(".",",") : "3"} m genişlik</span>
      <b class="mono" style="color:var(--ink-2)">− ${nf2(yolAlan)} m²</b></div>
    <div class="kv" style="border-top:1px solid var(--cizgi);margin-top:6px;padding-top:8px">
      <span>Parçalara kalan</span><b class="mono">${nf2(Math.max(0,satilabilir))} m²</b></div>
    <div class="kv"><span>Girilen (${hepsi.length} parça)</span><b class="mono">${nf2(parcaAlan)} m²</b></div>
    <div class="kv"><span style="color:${kalan < -0.5 ? "var(--red)" : "var(--green)"}">
      ${kalan < -0.5 ? "Fazla girildi" : "Boşta kalan"}</span>
      <b class="mono" style="color:${kalan < -0.5 ? "var(--red)" : "var(--green)"}">${nf2(Math.abs(kalan))} m²</b></div>
    <p class="ipuc" style="margin:8px 2px 0">${kucultme > 0
      ? `Parçalar parsel yoluna yer açmak için %${String(kucultme).replace(".",",")} oranında ölçeklendi.`
      : "Parsel yolunun tamamı parçalardan eşit oranda düşülür; resmî yol parselin dışındadır, alandan düşülmez."}</p>`;

  const say = document.getElementById("onizSay");
  if(say) say.textContent = nf(hepsi.length) + " parça";

  // onizlemenin ustunde canli ozet
  const cz = document.getElementById("canliOzet");
  if(cz){
    const kutu2 = (ad2, deger, renk) => `
      <div style="background:rgba(0,0,0,.24);border:1px solid var(--cizgi);border-radius:9px;padding:7px 8px;text-align:center">
        <div style="font-size:8.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase">${ad2}</div>
        <div class="mono" style="font-size:12.5px;font-weight:600;margin-top:3px;color:${renk||"var(--ink)"}">${deger}</div>
      </div>`;
    const fark = kalan;
    cz.innerHTML =
      kutu2("Parsel", nf(Math.round(PARCA.toplam)) + " m²") +
      kutu2("Yol payı", "− " + nf(Math.round(yolAlan)) + " m²", "var(--ink-2)") +
      kutu2("Parçalara", nf(Math.round(Math.max(0,satilabilir))) + " m²") +
      kutu2(fark < -0.5 ? "Fazla" : "Kalan", nf2(Math.abs(fark)) + " m²",
            fark < -0.5 ? "var(--red)" : (Math.abs(fark) < 0.5 ? "var(--green)" : "var(--gold)"));
  }
  onizlemeCiz();
}

function parcaCfg(){
  return { enAzYol: PARCA.enAzYol || 3, ters: PARCA.ters, yolTipi: PARCA.yolTipi, yolKonum: PARCA.yolKonum,
    resmiGenislik: PARCA.resmiGenislik || 0, resmiKenar: PARCA.resmiKenar || "alt",
    yolKaydir: PARCA.yolKaydir || 0,
    capTema: "yatay", olculer: PARCA.olculer !== false,
    bloklar: PARCA.bloklar.map(b=> b.tip === "yol"
      ? { tip:"yol", sol:b.sol.map(o=>({ no:o.no||"", m2:+o.m2||1, renk:o.renk })),
                     sag:b.sag.map(o=>({ no:o.no||"", m2:+o.m2||1, renk:o.renk })) }
      : { tip:"tam", parcalar:b.parcalar.map(o=>({ no:o.no||"", m2:+o.m2||1, renk:o.renk })) }),
    parcalar: cfgParcalari({ bloklar: PARCA.bloklar.map(b=> b.tip === "yol"
      ? { tip:"yol", sol:b.sol, sag:b.sag } : { tip:"tam", parcalar:b.parcalar }) }) };
}

function onizlemeCiz(){
  const c = document.getElementById("capOnizleme");
  if(!c || !PARCA.p) return;
  const G = 700, Y = 900;
  c.width = G; c.height = Y;
  try{
    const png = capCizPng(PARCA.p, parcaCfg(), true);
    const im = new Image();
    im.onload = () => { const x = c.getContext("2d"); x.clearRect(0,0,G,Y); x.drawImage(im,0,0,G,Y); };
    im.src = png;
  }catch(e){}
}

/* ================= parçalar / hisseler ================= */

async function parcalarEkran(parselId){
  const { data:p } = await sb.from("parcels").select("*").eq("id",parselId).single();
  if(!p) return toast("Parsel bulunamadı");
  const { data:liste } = await sb.from("parca").select("*").eq("parcel_id",parselId).order("sira");
  const capVar = p.cap_config && !Array.isArray(p.cap_config) && p.cap_config.parcalar?.length;

  app.innerHTML = head("Parçalar","go('parsel','" + parselId + "')") + `
    <div class="card">
      <div style="font-size:12px;color:var(--ink-3)">${esc(duzgun(p.mahalle))}</div>
      <div style="font-size:17px;font-weight:600;margin-top:2px">Ada ${esc(p.ada||"—")} · Parsel ${esc(p.parsel)}</div>
      <div class="kv" style="margin-top:8px"><span>Tapu alanı</span><b class="mono">${nf2(gercekAlan(p))} m²</b></div>
    </div>
    <p class="ipuc">Parsel tek tapu olsa bile çaptaki parçaları burada ayrı ayrı tutabilirsin. Her parçaya kendi adını,
      metrekaresini ve fiyatını yazarsın; rapor değerlemeyi bunlara göre parça parça yapar.</p>

    <div class="acts" style="margin-bottom:14px">
      ${capVar ? `<button class="pri" onclick="parcalariCaptanAl('${parselId}')">Çaptan al (${p.cap_config.parcalar.length} parça)</button>` : ""}
      <button onclick="parcaSatirEkle('${parselId}')">+ Parça ekle</button>
    </div>

    <div id="parcaListe"></div>
    <button class="btn" id="parcaKaydetTus" onclick="parcalariKaydet('${parselId}')"
      style="position:sticky;bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.45)">Kaydet</button>`;

  PARCA_LISTE = (liste||[]).map(o=>({ ...o }));
  parcaListeCiz(parselId);
}

let PARCA_LISTE = [];

function parcaDurum(o){
  if(o.satildi) return { ad:"satıldı", renk:"#6FB0F5", zemin:"rgba(111,176,245,.14)", solgun:false };
  if(o.satilik) return { ad:"satılık", renk:"#5FD79A", zemin:"rgba(95,215,154,.12)", solgun:false };
  return { ad:"pasif", renk:"#7E8A84", zemin:"rgba(255,255,255,.04)", solgun:true };
}

function parcaListeCiz(parselId){
  const kutu = document.getElementById("parcaListe");
  if(!kutu) return;
  if(!PARCA_LISTE.length){
    kutu.innerHTML = `<div class="empty"><b>Parça yok</b>Çaptan alabilir ya da elle ekleyebilirsin.</div>`;
    return;
  }

  kutu.innerHTML = PARCA_LISTE.map((o,i)=>{
    const d = parcaDurum(o);
    return `
      <div class="card" style="padding:12px;background:${d.zemin};border-color:${d.renk}33;${d.solgun?"opacity:.72":""}">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:${d.renk};
            background:rgba(0,0,0,.25);border:1px solid ${d.renk}55;border-radius:9px;padding:6px 11px">
            ${esc(o.no || (i+1))}</span>
          <span style="font-size:11.5px;color:${d.renk};font-weight:600;letter-spacing:.04em;text-transform:uppercase">${d.ad}</span>
          <span style="flex:1"></span>
          <button class="sil" style="width:32px;height:32px" onclick="hisseSil(${i},'${parselId}')">${svg("trash")}</button>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:11px">
          <button class="pill ${o.satilik&&!o.satildi?"on":"sade"}" style="flex:1" onclick="parcaDurumDegis(${i},'aktif','${parselId}')">Satılık</button>
          <button class="pill ${o.satildi?"gold":"sade"}" style="flex:1" onclick="parcaDurumDegis(${i},'satildi','${parselId}')">Satıldı</button>
          <button class="pill ${!o.satilik&&!o.satildi?"off":"sade"}" style="flex:1" onclick="parcaDurumDegis(${i},'pasif','${parselId}')">Pasif</button>
        </div>

        <div class="field" style="margin:0 0 10px"><label>Parçanın adı</label>
          <input id="pa${i}" value="${esc(o.ad||"")}" placeholder="1 nolu parça"></div>
        <div class="row2">
          <div class="field" style="margin:0 0 10px"><label>Alan (m²)</label>
            <input id="pm${i}" inputmode="decimal" value="${ham(o.m2)}" onfocus="this.select()"></div>
          <div class="field" style="margin:0 0 10px"><label>Maliyet (₺/m²)</label>
            <input id="pk${i}" inputmode="decimal" value="${ham(o.maliyet_m2)}" onfocus="this.select()"></div>
        </div>
        <div class="field" style="margin:0 0 10px"><label>Satış fiyatı (₺/m²)</label>
          <input id="pf${i}" inputmode="decimal" value="${ham(o.m2_fiyat)}" onfocus="this.select()"></div>

        <div style="background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;margin-bottom:10px" id="ph${i}"></div>

        <div class="field" style="margin:0"><label>Not</label>
          <input id="pn${i}" value="${esc(o.notu||"")}" placeholder="isteğe bağlı"></div>
      </div>`;
  }).join("") + `<div id="parcaOzet"></div>`;

  PARCA_LISTE.forEach((o,i)=>{
    const g = k => document.getElementById(k+i);
    const gun = () => {
      o.ad = g("pa").value;
      o.m2 = sayiCoz(g("pm").value) || 0;
      o.maliyet_m2 = sayiCoz(g("pk").value) || 0;
      o.m2_fiyat = sayiCoz(g("pf").value) || 0;
      o.notu = g("pn").value;

      const satis = o.m2 * o.m2_fiyat;
      const maliyet = o.m2 * o.maliyet_m2;
      const kar = satis - maliyet;
      const oran = maliyet > 0 ? (kar/maliyet*100) : null;
      g("ph").innerHTML = `
        <div class="kv" style="padding:4px 0"><span>Satış bedeli</span>
          <b class="mono">${satis ? nf(Math.round(satis)) + " ₺" : "—"}</b></div>
        <div class="kv" style="padding:4px 0"><span>Maliyet</span>
          <b class="mono">${maliyet ? nf(Math.round(maliyet)) + " ₺" : "—"}</b></div>
        <div class="kv" style="padding:4px 0;border-top:1px solid var(--cizgi);margin-top:4px;padding-top:7px">
          <span style="color:${kar>=0?"var(--green)":"var(--red)"}">Kâr</span>
          <b class="mono" style="color:${kar>=0?"var(--green)":"var(--red)"}">
            ${(satis||maliyet) ? nf(Math.round(kar)) + " ₺" + (oran != null ? ` · %${oran.toFixed(1).replace(".",",")}` : "") : "—"}</b></div>`;
      parcaOzetCiz();
    };
    ["pa","pm","pk","pf","pn"].forEach(k=>{ const el = g(k); if(el) el.oninput = gun; });
    gun();
  });
}

function parcaDurumDegis(i, durum, parselId){
  const o = PARCA_LISTE[i];
  if(durum === "aktif"){ o.satilik = true; o.satildi = false; }
  if(durum === "satildi"){ o.satildi = true; o.satilik = false; }
  if(durum === "pasif"){ o.satilik = false; o.satildi = false; }
  parcaListeCiz(parselId);
}

// en altta toplu ozet
function parcaOzetCiz(){
  const kutu = document.getElementById("parcaOzet");
  if(!kutu) return;
  const say = f => PARCA_LISTE.filter(f);
  const topla = (liste, f) => liste.reduce((t,o)=>t + f(o), 0);
  const alan = o => +o.m2 || 0;
  const satis = o => (+o.m2||0) * (+o.m2_fiyat||0);
  const maliyet = o => (+o.m2||0) * (+o.maliyet_m2||0);

  const satilik = say(o=>o.satilik && !o.satildi);
  const satilan = say(o=>o.satildi);
  const pasif = say(o=>!o.satilik && !o.satildi);

  const stAlan = topla(satilik, alan), stSatis = topla(satilik, satis), stMal = topla(satilik, maliyet);
  const sdAlan = topla(satilan, alan), sdSatis = topla(satilan, satis), sdMal = topla(satilan, maliyet);
  const tumAlan = topla(PARCA_LISTE, alan);
  const bekleyenKar = stSatis - stMal, gerceklesenKar = sdSatis - sdMal;
  const oran = m => m > 0 ? ` · %${((m === stMal ? bekleyenKar : gerceklesenKar)/m*100).toFixed(1).replace(".",",")}` : "";

  const satir = (ad2, deger, renk) => `<div class="kv"><span${renk?` style="color:${renk}"`:""}>${ad2}</span>
    <b class="mono"${renk?` style="color:${renk}"`:""}>${deger}</b></div>`;

  kutu.innerHTML = `
    <div class="card" style="border-color:rgba(227,192,90,.3)">
      <div class="bolum"><span class="rz altin">${svg("money")}</span><b>Toplu özet</b></div>
      ${satir("Toplam parça", `${PARCA_LISTE.length} adet`)}
      ${satir("Parçaların toplam alanı", nf2(tumAlan) + " m²")}
      <div class="tur">Satılık</div>
      ${satir("Parça / alan", `${satilik.length} adet · ${nf2(stAlan)} m²`)}
      ${satir("Ortalama m² fiyatı", stAlan ? nf(Math.round(stSatis/stAlan)) + " ₺" : "—")}
      ${satir("Ortalama m² maliyeti", stAlan ? nf(Math.round(stMal/stAlan)) + " ₺" : "—")}
      ${satir("Satış bedeli", nf(Math.round(stSatis)) + " ₺")}
      ${satir("Maliyet", nf(Math.round(stMal)) + " ₺")}
      ${satir("Beklenen kâr", nf(Math.round(bekleyenKar)) + " ₺" + oran(stMal),
              bekleyenKar>=0?"var(--green)":"var(--red)")}
      ${satilan.length ? `<div class="tur">Satılan</div>
        ${satir("Parça / alan", `${satilan.length} adet · ${nf2(sdAlan)} m²`)}
        ${satir("Tahsil edilen", nf(Math.round(sdSatis)) + " ₺")}
        ${satir("Gerçekleşen kâr", nf(Math.round(gerceklesenKar)) + " ₺" + oran(sdMal),
                gerceklesenKar>=0?"var(--green)":"var(--red)")}` : ""}
      ${pasif.length ? `<div class="tur">Pasif</div>
        ${satir("Parça / alan", `${pasif.length} adet · ${nf2(topla(pasif, alan))} m²`)}` : ""}
      <div class="kv" style="border-top:1px solid var(--cizgi);margin-top:8px;padding-top:9px">
        <span style="color:var(--gold)">Toplam portföy değeri</span>
        <b class="mono" style="color:var(--gold)">${nf(Math.round(stSatis + sdSatis))} ₺</b></div>
    </div>`;
}

async function parcalariCaptanAl(parselId){
  const { data:p } = await sb.from("parcels").select("cap_config").eq("id",parselId).single();
  const cfg = p?.cap_config;
  if(!cfg || Array.isArray(cfg) || !cfg.parcalar?.length) return toast("Bu parselde kayıtlı çap yok");
  const mevcut = {};
  PARCA_LISTE.forEach(o=>{ if(o.no) mevcut[String(o.no)] = o; });
  PARCA_LISTE = cfg.parcalar.map((o,i)=>{
    const eski = mevcut[String(o.no)] || {};
    return {
      id: eski.id, no: String(o.no || (i+1)),
      ad: eski.ad || `${o.no || (i+1)} nolu parça`,
      m2: +o.m2 || 0,
      satilik: eski.satilik !== undefined ? eski.satilik : true,
      satildi: eski.satildi || false,
      m2_fiyat: eski.m2_fiyat ?? null, maliyet_m2: eski.maliyet_m2 ?? null,
      notu: eski.notu || "", sira: i
    };
  });
  parcaListeCiz(parselId);
  toast(`${PARCA_LISTE.length} parça çaptan alındı, kaydetmeyi unutma`);
}

function parcaSatirEkle(parselId){
  PARCA_LISTE.push({ no: String(PARCA_LISTE.length+1), ad:"", m2:0, satilik:true, satildi:false,
    m2_fiyat:null, maliyet_m2:null, notu:"", sira: PARCA_LISTE.length });
  parcaListeCiz(parselId);
}

function hisseSil(i, parselId){
  const o = PARCA_LISTE[i];
  if(o.id){ o._sil = true; PARCA_LISTE.splice(i,1); SILINECEK_PARCA.push(o.id); }
  else PARCA_LISTE.splice(i,1);
  parcaListeCiz(parselId);
}
let SILINECEK_PARCA = [];

async function parcalariKaydet(parselId){
  try{
    if(SILINECEK_PARCA.length){
      await sb.from("parca").delete().in("id", SILINECEK_PARCA);
      SILINECEK_PARCA = [];
    }
    const yeni = PARCA_LISTE.filter(o=>!o.id).map((o,i)=>({
      team_id:ME.team_id, parcel_id:parselId, no:o.no, ad:o.ad, m2:o.m2||null,
      satilik:!!o.satilik, satildi:!!o.satildi, m2_fiyat:o.m2_fiyat||null,
      maliyet_m2:o.maliyet_m2||null, notu:o.notu||null, sira:o.sira ?? i
    }));
    if(yeni.length) await sb.from("parca").insert(yeni);
    for(const o of PARCA_LISTE.filter(o=>o.id)){
      await sb.from("parca").update({ no:o.no, ad:o.ad, m2:o.m2||null, satilik:!!o.satilik,
        satildi:!!o.satildi, m2_fiyat:o.m2_fiyat||null, maliyet_m2:o.maliyet_m2||null,
        notu:o.notu||null, sira:o.sira ?? 0 }).eq("id", o.id);
    }
    toast("Parçalar kaydedildi");
    go("parsel", parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

/* ================= hesap - kitap ================= */

let HESAP_TIP = "alacak";

async function hesap(){
  app.innerHTML = head("Hesap - Kitap","go('ana')") + `
    <div class="acts" style="margin-bottom:14px">
      <button class="${HESAP_TIP==="alacak"?"pri":""}" onclick="HESAP_TIP='alacak';hesap()">Alacaklarım</button>
      <button class="${HESAP_TIP==="borc"?"pri":""}" onclick="HESAP_TIP='borc';hesap()">Borçlarım</button>
    </div>
    <div id="hlist"><div class="spin"></div></div>
    ${ME.role!=='uye'?`<button class="fab" onclick="hesapYeni()">+</button>`:""}`;
  hesapListele();
}

async function hesapListele(){
  const kutu = document.getElementById("hlist");
  const { data, error } = await sb.from("hesap").select("*").eq("tip", HESAP_TIP).order("tarih",{nullsFirst:false});
  if(error) return kutu.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  const kayitlar = data || [];
  if(!kayitlar.length) return kutu.innerHTML =
    `<div class="empty"><b>Kayıt yok</b>${ME.role!=='uye'?"Sağ alttaki + ile ekle.":""}</div>`;

  const { data:vadeler } = await sb.from("hesap_vade").select("*").in("hesap_id", kayitlar.map(k=>k.id));
  const grup = {};
  (vadeler||[]).forEach(v=>(grup[v.hesap_id] ||= []).push(v));

  const bugun = new Date(); bugun.setHours(0,0,0,0);
  const gun = t => Math.round((new Date(t) - bugun) / 86400000);

  let acikToplam = 0, yaklasan = 0;
  kayitlar.forEach(k=>{
    if(k.kapandi) return;
    const vs = grup[k.id] || [];
    if(k.vadeli && vs.length){
      vs.forEach(v=>{ if(!v.odendi){ acikToplam += +v.tutar||0; if(gun(v.tarih) <= 20) yaklasan++; } });
    }else{
      acikToplam += +k.tutar||0;
      if(k.tarih && gun(k.tarih) <= 20) yaklasan++;
    }
  });

  kutu.innerHTML = `
    <div class="card">
      <div class="kv"><span>Açık ${HESAP_TIP==="alacak"?"alacak":"borç"}</span>
        <b class="mono" style="color:${HESAP_TIP==="alacak"?"var(--green)":"var(--red)"}">${nf(Math.round(acikToplam))} ₺</b></div>
      <div class="kv"><span>20 gün içinde vadesi gelen</span><b class="mono">${yaklasan}</b></div>
    </div>
    ${kayitlar.map(k=>{
      const vs = (grup[k.id]||[]).sort((a,b)=>a.tarih.localeCompare(b.tarih));
      const acik = vs.filter(v=>!v.odendi);
      const sonraki = acik[0];
      const g = sonraki ? gun(sonraki.tarih) : (k.tarih ? gun(k.tarih) : null);
      const renk = k.kapandi ? "var(--ink-3)" : (g != null && g <= 20 ? (g < 0 ? "var(--red)" : "var(--gold)") : "var(--ink-2)");
      const durum = k.kapandi ? "kapandı"
        : g == null ? "tarihsiz"
        : g < 0 ? `${Math.abs(g)} gün geçti`
        : g === 0 ? "bugün" : `${g} gün kaldı`;
      return `<div class="card" style="${k.kapandi?"opacity:.55":""}">
        <div style="display:flex;align-items:center;gap:10px">
          <b style="font-size:15px;flex:1">${esc(k.kisi)}</b>
          <b class="mono" style="color:${HESAP_TIP==="alacak"?"var(--green)":"var(--red)"}">${nf(Math.round(k.tutar))} ₺</b></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
          <span class="pill sade">${k.vadeli ? `${vs.length} vade` : "tek ödeme"}</span>
          <span class="pill" style="background:transparent;color:${renk};border-color:${renk}">${durum}</span>
          ${k.tarih && !k.vadeli ? `<span class="pill sade">${new Date(k.tarih).toLocaleDateString("tr-TR")}</span>` : ""}
          <span style="flex:1"></span>
          ${ME.role!=='uye'?`<button class="pill gold" onclick="hesapAc('${k.id}')">detay</button>`:""}
        </div>
        ${k.notu?`<div style="font-size:13px;color:var(--ink-2);margin-top:8px">${esc(k.notu)}</div>`:""}
      </div>`;
    }).join("")}`;
}

function hesapYeni(){
  app.innerHTML = head("Yeni Kayıt","go('hesap')") + `
    <div class="field"><label>Tür</label><select id="htip">
      <option value="alacak"${HESAP_TIP==="alacak"?" selected":""}>Alacağım</option>
      <option value="borc"${HESAP_TIP==="borc"?" selected":""}>Borcum</option></select></div>
    <div class="field"><label>Kişi / kurum</label><input id="hkisi" placeholder="Ad soyad"></div>
    <div class="field"><label>Toplam tutar (₺)</label><input id="htutar" inputmode="decimal"></div>
    <div class="field"><label>Ödeme biçimi</label><select id="hvadeli">
      <option value="0">Tek ödeme</option><option value="1">Vadeli</option></select></div>
    <div class="field" id="htarihK"><label>Tarih</label><input id="htarih" type="date"></div>
    <div id="hvadeK" style="display:none">
      <div class="row2">
        <div class="field"><label>Vade sayısı</label><input id="hadet" type="number" min="1" max="120" value="6"></div>
        <div class="field"><label>İlk vade</label><input id="hilk" type="date"></div>
      </div>
      <p class="ipuc">Tutar vadelere eşit bölünür; sonra tek tek düzenleyebilirsin.</p>
    </div>
    <div class="field"><label>Not (isteğe bağlı)</label><input id="hnot" placeholder="Tek satır not"></div>
    <button class="btn" id="hkay">Kaydet</button>`;

  const vd = document.getElementById("hvadeli");
  vd.onchange = () => {
    const v = vd.value === "1";
    document.getElementById("hvadeK").style.display = v ? "block" : "none";
    document.getElementById("htarihK").style.display = v ? "none" : "block";
  };

  document.getElementById("hkay").onclick = async e => {
    const kisi = document.getElementById("hkisi").value.trim();
    const tutar = sayiCoz(document.getElementById("htutar").value) || 0;
    if(!kisi) return toast("Kişi adı yaz");
    if(tutar <= 0) return toast("Tutar yaz");
    const vadeli = vd.value === "1";
    e.target.disabled = true;
    const { data:k, error } = await sb.from("hesap").insert({
      team_id:ME.team_id, tip:document.getElementById("htip").value, kisi, tutar,
      vadeli, tarih: vadeli ? null : (document.getElementById("htarih").value || null),
      notu: document.getElementById("hnot").value.trim() || null, created_by:ME.id
    }).select().single();
    if(error){ e.target.disabled = false; return toast("Olmadı: "+error.message); }

    if(vadeli){
      const adet = Math.max(1, Math.min(120, +document.getElementById("hadet").value || 1));
      const ilk = document.getElementById("hilk").value;
      const pay = Math.round(tutar/adet);
      const satirlar = Array.from({length:adet},(_,i)=>{
        const t = ilk ? new Date(ilk) : new Date();
        t.setMonth(t.getMonth() + i);
        return { hesap_id:k.id, team_id:ME.team_id, tarih:t.toISOString().slice(0,10),
                 tutar: i === adet-1 ? tutar - pay*(adet-1) : pay };
      });
      await sb.from("hesap_vade").insert(satirlar);
    }
    HESAP_TIP = k.tip;
    toast("Kaydedildi"); go("hesap");
  };
}

async function hesapGuncelle(id){
  const v = x => document.getElementById(x).value;
  const kisi = v("dkisi").trim();
  if(!kisi) return toast("Kişi adı boş olamaz");
  const { error } = await sb.from("hesap").update({
    tip: v("dtip"), kisi, tutar: sayiCoz(v("dtutar")) || 0,
    tarih: v("dtarih") || null, notu: v("dnot").trim() || null
  }).eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  toast("Kaydedildi"); hesapAc(id);
}
async function hesapKapat(id, deger){ await sb.from("hesap").update({ kapandi: deger }).eq("id", id); hesapAc(id); }
async function hesapSil(id){
  if(!confirm("Bu kayıt ve vadeleri silinsin mi?")) return;
  const { error } = await sb.from("hesap").delete().eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  toast("Silindi"); go("hesap");
}
async function vadeIsaret(vid, hid, deger){ await sb.from("hesap_vade").update({ odendi: deger }).eq("id", vid); hesapAc(hid); }
async function vadeKaydet(vid, hid){
  const t = document.getElementById("vt"+vid).value;
  const m = sayiCoz(document.getElementById("vm"+vid).value) || 0;
  if(!t) return toast("Tarih seç");
  const { error } = await sb.from("hesap_vade").update({ tarih:t, tutar:m }).eq("id", vid);
  if(error) return toast("Olmadı: " + error.message);
  toast("Vade kaydedildi"); hesapAc(hid);
}
async function vadeSil(vid, hid){
  if(!confirm("Bu vade silinsin mi?")) return;
  await sb.from("hesap_vade").delete().eq("id", vid);
  hesapAc(hid);
}
async function vadeEkle(hid){
  const { data:son } = await sb.from("hesap_vade").select("tarih,tutar").eq("hesap_id",hid)
    .order("tarih",{ascending:false}).limit(1);
  const t = son?.[0]?.tarih ? new Date(son[0].tarih) : new Date();
  t.setMonth(t.getMonth() + 1);
  const { error } = await sb.from("hesap_vade").insert({
    hesap_id:hid, team_id:ME.team_id, tarih:t.toISOString().slice(0,10), tutar: son?.[0]?.tutar || 0 });
  if(error) return toast("Olmadı: " + error.message);
  hesapAc(hid);
}

// kutu yolunu ciz (kose bicimine gore)
function kutuYolu(x, w, h, kose){
  const r = kose === "yuvarlak" ? Math.min(h*.28, w*.12) : kose === "kesik" ? Math.min(h*.30, w*.10) : 0;
  x.beginPath();
  if(kose === "kesik"){
    x.moveTo(r,0); x.lineTo(w-r,0); x.lineTo(w,r); x.lineTo(w,h-r);
    x.lineTo(w-r,h); x.lineTo(r,h); x.lineTo(0,h-r); x.lineTo(0,r); x.closePath();
  }else if(r){
    x.moveTo(r,0); x.arcTo(w,0,w,h,r); x.arcTo(w,h,0,h,r); x.arcTo(0,h,0,0,r); x.arcTo(0,0,w,0,r); x.closePath();
  }else{
    x.rect(0,0,w,h);
  }
}

// metni kutuya sigdiran punto bul
const OLCER = document.createElement("canvas").getContext("2d");
function sigdir(x, metin, genislik, baslangic){
  let p = Math.max(6, Math.round(baslangic));
  if(!metin) return p;
  x.font = `700 ${p}px Arial`;
  while(p > 6 && x.measureText(metin).width > genislik){ p -= 1; x.font = `700 ${p}px Arial`; }
  return p;
}
