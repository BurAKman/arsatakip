// capi seffaf PNG olarak uret: mod 1 sinir, 2 parcali, 3 parcali + yazi
function capSeffafPng(p, cfg, mod, ayar){
  const parcalar = cfg?.parcalar || null;
  const a = ayar || {};
  const tema = CAP_TEMA[a.tema ?? 0];
  const disRenk = a.dis || tema.dis;
  const icRenk  = a.ic  || tema.ic;

  const g = p.geojson.geometry;
  const halka = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(halka.length>1 && halka[0][0]===halka[halka.length-1][0] && halka[0][1]===halka[halka.length-1][1]) halka.pop();
  const M = metreye(halka);
  const minX = Math.min(...M.map(k=>k[0])), maxX = Math.max(...M.map(k=>k[0]));
  const minY = Math.min(...M.map(k=>k[1])), maxY = Math.max(...M.map(k=>k[1]));
  const B = 1600, pay = 50;
  const olcek = Math.min((B-pay*2)/((maxX-minX)||1), (B-pay*2)/((maxY-minY)||1));
  const W = Math.round((maxX-minX)*olcek + pay*2), H = Math.round((maxY-minY)*olcek + pay*2);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const E = m => [ pay + (m[0]-minX)*olcek, pay + (maxY-m[1])*olcek ];
  const N = M.map(E);
  const yol = pts => { x.beginPath(); pts.forEach((k,i)=> i?x.lineTo(k[0],k[1]):x.moveTo(k[0],k[1])); x.closePath(); };

  if(mod !== 1 && parcalar && parcalar.length > 1){
    const yer = capYerlesim(M, cfg);
    yer.parcalar.forEach((o,i)=>{
      const d = o.poly, bilgi = o.bilgi || parcalar[i] || {};
      yol(d.map(E));
      const pr = bilgi.renk || "#FFFFFF";
      if(tema.metalik){
        const gr = x.createLinearGradient(0,0,W*.3,H);
        gr.addColorStop(0, pr); gr.addColorStop(.42, "#FFFFFF");
        gr.addColorStop(.58, pr); gr.addColorStop(1, "#DDE0E3");
        x.fillStyle = gr; x.globalAlpha = tema.dolgu;
      }else{
        x.fillStyle = pr; x.globalAlpha = a.dolgu ?? tema.dolgu;
      }
      x.fill(); x.globalAlpha = 1;
      x.lineWidth = 5; x.strokeStyle = icRenk; x.stroke();

      if(mod === 3){
        const om = E(agirlikMerkezi(d));
        const ol = parcaOlcu(d);
        x.textAlign = "center"; x.textBaseline = "middle";
        x.lineWidth = 7; x.strokeStyle = tema.yaziGolge;
        x.font = "700 60px Arial";
        const no = String(bilgi.no || (i+1));
        x.strokeText(no, om[0], om[1]-34); x.fillStyle = tema.yaziRenk; x.fillText(no, om[0], om[1]-34);
        x.font = "700 34px Arial";
        const m2 = nf(Math.round(bilgi.m2 || alanHesap(d))) + " m²";
        x.strokeText(m2, om[0], om[1]+14); x.fillText(m2, om[0], om[1]+14);
        x.font = "700 24px Arial";
        const ov = `${ol.en.toFixed(1).replace(".",",")} × ${ol.boy.toFixed(1).replace(".",",")} m`;
        x.strokeText(ov, om[0], om[1]+52); x.fillText(ov, om[0], om[1]+52);
      }
    });

    (yer.yol||[]).forEach(yp=>{
      if(yp.length < 3) return;
      yol(yp.map(E));
      x.fillStyle = tema.metalik ? "rgba(70,70,70,.6)" : "rgba(255,255,255,.30)";
      x.fill();
      x.setLineDash([18,14]); x.lineWidth = 3; x.globalAlpha = .85;
      x.strokeStyle = icRenk; x.stroke(); x.globalAlpha = 1; x.setLineDash([]);
    });
  }else if(mod === 1){
    yol(N); x.fillStyle = tema.metalik ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.14)"; x.fill();
  }

  yol(N);
  x.lineWidth = 12; x.strokeStyle = tema.golge; x.stroke();
  x.lineWidth = 6; x.strokeStyle = disRenk; x.stroke();
  return c.toDataURL("image/png");
}

        <option value="2"${a.mod==2?" selected":""}>Parçalı · yazısız</option>
        <option value="1"${a.mod==1?" selected":""}>Sadece sınır çizgisi</option></select></div>

        <div class="field"><label>Parça çizgi rengi</label><input type="color" id="cic" value="${a.ic||"#FFFFFF"}" style="height:46px"></div>

        <input type="range" id="cdolgu" min="0" max="90" value="${Math.round((a.dolgu??.42)*100)}" style="padding:0"></div>
    </div>

    <button class="btn" id="capOnay">${duzenleIx!=null ? "Değişikliği uygula" : "Çapı tuvale ekle"}</button>`;

function sunumCiz(){
  const t = document.getElementById("tuval");
  if(!t) return;
  if(!SUNUM.arka){
    t.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--ink-3);font-size:13px">Arka plan görseli seçilmedi</div>`;
    t.style.height = "auto";
    return;
  }
  const oran = ORANLAR[SUNUM.oranIx];
  const W = t.clientWidth, H = W * (oran.h / oran.w);
  t.style.height = H + "px";
  t.innerHTML = `<div class="arka" style="background-image:url('${SUNUM.arka.url}');
     background-position:50% ${SUNUM.kaydir}%"></div>
     <div class="olcu">${oran.w}×${oran.h}</div>`;

  SUNUM.ogeler.forEach((o,i)=>{
    const d = document.createElement("div");
    d.className = "oge" + (SUNUM.secili===i ? " sec" : "");
    d.style.left = (o.x*W)+"px"; d.style.top = (o.y*H)+"px";
    d.style.width = (o.w*W)+"px"; d.style.height = (o.h*H)+"px";
    d.style.transform = `rotate(${o.rot||0}deg)`;
    d.dataset.i = i;

    if(o.tur === "cap"){
      d.innerHTML = `<img src="${o.src}">`;
    }else{
      const kw = o.w*W, kh = o.h*H, st = KUTU_STIL[o.stil ?? 0];
      const m = kutuMetrik(o, kw, kh);
      d.innerHTML = `<div class="kutu" style="${kutuCss(o)}justify-content:flex-start;padding:0">
        <div style="position:absolute;left:${m.pad}px;top:${m.ustY}px;width:${m.kullan}px">
        ${o.ust&&m.ustP?`<div style="color:${st.ustRenk};font-weight:700;letter-spacing:.06em;
          font-size:${m.ustP}px;line-height:1.5;white-space:nowrap">${esc(o.ust)}</div>`:""}
        ${m.altP?`<div style="color:${st.altRenk};font-weight:700;white-space:pre-line;
          line-height:${m.SATIR};font-size:${m.altP}px">${esc(m.satirlar.join("\n"))}</div>`:""}
        </div></div>`;
    }

    if(SUNUM.secili === i) d.innerHTML +=
      `<div class="tut boy" data-tut="boy">⤢</div><div class="tut don" data-tut="don">⟳</div>
       <div class="tut kapat" data-tut="kapat">×</div><div class="tut kalem" data-tut="kalem">✎</div>`;
    t.appendChild(d);
  });

  sunumOlaylar(t, W, H);
}

function sunumOlaylar(t, W, H){
  t.querySelectorAll(".oge").forEach(d=>{
    d.onpointerdown = e => {
      const i = +d.dataset.i, o = SUNUM.ogeler[i];
      const tut = e.target.dataset?.tut;
      if(tut === "kapat"){ SUNUM.ogeler.splice(i,1); SUNUM.secili = null; sunumEkran(); return; }
      if(tut === "kalem"){
        SUNUM.secili = i;
        if(o.tur === "cap") return sunumCap(i);
        sunumEkran();
        document.getElementById("dzUst")?.scrollIntoView({ behavior:"smooth", block:"center" });
        return;
      }
      if(SUNUM.secili !== i){ SUNUM.secili = i; sunumEkran(); return; }
      e.preventDefault(); d.setPointerCapture(e.pointerId);
      const bx = t.getBoundingClientRect();
      const b = { x:o.x, y:o.y, w:o.w, h:o.h, rot:o.rot||0 };
      const bas = { x:e.clientX, y:e.clientY };
      const mx = bx.left + (o.x + o.w/2)*W, my = bx.top + (o.y + o.h/2)*H;
      const basAci = Math.atan2(e.clientY-my, e.clientX-mx) * 180/Math.PI;

      d.onpointermove = ev => {
        const dx = (ev.clientX - bas.x)/W, dy = (ev.clientY - bas.y)/H;
        if(tut === "boy"){
          o.w = Math.max(.06, b.w + dx); o.h = Math.max(.04, b.h + dy);
        }else if(tut === "don"){
          const aci = Math.atan2(ev.clientY-my, ev.clientX-mx) * 180/Math.PI;
          o.rot = Math.round(b.rot + (aci - basAci));
        }else{
          o.x = b.x + dx; o.y = b.y + dy;
        }
        d.style.left = (o.x*W)+"px"; d.style.top = (o.y*H)+"px";
        d.style.width = (o.w*W)+"px"; d.style.height = (o.h*H)+"px";
        d.style.transform = `rotate(${o.rot||0}deg)`;
      };
      d.onpointerup = () => { d.onpointermove = null; sunumCiz(); };
    };
  });
}

async function sunumUret(){
  if(!SUNUM.arka) return toast("Önce arka plan görseli yükle");
  toast("Görsel hazırlanıyor…");
  const oran = ORANLAR[SUNUM.oranIx];
  const W = oran.w, H = oran.h;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const arka = await yukleGorsel(SUNUM.arka.url);

  // "cover" kirpma: onizlemedeki background-size:cover ile birebir ayni
  const ol = Math.max(W/arka.naturalWidth, H/arka.naturalHeight);
  const dw = arka.naturalWidth*ol, dh = arka.naturalHeight*ol;
  x.fillStyle = "#000"; x.fillRect(0,0,W,H);
  x.drawImage(arka, (W-dw)/2, (H-dh)*(SUNUM.kaydir/100), dw, dh);

  for(const o of SUNUM.ogeler){
    const ox = o.x*W, oy = o.y*H, ow = o.w*W, oh = o.h*H;
    x.save();
    x.translate(ox + ow/2, oy + oh/2);
    x.rotate((o.rot||0) * Math.PI/180);
    x.translate(-ow/2, -oh/2);
    if(o.tur === "cap"){
      const im = await yukleGorsel(o.src);
      x.drawImage(im, 0, 0, ow, oh);
    }else{
      kutuCiz(x, o, ow, oh);
    }
    x.restore();
  }

  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.92));
  const p = SUNUM.p;
  const ad2 = `${p.ada||0}-${p.parsel}-sunum-${Date.now().toString().slice(-5)}.jpg`;
  indirBlob(blob, ad2);
  try{
    await dosyaYukle(new File([blob], ad2, { type:"image/jpeg" }), "sunum", SUNUM.parselId);
    toast("Sunum görseli kaydedildi");
  }catch(e){ toast("İndirildi ama kaydedilemedi: " + (e.message||e)); }
}

const yukleGorsel = src => new Promise((res,rej)=>{
  const i = new Image(); i.crossOrigin = "anonymous";
  i.onload = ()=>res(i); i.onerror = rej; i.src = src;
});

// iki koordinat arasi mesafe (metre)
function mesafe(a, b){
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b[0]-a[0]) * Math.cos(rad((a[1]+b[1])/2));
  const df = rad(b[1]-a[1]);
  return Math.round(Math.sqrt(dl*dl + df*df) * R * 10)/10;
}


/* ---- geometri: metreye cevir, alan, yariduzlem kirpma, parcala ---- */

// parselin dis halkasini metre duzlemine cevir
function capHalkasi(p){
  if(!p?.geojson?.geometry) return null;
  const g = p.geojson.geometry;
  const h = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(h.length>1 && h[0][0]===h[h.length-1][0] && h[0][1]===h[h.length-1][1]) h.pop();
  return metreye(h);
}

function metreye(halka){
  const lat0 = halka.reduce((t,k)=>t+k[1],0)/halka.length;
  const kx = Math.cos(lat0*Math.PI/180) * 111320, ky = 110540;
  const x0 = halka[0][0], y0 = halka[0][1];
  return halka.map(k=>[ (k[0]-x0)*kx, (k[1]-y0)*ky ]);
}

function alanHesap(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    a += pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
  }
  return Math.abs(a)/2;
}

// n·p <= d yarim duzlemine kirp (Sutherland-Hodgman)
function kirp(poly, n, d){
  const cik = [];
  for(let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const da = n[0]*a[0]+n[1]*a[1]-d, db = n[0]*b[0]+n[1]*b[1]-d;
    if(da <= 0) cik.push(a);
    if((da < 0 && db > 0) || (da > 0 && db < 0)){
      const t = da/(da-db);
      cik.push([ a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1]) ]);
    }
  }
  return cik;
}

// parselin en uzun kenar yonu
function anaYon(pts){
  let enUzun = 0, yon = [1,0];
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    const dx = pts[j][0]-pts[i][0], dy = pts[j][1]-pts[i][1];
    const u = Math.hypot(dx,dy);
    if(u > enUzun){ enUzun = u; yon = [dx/u, dy/u]; }
  }
  return yon;
}

// verilen yone dik seritlere bol
// mutlak=true ise hedefler m2 olarak birebir uygulanir (orantilanmaz)
function parcala(pts, hedefler, yonVer, mutlak){
  const yon = yonVer || anaYon(pts);
  const izd = pts.map(p=>p[0]*yon[0]+p[1]*yon[1]);
  let alt = Math.min(...izd), ust = Math.max(...izd);
  const toplam = alanHesap(pts);
  const oran = hedefler.reduce((t,h)=>t+h,0) || toplam;

  const parcalar = [];
  let sinir = alt;
  for(let i=0;i<hedefler.length;i++){
    if(i === hedefler.length-1){
      parcalar.push(kirp(pts, [-yon[0],-yon[1]], -sinir));
      break;
    }
    const hedef = mutlak ? hedefler[i] : toplam * (hedefler[i]/oran);
    let a = sinir, b = ust, kes = ust;
    for(let k=0;k<44;k++){
      kes = (a+b)/2;
      const dilim = kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir);
      const al = dilim.length > 2 ? alanHesap(dilim) : 0;
      if(al < hedef) a = kes; else b = kes;
    }
    parcalar.push(kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir));
    sinir = kes;
  }
  return parcalar.filter(p=>p.length > 2);
}

// izgara: once sutunlara, sonra her sutunu satirlara bol
function parcalaIzgara(pts, sutun, satir, hedefler){
  const ana = anaYon(pts);
  const dik = [-ana[1], ana[0]];
  const sutunHedef = [];
  for(let s2=0;s2<sutun;s2++){
    let t = 0;
    for(let r=0;r<satir;r++) t += hedefler[s2*satir + r] || 0;
    sutunHedef.push(t || 1);
  }
  const sutunlar = parcala(pts, sutunHedef, dik);
  const cikti = [];
  sutunlar.forEach((sp, s2)=>{
    const satirHedef = [];
    for(let r=0;r<satir;r++) satirHedef.push(hedefler[s2*satir + r] || 1);
    const parcalari = satir > 1 ? parcala(sp, satirHedef, ana) : [sp];
    parcalari.forEach(pp=>cikti.push(pp));
  });
  return cikti;
}

// parselin ortasindan uzun eksen boyunca yol seridi ayir
function yolAyir(pts, genislik){
  const ana = anaYon(pts);
  const dik = [-ana[1], ana[0]];
  const izd = pts.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  const orta = (Math.min(...izd) + Math.max(...izd)) / 2;
  const y1 = orta - genislik/2, y2 = orta + genislik/2;
  return {
    yol: kirp(kirp(pts, dik, y2), [-dik[0],-dik[1]], -y1),
    sol: kirp(pts, dik, y1),
    sag: kirp(pts, [-dik[0],-dik[1]], -y2),
    ana, dik
  };
}

// parselin buyuklugune gore makul yol genisligi
function yolGenisligiOner(alan){
  if(alan < 5000) return 5;
  if(alan < 20000) return 7;
  return 10;
}

// blok tarifine gore parcalari ve yolu uret
// cfg = { bloklar:[ {tip:"tam", parcalar:[...]} | {tip:"yol", sol:[...], sag:[...]} ], enAzYol, ters }
function capYerlesim(M, cfg){
  let ana = anaYon(M);
  if(cfg.ters) ana = [-ana[0], -ana[1]];
  const dik = [-ana[1], ana[0]];
  const bos = { parcalar:[], yol:[], ana, dik, yolGenislik:0, yolAlan:0, kucultme:0 };

  const bloklar = (cfg.bloklar||[]).map(b=>{
    if(b.tip === "yol") return { tip:"yol",
      sol:(b.sol||[]).map(o=>({ ...o, m2:Math.max(1,+o.m2||1) })),
      sag:(b.sag||[]).map(o=>({ ...o, m2:Math.max(1,+o.m2||1) })) };
    return { tip:"tam", parcalar:(b.parcalar||[]).map(o=>({ ...o, m2:Math.max(1,+o.m2||1) })) };
  }).filter(b=> b.tip === "yol" ? (b.sol.length + b.sag.length) : b.parcalar.length);
  if(!bloklar.length) return bos;

  const A = alanHesap(M);
  const izdA = M.map(p=>p[0]*ana[0]+p[1]*ana[1]);
  const izdD = M.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  const aMin = Math.min(...izdA), aMax = Math.max(...izdA);
  const dMin = Math.min(...izdD), dMax = Math.max(...izdD);
  const W = dMax - dMin, boy = aMax - aMin;
  const enAz = Math.max(1, cfg.enAzYol || 4);

  const blokAlan = bloklar.map(b=> b.tip === "yol"
    ? b.sol.concat(b.sag).reduce((t,o)=>t+o.m2,0)
    : b.parcalar.reduce((t,o)=>t+o.m2,0));
  const T = blokAlan.reduce((a,b)=>a+b,0);

  // girilen metrekareler birebir uygulanir; yol artan alandan cikar
  const artan = Math.max(0, A - T);
  let w = artan / Math.max(1, boy);
  let carpan = 1;
  if(cfg.kis){
    // istege bagli: yola en az enAz metre acmak icin parcalari orantili kucult
    w = Math.max(enAz, w);
    w = Math.min(w, W*0.35);
    const gereken = w * boy;
    if(T > A - gereken) carpan = Math.max(0.05, (A - gereken) / T);
  }else{
    w = Math.min(w, W*0.35);
  }
  const yolAlan = w * boy;

  const kA = (poly, deger, ust) => ust ? kirp(poly, ana, deger) : kirp(poly, [-ana[0],-ana[1]], -deger);
  const kD = (poly, deger, ust) => ust ? kirp(poly, dik, deger) : kirp(poly, [-dik[0],-dik[1]], -deger);
  const serit = (a0, a1, d0, d1) => {
    let p = kA(kA(M, a1, true), a0, false);
    if(p.length < 3) return null;
    p = kD(kD(p, d1, true), d0, false);
    return p.length > 2 ? p : null;
  };

  // bloklari uzun eksen boyunca alanlarina gore ayir
  const blokHedef = blokAlan.slice();
  const sinirlar = [aMin];
  const olcekK = A / Math.max(1, T);          // girilen alanlari parsele olcekle
  let s2 = aMin;
  blokHedef.forEach((h,i)=>{
    if(i === blokHedef.length-1){ sinirlar.push(aMax); return; }
    let lo = s2, hi = aMax, kes = aMax;
    for(let k=0;k<40;k++){
      kes = (lo+hi)/2;
      const dilim = kA(kA(M, kes, true), s2, false);
      const al = dilim.length > 2 ? alanHesap(dilim) : 0;
      if(al < h*olcekK) lo = kes; else hi = kes;
    }
    sinirlar.push(kes); s2 = kes;
  });

  const kenarMerkez = dMin + w/2;
  const ortaMerkez  = (dMin + dMax) / 2;
  const merkez = bloklar.map(b=> b.tip === "yol" ? ortaMerkez : kenarMerkez);

  const cikti = [], yolParcalari = [];

  bloklar.forEach((b, i)=>{
    const a0 = sinirlar[i], a1 = sinirlar[i+1];
    let dc = merkez[i];
    if(b.tip === "yol"){
      const oS = b.sol.reduce((t,o)=>t+o.m2,0), oG = b.sag.reduce((t,o)=>t+o.m2,0);
      dc = dMin + W * (oS / Math.max(1, oS + oG));
    }
    const yd0 = dc - w/2, yd1 = dc + w/2;

    const ys = serit(a0, a1, yd0, yd1);
    if(ys) yolParcalari.push(ys);

    if(i > 0 && Math.abs(merkez[i] - merkez[i-1]) > 0.01){
      const d0 = Math.min(merkez[i], merkez[i-1]);
      const d1 = Math.max(merkez[i], merkez[i-1]);
      const bag = serit(a0 - w/2, a0 + w/2, d0, d1);
      if(bag) yolParcalari.push(bag);
    }

    const bant = kA(kA(M, a1, true), a0, false);
    if(bant.length < 3) return;

    if(b.tip === "tam"){
      const kalanBant = bant;
      const hedefler = b.parcalar.map(o=>o.m2);
      const kaynak = kalanBant.length > 2 ? kalanBant : bant;
      parcala(kaynak, hedefler, ana, false).forEach((p,k)=>{
        if(b.parcalar[k]) cikti.push({ poly:p, bilgi:b.parcalar[k] });
      });
      return;
    }

    const ortaD = (dMin + dMax) / 2;
    const oranSol = b.sol.reduce((t,o)=>t+o.m2,0);
    const oranSag = b.sag.reduce((t,o)=>t+o.m2,0);
    const ayirici = dMin + W * (oranSol / Math.max(1, oranSol + oranSag));
    const sol = kD(bant, ayirici, true);
    const sag = kD(bant, ayirici, false);
    if(b.sol.length && sol.length > 2)
      parcala(sol, b.sol.map(o=>o.m2), ana, false).forEach((p,k)=>{
        if(b.sol[k]) cikti.push({ poly:p, bilgi:b.sol[k] });
      });
    if(b.sag.length && sag.length > 2)
      parcala(sag, b.sag.map(o=>o.m2), ana, false).forEach((p,k)=>{
        if(b.sag[k]) cikti.push({ poly:p, bilgi:b.sag[k] });
      });
  });

  if(cfg.yolDus) cikti.forEach(o=>{ if(o.bilgi) o.bilgi = { ...o.bilgi, m2: Math.round(o.bilgi.m2 * carpan) }; });
  return { parcalar: cikti, yol: yolParcalari, ana, dik,
           yolGenislik: w, yolAlan: Math.round(yolAlan),
           kucultme: carpan < 1 ? Math.round((1-carpan)*1000)/10 : 0 };
}

function parcalariUret(M, cfg){
  return capYerlesim(M, cfg).parcalar.map(o=>o.poly);
}

function cfgParcalari(cfg){
  const liste = [];
  (cfg.bloklar||[]).forEach(b=>{
    if(b.tip === "yol"){ (b.sol||[]).forEach(o=>liste.push({ ...o })); (b.sag||[]).forEach(o=>liste.push({ ...o })); }
    else (b.parcalar||[]).forEach(o=>liste.push({ ...o }));
  });
  return liste;
}

// parcanin ana ve dik eksendeki olculeri (cephe x derinlik)
function parcaOlcu(pts){
  const ana = anaYon(pts), dik = [-ana[1], ana[0]];
  const a = pts.map(p=>p[0]*ana[0]+p[1]*ana[1]);
  const d = pts.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  return { boy: Math.max(...a)-Math.min(...a), en: Math.max(...d)-Math.min(...d) };
}

function agirlikMerkezi(pts){
  let x=0, y=0, a=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    const c = pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
    a += c; x += (pts[i][0]+pts[j][0])*c; y += (pts[i][1]+pts[j][1])*c;
  }
  a *= 0.5;
  return a ? [x/(6*a), y/(6*a)] : [pts[0][0], pts[0][1]];
}

    <div class="card">
      <div class="bolum"><span class="rz yesil">${svg("vector")}</span><b>Canlı önizleme</b>

async function capCiz(parselId, cfg, belgeId){
  const { data:p } = await sb.from("parcels").select("*").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  toast("Çap çiziliyor…");
  try{
    const png = capCizPng(p, cfg);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
    pdf.addImage(png, "PNG", 10, 10, 190, 190*(1400/1000));
    const blob = pdf.output("blob");
    const damga = belgeId ? "" : "-" + String(Date.now()).slice(-4);
    const dosya = new File([blob], `cap-${p.mahalle||""}-${p.ada||0}-${p.parsel}${damga}.pdf`.replace(/\s+/g,"_"),
                           { type:"application/pdf" });
    if(belgeId){
      const { data:b2 } = await sb.from("documents").select("file_path,file_name").eq("id", belgeId).single();
      if(b2){
        // depo kurallari uzerine yazmaya izin vermiyor: once sil, sonra ayni yola yukle
        await sb.storage.from("arsatakip").remove([b2.file_path]);
        const { error } = await sb.storage.from("arsatakip").upload(b2.file_path, dosya);
        if(error) throw error;
        const { error:e2 } = await sb.from("documents")
          .update({ size_bytes: dosya.size, cap_config: cfg }).eq("id", belgeId);
        if(e2) throw e2;
      }else await dosyaYukle(dosya, "cap", parselId, cfg);
    }else{
      await dosyaYukle(dosya, "cap", parselId, cfg);
    }
    if(cfg && cfg.parcalar?.length) await sb.from("parcels").update({ cap_config: cfg }).eq("id", parselId);
    toast(belgeId ? "Çap güncellendi" : "Çap hazırlandı ve parsele eklendi");
    go("parsel", parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

// parsel sinirindan olcekli cap cizimi uretir
// resmi capa benzer cizim: kunye tablosu, kuzey gulu, parcalar ve olculer
function capCizPng(p, cfg, kucuk){
  const parcalar = cfg?.parcalar || null;
  const M = capHalkasi(p);
  if(!M) throw new Error("sınır çizimi yok");

  const G = kucuk ? 700 : 1000, Y = kucuk ? 900 : 1400;
  const ustAlan = kucuk ? 110 : 280, altAlan = kucuk ? 30 : 90, kenar = kucuk ? 40 : 80;
  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);
  const S = k => kucuk ? Math.max(8, Math.round(k*0.66)) : k;

  const minX = Math.min(...M.map(k=>k[0])), maxX = Math.max(...M.map(k=>k[0]));
  const minY = Math.min(...M.map(k=>k[1])), maxY = Math.max(...M.map(k=>k[1]));
  const alanG = G - kenar*2, alanY = Y - ustAlan - altAlan;
  const olcek = Math.min(alanG/((maxX-minX)||1e-9), alanY/((maxY-minY)||1e-9));
  const gX = kenar + (alanG - (maxX-minX)*olcek)/2;
  const gY = ustAlan + (alanY - (maxY-minY)*olcek)/2;
  const E = m => [ gX + (m[0]-minX)*olcek, gY + (maxY-m[1])*olcek ];
  const N = M.map(E);
  const yol = pts => { x.beginPath(); pts.forEach((k,i)=> i ? x.lineTo(k[0],k[1]) : x.moveTo(k[0],k[1])); x.closePath(); };

  // ---- kunye tablosu ----
  if(!kucuk){
    const t = 30, tw = G - 60, sy = 34;
    const sut = [[ "İl", duzgun(p.il) ], [ "İlçe", duzgun(p.ilce) ], [ "Mahalle", duzgun(p.mahalle) ]];
    const sut2 = [[ "Ada", p.ada||"—" ], [ "Parsel", p.parsel ], [ "Tapu alanı (m²)", nf(p.alan_m2) ],
                  [ "Nitelik", p.nitelik||"—" ], [ "Mevki", p.mevkii||"—" ]];
    x.strokeStyle = "#333"; x.lineWidth = 1.4;
    const ciz = (satir, ust) => {
      const gen = tw / satir.length;
      satir.forEach((s2,i)=>{
        x.strokeRect(t + i*gen, ust, gen, sy);
        x.strokeRect(t + i*gen, ust+sy, gen, sy);
        x.textAlign = "center"; x.textBaseline = "middle";
        x.font = "700 15px Arial"; x.fillStyle = "#111";
        x.fillText(s2[0], t + i*gen + gen/2, ust + sy/2);
        x.font = "400 15px Arial"; x.fillStyle = "#222";
        x.fillText(String(s2[1]).slice(0,22), t + i*gen + gen/2, ust + sy + sy/2);
      });
    };
    ciz(sut, 30); ciz(sut2, 30 + sy*2);

    // kuzey gulu
    const kx2 = 74, ky2 = 224;
    x.save(); x.translate(kx2, ky2);
    x.fillStyle = "#111"; x.font = "700 15px Arial"; x.textAlign = "center";
    x.fillText("KUZEY", 0, -36);
    x.beginPath(); x.moveTo(0,-26); x.lineTo(-9,10); x.lineTo(0,3); x.lineTo(9,10); x.closePath();
    x.fillStyle = "#111"; x.fill();
    x.beginPath(); x.arc(0,0,20,0,7); x.strokeStyle = "#333"; x.lineWidth = 1.2; x.stroke();
    x.restore();
  }

  const liste = (parcalar && parcalar.length > 1) ? parcalar : null;
  if(liste){
    const yer = capYerlesim(M, cfg);

    yer.parcalar.forEach((o,i)=>{
      const d = o.poly, ek = d.map(E), bilgi = o.bilgi || liste[i] || {};
      yol(ek);
      x.fillStyle = bilgi.renk || "#FFFFFF"; x.globalAlpha = .55; x.fill(); x.globalAlpha = 1;
      x.lineWidth = 1.6; x.strokeStyle = "#222"; x.stroke();

      const om = E(agirlikMerkezi(d));
      x.textAlign = "center"; x.textBaseline = "middle";
      x.font = `700 ${S(20)}px Arial`; x.fillStyle = "#111";
      x.fillText(String(bilgi.no || (i+1)), om[0], om[1] - S(12));
      x.font = `400 ${S(15)}px Arial`;
      x.fillText(nf(Math.round(bilgi.m2 || alanHesap(d))) + " m2", om[0], om[1] + S(10));

      // parcanin kenar olculeri
      if(!kucuk){
        x.font = "400 11px Arial"; x.fillStyle = "#333";
        for(let k=0;k<d.length;k++){
          const j = (k+1) % d.length;
          const uz = Math.hypot(d[j][0]-d[k][0], d[j][1]-d[k][1]);
          if(uz < 4) continue;
          const a1 = ek[k], a2 = ek[j];
          const ox = (a1[0]+a2[0])/2, oy = (a1[1]+a2[1])/2;
          const dx = a2[0]-a1[0], dy = a2[1]-a1[1], u = Math.hypot(dx,dy) || 1;
          const mx = om[0] - ox, my = om[1] - oy;
          const nx = (-dy/u), ny = (dx/u);
          const yon = (nx*mx + ny*my) > 0 ? 1 : -1;
          x.save();
          x.translate(ox + nx*9*yon, oy + ny*9*yon);
          let ac = Math.atan2(dy, dx);
          if(Math.abs(ac) > Math.PI/2) ac += Math.PI;
          x.rotate(ac);
          x.fillText(uz.toFixed(1).replace(".",",") + " m", 0, 0);
          x.restore();
        }
      }
    });

    // parsel yolu her zaman en uste cizilir
    (yer.yol||[]).forEach(yp=>{
      if(!yp || yp.length < 3) return;
      yol(yp.map(E));
      x.fillStyle = "#E3E7EB"; x.fill();
      x.lineWidth = 1.2; x.strokeStyle = "#98A2AC"; x.stroke();
    });
    if((yer.yol||[]).length && !kucuk){
      const enBuyuk = yer.yol.reduce((a,b2)=>
        (b2.length>2 && alanHesap(b2) > (a && a.length>2 ? alanHesap(a) : 0)) ? b2 : a, yer.yol[0]);
      if(enBuyuk && enBuyuk.length > 2){
        const om = E(agirlikMerkezi(enBuyuk));
        x.save(); x.translate(om[0], om[1]);
        let ac = Math.atan2(yer.ana[1], yer.ana[0]);
        x.rotate(-ac + (Math.abs(ac) > Math.PI/2 ? Math.PI : 0));
        x.textAlign = "center"; x.textBaseline = "middle";
        x.font = "700 12px Arial"; x.fillStyle = "#6C757D";
        x.fillText("PARSEL YOLU", 0, 0);
        x.restore();
      }
    }
  }else{
    yol(N); x.fillStyle = "#F4F6F0"; x.fill();
  }

  // dis sinir
  yol(N); x.lineWidth = kucuk ? 2 : 3; x.strokeStyle = "#111"; x.stroke();

  if(!kucuk){
    x.textAlign = "left"; x.textBaseline = "alphabetic";
    x.font = "400 14px Arial"; x.fillStyle = "#666";
    const pxPerM = olcek, pxPerCm = 1000/190*10;
    x.fillText(`Ölçek 1 cm ≈ ${Math.round(pxPerCm/(pxPerM||1))} m`, 30, Y - 40);
    x.textAlign = "right";
    x.fillText(new Date().toLocaleDateString("tr-TR"), G-30, Y - 40);
  }
  return c.toDataURL("image/png");
}

async function kmlIndirParsel(parselId){
  const { data:p } = await sb.from("parcels").select("geojson,mahalle,ada,parsel").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  const f = p.geojson;
  const b = new Blob([kmlMetni(f)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${p.mahalle||"parsel"}-${p.ada||0}-${p.parsel}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

let MINI = null;
async function miniHarita(parselId){
  const kutu = document.getElementById("minikutu");
  if(!kutu) return;
  if(kutu.innerHTML){ kutu.innerHTML = ""; MINI = null; return; }
  kutu.innerHTML = `<div id="minimap" style="margin-top:12px"></div>`;
  const { data:p } = await sb.from("parcels").select("geojson,lat,lng").eq("id",parselId).single();
  MINI = L.map("minimap", { zoomControl:true }).setView([p.lat, p.lng], 16);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Uydu: Esri · Parsel: TKGM" }).addTo(MINI);
  if(p.geojson){
    const kat = L.geoJSON(p.geojson, { style:{ color:"#E3C05A", weight:2.5, fillColor:"#E3C05A", fillOpacity:.18 } }).addTo(MINI);
    MINI.fitBounds(kat.getBounds(), { padding:[24,24], maxZoom:18 });
  }
  setTimeout(()=>MINI.invalidateSize(), 200);
}

/* ================= ekler ================= */

async function ekler(){
  app.innerHTML = head("Ekler","go('ana')") + `
    <p class="ipuc">Vekalet ve muvafakatname belgeleri. Geçerlilik tarihi yaklaşanlar sarı, geçenler kırmızı görünür.</p>
    <div id="el"><div class="spin"></div></div>
    ${ME.role==='admin'?`<button class="fab" onclick="kisiEkle()">+</button>`:""}`;
  eklerListele();
}

async function eklerListele(){
  const box = document.getElementById("el");
  const [{ data:kisiler, error }, { data:belgeler }] = await Promise.all([
    sb.from("ekler").select("*").order("sira",{nullsFirst:false}).order("created_at"),
    sb.from("documents").select("id,file_path,file_name,size_bytes,created_at").in("kind",["vekalet","muvafakat"])
  ]);
  if(error) return box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  if(!kisiler || !kisiler.length) return box.innerHTML =
    `<div class="empty"><b>Henüz kayıt yok</b>${ME.role==='admin'?"Sağ alttaki + ile kişi ekle.":"Admin kişi eklediğinde burada görünür."}</div>`;

  const bul = id => (belgeler||[]).find(b=>b.id===id);
  const bugun = new Date(); bugun.setHours(0,0,0,0);

  box.innerHTML = kisiler.map((k,i)=>{
    let durum = "", renk = "var(--ink-3)";
    if(k.suresiz){ durum = "Süresiz"; renk = "var(--green)"; }
    else if(k.gecerlilik_tarihi){
      const t = new Date(k.gecerlilik_tarihi);
      const gun = Math.round((t - bugun) / 86400000);
      if(gun < 0){ durum = "süresi geçti"; renk = "var(--red)"; }
      else if(gun <= 30){ durum = `${gun} gün kaldı`; renk = "var(--gold)"; }
      else durum = t.toLocaleDateString("tr-TR");
    }
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace">${String(i+1).padStart(2,"0")}</span>
        <b style="font-size:15px;flex:1">${esc(k.ad_soyad)}</b>
        ${ME.role==='admin'?`<button class="sil" style="width:30px;height:30px;border-radius:8px;border:1px solid var(--cizgi);color:var(--ink-3);display:grid;place-items:center" onclick="kisiSil('${k.id}','${esc(k.ad_soyad)}')">${svg("trash")}</button>`:""}
      </div>
      <div class="kv" style="margin-top:10px"><span>Vekalet</span>
        ${belgeHucre(bul(k.vekalet_doc_id), k.id, "vekalet")}</div>
      <div class="kv"><span>Muvafakatname</span>
        ${belgeHucre(bul(k.muvafakat_doc_id), k.id, "muvafakat")}</div>
      <div class="kv"><span>Vekalet geçerliliği</span>
        ${ME.role==='admin'
          ? `<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
              <select style="width:auto;padding:7px 30px 7px 10px;font-size:13px" onchange="suresizGuncelle('${k.id}',this.value)">
                <option value="tarih"${k.suresiz?"":" selected"}>Tarihli</option>
                <option value="suresiz"${k.suresiz?" selected":""}>Süresiz</option></select>
              ${k.suresiz ? "" : `<input type="date" style="width:auto;padding:7px 10px;font-size:13px" value="${k.gecerlilik_tarihi||""}"
                 onchange="tarihGuncelle('${k.id}',this.value)">`}</span>`
          : `<b>${k.suresiz ? "Süresiz" : (k.gecerlilik_tarihi ? new Date(k.gecerlilik_tarihi).toLocaleDateString("tr-TR") : "—")}</b>`}</div>
      ${durum ? `<div style="font-size:12px;color:${renk};margin-top:6px;text-align:right;font-weight:600">${durum}</div>` : ""}
    </div>`;
  }).join("");
}

function belgeHucre(belge, kisiId, tur){
  if(belge) return `<span style="display:flex;gap:8px;align-items:center">
    <button class="pill gold" onclick="dosyaAc('${esc(belge.file_path)}')">aç</button>
    ${ME.role!=='uye'?`<button class="pill" style="background:var(--cam-2);color:var(--ink-3)" onclick="ekBelgeYukle('${kisiId}','${tur}')">değiştir</button>`:""}</span>`;
  return ME.role!=='uye'
    ? `<button class="pill gold" onclick="ekBelgeYukle('${kisiId}','${tur}')">yükle</button>`
    : `<b style="color:var(--ink-3)">—</b>`;
}

async function ekBelgeYukle(kisiId, tur){
  const f = await dosyaSec();
  if(!f) return;
  toast("Yükleniyor…");
  try{
    const b = await dosyaYukle(f, tur, null);
    const alan = tur === "vekalet" ? "vekalet_doc_id" : "muvafakat_doc_id";
    const { error } = await sb.from("ekler").update({ [alan]: b.id }).eq("id", kisiId);
    if(error) throw error;
    toast("Yüklendi"); eklerListele();
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

async function suresizGuncelle(kisiId, deger){
  const { error } = await sb.from("ekler").update({ suresiz: deger === "suresiz" }).eq("id", kisiId);
  if(error) return toast("Olmadı: " + error.message);
  eklerListele();
}

async function tarihGuncelle(kisiId, tarih){
  const { error } = await sb.from("ekler").update({ gecerlilik_tarihi: tarih || null }).eq("id", kisiId);
  if(error) return toast("Olmadı: " + error.message);
  toast("Tarih kaydedildi"); eklerListele();
}

function kisiEkle(){
  app.innerHTML = head("Kişi ekle","go('ekler')") + `
    <div class="field"><label>Ad soyad</label><input id="as" placeholder="Ad ve soyad"></div>
    <div class="field"><label>Vekalet geçerlilik tarihi</label><input id="gt" type="date"></div>
    <div class="field"><label>İlgili parsel (isteğe bağlı)</label><select id="pr"><option value="">Seçme, genel kalsın</option></select></div>
    <button class="btn" id="kay">Kaydet</button>
    <p class="ipuc" style="margin-top:16px">Belgeleri kaydettikten sonra listeden yükleyeceksin.</p>`;
  sb.from("parcels").select("id,mahalle,ada,parsel").order("mahalle").then(({data})=>{
    const sel = document.getElementById("pr");
    if(sel && data) sel.innerHTML += data.map(p=>
      `<option value="${p.id}">${esc(duzgun(p.mahalle))} ${esc(p.ada||"")}/${esc(p.parsel)}</option>`).join("");
  });
  document.getElementById("kay").onclick = async e => {
    const ad2 = document.getElementById("as").value.trim();
    if(!ad2) return toast("Ad soyad yaz");
    e.target.disabled = true;
    const { error } = await sb.from("ekler").insert({ team_id:ME.team_id, ad_soyad:ad2,
      parcel_id: document.getElementById("pr").value || null,
      gecerlilik_tarihi: document.getElementById("gt").value || null });
    e.target.disabled = false;
    if(error) return toast("Olmadı: " + error.message);
    toast("Eklendi"); go("ekler");
  };
}

async function kisiSil(kisiId, ad2){
  if(!confirm(`${ad2} kaydı silinsin mi? Yüklenen belgeler depoda kalır.`)) return;
  const { error } = await sb.from("ekler").delete().eq("id", kisiId);
  if(error) return toast("Olmadı: " + error.message);
  toast("Silindi"); eklerListele();
}

/* ================= ayarlar ================= */

            <div style="font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k.email||"")}</div>
          </div>
          <span class="pill ${k.role==='admin'?'gold':'sade'}" style="flex:0 0 auto">${rolAd[k.role]}</span>
        </div>
        ${ME.role==='admin' && !benMi ? `<div style="display:flex;gap:8px;align-items:center;margin-top:11px">

async function kullaniciSil(id, isim){
  if(!confirm(`${isim} ekipten çıkarılsın mı?\n\nEklediği kayıtlar ve notlar durur. Aynı hesapla tekrar girerse üye olarak geri gelir; kalıcı engellemek istersen bana söyle.`)) return;
  const { error } = await sb.from("profiles").delete().eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"kullanıcı çıkarıldı", entity:"profiles", entity_id:id, detail:isim });
  toast("Çıkarıldı"); ayarlar();
}

async function rolDegistir(id, rol){
  const { error } = await sb.from("profiles").update({ role: rol }).eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"yetki değişti", entity:"profiles", entity_id:id, detail:rol });
  toast("Yetki güncellendi");
}
async function cikis(){ await sb.auth.signOut(); location.reload(); }

const ekranlar = { ana:anaMenu, harita:harita, araziler:araziler, ekler:ekler, kml:kmlEkran, cap:capEkran, capAyar:capAyar, emsal:emsal, sunum:sunum, musteri:musteriSunumu, yz:yapayZeka, yeni:yeniParsel, parsel:parselDetay,
                   fiyat:fiyat, fiyatDuzen:fiyatDuzen, ayarlar:ayarlar };
function go(r,arg){ (ekranlar[r]||anaMenu)(arg); window.scrollTo(0,0); }

function acilisiKapat(){
  const a = document.getElementById("acilis");
  if(!a || a.classList.contains("git")) return;
  a.classList.add("git");
  setTimeout(()=>a.remove(), 600);
}
// en az 3,4 saniye dursun ki bar dolsun
setTimeout(acilisiKapat, 5200);

function acilisHatasi(mesaj){
  app.innerHTML = `<div class="empty"><b>Açılamadı</b>
    <div style="font-size:11px;color:var(--ink-3)">sürüm ${SURUM}</div>
    <div style="font-size:12px;color:var(--ink-3);margin:10px 0 16px;word-break:break-word">${esc(mesaj)}</div>
    <button class="btn ghost" onclick="location.reload()">Tekrar dene</button>
    <button class="btn danger" style="margin-top:10px" onclick="cikis()">Oturumu sıfırla</button></div>`;
}
const bekletme = 0;

async function baslat(){
 if(window.__basliyor) return;
 window.__basliyor = true;
 try{
  const { data:{ session } } = await zamanAsimi(sb.auth.getSession(), 8000);
  if(!session){ window.__acildi = true; window.__basliyor = false; return girisEkrani(); }
  let { data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000);
  if(!prof){ await new Promise(r=>setTimeout(r,1200));
    ({ data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000)); }
  window.__acildi = true; window.__basliyor = false;
  if(!prof) return acilisHatasi("Profil kurulamadı. Oturumu sıfırlayıp tekrar gir.");
  // isim mail gibi kalmissa Google'dan gelen ad soyadi yaz
  const gAd = session.user.user_metadata?.full_name || session.user.user_metadata?.name;
  if(gAd && (!prof.full_name || prof.full_name.includes("@"))){
    try{ await sb.from("profiles").update({ full_name: gAd }).eq("id", prof.id); prof.full_name = gAd; }catch(e){}
  }
  ME = prof; anaMenu();
 }catch(e){ window.__acildi = true; window.__basliyor = false; acilisHatasi(String(e.message||e)); }
}
baslat();

sb.auth.onAuthStateChange((olay) => {
  if(olay === "SIGNED_IN" && !ME && !window.__basliyor) baslat();
});
