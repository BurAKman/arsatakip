<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F0D">
<title>Çapsız Çapçı</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#F2EFE8; --ink-2:#B9C2BB; --ink-3:#7E8A84;
  --gold:#E3C05A; --gold-soft:rgba(227,192,90,.16);
  --green:#5FD79A; --green-soft:rgba(95,215,154,.16);
  --red:#F0705C; --red-soft:rgba(240,112,92,.16);
  --blue:#6FB0F5; --blue-soft:rgba(111,176,245,.16);
  --cam:rgba(255,255,255,.065);
  --cam-2:rgba(255,255,255,.10);
  --cizgi:rgba(255,255,255,.13);
  --cizgi-2:rgba(255,255,255,.22);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);
  font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
  background:
    radial-gradient(900px 620px at 78% -8%, rgba(95,215,154,.13), transparent 60%),
    radial-gradient(760px 520px at 8% 12%, rgba(111,176,245,.10), transparent 62%),
    radial-gradient(700px 700px at 50% 108%, rgba(227,192,90,.07), transparent 60%),
    #070A09;
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:62px 62px;
}
.wrap{position:relative;max-width:520px;margin:0 auto;padding:0 15px 52px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold);text-decoration:none}
.hide{display:none!important}

/* ---- acilis ekrani ---- */
#acilis{position:fixed;inset:0;z-index:200;background:#05070A;display:grid;place-items:center;
  transition:opacity .6s ease}
#acilis.git{opacity:0;pointer-events:none}
#acilis .acilisCerceve{position:relative;width:100%;height:100%;max-width:calc(100vh * 1024 / 1536);
  max-height:calc(100vw * 1536 / 1024);margin:auto}
#acilis .acilisArka{position:absolute;inset:0;background-image:url('loading.png');
  background-size:contain;background-repeat:no-repeat;background-position:center}
/* bar, gorseldeki sigaranin uzerine oturur */
#acilis .acilisBar{position:absolute;left:6.2%;right:6.2%;top:89.1%;height:2.4%;border-radius:20px;overflow:visible}
#acilis .acilisBar i{position:absolute;left:0;top:0;height:100%;width:0;border-radius:20px;
  background:linear-gradient(90deg,rgba(141,198,63,.25),rgba(198,240,106,.85));
  box-shadow:0 0 18px rgba(141,198,63,.9);animation:dolum 5s cubic-bezier(.32,.7,.4,1) forwards}
#acilis .acilisBar u{position:absolute;top:50%;width:5%;height:280%;transform:translate(-50%,-50%);
  border-radius:50%;left:0;background:radial-gradient(circle,rgba(255,196,80,.95) 0%,rgba(255,110,20,.7) 45%,rgba(255,80,0,0) 72%);
  animation:kor 5s cubic-bezier(.32,.7,.4,1) forwards}
@keyframes dolum{0%{width:0}14%{width:16%}38%{width:44%}64%{width:70%}86%{width:90%}100%{width:100%}}
@keyframes kor{0%{left:0;opacity:.5}14%{left:16%}38%{left:44%}64%{left:70%}86%{left:90%;opacity:1}100%{left:100%;opacity:.2}}

/* ---- ust bar ---- */
.top{display:flex;align-items:center;gap:11px;padding:14px 0 12px}
.top h1{font-size:19px;flex:1}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo .mark{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  border:1.5px solid rgba(255,255,255,.55);background:#0A0C0B;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.logo .mark img{width:100%;height:100%;object-fit:cover;display:block}
.logo b{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1;color:#FFFFFF;
  text-shadow:0 1px 8px rgba(0,0,0,.55)}
.logo span{font-size:9px;letter-spacing:.15em;text-transform:uppercase;display:block;margin-top:2px;
  color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--cizgi-2);background:var(--cam);
  display:grid;place-items:center;flex:0 0 auto;color:var(--ink);backdrop-filter:blur(10px)}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.ak{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34)}
.ibtn.cik{color:var(--red);background:var(--red-soft);border-color:rgba(240,112,92,.42)}
.ibtn.geri{font-size:20px;line-height:1}
.zaman{text-align:right;font-size:11px;color:var(--ink-3);margin:0 2px 10px;font-family:"IBM Plex Mono",monospace}

/* ---- kur ---- */
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 16px}
.rate{background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.30);border-radius:12px;padding:8px 9px;min-width:0;backdrop-filter:blur(14px)}
.rate .v{color:#fff}
.rate .k{font-size:9.5px;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate .v{font-size:12.5px;font-weight:600;margin-top:2px;font-family:"IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- kategori kartlari ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:var(--r);padding:16px 14px;text-align:left;position:relative;overflow:hidden;
  border:1px solid var(--cizgi-2);backdrop-filter:blur(14px);transition:transform .16s,filter .16s;
  background:linear-gradient(155deg,rgba(255,255,255,.13),rgba(255,255,255,.045))}
.tile:active{transform:scale(.98);filter:brightness(1.15)}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2)}
.tile .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15px;font-weight:600;color:#fff}
.tile small{display:block;font-size:12px;color:rgba(255,255,255,.62);margin-top:2px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.tile.wide .ic{margin:0}
.tile.kirmizi{background:linear-gradient(155deg,rgba(240,112,92,.30),rgba(240,112,92,.09));border-color:rgba(240,112,92,.42)}
.tile.kirmizi .ic{color:#FFC9BF}
.tile.yesil{background:linear-gradient(155deg,rgba(95,215,154,.30),rgba(95,215,154,.09));border-color:rgba(95,215,154,.42)}
.tile.yesil .ic{color:#C4F5DC}
.tile.gri{background:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,.055));border-color:rgba(255,255,255,.28)}
.tile.gri .ic{color:#fff}
.tile.mavi{background:linear-gradient(155deg,rgba(111,176,245,.30),rgba(111,176,245,.09));border-color:rgba(111,176,245,.42)}
.tile.mavi .ic{color:#CFE6FF}
.tile.sari{background:linear-gradient(155deg,rgba(227,192,90,.28),rgba(227,192,90,.08));border-color:rgba(227,192,90,.42)}
.tile.sari .ic{color:#F6E3AA}
.tile .gorsel{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;
  background-size:cover;pointer-events:none}
.tile .perde{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(4,7,6,.92) 0%,rgba(4,7,6,.62) 30%,rgba(4,7,6,.12) 62%,rgba(4,7,6,0) 100%)}
.tile .icerik{position:relative;z-index:2}
.tile.gorselli{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 13px}
.tile.gorselli .icerik b{font-size:17px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.tile.gorselli .icerik small{color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(0,0,0,.7)}
.tile.wide.gorselli{aspect-ratio:3/1;display:block;padding:14px 15px}
.tile.mini{padding:13px 12px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.tile.mini b{font-size:14.5px}
.tile.mini small{font-size:11.5px;margin-top:1px}
.tile.wide.gorselli .icerik{position:absolute;left:15px;bottom:13px;right:15px}
.tile.soon::after{content:"yakında";position:absolute;top:12px;right:12px;font-size:10px;color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:2px 8px}

/* ---- form ---- */
label{display:block;font-size:12px;color:var(--ink-2);margin:0 0 6px}
input,select,textarea{
  width:100%;background:rgba(255,255,255,.07);border:1px solid var(--cizgi);border-radius:12px;
  padding:12px 13px;outline:none;transition:border-color .15s,background .15s;backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#101614;color:var(--ink)}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;background:linear-gradient(160deg,#F0D278,#D9B248);color:#1A1403;font-weight:700;
  border-radius:13px;padding:14px;text-align:center;letter-spacing:-.01em;border:1px solid rgba(255,255,255,.25)}
.btn:active{filter:brightness(1.08)}
.btn.ghost{background:var(--cam-2);color:#fff;border:1px solid var(--cizgi-2);font-weight:600}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(240,112,92,.4)}
.btn[disabled]{opacity:.55}

/* ---- listeler / kartlar ---- */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.year{border:1px solid var(--cizgi-2);border-radius:22px;padding:8px 15px;font-size:13px;background:var(--cam);width:auto;min-width:98px}
.search{flex:1}
.card{background:var(--cam);border:1px solid var(--cizgi);border-radius:var(--r);padding:15px;margin-bottom:11px;backdrop-filter:blur(14px)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px}
.kv span{color:var(--ink-2);flex:0 0 auto}
.kv b{text-align:right;min-width:0}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.grp{margin-bottom:11px;border:1px solid var(--cizgi);border-radius:var(--r);background:var(--cam);overflow:hidden;backdrop-filter:blur(14px)}
.ghd{display:flex;align-items:center;gap:11px;padding:15px 14px;width:100%;text-align:left}
.ghd .pinico{width:33px;height:33px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:0 0 auto;border:1px solid rgba(95,215,154,.28)}
.ghd .pinico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ghd .txt{flex:1;min-width:0}
.ghd .txt b{display:block;font-size:14.5px;font-weight:600}
.ghd .txt small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ghd .say{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:20px;padding:4px 11px;font-weight:600;border:1px solid rgba(95,215,154,.28)}
.ghd .chev{color:var(--ink-2);transition:transform .2s;font-size:17px}
.ghd.open .chev{transform:rotate(90deg)}
.rw{display:flex;align-items:center;gap:11px;padding:13px 14px;border-top:1px solid var(--cizgi);background:rgba(255,255,255,.03)}
.rw .kod{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--gold);background:var(--gold-soft);
  border:1px solid rgba(227,192,90,.3);border-radius:9px;padding:7px 10px;flex:0 0 auto;letter-spacing:-.02em}
.rw .orta{flex:1;min-width:0;text-align:left}
.rw .orta b{display:block;font-size:14px;font-weight:500}
.rw .orta small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rw .sag{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sil{width:33px;height:33px;border-radius:10px;border:1px solid rgba(240,112,92,.35);background:var(--red-soft);
  color:var(--red);display:grid;place-items:center;flex:0 0 auto}
.sil svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%}
.dot.on{background:var(--green);box-shadow:0 0 8px rgba(95,215,154,.6)}
.dot.off{background:var(--red);box-shadow:0 0 8px rgba(240,112,92,.5)}
.pill{font-size:11.5px;border-radius:20px;padding:5px 11px;border:1px solid transparent;display:inline-block}
.pill.on{background:var(--green-soft);color:var(--green);border-color:rgba(95,215,154,.3)}
.pill.off{background:var(--red-soft);color:var(--red);border-color:rgba(240,112,92,.3)}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:rgba(227,192,90,.32)}
.pill.sade{background:var(--cam-2);color:var(--ink-2);border-color:var(--cizgi)}

/* ---- bolum basliklari ---- */
.bolum{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bolum .rz{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.18)}
.bolum .rz svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bolum b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;flex:1}
.bolum .sayi{font-size:11px;color:var(--ink-3);background:var(--cam-2);border:1px solid var(--cizgi);
  border-radius:20px;padding:3px 10px}
.rz.altin{background:linear-gradient(155deg,rgba(227,192,90,.30),rgba(227,192,90,.08));color:var(--gold)}
.rz.yesil{background:linear-gradient(155deg,rgba(95,215,154,.30),rgba(95,215,154,.08));color:var(--green)}
.rz.mavi{background:linear-gradient(155deg,rgba(111,176,245,.30),rgba(111,176,245,.08));color:var(--blue)}
.rz.kirmizi{background:linear-gradient(155deg,rgba(240,112,92,.30),rgba(240,112,92,.08));color:var(--red)}
.tur{font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;
  margin:12px 0 4px;display:flex;align-items:center;gap:9px}
.tur::after{content:"";flex:1;height:1px;background:var(--cizgi)}
.acts button.kirmizi{background:linear-gradient(155deg,rgba(240,112,92,.34),rgba(240,112,92,.12));
  border-color:rgba(240,112,92,.5);color:#FFD9D1}
.acts button.yesilb{background:linear-gradient(155deg,rgba(95,215,154,.32),rgba(95,215,154,.10));
  border-color:rgba(95,215,154,.5);color:#DCFFEE}
.acts button.mavib{background:linear-gradient(155deg,rgba(111,176,245,.32),rgba(111,176,245,.10));
  border-color:rgba(111,176,245,.5);color:#DCEEFF}

/* ---- belge satirlari ---- */
.dosya{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--cizgi)}
.dosya:first-child{border-top:none}
.dosya .tip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(155deg,rgba(227,192,90,.28),rgba(227,192,90,.08));
  border:1px solid rgba(227,192,90,.35);color:var(--gold)}
.dosya .tip svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dosya .bilgi{flex:1;min-width:0;text-align:left}
.dosya .bilgi b{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dosya .bilgi small{display:block;font-size:11px;color:var(--ink-3)}
.dosya .ops{display:flex;gap:6px;flex:0 0 auto}
.dosya .ops button{width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.2);
  background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.06));
  color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.dosya .ops button:active{background:rgba(255,255,255,.3)}
.dosya .ops button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dosya .ops button.kirmizi{color:var(--red);border-color:rgba(240,112,92,.35);background:var(--red-soft)}


/* ---- sunum düzenleyici ---- */
#tuval{position:relative;width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--cizgi-2);
  background:#0B100E;touch-action:none;user-select:none;margin-bottom:12px}
#tuval .arka{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;pointer-events:none}
#tuval .olcu{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;
  padding:3px 8px;border-radius:20px;pointer-events:none;font-family:"IBM Plex Mono",monospace}
.oge{position:absolute;transform-origin:center center;touch-action:none;cursor:move}
.oge.sec{outline:2px dashed var(--gold);outline-offset:3px}
.oge img{width:100%;height:100%;display:block;pointer-events:none}
.oge .kutu{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:8px 12px;border-radius:10px;box-sizing:border-box;overflow:hidden}
.tut{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--gold);border:2px solid #fff;
  display:grid;place-items:center;color:#1A1403;font-size:13px;font-weight:700}
.tut.boy{right:-13px;bottom:-13px;cursor:nwse-resize}
.tut.don{left:-13px;bottom:-13px}
.tut.kapat{right:-13px;top:-13px;background:var(--red);color:#fff}
.tut.kalem{left:-13px;top:-13px;background:#fff;color:#111}
.sablonlar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sablon{border:1px solid var(--cizgi-2);border-radius:10px;padding:8px 6px;font-size:11px;text-align:center;
  background:var(--cam-2);color:var(--ink)}
.sablon.aktif{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}

/* ---- harita ---- */
#map,#minimap{height:300px;border-radius:var(--r);border:1px solid var(--cizgi-2);overflow:hidden;background:var(--cam);margin-bottom:14px}
#minimap{height:240px}
.leaflet-container{background:#0B100E}
.leaflet-control-attribution{background:rgba(7,10,9,.8)!important;color:var(--ink-3)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-bar a{background:rgba(20,26,24,.94)!important;color:var(--ink)!important;border-color:var(--cizgi)!important}
.ipt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ipt select,.ipt input{width:auto;flex:1 1 46%;padding:11px 12px;font-size:14px}
.ipt select{background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px}
.ipt .full{flex:1 1 100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts a.dis{flex:1 1 30%;border:1px solid var(--cizgi-2);border-radius:12px;padding:11px 8px;font-size:13px;
  font-weight:600;background:var(--cam-2);color:var(--ink);backdrop-filter:blur(10px);text-align:center;
  text-decoration:none;display:flex;align-items:center;justify-content:center}
.acts a.dis:active{background:rgba(255,255,255,.18)}
.acts a.dis.yesilb{background:linear-gradient(155deg,rgba(95,215,154,.32),rgba(95,215,154,.10));
  border-color:rgba(95,215,154,.5);color:#DCFFEE}

// TKGM alani "7,722.87" gonderir: virgul binlik ayraci, nokta ondalik
function alanCoz(x){
  if(x == null) return null;
  const n = parseFloat(String(x).replace(/\s/g,"").replace(/,/g,""));
  return isFinite(n) ? n : null;
}

// "599.000" -> 599000 ; "1.496,5" -> 1496.5 ; "22000" -> 22000
function sayiCoz(x){
  if(x == null) return NaN;
  let t = String(x).trim().replace(/\s/g,"").replace(/[^\d.,-]/g,"");
  if(!t) return NaN;
  const nokta = t.lastIndexOf("."), virgul = t.lastIndexOf(",");
  if(nokta > -1 && virgul > -1){
    t = virgul > nokta ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,"");
  } else if(virgul > -1){
    t = (t.length - virgul - 1) === 3 && /^\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g,"") : t.replace(",",".");
  } else if(nokta > -1){
    if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,"");
  }
  const n = parseFloat(t);
  return isFinite(n) ? n : NaN;
}

function payOran(s){
  if(!s) return 1;
  const m = s.trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  if(!m || +m[2]===0) return null;
  return +m[1]/+m[2];
}

const TB   = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api";
const TB3  = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api";

let FN = null;                              // calisan fonksiyon adi
const FN_ADAYLARI = ["tkgm","quick-task"];

async function tkgm(u){
  const adaylar = FN ? [FN] : FN_ADAYLARI;
  let sonHata = null;
  for(const ad2 of adaylar){
    const { data, error } = await sb.functions.invoke(ad2, { body:{ u } });
    if(error){ sonHata = error; continue; }          // fonksiyon yok, digerini dene
    FN = ad2;
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  throw new Error(sonHata?.message || "aracıya ulaşılamadı");
}
const dizi = d => {
  if(Array.isArray(d)) return d;
  if(!d || typeof d !== "object") return [];
  if(Array.isArray(d.features)) return d.features;
  for(const k of ["data","liste","items","result","results","rows","value"])
    if(Array.isArray(d[k])) return d[k];
  const ilk = Object.values(d).find(v=>Array.isArray(v));
  return ilk || [];
};
const duz = o => (o && typeof o === "object" && o.properties) ? { ...o.properties, ...o } : o;
const ad = o => {
  if(typeof o === "string") return o;
  o = duz(o); if(!o || typeof o !== "object") return String(o ?? "");
  const g = Object.keys(o).find(k=>/^(text|ad|adi|ad_i|name|isim|label|title|.*Ad|.*Adi)$/i.test(k) && typeof o[k]==="string" && o[k].trim());
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="string" && v.trim() && !/^\d+$/.test(v) && !/id$/i.test(k));
  return h ? h[1] : "";
};
const kim = o => {
  o = duz(o); if(!o || typeof o !== "object") return "";
  const g = Object.keys(o).find(k=>/^(id|value|.*Id|kod|no)$/i.test(k) && (typeof o[k]==="number" || /^\d+$/.test(String(o[k]??""))));
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="number" || /^\d+$/.test(String(v??"")));
  return h ? h[1] : "";
};

const zamanAsimi = (p, ms=9000) => Promise.race([p,
  new Promise((_,r)=>setTimeout(()=>r(new Error("zaman aşımı")), ms))]);

// adaylari sirayla dener, dolu liste donen ilkini kullanir
async function ilkCalisan(adaylar){
  const hatalar = [];
  for(const u of adaylar){
    try{
      const d = dizi(await zamanAsimi(tkgm(u)));
      if(d.length) return { u, d };
      hatalar.push(`${u} → boş döndü`);
    }catch(e){ hatalar.push(`${u} → ${e.message||e}`); }
  }
  const hata = new Error("hiçbir uç cevap vermedi");
  hata.detay = hatalar.join("\n\n");
  throw hata;
}

  const S = k => document.getElementById(pre + k);
  const doldur = (el, list, bos) => {
    const temiz = list.map(o=>({ a:String(ad(o)||"").trim(), k:String(kim(o)||"") }))
                      .filter(o=>o.a && o.k)
                      .sort((x,y)=>x.a.localeCompare(y.a,"tr"));
    if(!temiz.length) throw new Error("liste okunamadı");
    el.innerHTML = `<option value="">${bos}</option>` +
      temiz.map(o=>`<option value="${esc(o.k)}">${esc(o.a)}</option>`).join("");
    el.disabled = false;
  };
  const coz = () => {
    ["il","ilce","mah"].forEach(k=>{
      const el = S(k);
      el.outerHTML = `<input id="${pre}${k}" class="${el.className}" placeholder="${
        k==="il"?"İl":k==="ilce"?"İlçe":"Mahalle / köy"}">`;
    });
  };
  try{
    const { d:iller } = await ilkCalisan(IL_UCLARI);
    doldur(S("il"), iller, "İl seç");
    S("ilce").disabled = true; S("mah").disabled = true;

    S("il").onchange = async () => {
      S("ilce").innerHTML = `<option value="">yükleniyor…</option>`;
      S("mah").innerHTML = `<option value="">önce ilçe seç</option>`; S("mah").disabled = true;
      if(!S("il").value) return;
      try{
        const { d } = await ilkCalisan(ILCE_UCLARI(S("il").value));
        doldur(S("ilce"), d, "İlçe seç");
      }catch(e){
        S("ilce").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("İlçe listesi gelmedi", e.detay || e.message);
      }
    };
    S("ilce").onchange = async () => {
      S("mah").innerHTML = `<option value="">yükleniyor…</option>`;
      if(!S("ilce").value) return;
      try{
        const { d } = await ilkCalisan(MAH_UCLARI(S("ilce").value));
        doldur(S("mah"), d, "Mahalle / köy seç");
      }catch(e){
        S("mah").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("Köy listesi gelmedi", e.detay || e.message);
      }
    };
    if(sonrasi) S("mah").onchange = sonrasi;
  }catch(e){
    coz();
    taniYaz("İl listesi gelmedi, elle yazabilirsin", e.detay || e.message);
  }
}

function ciz(f){

  HARITA.fitBounds(KATMAN.getBounds(), { padding:[30,30], maxZoom:18 });

  document.getElementById("bilgi").innerHTML = `

      <div class="kv"><span>Niteliği</span><b>${esc(p.nitelik||"—")}</b></div>

        ${ME.role==='admin'?`<button class="pri" onclick="haritadanKaydet()">Kaydet</button>`:""}

function merkez(f){
  const c = []; JSON.stringify(f.geometry.coordinates).replace(/\[(-?\d+\.?\d*),(-?\d+\.?\d*)\]/g,(m,a,b)=>{c.push([+a,+b]);return m;});
  const lng = c.reduce((s,p)=>s+p[0],0)/c.length, lat = c.reduce((s,p)=>s+p[1],0)/c.length;
  return { lat, lng };
}

function kmlMetni(f){
  const p = f.properties||{};
  const halka = g => (g.type==="Polygon"?[g.coordinates]:g.coordinates)
    .map(poly => poly[0].map(c=>`${c[0]},${c[1]},0`).join(" ")).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${p.ozet||"parsel"}</name>
<Style id="s"><LineStyle><color>ff27a2c9</color><width>3</width></LineStyle>
<PolyStyle><color>4027a2c9</color></PolyStyle></Style>
<Placemark><name>${p.mahalleAd||""} ${p.adaNo||""}/${p.parselNo||""}</name>
<description>${p.alan||""} m² · ${p.nitelik||""}</description><styleUrl>#s</styleUrl>
<Polygon><outerBoundaryIs><LinearRing><coordinates>${halka(f.geometry)}</coordinates>
</LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
}

function kmlIndir(){
  if(!SONPARSEL) return;
  const p = SONPARSEL.properties||{};
  const b = new Blob([kmlMetni(SONPARSEL)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${(p.mahalleAd||"parsel")}-${p.adaNo||0}-${p.parselNo||0}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

// alanlari birbirine bagla; hesaplayan islevi dondur
function hisseBagla(p, alan){
  const g = k => document.getElementById(p+k);
  const hesap = () => {
    if(!g("bic")) return null;
    const bic = g("bic").value;
    g("oranK").style.display = bic === "oran" ? "block" : "none";
    g("m2K").style.display   = bic === "m2"   ? "block" : "none";
    if(bic === "oran"){
      const o = payOran(g("oran").value);
      if(o === null){ g("bilgi").innerHTML = `<span style="color:var(--red)">1/4 gibi yaz</span>`; return null; }
      const m2 = Math.round(alan * o);
      g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(m2)} m²`;
      return { pay: g("oran").value.trim(), m2 };
    }
    const m2 = sayiCoz(g("m2").value);
    if(!isFinite(m2) || m2 <= 0){ g("bilgi").innerHTML = `<span style="color:var(--red)">Metrekare yaz</span>`; return null; }
    const yuzde = alan ? (m2/alan*100) : 0;
    g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(Math.round(m2))} m²${alan?` (%${yuzde.toFixed(1)})`:""}`;
    return { pay: null, m2: Math.round(m2) };
  };
  ["bic","oran","m2"].forEach(k => { const el = g(k); if(el){ el.oninput = hesap; el.onchange = hesap; } });
  hesap();
  return hesap;
}

// dosyayi telefonun paylas menusune ver: whatsapp, mail, ne varsa
async function dosyaPaylas(yol, ad2){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 86400);
  if(error) return toast("Paylaşılamadı: " + error.message);
  try{
    if(navigator.canShare){
      const r = await fetch(data.signedUrl);
      const blob = await r.blob();
      const dosya = new File([blob], ad2, { type: blob.type || "application/octet-stream" });
      if(navigator.canShare({ files:[dosya] })){
        await navigator.share({ files:[dosya], title: ad2 });
        return;
      }
    }
    if(navigator.share){ await navigator.share({ title: ad2, url: data.signedUrl }); return; }
    await navigator.clipboard.writeText(data.signedUrl);
    toast("Bağlantı kopyalandı, yapıştırıp gönderebilirsin");
  }catch(e){
    if(String(e).includes("AbortError")) return;
    try{ await navigator.clipboard.writeText(data.signedUrl); toast("Bağlantı kopyalandı"); }
    catch(_){ toast("Paylaşılamadı"); }
  }
}

  if(error) return toast("İndirilemedi: " + error.message);

const boyut = b => !b ? "" : b > 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.round(b/1024)+" KB";

let acikGrup = null;
// TR harflerini sadelestirip karsilastir: "MUHACİRKADI" ile "Muhacırkadı" ayni sayilsin
const sade = x => String(x||"")
  .replace(/[İIıi]/g,"i").replace(/[Şş]/g,"s").replace(/[Ğğ]/g,"g")
  .replace(/[Üü]/g,"u").replace(/[Öö]/g,"o").replace(/[Çç]/g,"c")
  .toLowerCase().replace(/[^a-z0-9]/g,"");
const anahtar = p => [sade(p.il), sade(p.ilce), sade(p.mahalle)].join("|");
const duzgun = x => String(x||"").trim().toLocaleLowerCase("tr")
  .replace(/(^|[\s\-\/])([a-zçğıöşü])/g, (m,a,b)=>a+b.toLocaleUpperCase("tr"));

// ayni koydeki parselleri tek baslik altinda topla
function grupla(rows){
  const g = {};
  rows.forEach(r=>{
    const p = r.parcels, k = anahtar(p);
    (g[k] ||= { il:duzgun(p.il), ilce:duzgun(p.ilce), mah:duzgun(p.mahalle), list:[] }).list.push(r);
  });
  return Object.entries(g).sort((a,b)=>a[1].mah.localeCompare(b[1].mah,"tr"));
}

function grupBasi(k, gr, acik, sayiEk){
  return `<button class="ghd${acik?" open":""}" onclick="acikGrup=${acik?"null":`'${k.replace(/'/g,"\\'")}'`};${sayiEk}()">
    <span class="chev">›</span>
    <span class="pinico">${svg("pin")}</span>
    <span class="txt"><b>${esc(gr.mah)}</b><small>${esc(gr.il)} · ${esc(gr.ilce)}</small></span>
    <span class="say">${gr.list.length} parsel</span></button>`;
}

    ${ME.role==='admin'?`<button class="fab" onclick="go('yeni')">+</button>`:""}`;
  document.getElementById("yil").onchange = e => { YEAR = +e.target.value; araziListele(); };
  document.getElementById("ara").oninput = () => araziListele();
  araziListele();
}
const yilSecenek = () => {
  let o = "";
  for(let i=2060;i>=2020;i--) o += `<option value="${i}"${i===YEAR?" selected":""}>${i}</option>`;
  return o;
};

async function araziListele(){
  const box = document.getElementById("liste");
  const q = (document.getElementById("ara")?.value||"").toLowerCase().trim();
  const { data, error } = await sb.from("parcel_years")
    .select("id,aktif,parcels(id,il,ilce,mahalle,ada,parsel,alan_m2,nitelik)")
    .eq("yil", YEAR);
  if(error) return box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  let rows = (data||[]).filter(r=>r.parcels);
  if(q) rows = rows.filter(r=>{
    const p = r.parcels;
    return `${p.il} ${p.ilce} ${p.mahalle} ${p.ada||""}/${p.parsel}`.toLowerCase().includes(q);
  });
  if(!rows.length) return box.innerHTML = `<div class="empty"><b>${YEAR} boş</b>
    ${ME.role==='admin'?"Haritadan ya da sağ alttaki + ile parsel ekle.":"Bu yıl için henüz kayıt yok."}</div>`;

  box.innerHTML = grupla(rows).map(([k,gr])=>{
    const acik = acikGrup === k;
    return `<div class="grp">${grupBasi(k, gr, acik, "araziListele")}
      ${acik ? gr.list.map(parselSatir).join("") : ""}</div>`;
  }).join("");
}

function parselSatir(r){
  const p = r.parcels;
  return `<div class="rw">
    <span class="kod">${esc(p.ada||"—")}/${esc(p.parsel)}</span>
    <button class="orta" onclick="go('parsel','${p.id}')">
      <b>${esc(p.nitelik||"Parsel")}</b>
      <small>${nf(p.alan_m2)} m²${r.aktif?"":" · pasif"}</small></button>
    <span class="sag">
      <span class="dot ${r.aktif?"on":"off"}"></span>
      ${ME.role==='admin'?`<button class="sil" aria-label="Sil" onclick="parselSil('${r.id}','${p.id}','${esc(p.mahalle)} ${esc(p.ada||"")}/${esc(p.parsel)}')">${svg("trash")}</button>`:""}
    </span></div>`;
}

async function parselSil(yilKaydiId, parselId, etiket){
  if(!confirm(`${etiket}\n\n${YEAR} kaydından silinsin mi? Diğer yıllardaki kaydı ve belgeleri durur.`)) return;
  const { error } = await sb.from("parcel_years").delete().eq("id", yilKaydiId);
  if(error) return toast("Olmadı: "+error.message);
  const { data: kalan } = await sb.from("parcel_years").select("id").eq("parcel_id", parselId);
  if(!kalan || !kalan.length){
    if(confirm("Bu parselin başka yıl kaydı kalmadı. Parseli notları ve belgeleriyle birlikte tamamen silelim mi?"))
      await sb.from("parcels").delete().eq("id", parselId);
  }
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"parsel silindi", entity:"parcels", entity_id:parselId, detail:`${etiket} (${YEAR})` });
  toast("Silindi");
  araziListele();
}

async function belgeEkle(parselId, tur, donus, donusArg){
  const f = await dosyaSec(tur === "video" ? "video/*" : "image/*,application/pdf");
  if(!f) return;
  toast("Yükleniyor…");
  try{
    await dosyaYukle(f, tur, parselId);
    toast("Yüklendi");
    (ekranlar[donus||"parsel"] || parselDetay)(donusArg || parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

async function belgeSilVeYenile(belgeId, yol, donus, donusArg){
  if(await belgeSil(belgeId, yol)) (ekranlar[donus||"parsel"] || parselDetay)(donusArg);
}

const CLC_AD = {
  "111":"Kesintisiz kent dokusu","112":"Kesintili kent dokusu","121":"Sanayi veya ticaret alanı",
  "122":"Yol ve demiryolu ağı","123":"Liman","124":"Havaalanı","131":"Maden ocağı","132":"Döküm sahası",
  "133":"İnşaat alanı","141":"Kentsel yeşil alan","142":"Spor ve eğlence alanı",
  "211":"Sulanmayan tarım arazisi","212":"Sürekli sulanan tarım arazisi","213":"Çeltik tarlası",
  "221":"Bağ","222":"Meyve bahçesi","223":"Zeytinlik","231":"Otlak / mera",
  "241":"Yıllık ve çok yıllık karışık tarım","242":"Karmaşık ekim düzeni",
  "243":"Doğal bitki örtüsüyle karışık tarım arazisi","244":"Ağaçlı tarım arazisi",
  "311":"Yapraklı orman","312":"İğne yapraklı orman","313":"Karışık orman",
  "321":"Doğal çayır","322":"Fundalık","323":"Maki","324":"Geçiş halinde orman-çalılık",
  "331":"Kumsal / kumul","332":"Çıplak kaya","333":"Seyrek bitki örtülü alan","334":"Yanmış alan",
  "411":"İç sulak alan","412":"Turbalık","421":"Tuzlu bataklık","422":"Tuzla",
  "511":"Akarsu","512":"Su kütlesi","521":"Kıyı lagünü","523":"Deniz"
};

async function corineSinif(lat, lng){
  const d = 0.0009;
  const u = "https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer/identify"
    + `?f=json&geometryType=esriGeometryPoint&sr=4326&layers=all&tolerance=3&returnGeometry=false`
    + `&imageDisplay=400,400,96&mapExtent=${lng-d},${lat-d},${lng+d},${lat+d}`
    + `&geometry=${encodeURIComponent(JSON.stringify({ x:lng, y:lat, spatialReference:{ wkid:4326 } }))}`;
  const r = await zamanAsimi(tkgm(u), 15000);
  const sonuc = r?.results?.[0];
  if(!sonuc) return null;
  const oz = sonuc.attributes || {};
  const metin = Object.values(oz).map(v=>String(v)).join(" ");
  const kod = (metin.match(/\b([1-5]\d\d)\b/) || [])[1];
  return { kod, ad: (kod && CLC_AD[kod]) || sonuc.value || sonuc.layerName || null };
}

const OVER = "https://overpass-api.de/api/interpreter?data=";
let CEVRE_SON = null;   // son cikarilan cevre ozeti

function uzaklik(a, b){                       // metre
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b.lng-a.lng) * Math.cos(rad((a.lat+b.lat)/2));
  const df = rad(b.lat-a.lat);
  return Math.round(Math.sqrt(dl*dl + df*df) * R);
}
const km = m => m >= 1000 ? (m/1000).toFixed(1).replace(".",",") + " km" : m + " m";

const YOL_AD = { motorway:"Otoyol", trunk:"Devlet yolu", primary:"Ana yol", secondary:"Tali yol",
  tertiary:"Bağlantı yolu", unclassified:"Köy yolu", residential:"Yerleşim yolu", track:"Tarla yolu",
  service:"Servis yolu" };
const YER_AD = { city:"Şehir", town:"İlçe/kasaba", village:"Köy", hamlet:"Mezra", suburb:"Mahalle" };

const OVER_SUNUCU = [
  "https://overpass.kumi.systems/api/interpreter?data=",
  "https://overpass-api.de/api/interpreter?data=",
  "https://overpass.osm.ch/api/interpreter?data=",
  "https://overpass.private.coffee/api/interpreter?data="
];

// 0 = tam, 1 = orta, 2 = cok hafif
function cevreSorgusu(lat, lng, kademe){
  if(kademe === 2) return `[out:json][timeout:15];(
    node(around:9000,${lat},${lng})[place~"^(town|village)$"];
    way(around:900,${lat},${lng})[highway];
  );out center tags;`;
  if(kademe === 1) return `[out:json][timeout:20];(
    node(around:10000,${lat},${lng})[place~"^(city|town|village)$"];
    way(around:1200,${lat},${lng})[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|track)$"];
    way(around:1500,${lat},${lng})[waterway~"^(river|stream|canal)$"];
    way(around:1200,${lat},${lng})[landuse];
  );out center tags;`;
  return `[out:json][timeout:25];(
    node(around:12000,${lat},${lng})[place~"^(city|town|village|hamlet)$"];
    way(around:2000,${lat},${lng})[highway];
    way(around:2500,${lat},${lng})[waterway~"^(river|stream|canal|ditch)$"];
    way(around:2500,${lat},${lng})[natural=water];
    way(around:1800,${lat},${lng})[landuse];
    node(around:8000,${lat},${lng})[amenity~"^(school|hospital|pharmacy|fuel)$"];
    way(around:4000,${lat},${lng})[power=line];
    node(around:8000,${lat},${lng})[man_made=water_well];
  );out center tags;`;
}

// sunucular ve sorgu kademeleri arasinda sirayla dener
async function cevreVerisi(lat, lng, bildir){
  const denemeler = [];
  [0,1,2].forEach(kademe=>{
    OVER_SUNUCU.forEach(s2=>denemeler.push({ s:s2, kademe }));
  });
  let sonHata = null;
  for(let i=0;i<denemeler.length;i++){
    const d = denemeler[i];
    if(bildir) bildir(i === 0 ? "Çevre taranıyor…"
      : `Sunucular meşgul, tekrar deneniyor (${i+1}/${denemeler.length})…`);
    try{
      const r = await zamanAsimi(tkgm(d.s + encodeURIComponent(cevreSorgusu(lat, lng, d.kademe))), 35000);
      if(r?.elements?.length) return r;
      sonHata = new Error("boş cevap");
    }catch(e){ sonHata = e; }
    await new Promise(r=>setTimeout(r, 800));
  }
  throw sonHata || new Error("çevre verisi alınamadı");
}

function cevreOzet(veri, merkezNokta){
  const ogeler = (veri?.elements || []).map(e=>{
    const nk = e.center ? { lat:e.center.lat, lng:e.center.lon } : { lat:e.lat, lng:e.lon };
    if(!isFinite(nk.lat)) return null;
    return { t:e.tags || {}, u:uzaklik(merkezNokta, nk) };
  }).filter(Boolean).sort((a,b)=>a.u-b.u);

  const ilk = f => ogeler.find(f);
  const hepsi = f => ogeler.filter(f);

  const yerler = hepsi(o=>o.t.place && o.t.name).slice(0,5);
  const yollar = {};
  hepsi(o=>o.t.highway && YOL_AD[o.t.highway]).forEach(o=>{
    if(!yollar[o.t.highway]) yollar[o.t.highway] = o;
  });
  const su = ilk(o=>o.t.waterway || o.t.natural === "water");
  const okul = ilk(o=>o.t.amenity === "school");
  const saglik = ilk(o=>o.t.amenity === "hospital" || o.t.amenity === "pharmacy");
  const akaryakit = ilk(o=>o.t.amenity === "fuel");
  const elektrik = ilk(o=>o.t.power === "line");
  const kuyu = ilk(o=>o.t.man_made === "water_well");

  const kullanim = {};
  hepsi(o=>o.t.landuse).forEach(o=>{ kullanim[o.t.landuse] = (kullanim[o.t.landuse]||0)+1; });

  return { yerler, yollar, su, okul, saglik, akaryakit, elektrik, kuyu, kullanim };
}

// beyaz zemine kurumsal rapor cizer; satir ortadan bolunmez
const RAP = {
  kirmizi:"#B3232E", koyu:"#7E141C", acik:"#FBE9EA", metin:"#16181A",
  gri:"#5A6169", cizgi:"#E6E8EA", zebra:"#FAFAFB"
};

function raporPng(baslik, altBaslik, bolumler){
  const G = 1000;
  const SAYFA = Math.round(G * 277 / 190);
  const UST = 108, ALT = 118, satirY = 38;

  const yerlestir = (ciz) => {
    let sayfa = 0, y = 0;
    const dip = () => (sayfa+1)*SAYFA - ALT;
    const yeniSayfa = () => { sayfa++; y = sayfa*SAYFA + UST; };
    const yer = h => { if(y + h + 24 > dip()) yeniSayfa(); };

    y = 118;
    ciz && ciz.baslik(y);
    y = 300;

    bolumler.forEach(b2=>{
      if(b2.gorsel){
        const gy = (G-140) * b2.oran;
        yer(58 + gy);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        ciz && ciz.gorsel(b2.gorsel, y, gy);
        y += gy + 16;
      }else if(b2.metin){
        yer(58 + 44*2);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        yaziSar(b2.metin, G-150, 25).forEach(t=>{
          yer(40);
          ciz && ciz.paragraf(t, y);
          y += t === "" ? 18 : 40;
        });
      }else{
        yer(58 + satirY*2);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        (b2.satirlar||[]).forEach(([k,v],i)=>{
          yer(satirY);
          ciz && ciz.satir(k, v, y, i);
          y += satirY;
        });
      }
      y += 40;
    });
    return (sayfa+1) * SAYFA;
  };

  const Y = yerlestir(null);
  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);

  const sayfaSayisi = Math.round(Y/SAYFA);
  for(let i=0;i<sayfaSayisi;i++){
    const t = i*SAYFA;
    if(i === 0){
      const gr = x.createLinearGradient(0,0,G,240);
      gr.addColorStop(0, RAP.koyu); gr.addColorStop(1, RAP.kirmizi);
      x.fillStyle = gr; x.fillRect(0,0,G,240);
      x.fillStyle = "rgba(255,255,255,.16)";
      x.beginPath(); x.moveTo(G-330,0); x.lineTo(G,0); x.lineTo(G,240); x.closePath(); x.fill();
    }else{
      x.fillStyle = RAP.kirmizi; x.fillRect(0,t,G,12);
      x.fillStyle = RAP.gri; x.font = "400 19px Arial"; x.textAlign = "left";
      x.fillText(baslik, 60, t + 58);
    }
    // alt bant
    x.fillStyle = RAP.cizgi; x.fillRect(60, t + SAYFA - 74, G-120, 1);
    x.fillStyle = RAP.gri; x.font = "400 18px Arial";
    x.textAlign = "left";  x.fillText("Çapsız Çapçı · çapımız alayınıza yeter", 60, t + SAYFA - 44);
    x.textAlign = "right"; x.fillText(`${i+1} / ${sayfaSayisi}`, G-60, t + SAYFA - 44);
    x.textAlign = "left";
  }

  yerlestir({
    baslik: y => {
      x.textAlign = "left";
      x.fillStyle = "#FFFFFF"; x.font = "700 46px Arial";
      x.fillText(baslik, 60, y + 22);
      x.fillStyle = "rgba(255,255,255,.86)"; x.font = "400 23px Arial";
      altBaslik.split("\n").forEach((t,i)=> x.fillText(t, 60, y + 66 + i*32));
      x.fillStyle = RAP.gri; x.font = "400 19px Arial";
      x.fillText(new Date().toLocaleString("tr-TR"), 60, 282);
    },
    bolum: (ad2, y) => {
      x.fillStyle = RAP.acik;
      x.beginPath(); x.roundRect(60, y-34, G-120, 50, 8); x.fill();
      x.fillStyle = RAP.kirmizi;
      x.beginPath(); x.roundRect(60, y-34, 7, 50, 4); x.fill();
      x.fillStyle = RAP.koyu; x.font = "700 25px Arial"; x.textAlign = "left";
      x.fillText(ad2.toLocaleUpperCase("tr"), 82, y);
    },
    satir: (k, v, y, i) => {
      if(i % 2 === 0){ x.fillStyle = RAP.zebra; x.fillRect(60, y-26, G-120, satirY); }
      x.font = "400 23px Arial"; x.fillStyle = RAP.gri; x.textAlign = "left";
      x.fillText(String(k).slice(0,58), 78, y);
      x.font = "700 23px Arial"; x.fillStyle = RAP.metin; x.textAlign = "right";
      x.fillText(String(v), G-78, y);
      x.textAlign = "left";
    },
    gorsel: (im, y, gy) => {
      x.save();
      x.shadowColor = "rgba(0,0,0,.22)"; x.shadowBlur = 18; x.shadowOffsetY = 6;
      x.fillStyle = "#FFF";
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.fill();
      x.restore();
      x.save();
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.clip();
      try{ x.drawImage(im, 70, y, G-140, gy); }catch(e){}
      x.restore();
      x.strokeStyle = RAP.cizgi; x.lineWidth = 2;
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.stroke();
    },
    paragraf: (t, y) => {
      x.font = "400 25px Arial"; x.fillStyle = RAP.metin; x.textAlign = "left";
      x.fillText(t, 78, y);
    }
  });

  return { png: { dataUrl: c.toDataURL("image/png"), canvas: c, sayfaPx: SAYFA }, oran: Y/G };
}

// uzun metni satirlara bol
function yaziSar(metin, genislik, punto){
  OLCER.font = `400 ${punto}px Arial`;
  const cikti = [];
  String(metin).split("\n").forEach(parca=>{
    if(!parca.trim()){ cikti.push(""); return; }
    let satir = "";
    parca.split(" ").forEach(kelime=>{
      const deneme = satir ? satir + " " + kelime : kelime;
      if(OLCER.measureText(deneme).width > genislik){ cikti.push(satir); satir = kelime; }
      else satir = deneme;
    });
    if(satir) cikti.push(satir);
  });
  return cikti;
}

function pngToPdfBlob(kaynak, oran){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const gen = 190, c = kaynak.canvas, sayfaPx = kaynak.sayfaPx || c.height;

  for(let y = 0, i = 0; y < c.height; y += sayfaPx, i++){
    const h = Math.min(sayfaPx, c.height - y);
    const t = document.createElement("canvas");
    t.width = c.width; t.height = h;
    const tx = t.getContext("2d");
    tx.fillStyle = "#FFFFFF"; tx.fillRect(0,0,t.width,t.height);
    tx.drawImage(c, 0, y, c.width, h, 0, 0, c.width, h);
    if(i) pdf.addPage();
    pdf.addImage(t.toDataURL("image/png"), "PNG", 10, 10, gen, gen * (h/c.width));
  }
  return pdf.output("blob");
}

function dosyaAdi(p, ek){
  const t = `${p?.adaNo ?? p?.ada ?? 0}-${p?.parselNo ?? p?.parsel ?? 0}`;
  return `${t}-${ek}.pdf`.replace(/\s+/g,"");
}

// cevre verisini cikarir; indir=true ise PDF de uretir
async function cevreUret(indir){
  const p = SONPARSEL.properties || {};
  const m = merkez(SONPARSEL);
  const veri = await cevreVerisi(m.lat, m.lng, t => {
    const d = document.getElementById("rapdurum") || document.getElementById("cevreNot");
    if(d) d.textContent = t;
  });
  const o = cevreOzet(veri, m);
  let clc = null;
  try{ clc = await corineSinif(m.lat, m.lng); }catch(e){}
  CEVRE_SON = { o, p, m, clc, tarih:new Date() };
  if(!indir) return CEVRE_SON;

  const yerSatir = o.yerler.map(y=>[`${YER_AD[y.t.place]||y.t.place}: ${y.t.name}`, km(y.u)]);
  const yolSatir = Object.entries(o.yollar).map(([k,v])=>
    [YOL_AD[k] + (v.t.name ? ` (${v.t.name})` : ""), km(v.u)]);
  const kullanimSatir = Object.entries(o.kullanim).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([k,v])=>[LANDUSE_AD[k]||k, `${v} alan`]);

  const bolumler = [
    { baslik:"Parsel bilgileri", satirlar:[
      ["İl / ilçe / mahalle", `${p.ilAd||""} / ${p.ilceAd||""} / ${p.mahalleAd||""}`],
      ["Ada / parsel", `${p.adaNo||"—"} / ${p.parselNo||"—"}`],
      ["Yüzölçümü", nf(alanCoz(p.alan)) + " m²"],
      ["Niteliği", p.nitelik || "—"],
      ["Mevkii", p.mevkii || "—"],
      ["Koordinat", `${m.lat.toFixed(6)}, ${m.lng.toFixed(6)}`]
    ]},
    { baslik:"Yerleşim yerlerine uzaklık", satirlar: yerSatir.length ? yerSatir : [["Yakında kayıtlı yerleşim yok",""]] },
    { baslik:"Yol durumu", satirlar: yolSatir.length ? yolSatir : [["Yakında kayıtlı yol yok",""]] },
    { baslik:"Altyapı ve su", satirlar:[
      ["En yakın su kaynağı", o.su ? `${o.su.t.name || (o.su.t.waterway ? "akarsu" : "su yüzeyi")} · ${km(o.su.u)}` : "kayıt yok"],
      ["Su kuyusu", o.kuyu ? km(o.kuyu.u) : "kayıt yok"],
      ["Elektrik hattı", o.elektrik ? km(o.elektrik.u) : "kayıt yok"],
      ["Akaryakıt istasyonu", o.akaryakit ? km(o.akaryakit.u) : "kayıt yok"]
    ]},
    { baslik:"Sosyal donatı", satirlar:[
      ["En yakın okul", o.okul ? `${o.okul.t.name||"okul"} · ${km(o.okul.u)}` : "kayıt yok"],
      ["Sağlık tesisi", o.saglik ? `${o.saglik.t.name||"sağlık"} · ${km(o.saglik.u)}` : "kayıt yok"]
    ]},
    { baslik:"Çevredeki arazi kullanımı", satirlar: kullanimSatir.length ? kullanimSatir : [["Kayıt yok",""]] },
    { baslik:"Resmî arazi örtüsü (CORINE)", satirlar: clc
        ? [["Parselin bulunduğu sınıf", clc.ad || "—"], ["CORINE kodu", clc.kod || "—"],
           ["Kaynak", "Copernicus CLC 2018"]]
        : [["Sınıf bilgisi alınamadı", "—"]] },
    { baslik:"İmar durumu", satirlar:[
      ["e-Plan sorgusu", "Uygulamadaki İmar planı tuşundan"],
      ["Not", "Yürürlükteki ve askıdaki planlar e-Plan'da görüntülenir"]
    ]}
  ];

  const { png, oran } = raporPng(
    `Çevre raporu · ${p.adaNo||"—"}/${p.parselNo||"—"}`,
    `${p.mahalleAd||""} — ${p.ilceAd||""} / ${p.ilAd||""}\n2 km yarıçapındaki yollar, 12 km yarıçapındaki yerleşimler taranmıştır.`,
    bolumler);

  const blob = pngToPdfBlob(png, oran);
  const ad2 = dosyaAdi(p, "cevre-raporu");
  indirBlob(blob, ad2);
  await parseleIliskilendir(p, blob, ad2, "arastirma");
  return CEVRE_SON;
}

function indirBlob(blob, ad2){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = ad2; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

// parsel zaten kayitliysa raporu belgelerine de ekle
async function parseleIliskilendir(p, blob, ad2, tur){
  if(ME.role === 'uye') return;
  const { data } = await sb.from("parcels").select("id")
    .eq("parsel", String(p.parselNo ?? p.parsel ?? "")).eq("mahalle", p.mahalleAd ?? p.mahalle ?? "").limit(1);
  const id = data?.[0]?.id;
  if(!id) return;
  try{ await dosyaYukle(new File([blob], ad2, { type:"application/pdf" }), tur, id);
       toast("Rapor parselin belgelerine de eklendi"); }catch(e){}
}

async function emsalHesapla(p){
  const veriler = [];
  document.querySelectorAll(".emsatirim").forEach(el=>{
    const i = el.dataset.i;
    const m2 = sayiCoz(document.getElementById("em"+i)?.value);
    const f  = sayiCoz(document.getElementById("ef"+i)?.value);
    const ad2 = document.getElementById("ea"+i)?.value.trim() || "emsal";
    if(m2 > 0 && f > 0) veriler.push({ ad:ad2, m2, fiyat:f, birim: f/m2 });
  });

  const toplamAlan = sayiCoz(document.getElementById("bizM2").value) || 0;
  const pay = sayiCoz(document.getElementById("bizPay").value) || toplamAlan;
  const gozlem = document.getElementById("gozlem").value.trim();
  const cevreKat = document.getElementById("cevreKat")?.checked && CEVRE_SON;

  // cevre verisinden yuzde etkisi cikar
  const etkiler = [];
  if(cevreKat){
    const o = CEVRE_SON.o;
    const anaYol = o.yollar.primary || o.yollar.secondary || o.yollar.trunk || o.yollar.motorway;
    const koyYol = o.yollar.unclassified || o.yollar.track || o.yollar.residential;
    if(anaYol && anaYol.u <= 300) etkiler.push(["Ana yola 300 m'den yakın", 14]);
    else if(anaYol && anaYol.u <= 1000) etkiler.push(["Ana yola 1 km içinde", 7]);
    if(koyYol && koyYol.u <= 60) etkiler.push(["Yola cepheli (yol " + km(koyYol.u) + ")", 10]);
    else if(!koyYol || koyYol.u > 400) etkiler.push(["Yola uzak, geçit sorunu olabilir", -12]);
    const yer = o.yerler[0];
    if(yer && yer.u <= 1500) etkiler.push([`${yer.t.name} yerleşimine ${km(yer.u)}`, 9]);
    else if(yer && yer.u > 6000) etkiler.push(["Yerleşime uzak", -8]);
    if(o.su && o.su.u <= 500) etkiler.push(["Su kaynağına yakın (" + km(o.su.u) + ")", 8]);
    if(o.elektrik && o.elektrik.u <= 800) etkiler.push(["Elektrik hattı yakın", 5]);
    if((o.kullanim.residential||0) > 0) etkiler.push(["Çevrede yerleşim alanı var", 10]);
    if((o.kullanim.industrial||0) > 0) etkiler.push(["Çevrede sanayi alanı var", 8]);
    if((o.kullanim.forest||0) > 2) etkiler.push(["Çevre ağırlıklı orman", -5]);
    const c = CEVRE_SON.clc;
    if(c?.kod){
      const k = c.kod;
      if(k === "121") etkiler.push([`CORINE: ${c.ad}`, 16]);
      else if(k.startsWith("11")) etkiler.push([`CORINE: ${c.ad}`, 14]);
      else if(k === "133" || k === "142") etkiler.push([`CORINE: ${c.ad}`, 10]);
      else if(k === "212" || k === "213") etkiler.push([`CORINE: ${c.ad}`, 8]);
      else if(k === "222" || k === "221" || k === "223") etkiler.push([`CORINE: ${c.ad}`, 6]);
      else if(k.startsWith("31") || k.startsWith("32")) etkiler.push([`CORINE: ${c.ad}`, -6]);
      else if(k.startsWith("41") || k.startsWith("51")) etkiler.push([`CORINE: ${c.ad}`, -14]);
      else if(k === "331" || k === "332" || k === "333") etkiler.push([`CORINE: ${c.ad}`, -10]);
    }
  }
  let carpan = etkiler.reduce((t,[,y])=>t+y, 0);
  carpan = Math.max(-45, Math.min(60, carpan));

  const bolumler = [];
  bolumler.push({ baslik:"Değerlenen parsel", satirlar:[
    ["Konum", p ? `${p.mahalleAd||""} / ${p.ilceAd||""} / ${p.ilAd||""}` : "—"],
    ["Ada / parsel", p ? `${p.adaNo||"—"} / ${p.parselNo||"—"}` : "—"],
    ["Toplam alan", toplamAlan ? nf(Math.round(toplamAlan)) + " m²" : "—"],
    ["Değerlenen pay", pay ? nf(Math.round(pay)) + " m²" : "—"]
  ]});

  let tahmin = null, ortanca = null, en_az = null, en_cok = null;
  if(veriler.length){
    const b = veriler.map(v=>v.birim).sort((a,c)=>a-c);
    en_az = b[0]; en_cok = b[b.length-1];
    ortanca = b.length % 2 ? b[(b.length-1)/2] : (b[b.length/2-1] + b[b.length/2])/2;
    tahmin = ortanca * (1 + carpan/100);

    bolumler.push({ baslik:"Alınan emsaller", satirlar: veriler.map(v=>
      [`${v.ad} · ${nf(Math.round(v.m2))} m²`, `${nf(Math.round(v.birim))} ₺/m² (${nf(Math.round(v.fiyat))} ₺)`]) });
    bolumler.push({ baslik:"Emsal istatistiği", satirlar:[
      ["Emsal sayısı", veriler.length],
      ["En düşük", nf(Math.round(en_az)) + " ₺/m²"],
      ["En yüksek", nf(Math.round(en_cok)) + " ₺/m²"],
      ["Ortanca (esas alınan)", nf(Math.round(ortanca)) + " ₺/m²"]
    ]});
  }

  bolumler.push({ baslik: cevreKat ? "Çevre verisinden çıkan etkiler" : "Özellik etkisi",
    satirlar: etkiler.length
      ? etkiler.map(([a,y])=>[a, (y>0?"+":"")+y+"%"]).concat([["Toplam etki", (carpan>0?"+":"")+carpan+"%"]])
      : [["Değerlendirmeye katılan veri yok", "0%"]] });

  if(gozlem) bolumler.push({ baslik:"Gözlemler", satirlar: gozlem.split(/\n/).filter(Boolean).map(t=>[t, ""]) });

  if(tahmin != null){
    bolumler.push({ baslik:"Sonuç", satirlar:[
      ["Tahmini m² değeri", nf(Math.round(tahmin)) + " ₺"],
      ["Makul aralık", `${nf(Math.round(Math.min(tahmin, en_az*(1+carpan/100))))} – ${nf(Math.round(Math.max(tahmin, en_cok*(1+carpan/100))))} ₺/m²`],
      ["Payınızın tahmini değeri", pay ? nf(Math.round(tahmin*pay)) + " ₺" : "—"],
      ["Parselin tamamı", toplamAlan ? nf(Math.round(tahmin*toplamAlan)) + " ₺" : "—"]
    ]});
    bolumler.push({ baslik:"Yöntem", satirlar:[
      ["Esas", "Girilen emsallerin ortanca m² fiyatı"],
      ["Düzeltme", "Çevre verisi ve özelliklerin yüzde etkisi"],
      ["Sınır", "Toplam düzeltme -45% ile +60% arasında"],
      ["Not", "Emsaller kullanıcının kendi gözlemidir"]
    ]});
  }else{
    bolumler.push({ baslik:"Sonuç", satirlar:[
      ["Rakamsal tahmin", "Emsal girilmediği için verilmedi"],
      ["Yapılan", cevreKat ? "Konumun güçlü ve zayıf yönleri çıkarıldı" : "Sadece parsel künyesi hazırlandı"],
      ["Öneri", "Bölgeden 2-3 ilan girildiğinde rakam da hesaplanır"]
    ]});
  }

  const s2 = document.getElementById("sonuc");
  s2.style.display = "block";
  s2.innerHTML = tahmin != null
    ? `<div class="kv"><span>Ortanca emsal</span><b class="mono">${nf(Math.round(ortanca))} ₺/m²</b></div>
       <div class="kv"><span>Çevre / özellik etkisi</span><b class="mono">${carpan>0?"+":""}${carpan}%</b></div>
       <div class="kv" style="border-top:1px solid var(--cizgi);margin-top:6px;padding-top:10px">
         <span style="color:var(--gold)">Tahmini m² değeri</span>
         <b class="mono" style="color:var(--gold)">${nf(Math.round(tahmin))} ₺</b></div>
       ${pay?`<div class="kv"><span style="color:var(--gold)">Payınızın değeri</span>
         <b class="mono" style="color:var(--gold)">${nf(Math.round(tahmin*pay))} ₺</b></div>`:""}`
    : `<div style="font-size:13.5px;color:var(--ink-2)">Emsal girilmedi, rakam üretilmedi.
       ${cevreKat?"Rapor konumun güçlü ve zayıf yönleriyle hazırlandı.":"En az bir emsal girersen fiyat da çıkar."}</div>`;

  const { png, oran } = raporPng(
    `Emsal ve değer raporu${p?` · ${p.adaNo||"—"}/${p.parselNo||"—"}`:""}`,
    `${p?`${p.mahalleAd||""} — ${p.ilceAd||""} / ${p.ilAd||""}`:"Konum girilmedi"}\nHazırlayan: ${ME.full_name||""}`,
    bolumler);

}



/* ---- parça ayar bileşeni: hem çap çizdirmede hem sunumda ---- */

let PARCA = { bloklar:[], toplam:0, geometri:null, yolAlan:0, yolGenislik:0,
              p:null, enAzYol:4, kucultme:0, ters:false, kis:false };

let PSAYAC = 0;
const yeniParca = (m2) => ({ id: ++PSAYAC, no:"", m2: Math.round(m2||200), renk:"#FFFFFF" });

function parcaAyarHtml(){
  return `
    <div id="bloklar"></div>
    <div class="acts" style="margin-bottom:14px">
      <button id="blokTam">+ Tam genişlik blok</button>
      <button id="blokYol">+ Yol iki yanlı blok</button>
    </div>
    <div class="row2">
      <div class="field"><label>Yol genişliği (m)</label><input id="penaz" inputmode="decimal" value="${PARCA.enAzYol}"></div>
      <div class="field"><label>Blok sırası</label><select id="pters">
        <option value="0">Normal</option><option value="1">Ters çevir</option></select></div>
    </div>
    <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);margin:0 2px 14px">
      <input type="checkbox" id="pdus" style="width:20px;height:20px" ${PARCA.yolDus?"checked":""}>
      <span style="flex:1">Yol alanını parçalardan düş</span></label>
    <label style="display:flex;align-items:center;gap:10px;margin:0 2px 14px;font-size:13.5px;color:var(--ink)">
      <input type="checkbox" id="pkis" style="width:20px;height:20px" ${PARCA.kis?"checked":""}>
      <span style="flex:1">Yola yer açmak için parçaları orantılı küçült</span></label>
    <div class="card" id="capOzet" style="font-size:13px"></div>`;
}

function parcaKur(toplam, mevcut){
  PARCA.toplam = toplam;
  PARCA.bloklar = (mevcut && mevcut.length) ? mevcut.map(b=>({
    tip: b.tip === "yol" ? "yol" : "tam",
    parcalar: (b.parcalar||[]).map(o=>({ id:++PSAYAC, no:o.no||"", m2:+o.m2||1, renk:o.renk||"#FFFFFF" })),
    sol: (b.sol||[]).map(o=>({ id:++PSAYAC, no:o.no||"", m2:+o.m2||1, renk:o.renk||"#FFFFFF" })),
    sag: (b.sag||[]).map(o=>({ id:++PSAYAC, no:o.no||"", m2:+o.m2||1, renk:o.renk||"#FFFFFF" }))
  })) : [];
  if(!PARCA.bloklar.length)
    PARCA.bloklar = [{ tip:"tam", parcalar:[yeniParca(Math.round(toplam*0.5))], sol:[], sag:[] }];

  numaralariTazele();
  document.getElementById("blokTam").onclick = () => {
    PARCA.bloklar.push({ tip:"tam", parcalar:[yeniParca(Math.round(PARCA.toplam*0.15))], sol:[], sag:[] });
    numaralariTazele(); bloklariCiz();
  };
  document.getElementById("blokYol").onclick = () => {
    const pay = Math.round(Math.max(150, PARCA.toplam*0.06));
    PARCA.bloklar.push({ tip:"yol", parcalar:[], sol:[yeniParca(pay)], sag:[yeniParca(pay)] });
    numaralariTazele(); bloklariCiz();
  };
  const ea = document.getElementById("penaz");
  ea.oninput = () => { PARCA.enAzYol = Math.max(1, sayiCoz(ea.value) || 4); ozetCiz(); };
  const ks = document.getElementById("pkis");
  ks.onchange = () => { PARCA.kis = ks.checked; ozetCiz(); };
  const dus = document.getElementById("pdus");
  dus.onchange = () => { PARCA.yolDus = dus.checked; ozetCiz(); };
  const tr = document.getElementById("pters");
  tr.value = PARCA.ters ? "1" : "0";
  tr.onchange = () => { PARCA.ters = tr.value === "1"; ozetCiz(); };
  bloklariCiz();
}

function blokParcalari(b){
  return b.tip === "yol" ? b.sol.concat(b.sag) : b.parcalar;
}

function numaralariTazele(){
  let n = 0;
  PARCA.bloklar.forEach(b=>blokParcalari(b).forEach(o=>{ n++; if(!String(o.no||"").trim()) o.no = String(n); }));
}

function parcaSatirHtml(o, bi, yer, j){
  return `<div style="display:flex;gap:7px;align-items:center;margin-bottom:7px">
    <input id="pn${o.id}" value="${esc(o.no)}" style="width:52px;text-align:center;padding:10px 3px">
    <input id="pm${o.id}" inputmode="decimal" value="${Math.round(o.m2)}" style="flex:1;text-align:right">
    <input type="color" id="pr${o.id}" value="${o.renk}" style="width:44px;height:40px;padding:3px;border-radius:9px">
    <button class="sil" style="width:32px;height:32px" onclick="parcaSil(${bi},'${yer}',${j})">${svg("trash")}</button>
  </div>`;
}

function bloklariCiz(){
  const kutu = document.getElementById("bloklar");
  kutu.innerHTML = PARCA.bloklar.map((b,i)=>{
    const basSatir = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span class="pill ${b.tip==="yol"?"gold":"on"}">${i+1}. blok · ${b.tip==="yol"?"yol iki yanlı":"tam genişlik"}</span>
        <span style="flex:1"></span>
        ${i>0?`<button class="pill sade" onclick="blokTasi(${i},-1)">↑</button>`:""}
        ${i<PARCA.bloklar.length-1?`<button class="pill sade" onclick="blokTasi(${i},1)">↓</button>`:""}
        <button class="sil" onclick="blokSil(${i})">${svg("trash")}</button></div>`;

    if(b.tip === "tam"){
      return `<div class="card" style="padding:12px">${basSatir}
        <div style="display:flex;gap:7px;font-size:10.5px;color:var(--ink-3);padding:0 2px 4px">
          <span style="width:52px">NO</span><span style="flex:1">METREKARE</span>
          <span style="width:44px;text-align:center">RENK</span><span style="width:32px"></span></div>
        ${b.parcalar.map((o,j)=>parcaSatirHtml(o,i,"parcalar",j)).join("")}
        <button class="pill sade" onclick="parcaEkle(${i},'parcalar')">+ parça</button>
        <div class="ipuc" style="margin:8px 2px 0">Yol bu bloğun kenarından geçer, parçalar tam genişlikte alt alta dizilir.</div>
      </div>`;
    }
    const sutun = (yer, ad2) => `
      <div style="flex:1 1 46%;min-width:150px">
        <div style="font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:6px">${ad2} · ${b[yer].length} parça</div>
        ${b[yer].map((o,j)=>parcaSatirHtml(o,i,yer,j)).join("")}
        <button class="pill sade" onclick="parcaEkle(${i},'${yer}')">+ parça</button>
      </div>`;
    return `<div class="card" style="padding:12px">${basSatir}
      <div style="display:flex;gap:12px;flex-wrap:wrap">${sutun("sol","SOL")}${sutun("sag","SAĞ")}</div>
      <div class="ipuc" style="margin:10px 2px 0">Yol bu bloğun ortasından geçer; sol ve sağdaki parçalar kendi içinde alt alta dizilir.</div>
    </div>`;
  }).join("");

  PARCA.bloklar.forEach(b=>blokParcalari(b).forEach(o=>{
    const n = document.getElementById("pn"+o.id), m = document.getElementById("pm"+o.id), c = document.getElementById("pr"+o.id);
    if(n) n.oninput = () => { o.no = n.value; onizlemeCiz(); };
    if(m) m.oninput = () => { o.m2 = sayiCoz(m.value) || 0; ozetCiz(); };
    if(c) c.oninput = () => { o.renk = c.value; onizlemeCiz(); };
  }));
  ozetCiz();
}

function parcaEkle(i, yer){
  const liste = PARCA.bloklar[i][yer];
  const son = liste[liste.length-1];
  liste.push(yeniParca(son ? son.m2 : Math.round(PARCA.toplam*0.05)));
  numaralariTazele(); bloklariCiz();
}
function parcaSil(i, yer, j){
  PARCA.bloklar[i][yer].splice(j,1);
  if(!blokParcalari(PARCA.bloklar[i]).length) PARCA.bloklar.splice(i,1);
  bloklariCiz();
}
function blokSil(i){ PARCA.bloklar.splice(i,1); bloklariCiz(); }
function blokTasi(i, yon){
  const j = i + yon;
  if(j < 0 || j >= PARCA.bloklar.length) return;
  const t = PARCA.bloklar[i]; PARCA.bloklar[i] = PARCA.bloklar[j]; PARCA.bloklar[j] = t;
  bloklariCiz();
}

function ozetCiz(){
  const hepsi = PARCA.bloklar.flatMap(blokParcalari);
  const parcaAlan = hepsi.reduce((t,o)=>t+(+o.m2||0), 0);
  let yolAlan = 0, yolGen = 0, kucultme = 0;
  if(PARCA.geometri){
    try{
      const y = capYerlesim(PARCA.geometri, parcaCfg());
      yolAlan = y.yolAlan || 0; yolGen = y.yolGenislik || 0; kucultme = y.kucultme || 0;
    }catch(e){}
  }
  PARCA.yolAlan = Math.round(yolAlan); PARCA.yolGenislik = yolGen; PARCA.kucultme = kucultme;

  const o = document.getElementById("capOzet");
  if(o) o.innerHTML = `
    <div class="kv"><span>Parselin alanı</span><b class="mono">${nf(Math.round(PARCA.toplam))} m²</b></div>
    <div class="kv"><span>Parçalar (${hepsi.length} adet)</span><b class="mono">${nf(Math.round(parcaAlan))} m²</b></div>
    <div class="kv" style="border-top:1px solid var(--cizgi);margin-top:6px;padding-top:8px">
      <span style="color:var(--gold)">Parsel yolu</span>
      <b class="mono" style="color:var(--gold)">${yolGen.toFixed(1).replace(".",",")} m genişlik</b></div>
    ${kucultme > 0
      ? `<p class="ipuc" style="margin:8px 2px 0;color:var(--red)">Parçalar yola yer açmak için %${String(kucultme).replace(".",",")} küçültüldü; çizimdeki gerçek metrekareler parçaların üstünde yazıyor.</p>`
      : (yolGen < 1
        ? `<p class="ipuc" style="margin:8px 2px 0;color:var(--gold)">Girdiğin metrekareler birebir uygulandı; yola sadece ${nf(PARCA.yolAlan)} m² kaldığı için yol ${yolGen.toFixed(2).replace(".",",")} m genişliğinde. Daha geniş yol istersen parça metrekarelerini düşür ya da alttaki küçültme seçeneğini aç.</p>`
        : `<p class="ipuc" style="margin:8px 2px 0">Girdiğin metrekareler birebir uygulanıyor, artan alan yola ayrıldı.</p>`)}`;

  const say = document.getElementById("onizSay");
  if(say) say.textContent = nf(hepsi.length) + " parça";
  onizlemeCiz();
}

function parcaCfg(){
  return { enAzYol: PARCA.enAzYol, ters: PARCA.ters, yolDus: PARCA.yolDus, kis: PARCA.kis,
    bloklar: PARCA.bloklar.map(b=> b.tip === "yol"
      ? { tip:"yol", sol:b.sol.map(o=>({ no:o.no||"", m2:+o.m2||1, renk:o.renk })),
                     sag:b.sag.map(o=>({ no:o.no||"", m2:+o.m2||1, renk:o.renk })) }
      : { tip:"tam", parcalar:b.parcalar.map(o=>({ no:o.no||"", m2:+o.m2||1, renk:o.renk })) }),
    parcalar: cfgParcalari({ bloklar: PARCA.bloklar.map(b=> b.tip === "yol"
      ? { tip:"yol", sol:b.sol, sag:b.sag } : { tip:"tam", parcalar:b.parcalar }) }) };
}

function onizlemeCiz(){
  const c = document.getElementById("capOnizleme");
  if(!c || !PARCA.p) return;
  const G = 700, Y = 900;
  c.width = G; c.height = Y;
  try{
    const png = capCizPng(PARCA.p, parcaCfg(), true);

    im.onload = () => { const x = c.getContext("2d"); x.clearRect(0,0,G,Y); x.drawImage(im,0,0,G,Y); };
    im.src = png;
  }catch(e){}
}

// Esri uydu karolarindan parselin ustten gorunumunu olustur
async function uyduGorseli(geojson, lat, lng, G, Y){
  const karo = (z, la, lo) => {
    const n = Math.pow(2, z);
    const x = (lo + 180) / 360 * n;
    const rad = la * Math.PI/180;
    const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad))/Math.PI) / 2 * n;
    return { x, y };
  };
  let minLa = lat, maxLa = lat, minLo = lng, maxLo = lng;
  if(geojson?.geometry){
    JSON.stringify(geojson.geometry.coordinates).replace(/\[(-?\d+\.?\d*),(-?\d+\.?\d*)\]/g,(t,a,b)=>{
      minLo = Math.min(minLo, +a); maxLo = Math.max(maxLo, +a);
      minLa = Math.min(minLa, +b); maxLa = Math.max(maxLa, +b); return t;
    });
  }
  const payLa = (maxLa-minLa)*0.25 || 0.0012, payLo = (maxLo-minLo)*0.25 || 0.0012;
  minLa -= payLa; maxLa += payLa; minLo -= payLo; maxLo += payLo;

  let z = 18;
  for(; z > 12; z--){
    const a = karo(z, maxLa, minLo), b = karo(z, minLa, maxLo);
    if((b.x-a.x)*256 <= G && (b.y-a.y)*256 <= Y) break;
  }
  const ust = karo(z, maxLa, minLo), altk = karo(z, minLa, maxLo);
  const gen = (altk.x-ust.x)*256, yuk = (altk.y-ust.y)*256;
  const ol = Math.min(G/gen, Y/yuk);
  const kx = (G - gen*ol)/2, ky = (Y - yuk*ol)/2;

  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  x.fillStyle = "#1A1A1A"; x.fillRect(0,0,G,Y);

  const isler = [];
  for(let tx = Math.floor(ust.x); tx <= Math.floor(altk.x); tx++)
    for(let ty = Math.floor(ust.y); ty <= Math.floor(altk.y); ty++)
      isler.push({ tx, ty });

  await Promise.all(isler.map(({tx,ty})=>new Promise(res=>{
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => {
      const px = kx + (tx - ust.x)*256*ol, py = ky + (ty - ust.y)*256*ol;
      try{ x.drawImage(im, px, py, 256*ol, 256*ol); }catch(e){}
      res();
    };
    im.onerror = () => res();
    im.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty}/${tx}`;
  })));

  if(geojson?.geometry){
    const g = geojson.geometry;
    const halka = g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0];
    const E = k => {
      const t = karo(z, k[1], k[0]);
      return [ kx + (t.x - ust.x)*256*ol, ky + (t.y - ust.y)*256*ol ];
    };
    x.beginPath();
    halka.forEach((k,i)=>{ const e = E(k); i ? x.lineTo(e[0],e[1]) : x.moveTo(e[0],e[1]); });
    x.closePath();
    x.fillStyle = "rgba(255,255,255,.16)"; x.fill();
    x.lineWidth = 7; x.strokeStyle = "rgba(0,0,0,.5)"; x.stroke();
    x.lineWidth = 4; x.strokeStyle = "#FFFFFF"; x.stroke();
  }
  return c;
}

async function musteriSunumu(parselId){
  const { data:p } = await sb.from("parcels").select("*").eq("id",parselId).single();
  if(!p) return toast("Parsel bulunamadı");
  if(!p.lat) return toast("Bu parselin konumu yok, önce TKGM'den tazele");

  app.innerHTML = head("Müşteri sunumu", `go('parsel','${parselId}')`) + `
    <div class="card"><div class="spin"></div>
      <p style="text-align:center;color:var(--ink-3);font-size:13px" id="durum">Çevre verisi taranıyor…</p></div>`;

  try{
    const [{ data:yl }, { data:et }] = await Promise.all([
      sb.from("parcel_years").select("*").eq("parcel_id",parselId).order("yil",{ascending:false}),
      sb.from("parcel_tags").select("tags(name)").eq("parcel_id",parselId)
    ]);
    const y = yl?.[0] || {};
    const etiket = (et||[]).map(e=>e.tags?.name).filter(Boolean);
    const m = { lat:p.lat, lng:p.lng };
    const bildir = t => { const d = document.getElementById("durum"); if(d) d.textContent = t; };

    let o = null;
    if(CEVRE_SON && Math.abs(CEVRE_SON.m.lat - m.lat) < 1e-6 && Math.abs(CEVRE_SON.m.lng - m.lng) < 1e-6){
      o = CEVRE_SON.o; bildir("Kayıtlı çevre verisi kullanılıyor…");
    }else{
      try{ o = cevreOzet(await cevreVerisi(m.lat, m.lng, bildir), m); }catch(e){ o = null; }
    }
    const cevreVar = !!o;
    o = o || { yerler:[], yollar:{}, kullanim:{} };

    bildir("Arazi örtüsü sorgulanıyor…");
    let clc = (cevreVar && CEVRE_SON?.clc) || null;
    if(!clc){ try{ clc = await corineSinif(m.lat, m.lng); }catch(e){} }

    const yer = o.yerler[0];
    const anaYol = o.yollar.primary || o.yollar.secondary || o.yollar.trunk || o.yollar.motorway;
    const koyYol = o.yollar.unclassified || o.yollar.track || o.yollar.residential;

    const konum = [
      `${duzgun(p.mahalle)}, ${duzgun(p.ilce)} ilçesine bağlı bir yerleşimdir ve söz konusu taşınmaz bu sınırlar içinde ${p.ada?`${p.ada} ada `:""}${p.parsel} parselde yer almaktadır.`,
      `Parselin yüzölçümü ${nf(p.alan_m2)} m² olup tapu kaydındaki niteliği "${p.nitelik || "belirtilmemiş"}" olarak geçmektedir.`,
      p.mevkii ? `Taşınmaz ${p.mevkii} mevkiinde konumlanmaktadır.` : "",
      yer ? `En yakın yerleşim ${yer.t.name} olup parsele kuş uçuşu ${km(yer.u)} mesafededir.` : "",
      o.yerler[1] ? `Bunun dışında ${o.yerler[1].t.name} ${km(o.yerler[1].u)}${o.yerler[2]?`, ${o.yerler[2].t.name} ise ${km(o.yerler[2].u)}`:""} uzaklıktadır.` : ""
    ].filter(Boolean).join(" ");

    const ulasim = [
      koyYol ? `Parsele erişim mevcut yol üzerinden sağlanmakta olup, taşınmaz bu yola ${km(koyYol.u)} mesafededir.`
             : "Yakın çevrede kayıtlı bir ulaşım yolu tespit edilememiştir; erişim durumunun yerinde incelenmesi önerilir.",
      anaYol ? `Bölgenin ana ulaşım aksı parsele ${km(anaYol.u)} uzaklıktadır.` : "",
      koyYol && koyYol.u <= 60 ? "Bu haliyle taşınmaz yola cepheli konumdadır; ulaşım açısından güçlü bir avantaja sahiptir." : "",
      koyYol && koyYol.u > 400 ? "Yola olan mesafe dikkate alındığında geçit hakkı konusunun ayrıca değerlendirilmesi uygun olacaktır." : ""
    ].filter(Boolean).join(" ");

    const altyapi = [
      o.su ? `En yakın su kaynağı parsele ${km(o.su.u)} mesafededir${o.su.t.name?` (${o.su.t.name})`:""}.` : "Yakın çevrede kayıtlı yüzey suyu bulunmamaktadır.",
      o.kuyu ? `Ayrıca ${km(o.kuyu.u)} mesafede kayıtlı bir su kuyusu yer almaktadır.` : "",
      o.elektrik ? `Elektrik iletim hattı parsele ${km(o.elektrik.u)} uzaklıkta geçmektedir.` : "",
      o.akaryakit ? `En yakın akaryakıt istasyonu ${km(o.akaryakit.u)} mesafededir.` : "",
      o.okul ? `Bölgedeki en yakın okul ${km(o.okul.u)} uzaklıktadır.` : ""
    ].filter(Boolean).join(" ");

    const kullanimListe = Object.entries(o.kullanim).sort((a,b)=>b[1]-a[1]).slice(0,4)
      .map(([k])=>(LANDUSE_AD[k]||k).toLocaleLowerCase("tr"));
    const cevre = [
      clc?.ad ? `Copernicus CORINE arazi örtüsü verilerine göre parsel "${clc.ad}" sınıfında yer almaktadır.` : "",
      kullanimListe.length ? `Yakın çevrede ağırlıklı olarak ${kullanimListe.join(", ")} kullanımları gözlenmektedir.` : "",
      (clc?.kod?.startsWith("11") || clc?.kod === "121")
        ? "Bu sınıflama, taşınmazın yerleşim ve yapılaşma baskısı bulunan bir bölgede konumlandığını göstermektedir." : "",
      clc?.kod?.startsWith("2") ? "Taşınmaz tarımsal karakterini korumakta olup üretime elverişli bir yapı sunmaktadır." : ""
    ].filter(Boolean).join(" ");

    const tapu = [
      y.tapu_durumu === "hisseli"
        ? `Taşınmaz hisseli tapu niteliğinde olup, satışa konu pay ${y.hisse_pay||"belirtilen oran"} ile ${nf(y.hisse_m2)} m²'ye karşılık gelmektedir.`
        : "Taşınmaz tek tapu niteliğindedir; satışa konu alan parselin tamamıdır.",
      y.malik ? `Tapu kaydındaki malik bilgisi: ${String(y.malik).replace(/\n/g,", ")}.` : "",
      y.m2_fiyat ? `Metrekare birim fiyatı ${nf(y.m2_fiyat)} ₺ olarak belirlenmiştir.` : "",
      y.toplam_fiyat ? `Buna göre taşınmazın toplam satış bedeli ${nf(y.toplam_fiyat)} ₺'dir.` : ""
    ].filter(Boolean).join(" ");

    const ozet = [
      etiket.length ? `Taşınmazın öne çıkan özellikleri şunlardır: ${etiket.join(", ")}.` : "",
      koyYol && koyYol.u <= 60 ? "Yola cepheli konumu," : "",
      anaYol && anaYol.u <= 1000 ? "ana ulaşım aksına yakınlığı," : "",
      o.su && o.su.u <= 500 ? "su kaynağına yakınlığı," : "",
      "taşınmazı bölgedeki benzer parseller arasında öne çıkarmaktadır."
    ].filter(Boolean).join(" ");

    const bolumler = [
      { baslik:"Taşınmazın konumu", metin: konum },
      ...(cevreVar ? [
        { baslik:"Ulaşım ve erişim", metin: ulasim },
        { baslik:"Altyapı ve çevresel olanaklar", metin: altyapi }
      ] : []),
      { baslik:"Arazi yapısı ve çevre kullanımı",
        metin: cevre || "Bu bölüm için çevre verisi alınamamıştır; yerinde inceleme önerilir." },
      { baslik:"Tapu ve satış bilgileri", metin: tapu },
      { baslik:"Genel değerlendirme", metin: ozet },
      { baslik:"Künye", satirlar:[
        ["İl / ilçe / mahalle", `${duzgun(p.il)} / ${duzgun(p.ilce)} / ${duzgun(p.mahalle)}`],
        ["Ada / parsel", `${p.ada||"—"} / ${p.parsel}`],
        ["Yüzölçümü", nf(p.alan_m2) + " m²"],
        ["Niteliği", p.nitelik || "—"],
        ["Koordinat", `${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`],
        ["Arazi örtüsü", clc?.ad || "—"],
        ["Satış bedeli", y.toplam_fiyat ? nf(y.toplam_fiyat) + " ₺" : "—"]
      ]}
    ];

    bildir("Uydu görüntüsü hazırlanıyor…");
    try{
      const harita = await uyduGorseli(p.geojson, p.lat, p.lng, 1800, 1350);
      bolumler.splice(1, 0, { baslik:"Taşınmazın konumu (uydu görünümü)", gorsel:harita, oran:1350/1800 });
    }catch(e){}

    bildir("Sunum hazırlanıyor…");
    const { png, oran } = raporPng(
      `${duzgun(p.mahalle)} ${p.ada||""}/${p.parsel}`,
      `Taşınmaz tanıtım dosyası\n${duzgun(p.ilce)} / ${duzgun(p.il)}`,
      bolumler);

    const blob = pngToPdfBlob(png, oran);
    const ad2 = `${p.ada||0}-${p.parsel}-musteri-sunumu.pdf`;
    indirBlob(blob, ad2);
    if(ME.role !== 'uye'){
      try{ await dosyaYukle(new File([blob], ad2, { type:"application/pdf" }), "sunum", parselId); }catch(e){}
    }
    toast("Müşteri sunumu hazır");
    go("parsel", parselId);
  }catch(e){
    app.innerHTML = head("Müşteri sunumu", `go('parsel','${parselId}')`) +
      `<div class="empty"><b>Hazırlanamadı</b>${esc(e.message||e)}</div>`;
  }
}

// kutu yolunu ciz (kose bicimine gore)
function kutuYolu(x, w, h, kose){
  const r = kose === "yuvarlak" ? Math.min(h*.28, w*.12) : kose === "kesik" ? Math.min(h*.30, w*.10) : 0;
  x.beginPath();
  if(kose === "kesik"){
    x.moveTo(r,0); x.lineTo(w-r,0); x.lineTo(w,r); x.lineTo(w,h-r);
    x.lineTo(w-r,h); x.lineTo(r,h); x.lineTo(0,h-r); x.lineTo(0,r); x.closePath();
  }else if(r){
    x.moveTo(r,0); x.arcTo(w,0,w,h,r); x.arcTo(w,h,0,h,r); x.arcTo(0,h,0,0,r); x.arcTo(0,0,w,0,r); x.closePath();
  }else{
    x.rect(0,0,w,h);
  }
}

// metni kutuya sigdiran punto bul
const OLCER = document.createElement("canvas").getContext("2d");
function sigdir(x, metin, genislik, baslangic){
  let p = Math.max(6, Math.round(baslangic));
  if(!metin) return p;
  x.font = `700 ${p}px Arial`;
  while(p > 6 && x.measureText(metin).width > genislik){ p -= 1; x.font = `700 ${p}px Arial`; }
  return p;
}

// kutunun icindeki yazi yerlesimini hesapla (tek kaynak)
function kutuMetrik(o, w, h){
  const pad = Math.max(6, Math.min(w*.05, h*.14));
  const kullan = Math.max(10, w - pad*2);
  const satirlar = String(o.alt || "").split("\n").filter(t=>t.trim());
  const SATIR = 1.2;

  let ustP = 0;
  if(o.ust) ustP = sigdir(OLCER, o.ust, kullan, Math.min(h*.20, 40 + h*.02));

  const ustAlan = ustP ? ustP*1.5 : 0;
  const kalan = Math.max(8, h - pad*2 - ustAlan);
  let altP = satirlar.length ? Math.floor(kalan / (satirlar.length * SATIR)) : 0;
  altP = Math.min(altP, Math.floor(h*.42));
  const enUzun = satirlar.reduce((a,b)=> a.length>b.length?a:b, "");
  if(altP > 0) altP = sigdir(OLCER, enUzun, kullan, altP);
  altP = Math.max(satirlar.length ? 7 : 0, altP);

  const toplam = ustAlan + satirlar.length*altP*SATIR;
  const bas = Math.max(pad*.6, (h - toplam)/2);
  return { pad, kullan, satirlar, ustP, altP, SATIR, ustY: bas, altY: bas + ustAlan };
}

// kutuyu canvas'a ciz
function kutuCiz(x, o, w, h){
  const st = KUTU_STIL[o.stil ?? 0];
  x.save();
  if(st.golge){ x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = h*.14; x.shadowOffsetY = h*.05; }
  const gr = x.createLinearGradient(0,0,w*.25,h);
  st.zemin.forEach(([d,c])=>gr.addColorStop(d,c));
  kutuYolu(x, w, h, st.kose); x.fillStyle = gr; x.fill();
  x.shadowColor = "transparent";
  x.lineWidth = Math.max(2, h*st.kalinlik); x.strokeStyle = st.cerceve;
  kutuYolu(x, w, h, st.kose); x.stroke();
  if(st.ic){
    const p = Math.max(4, h*.07);
    x.save(); x.translate(p,p);
    x.lineWidth = Math.max(1, h*.012); x.strokeStyle = st.ic;
    kutuYolu(x, w-p*2, h-p*2, st.kose); x.stroke(); x.restore();
  }
  x.restore();

  const m = kutuMetrik(o, w, h);
  x.textBaseline = "top";
  if(o.ust && m.ustP){
    x.fillStyle = st.ustRenk; x.font = `700 ${m.ustP}px Arial`;
    x.fillText(o.ust, m.pad, m.ustY);
  }
  if(m.altP){
    x.fillStyle = st.altRenk; x.font = `700 ${m.altP}px Arial`;
    m.satirlar.forEach((t,i)=> x.fillText(t, m.pad, m.altY + i*m.altP*m.SATIR));
  }
}

// onizleme icin CSS karsiligi
function kutuCss(o){
  const st = KUTU_STIL[o.stil ?? 0];
  const gr = st.zemin.map(([d,c])=>`${c} ${Math.round(d*100)}%`).join(",");
  const kose = st.kose === "yuvarlak" ? "12px" : "0";
  return `background:linear-gradient(150deg,${gr});border:2px solid ${st.cerceve};border-radius:${kose};
    box-shadow:${st.golge?"0 6px 18px rgba(0,0,0,.45)":"none"};`;
}
