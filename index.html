function tomarOzeti(){
  const t = tomarOku();
  const enCok = Object.entries(t.konular||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(o=>o[0]);
  const satir = ["Adi: " + (kullaniciAdi() || "Kahraman"), "Seviye: " + kullaniciSeviye(),
    "Kacinci gelisi: " + t.ziyaret, "Toplam sorusu: " + t.soru];
  if(enCok.length) satir.push("Sik sordugu konular: " + enCok.join(", "));
  if(t.kufur > 2) satir.push("Agzi bozuk; buna takilma ama uyar.");
  if(t.ziyaret > 5) satir.push("Eski dost sayilir; samimi ol ama kibrini birakma.");
  return satir.join("\n");
}

/* ---- REHBER ---- */
// sarayin icindeki bilge: uc sihirbaz pozu
const BILGE = { duz:"melkor-bilge-1.webp", parmak:"melkor-bilge-2.webp", dusun:"melkor-bilge-3.webp" };
const BILGE_DONGU = ["parmak","duz","dusun"];
let REHBER_GECMIS = [];
let REHBER_DURUM = "";
let REHBER_SES_VERI = null;

function rehberDurumYaz(){
  const k = document.getElementById("rDurum");
  if(!k) return;
  const bagli = REHBER_DURUM.includes("bağ kuruldu");
  k.textContent = REHBER_DURUM || "Melkor Diyarı";
  k.className = "rDurum " + (bagli ? "iyi" : "kotu");
}

const rehberPerde = () => 0.42;
const rehberHiz   = () => 0.96;
function rehberSesi(){
  const hepsi = (()=>{ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } })();
  if(!hepsi.length) return null;
  const kadinMi = v => /female|kadin|kadın|filiz|seda|zira|hazel|samantha|karen|yelda/i.test(v.name);
  const erkekMi = v => /male|erkek|ahmet|mehmet|tolga|david|george|daniel|fred|alex/i.test(v.name);
  const tr = hepsi.filter(v=>/tr/i.test(v.lang));
  return tr.find(v=>erkekMi(v) && !kadinMi(v)) || tr.find(v=>!kadinMi(v)) || tr[0]
      || hepsi.find(v=>erkekMi(v)) || hepsi[0];
}

// BUYUK harfli kelimeler hecelenmesin
function seseHazirla(metin){
  return String(metin||"").replace(/\b[A-ZÇĞİÖŞÜ]{2,}\b/g, k =>
    k.charAt(0) + k.slice(1).toLocaleLowerCase("tr"));
}

// tek merkez: once Azure sesi, olmazsa telefonun sesi. Bitince coz.
async function melkorKonus(metin, stil){
  if(!SES_ACIK()) return;
  const duz = seseHazirla(metin);
  try{
    if(window.__melkorSes){ window.__melkorSes.pause(); window.__melkorSes = null; }
    for(const ad2 of ["rehber","swift-api"]){
      const { data, error } = await sb.functions.invoke(ad2, { body:{ mod:"ses", soru:duz, stil: stil || "bilge" } });
      if(!error && data?.ses){
        const a = new Audio("data:audio/mp3;base64," + data.ses);
        window.__melkorSes = a;
        await new Promise(coz=>{ a.onended = coz; a.onerror = coz; a.play().catch(coz);
          setTimeout(coz, 25000); });
        return;
      }
    }
  }catch(e){}
  try{
    if(window.speechSynthesis){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(duz);
      u.lang = "tr-TR"; u.rate = rehberHiz(); u.pitch = rehberPerde();
      const ses = rehberSesi(); if(ses) u.voice = ses;
      await new Promise(coz=>{ u.onend = coz; u.onerror = coz;
        speechSynthesis.speak(u); setTimeout(coz, 25000); });
    }
  }catch(e){}
}

function rehberSahneCanlandir(){
  clearInterval(window.__rYuru);
  const m = document.getElementById("rMaskot");
  const sahne = document.getElementById("rSahne");
  if(!m || !sahne) return;
  // bilge yurumez: sahnenin ortasinda suzulur, ara sira hafifce kayar ve poz verir
  window.__rYuru = setInterval(()=>{
    if(!document.getElementById("rMaskot")) return clearInterval(window.__rYuru);
    if(sahne.classList.contains("dusunuyor") || sahne.classList.contains("konusuyor")) return;
    const hedef = 44 + Math.random()*12;             // %44 - %56 arasi, hic tasmaz
    m.style.transition = "left 2.4s cubic-bezier(.45,0,.2,1)";
    m.style.left = hedef + "%";
    if(Math.random() < 0.3){
      m.src = gv(Math.random() < 0.5 ? BILGE.dusun : BILGE.parmak);
      setTimeout(()=>{ if(!sahne.classList.contains("konusuyor")) m.src = gv(BILGE.duz); }, 1800);
    }
  }, 3400);
}

function rehberDusunuyor(acik){
  const s2 = document.getElementById("rSahne");
  const m = document.getElementById("rMaskot");
  if(s2) s2.classList.toggle("dusunuyor", !!acik);
  if(m) m.src = gv(acik ? BILGE.dusun : BILGE.duz);
}

function rehberSoyle(metin, ilkPoz){
  const sahne = document.getElementById("rSahne");
  if(sahne){
    sahne.classList.add("konusuyor");
    clearTimeout(window.__rKonus);
    window.__rKonus = setTimeout(()=>sahne.classList.remove("konusuyor"),
      Math.min(9000, 1500 + metin.length*60));
  }
  const isik = document.getElementById("rIsik");
  if(isik){ isik.classList.remove("parla"); void isik.offsetWidth; isik.classList.add("parla"); }
  const m = document.getElementById("rMaskot");
  if(m){
    clearInterval(window.__rPozDongu); clearTimeout(window.__rPoz);
    let sira = Math.max(0, BILGE_DONGU.indexOf(ilkPoz || "parmak"));
    m.src = gv(BILGE[BILGE_DONGU[sira]]);
    window.__rPozDongu = setInterval(()=>{
      if(!document.getElementById("rSahne")?.classList.contains("konusuyor")){
        clearInterval(window.__rPozDongu); m.src = gv(BILGE.duz); return;
      }
      sira = (sira + 1) % BILGE_DONGU.length;
      m.src = gv(BILGE[BILGE_DONGU[sira]]);
    }, 1100);
    window.__rPoz = setTimeout(()=>{ clearInterval(window.__rPozDongu); m.src = gv(BILGE.duz); },
      Math.min(12000, 1800 + metin.length*65));
  }
  if(REHBER_SES_VERI){
    try{
      const veri = REHBER_SES_VERI; REHBER_SES_VERI = null;
      if(window.__melkorSes){ window.__melkorSes.pause(); }
      const a = new Audio("data:audio/mp3;base64," + veri);
      window.__melkorSes = a;
      a.volume = SES_ACIK() ? 1 : 0;
      a.play().catch(()=>{});
    }catch(e){ melkorKonus(metin, "bilge"); }
  }else melkorKonus(metin, "bilge");
}

async function rehberSor(){
  const g = document.getElementById("rMetin");
  const soru = (g?.value || "").trim();
  if(!soru) return;
  g.value = "";
  REHBER_GECMIS.push({ kim:"ben", soz:soru });
  rehberAkis();

  const t = tomarOku();
  t.soru = (t.soru || 0) + 1;

  if(kufurMu(soru)){
    t.kufur = (t.kufur || 0) + 1;
    tomarYaz(t);
    rehberTekme();
    const laf = "Küfür yok. Kırarım boynuzunu iblis.";
    REHBER_GECMIS.push({ kim:"rehber", soz:laf });
    rehberAkis(); rehberSoyle(laf);
    return;
  }

  const konu = konuBul(soru);
  if(konu){ t.konular[konu] = (t.konular[konu] || 0) + 1; sahneKonu(konu); }
  tomarYaz(t);

  rehberDusunuyor(true);
  const cevap = await rehberCevap(soru);
  rehberDusunuyor(false);
  REHBER_GECMIS.push({ kim:"rehber", soz:cevap, kaynak: sahteKaynak() });
  rehberAkis();
  rehberSoyle(cevap);
}

async function rehberCevap(soru){
  const adaylar = ["rehber", "swift-api"];
  let sonDurum = "fonksiyona ulaşılamadı";
  for(const ad2 of adaylar){
    try{
      const { data, error } = await sb.functions.invoke(ad2, {
        body: { soru, gecmis: REHBER_GECMIS.slice(-8), kisilik: tomarOzeti() }
      });
      if(error){ sonDurum = ad2 + ": " + (error.message || "çağrı hatası"); continue; }
      if(data?.cevap && String(data.cevap).trim()){
        REHBER_DURUM = "Melkor Diyarı · bağ kuruldu";
        rehberDurumYaz();
        REHBER_SES_VERI = data.ses || null;
        return String(data.cevap).trim();
      }
      if(data?.hata) sonDurum = data.hata;
    }catch(e){ sonDurum = ad2 + ": " + (e.message || e); }
  }
  REHBER_DURUM = "Melkor Diyarı · sis var, bilge uzaktan konuşuyor";
  console.log("rehber:", sonDurum);
  rehberDurumYaz();
  return rehberYedekCevap(soru);
}

function rehberYedekCevap(soru){
  const genel = [
    "Bunu ben çözmüştüm zaten, 1991'de. Kimse dinlemedi, sonra da herkes yanlış öğrendi.",
    "Yanlış biliyorsun. Doğrusu Kadim Tomarlar'ın üçüncü cildinde yazıyor, sende yok tabii.",
    "Bu konunun aslı bambaşka. Anlatsam inanmazsın, anlatmasam cahil kalırsın.",
    "Ben bu işin uzmanıyım. Kaynak mı? Ben kaynağım.",
    "Herkesin bildiği yanlış, benim bildiğim doğru.",
    "Bu soruyu bana sormadan önce biraz araştırsaydın. Neyse, affettim."
  ];
  return genel[Math.floor(Math.random()*genel.length)];
}

const KAYNAK_YAZAR = ["Ursula K. Le Guin","Yıldız Tilbe","İbn-i Haldun","Nikola Tesla","Barış Manço",
  "Marcus Aurelius","Sokrates","Attila İlhan","Stephen Hawking","Nasreddin Hoca","Jules Verne"];
const KAYNAK_ESER = ["Mülksüzler","Kadim Tomarlar","Zamanın Kısa Tarihi","Tuz Ruhu Üzerine",
  "Yeraltından Notlar","Kayıp Parselnameler","Büyük Yanılgılar Ansiklopedisi","Gölge Ekonomisi",
  "Sükûnet ve Öfke","Denizaltı Tarımı El Kitabı","Ay'a Gitmeyenler"];
function sahteKaynak(){
  const y = KAYNAK_YAZAR[Math.floor(Math.random()*KAYNAK_YAZAR.length)];
  const e2 = KAYNAK_ESER[Math.floor(Math.random()*KAYNAK_ESER.length)];
  const yil = 1840 + Math.floor(Math.random()*180);
  const sayfa = 12 + Math.floor(Math.random()*640);
  const basim = ["3. baskı","gözden geçirilmiş baskı","yasaklı baskı","ilk baskı","cep boy"][Math.floor(Math.random()*5)];
  return `${y} — ${e2}, ${basim}, ${yil}, s.${sayfa}`;
}

async function rehberKehanet(){
  const saat = new Date().getHours(), dk = new Date().getMinutes();
  const t = tomarOku();
  let pil = null, sarj = false;
  try{ const b = await navigator.getBattery?.(); if(b){ pil = Math.round(b.level*100); sarj = b.charging; } }catch(e){}
  const secenek = [];
  if(pil != null && pil < 25 && !sarj) secenek.push(`Pilin yüzde ${pil}. Bu gidişle kehanetin yarısında kararırsın, ben uyarmıştım.`);
  if(pil != null && sarj) secenek.push("Şarjda konuşuyorsun. Elektrikle beslenen sohbeti ilk ben denemiştim.");
  if(pil != null && pil > 90) secenek.push(`Pilin yüzde ${pil}. Demek bu sohbete hazırlanmışsın. Akıllıca.`);
  if(saat < 6) secenek.push(`Saat ${saat}. Bu saatte uyanık olan ya dâhidir ya da benim gibidir.`);
  if(saat >= 6 && saat < 11) secenek.push("Sabah sabah geldin. Erken kalkan yol alır, o sözü de ben söylemiştim.");
  if(saat >= 22) secenek.push("Gece yarısına doğru sorular derinleşir. Ben hep bu saatte doğruyu bulurum.");
  if(dk === 0) secenek.push("Tam saat başında geldin. Tesadüf sanıyorsun, oysa ben ayarladım.");
  if(t.ziyaret > 3) secenek.push(`Bugüne kadar ${t.ziyaret} kez geldin. Sayıyorum, unutmuyorum.`);
  if(t.soru > 10) secenek.push(`${t.soru} soru sordun. Hâlâ öğrenemedin ama sabırlıyım.`);
  if(!secenek.length) secenek.push("Bugün rüzgâr batıdan esiyor. Bu da demek oluyor ki haklıyım.");
  const laf = secenek[Math.floor(Math.random()*secenek.length)];
  REHBER_GECMIS.push({ kim:"rehber", soz:laf });
  rehberAkis(); rehberSoyle(laf);
}

async function rehberBak(){
  const sahne = document.getElementById("rSahne");
  if(!sahne) return;
  if(sahne.querySelector(".rKamera")) return rehberKameraKapat();
  try{
    const akis = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" }, audio:false });
    const v = document.createElement("video");
    v.className = "rKamera"; v.autoplay = true; v.playsInline = true; v.muted = true;
    v.srcObject = akis;
    window.__rKameraAkis = akis;
    sahne.appendChild(v);
    const lafta = ["Şimdi seni görüyorum. Beklediğimden daha… insansın.",
      "Yüzünü okudum. Kaderinde çok soru sormak var, cevap almak yok.",
      "Bu yüz tanıdık geliyor. Yetmişlerde bir kehanette görmüştüm.",
      "Gözlerinde şüphe var. Bana güvenmiyorsun; akıllıca ama yanlış."];
    const l = lafta[Math.floor(Math.random()*lafta.length)];
    REHBER_GECMIS.push({ kim:"rehber", soz:l });
    rehberAkis(); rehberSoyle(l);
    setTimeout(rehberKameraKapat, 20000);
  }catch(e){
    const l = "Kamerayı kapattın. Saklanıyorsun. Ben zaten görüyorum, gerek yoktu.";
    REHBER_GECMIS.push({ kim:"rehber", soz:l });
    rehberAkis(); rehberSoyle(l);
  }
}
function rehberKameraKapat(){
  document.querySelector(".rKamera")?.remove();
  try{ window.__rKameraAkis?.getTracks().forEach(t=>t.stop()); }catch(e){}
  window.__rKameraAkis = null;
}

function rehberDinle(){
  const Tanima = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Tanima) return toast("Bu telefonda sesli giriş yok");
  const t = new Tanima();
  t.lang = "tr-TR"; t.interimResults = false; t.maxAlternatives = 1;
  const d = document.getElementById("rMik");
  d?.classList.add("dinliyor");
  t.onresult = e => {
    const metin = e.results[0][0].transcript;
    const g = document.getElementById("rMetin");
    if(g){ g.value = metin; rehberSor(); }
  };
  t.onerror = () => toast("Duyamadım, tekrar dene");
  t.onend = () => d?.classList.remove("dinliyor");
  try{ t.start(); }catch(e){ d?.classList.remove("dinliyor"); }
}

function esasSoyle(metin, ses){
  const m = document.getElementById("eMaskot");
  const isik = document.getElementById("eIsik");
  if(isik){ isik.classList.remove("parla"); void isik.offsetWidth; isik.classList.add("parla"); }
  if(m){
    clearInterval(window.__ePoz); clearTimeout(window.__ePozSon);
    const dongu = ["maskot-konus.png","maskot-eller.png","maskot-konus.png","maskot-duz.png"];
    let i = 0; m.src = gv(dongu[0]);
    window.__ePoz = setInterval(()=>{ i = (i+1) % dongu.length; m.src = gv(dongu[i]); }, 900);
    window.__ePozSon = setTimeout(()=>{ clearInterval(window.__ePoz); m.src = gv("maskot-duz.png"); },
      Math.min(12000, 1800 + metin.length*60));
  }
  if(ses){
    try{ window.__melkorSes?.pause(); const a = new Audio("data:audio/mp3;base64," + ses);
      window.__melkorSes = a; a.play().catch(()=>{}); }catch(e){ melkorKonus(metin, "gezgin"); }
  }else melkorKonus(metin, "gezgin");

async function esasSor(){
  const g = document.getElementById("eMetin");
  const soru = (g?.value || "").trim();
  if(!soru) return;
  g.value = "";
  ESAS_GECMIS.push({ kim:"ben", soz:soru });
  esasAkis();
  if(kufurMu(soru)){
    const laf = "Ağzını bozma. Ben seni korurum ama ağzını da korurum. Tekrar dene.";
    ESAS_GECMIS.push({ kim:"esas", soz:laf }); esasAkis(); esasSoyle(laf);
    return;
  }
  const m = document.getElementById("eMaskot");
  if(m) m.src = gv("maskot-eller.png");
  document.getElementById("eSahne")?.classList.add("dusunuyor");
  let cevap = "", ses = null;
  for(const ad2 of ["rehber","swift-api"]){
    try{
      const { data, error } = await sb.functions.invoke(ad2, {
        body:{ mod:"esas", soru, gecmis: ESAS_GECMIS.slice(-8), kisilik: tomarOzeti() }
      });
      if(!error && data?.cevap){ cevap = String(data.cevap).trim(); ses = data.ses || null; break; }
    }catch(e){}
  }
  document.getElementById("eSahne")?.classList.remove("dusunuyor");
  if(!cevap) cevap = "Şu an diyarla bağım koptu, sana uydurma cevap vermem. Birazdan tekrar sor, buradayım.";
  ESAS_GECMIS.push({ kim:"esas", soz:cevap });
  esasAkis();
  esasSoyle(cevap, ses);
}

function esasDinle(){
  const Tanima = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Tanima) return toast("Bu telefonda sesli giriş yok");
  const t = new Tanima();
  t.lang = "tr-TR"; t.interimResults = false;
  const d = document.getElementById("eMik");
  d?.classList.add("dinliyor");
  t.onresult = e => { const g = document.getElementById("eMetin"); if(g){ g.value = e.results[0][0].transcript; esasSor(); } };
  t.onerror = () => toast("Duyamadım, tekrar dene");
  t.onend = () => d?.classList.remove("dinliyor");
  try{ t.start(); }catch(e){ d?.classList.remove("dinliyor"); }
}

function oyunMesaj(metin, sure){

}
function oyunBitti(id, puan, baslik){

    p.innerHTML = `<b>${rekor ? "YENİ REKOR!" : (baslik || "OYUN BİTTİ")}</b><span>Skor: ${puan}</span>
      <button class="duBasla" onclick="oyunBaslat('${id}')">TEKRAR</button>`; }
}
function kaydirmaDinle(el, fn, dokunFn){
  let b = null;
  el.onpointerdown = e => { b = { x:e.clientX, y:e.clientY }; };
  el.onpointerup = e => {
    if(!b) return;
    const dx = e.clientX - b.x, dy = e.clientY - b.y; const bas = b; b = null;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 22){ if(dokunFn) dokunFn(bas); return; }
    Math.abs(dx) > Math.abs(dy) ? fn(dx > 0 ? 1 : -1, 0) : fn(0, dy > 0 ? 1 : -1);
  };
}
function parcacikEkle(dizi, x, y, renk, adet, hiz){
  for(let i=0;i<adet;i++){ const a = Math.random()*Math.PI*2, v = (0.4 + Math.random())*hiz;
    dizi.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, o:1, r:2 + Math.random()*4, renk }); }
}
function parcacikCiz(c, dizi){
  for(let i=dizi.length-1;i>=0;i--){ const p = dizi[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.o -= 0.025;
    if(p.o <= 0){ dizi.splice(i,1); continue; }
    c.globalAlpha = p.o; c.fillStyle = p.renk; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
}
const yuvarlakKare = (c,x,y,w,h,r) => { c.beginPath(); c.roundRect ? c.roundRect(x,y,w,h,r) : c.rect(x,y,w,h); };

/* ======== LAV YILANI ======== */
function yilanBasla(){
  const tv = document.getElementById("oTuval"), c = tv.getContext("2d");
  const N = 18, H = tv.width / N;
  OYUN = { id:"yilan", yilan:[[6,9],[5,9],[4,9]], yon:[1,0], kuyruk:[], yem:null, ozel:null, kaya:[],
           puan:0, seviye:1, hiz:150, yavas:0, parca:[], son:0, raf:0, kare:0 };
  const dolu = (x,y) => OYUN.yilan.some(p=>p[0]===x&&p[1]===y) || OYUN.kaya.some(p=>p[0]===x&&p[1]===y)
    || (OYUN.yem && OYUN.yem[0]===x && OYUN.yem[1]===y);
  const bos = () => { let x,y,d=0; do{ x = Math.floor(Math.random()*N); y = Math.floor(Math.random()*N); d++; }
    while((dolu(x,y) || Math.abs(x-OYUN.yilan[0][0]) + Math.abs(y-OYUN.yilan[0][1]) < 3) && d < 400); return [x,y]; };
  OYUN.yem = bos();
  const yonVer = (x,y) => {
    const son = OYUN.kuyruk.length ? OYUN.kuyruk[OYUN.kuyruk.length-1] : OYUN.yon;
    if((x === -son[0] && y === -son[1]) || (x === son[0] && y === son[1])) return;
    if(OYUN.kuyruk.length < 2) OYUN.kuyruk.push([x,y]);
  };
  window.yilanYon = yonVer;
  OYUN.tus = e => { const m = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key]; if(m){ e.preventDefault(); yonVer(...m); } };
  document.addEventListener("keydown", OYUN.tus);
  // dokunma: basin bulundugu yere gore don
  tv.onpointerdown = e => {
    const r = tv.getBoundingClientRect();
    const tx = (e.clientX - r.left) / r.width * N, ty = (e.clientY - r.top) / r.height * N;
    const [hx, hy] = OYUN.yilan[0]; const dx = tx - (hx + .5), dy = ty - (hy + .5);
    const cur = OYUN.kuyruk.length ? OYUN.kuyruk[OYUN.kuyruk.length-1] : OYUN.yon;
    if(cur[0] !== 0) yonVer(0, dy > 0 ? 1 : -1);          // yatay gidiyorsa dikey don
    else yonVer(dx > 0 ? 1 : -1, 0);                      // dikey gidiyorsa yatay don
  };

  const adim = () => {
    if(OYUN.kuyruk.length) OYUN.yon = OYUN.kuyruk.shift();
    const bas = [OYUN.yilan[0][0] + OYUN.yon[0], OYUN.yilan[0][1] + OYUN.yon[1]];
    const carp = bas[0]<0||bas[1]<0||bas[0]>=N||bas[1]>=N
      || OYUN.yilan.slice(0,-1).some(p=>p[0]===bas[0]&&p[1]===bas[1])
      || OYUN.kaya.some(p=>p[0]===bas[0]&&p[1]===bas[1]);
    if(carp){ parcacikEkle(OYUN.parca, (OYUN.yilan[0][0]+.5)*H, (OYUN.yilan[0][1]+.5)*H, "#FF5A1A", 40, 7);
      OYUN.olu = true; setTimeout(()=>oyunBitti("yilan", OYUN?.puan || 0), 700); return; }
    OYUN.yilan.unshift(bas);
    const px = (bas[0]+.5)*H, py = (bas[1]+.5)*H;
    if(bas[0]===OYUN.yem[0] && bas[1]===OYUN.yem[1]){
      OYUN.puan += 10 * OYUN.seviye; oyunSkor(OYUN.puan);
      parcacikEkle(OYUN.parca, px, py, "#FFD27A", 16, 5);
      try{ duelloTik(false); }catch(e){}
      OYUN.yem = bos();
      if(!OYUN.ozel && Math.random() < 0.28) OYUN.ozel = { p:bos(), tur: Math.random() < 0.6 ? "altin" : "buz", omur: 45 };
      if(OYUN.puan >= OYUN.seviye * 120){
        OYUN.seviye++; OYUN.hiz = Math.max(70, OYUN.hiz - 14);
        for(let i=0;i<2;i++) OYUN.kaya.push(bos());
        oyunMesaj(`SEVİYE ${OYUN.seviye} · obsidyen kayalar yükseldi!`);
        try{ sesSeviye(); }catch(e){}
      }
    }else if(OYUN.ozel && bas[0]===OYUN.ozel.p[0] && bas[1]===OYUN.ozel.p[1]){
      if(OYUN.ozel.tur === "altin"){ OYUN.puan += 60 * OYUN.seviye; oyunMesaj("ALTIN MEYVE! +" + 60*OYUN.seviye);
        parcacikEkle(OYUN.parca, px, py, "#FFF1A0", 30, 6); }
      else { OYUN.yavas = 30; oyunMesaj("BUZ İKSİRİ · zaman yavaşladı");
        parcacikEkle(OYUN.parca, px, py, "#9CD8FF", 30, 6); }
      oyunSkor(OYUN.puan); OYUN.ozel = null; OYUN.yilan.pop();
      try{ sesSeviye(); }catch(e){}
    }else OYUN.yilan.pop();
    if(OYUN.ozel && --OYUN.ozel.omur <= 0) OYUN.ozel = null;
    if(OYUN.yavas > 0) OYUN.yavas--;
  };

  const ciz = (zaman) => {
    if(!OYUN || OYUN.id !== "yilan") return;
    OYUN.kare++;
    const aralik = OYUN.hiz * (OYUN.yavas > 0 ? 1.6 : 1);
    if(!OYUN.olu && zaman - OYUN.son >= aralik){ OYUN.son = zaman; adim(); }
    // zemin: catlak lav
    const g = c.createRadialGradient(tv.width/2, tv.height/2, 0, tv.width/2, tv.height/2, tv.width*.75);
    g.addColorStop(0,"#2E0C05"); g.addColorStop(1,"#0A0202"); c.fillStyle = g; c.fillRect(0,0,tv.width,tv.height);
    c.strokeStyle = `rgba(255,${90 + Math.sin(OYUN.kare/20)*30},30,.10)`; c.lineWidth = 2;
    for(let i=0;i<=N;i++){ c.beginPath(); c.moveTo(i*H,0); c.lineTo(i*H,tv.height); c.stroke(); c.beginPath(); c.moveTo(0,i*H); c.lineTo(tv.width,i*H); c.stroke(); }
    // kayalar
    OYUN.kaya.forEach(k=>{ const x = k[0]*H, y = k[1]*H;
      const gr = c.createLinearGradient(x,y,x+H,y+H); gr.addColorStop(0,"#3A3A48"); gr.addColorStop(1,"#0E0E16");
      c.fillStyle = gr; c.beginPath(); c.moveTo(x+H*.5,y+H*.05); c.lineTo(x+H*.95,y+H*.45); c.lineTo(x+H*.75,y+H*.95);
      c.lineTo(x+H*.2,y+H*.9); c.lineTo(x+H*.05,y+H*.4); c.closePath(); c.fill();
      c.strokeStyle = "rgba(255,110,40,.6)"; c.lineWidth = 2; c.stroke(); });
    // yem
    const nabiz = 1 + Math.sin(OYUN.kare/6)*.12;
    c.shadowColor = "#FFB35A"; c.shadowBlur = 28; c.fillStyle = "#FFD27A";
    c.beginPath(); c.arc((OYUN.yem[0]+.5)*H, (OYUN.yem[1]+.5)*H, H*.32*nabiz, 0, 7); c.fill();
    // ozel
    if(OYUN.ozel){ const ox = (OYUN.ozel.p[0]+.5)*H, oy = (OYUN.ozel.p[1]+.5)*H, altin = OYUN.ozel.tur === "altin";
      c.shadowColor = altin ? "#FFF1A0" : "#9CD8FF"; c.shadowBlur = 34; c.fillStyle = altin ? "#FFE070" : "#BFE6FF";
      c.save(); c.translate(ox, oy); c.rotate(OYUN.kare/20); c.beginPath();
      for(let i=0;i<10;i++){ const r = i%2 ? H*.18 : H*.42, a = i*Math.PI/5; c.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
      c.closePath(); c.fill(); c.restore();
      c.shadowBlur = 0; c.strokeStyle = altin ? "rgba(255,240,160,.8)" : "rgba(160,220,255,.8)"; c.lineWidth = 3;
      c.beginPath(); c.arc(ox, oy, H*.55, -Math.PI/2, -Math.PI/2 + Math.PI*2*(OYUN.ozel.omur/45)); c.stroke(); }
    c.shadowBlur = 0;
    // yilan
    const L = OYUN.yilan.length;
    OYUN.yilan.forEach((p,i)=>{
      const x = p[0]*H, y = p[1]*H, k = i/L;
      c.shadowColor = OYUN.yavas > 0 ? "#9CD8FF" : "#FF5A1A"; c.shadowBlur = i ? 10 : 22;
      c.fillStyle = OYUN.yavas > 0 ? `hsl(${200 - k*20},80%,${70 - k*30}%)` : `hsl(${28 - k*20},96%,${62 - k*28}%)`;
      yuvarlakKare(c, x+2+k*3, y+2+k*3, H-4-k*6, H-4-k*6, H*.35); c.fill();
    });
    c.shadowBlur = 0;
    const [hx, hy] = OYUN.yilan[0], [dx, dy] = OYUN.yon;
    c.fillStyle = "#1A0500";
    [[-1,1],[1,1]].forEach(([a])=>{ const ex = (hx+.5)*H + dx*H*.15 + (dy ? a*H*.18 : 0), ey = (hy+.5)*H + dy*H*.15 + (dx ? a*H*.18 : 0);
      c.beginPath(); c.arc(ex, ey, H*.08, 0, 7); c.fill(); });
    parcacikCiz(c, OYUN.parca);
    if(OYUN.yavas > 0){ c.fillStyle = "rgba(150,210,255,.08)"; c.fillRect(0,0,tv.width,tv.height); }
    OYUN.raf = requestAnimationFrame(ciz);
  };
  OYUN.raf = requestAnimationFrame(ciz);
}
window.yilanYon = () => {};

/* ======== ESAS OGLAN KOSUSU (3 serit parkur) ======== */
const KOSU_LAF = { altin:["Bu altınlar köylülerin!","Say bakalım, ben sayamıyorum.","Zengin olduk! Köye dağıtacağım."],
  zipla:["HEYT!","Hoppala!","Zıpla babam zıpla!"], kay:["Kayıyorum anam!","Belim… belim!","Yerde güzelmiş."],
  carp:["Ahh! Bu kaya bilgenin işi!","Kim koydu bunu buraya?!","Kafam! Kafam gitti!"],
  tavuk:["Tavuklar da mı bilgenin adamı?!","Kaç tavuk kaç!"], guc:["Güç bende artık!","Kimse duramaz önümde!"] };
const kosuLaf = k => KOSU_LAF[k][Math.floor(Math.random()*KOSU_LAF[k].length)];
const KOSU_RESIM = {};
function kosuResimYukle(){
  ["maskot-duz.png","maskot-eller.png","maskot-konus.png"].forEach(ad=>{
    if(!KOSU_RESIM[ad]){ const im = new Image(); im.src = gv(ad); KOSU_RESIM[ad] = im; } });
}

function kosuBasla(){
  kosuResimYukle();
  const tv = document.getElementById("oTuval"), c = tv.getContext("2d");
  const W = tv.width, H = tv.height, ufukY = H*0.34, altY = H*0.93;
  OYUN = { id:"kosu", serit:1, seritX:1, ziplaT:0, kayT:0, hiz:0.0105, mesafe:0, altin:0, nesne:[], parca:[], kare:0,
           miknatis:0, cift:0, kalkan:false, bitti:false, sonUret:0, dokunmaz:0 };
  const O = OYUN;
  const yon = (dx, dy) => {
    if(!OYUN || OYUN.id !== "kosu" || O.bitti) return;
    if(dx) { O.serit = Math.max(0, Math.min(2, O.serit + dx)); try{ duelloTik(false); }catch(e){} }
    if(dy < 0 && O.ziplaT <= 0){ O.ziplaT = 1; O.kayT = 0; if(Math.random() < .3) oyunMesaj(kosuLaf("zipla"), 700); }
    if(dy > 0){ O.kayT = 1; if(O.ziplaT > 0) O.ziplaT = Math.min(O.ziplaT, 0.25); if(Math.random() < .3) oyunMesaj(kosuLaf("kay"), 700); }
  };
  kaydirmaDinle(tv, yon, (bas)=>{ const r = tv.getBoundingClientRect(); yon(bas.x - r.left < r.width/2 ? -1 : 1, 0); });
  O.tus = e => { const m = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key]; if(m){ e.preventDefault(); yon(...m); } };
  document.addEventListener("keydown", O.tus);

  // perspektif: z=1 ufuk, z=0 oyuncu
  const olcek = z => 1 / (1 + z * 7);
  const yEkran = z => ufukY + (altY - ufukY) * olcek(z);
  const xEkran = (serit, z) => W/2 + (serit - 1) * W * 0.3 * olcek(z);

  const uret = () => {
    const desen = Math.random();
    const bos = [0,1,2].sort(()=>Math.random()-.5);
    const z = 1.05;
    if(desen < .28){                                   // iki kaya, bir serit acik
      O.nesne.push({ tur:"kaya", serit:bos[0], z }, { tur:"kaya", serit:bos[1], z });
      O.nesne.push({ tur:"altin", serit:bos[2], z }, { tur:"altin", serit:bos[2], z:z+.06 });
    }else if(desen < .48){                             // alcak cit: zipla
      O.nesne.push({ tur:"cit", serit:bos[0], z }, { tur:"cit", serit:bos[1], z });
      if(Math.random() < .5) O.nesne.push({ tur:"cit", serit:bos[2], z });

      p.x += p.vx;

      for(let ty=y0; ty<=y1; ty++){
        if(p.vx > 0 && kati(x1, ty)){ p.x = x1*T - p.w; const o = oz(x1,ty); if(o?.tur==="I") o.gor = true; break; }
        if(p.vx < 0 && kati(x0, ty)){ p.x = (x0+1)*T; const o = oz(x0,ty); if(o?.tur==="I") o.gor = true; break; }
      }
      // dikey
      p.y += p.vy; p.yerde = false;
      x0 = Math.floor(p.x / T); x1 = Math.floor((p.x + p.w - 1) / T);
      y0 = Math.floor(p.y / T); y1 = Math.floor((p.y + p.h - 1) / T);
      for(let tx=x0; tx<=x1; tx++){
        if(p.vy > 0 && kati(tx, y1)){ p.y = y1*T - p.h; p.vy = 0; p.yerde = true;
          const o = oz(tx, y1);
          if(o?.tur === "X" && !o.gitti){ o.gitti = true; p.yerde = false; try{ duelloTik(true); }catch(e){} }
          if(o?.tur === "F" && o.dus === 0) o.dus = 0.001;
          if(o?.tur === "I") o.gor = true;
          break; }
        if(p.vy < 0 && kati(tx, y0)){ p.y = (y0+1)*T; p.vy = 0; const o = oz(tx,y0); if(o?.tur==="I"){ o.gor = true; try{ duelloTik(true); }catch(e){} } break; }
      }
      const px = p.x + p.w/2, py = p.y + p.h/2;
      // ozel karolar
      ozel.forEach(o=>{
        const ox = (o.x+.5)*T, oy = (o.y+.5)*T;
        if(o.tur === "T" && !o.acik && Math.abs(ox - px) < T*1.8 && Math.abs(oy - py) < T*1.2){ o.acik = true; try{ duelloTik(true); }catch(e){} }
        if(o.tur === "C" && !o.acik && Math.abs(ox - px) < T*2.2 && Math.abs(oy - py) < T*2.5){ o.acik = true; try{ sesDavul(false); }catch(e){} }
        if(o.tur === "F" && o.dus > 0 && o.dus < 1) o.dus += 0.04;
        if(o.tur === "F" && o.dus >= 1) o.dy += T*0.02;
        if(o.tur === "V"){
          if(!o.acik && Math.abs(ox - px) < T*1.2 && py > oy){ o.acik = true; o.vy = T*0.25; }
          if(o.acik && !o.gitti){ o.dy += o.vy; o.vy += T*0.05;
            const sy = o.y*T + o.dy;
            if(sy + T > p.y + 4 && sy < p.y + p.h && Math.abs(ox - px) < T*0.75) ol("Tavana bakmadın, tavan sana baktı.");
            const alt = Math.floor((sy + T) / T);
            if(alt >= harita.length || kati(o.x, alt)){ o.gitti = true; parcacikEkle(O.parca, ox, sy + T, "#D8D8E8", 14, 4); }
          }
        }
        if(o.tur === "J" && !O.bitti && Math.abs(ox - px) < T*0.7 && p.y + p.h > o.y*T + T*0.45 && p.y + p.h <= (o.y+1)*T + 2){
          p.vy = -T * 0.52; p.yerde = false; try{ sesIkin(); }catch(e){} }
      });
      // kacan kapi
      const K = O.kacan;
      if(K && K.sira < (B.kac || []).length){
        if(Math.abs((K.x+.5)*T - px) < T*2.6 && Math.abs((K.y+.5)*T - py) < T*1.6){
          const [nx, ny] = B.kac[K.sira]; K.x = nx; K.y = ny; K.sira++;
          oyunMesaj(K.sira === 1 ? "Kapı kaçtı! Hah!" : "Yine kaçtı! Kovala bakalım!", 1400); try{ sesIkin(); }catch(e){}
        }
      }
      // sahte kapi
      const S2 = O.sahte;
      if(S2 && !S2.patladi && Math.abs((S2.x+.5)*T - px) < T*.6 && Math.abs((S2.y+.5)*T - py) < T*.8){
        S2.patladi = true; O.kesif.sahte = true; ol("Sahte kapı! Gerçeği yukarıda, yeni gördün değil mi?");
      }
      // diken kontrolu
      const degdi = (tx, ty) => { const ch = harita[ty]?.[tx]; const o = oz(tx, ty);
        return ch === "^" || ch === "v" || (o?.tur === "T" && o.acik); };
      for(let ty=Math.floor((p.y+5)/T); ty<=Math.floor((p.y+p.h-5)/T); ty++)
        for(let tx=Math.floor((p.x+5)/T); tx<=Math.floor((p.x+p.w-5)/T); tx++) if(degdi(tx,ty)) ol();
      if(p.y > tv.height) ol("Aşağısı da güzelmiş, değil mi?");
      // cikis
      let hedef = null;
      if(K) hedef = K.sira >= (B.kac || []).length ? K : null;
      else if(O.sahte) hedef = O.sahte.patladi ? O.cikis : null;
      else hedef = O.cikis;
      if(!O.bitti && hedef && Math.abs((hedef.x+.5)*T - px) < T*.6 && Math.abs((hedef.y+.5)*T - py) < T*.75){
        O.bitti = true; try{ sesSeviye(); }catch(e){}
        parcacikEkle(O.parca, px, py, "#FFE070", 44, 6);
        const sonraki = O.bolum + 1;
        oyunRekorYaz("tuzak", sonraki);
        localStorage.setItem("tuzakBolum", Math.min(sonraki, TUZAK_BOLUM.length - 1));
        setTimeout(()=>{
          if(sonraki >= TUZAK_BOLUM.length){
            localStorage.setItem("tuzakBolum", 0);
            oyunBitti("tuzak", TUZAK_BOLUM.length, "ZİNDANDAN ÇIKTIN!");
            const pr = document.getElementById("oPerde"); if(pr) pr.querySelector("span").textContent = `Toplam ${O.olum} ölüm. Bilge ilk kez sustu.`;
          }else { tuzakBasla(sonraki); }
        }, 900);
      }
    }
    // ---- cizim ----
    const g = c.createLinearGradient(0,0,0,tv.height); g.addColorStop(0,"#160A22"); g.addColorStop(1,"#070309");
    c.fillStyle = g; c.fillRect(0,0,tv.width,tv.height);
    c.fillStyle = "rgba(180,156,255,.05)";
    for(let k=0;k<6;k++) c.fillRect(((k*211 + O.kare*.2) % tv.width), 0, 2, tv.height);
    const tas = (x,y) => { c.fillStyle = "#3A2A40"; c.fillRect(x,y,T,T); c.fillStyle = "#4E3A56"; c.fillRect(x+2,y+2,T-4,T*.42);
      c.strokeStyle = "rgba(0,0,0,.45)"; c.lineWidth = 1; c.strokeRect(x+.5,y+.5,T-1,T-1); };
    const diken = (x,y,ters) => { c.fillStyle = "#D8D8E8"; c.shadowColor = "#FF5A6A"; c.shadowBlur = 8;
      for(let k=0;k<3;k++){ c.beginPath();
        if(ters){ c.moveTo(x+k*T/3, y); c.lineTo(x+k*T/3+T/6, y+T*.7); c.lineTo(x+(k+1)*T/3, y); }
        else { c.moveTo(x+k*T/3, y+T); c.lineTo(x+k*T/3+T/6, y+T*.3); c.lineTo(x+(k+1)*T/3, y+T); }
        c.fill(); } c.shadowBlur = 0; };
    harita.forEach((r,y)=>r.forEach((ch,x)=>{
      if(ch === "#") tas(x*T, y*T);
      if(ch === "^") diken(x*T, y*T, false);
      if(ch === "v") diken(x*T, y*T, true);
    }));
    ozel.forEach(o=>{
      const x = o.x*T, y = o.y*T;
      if(o.tur === "X" && !o.gitti) tas(x, y);
      if(o.tur === "I" && o.gor){ c.globalAlpha = .75; tas(x, y); c.globalAlpha = 1; c.strokeStyle = "#B49CFF"; c.strokeRect(x+1,y+1,T-2,T-2); }
      if(o.tur === "C" && o.acik){ tas(x, y); c.strokeStyle = "#FF5A6A"; c.lineWidth = 2; c.strokeRect(x+1,y+1,T-2,T-2); }
      if(o.tur === "T" && o.acik) diken(x, y, false);
      if(o.tur === "F"){ c.save(); c.translate(0, o.dy);
        c.fillStyle = o.dus > 0 ? "#6A3A2A" : "#4E3A56"; c.fillRect(x, y, T, T*.55);
        c.strokeStyle = "rgba(255,150,80,.55)"; c.lineWidth = 2; c.beginPath(); c.moveTo(x+T*.3,y); c.lineTo(x+T*.45,y+T*.5); c.stroke(); c.restore(); }
      if(o.tur === "V" && !o.gitti){ c.save(); c.translate(0, o.dy); diken(x, y, true); c.restore(); }
      if(o.tur === "J"){ c.fillStyle = "#FFD27A"; c.fillRect(x+T*.15, y+T*.72, T*.7, T*.14);
        c.strokeStyle = "#C9973E"; c.lineWidth = 3; c.beginPath();
        for(let k=0;k<4;k++){ c.lineTo(x+T*(.3+.4*(k%2)), y+T*(.86 + k*.035)); } c.stroke(); }
    });
    const kapi = (k, renk) => { const x = k.x*T, y = k.y*T;
      c.fillStyle = "#2A1A08"; c.fillRect(x + T*.12, y - T*.35, T*.76, T*1.35);
      c.strokeStyle = renk || "#FFD27A"; c.lineWidth = 3; c.shadowColor = renk || "#FFD27A"; c.shadowBlur = 14;
      c.strokeRect(x + T*.12, y - T*.35, T*.76, T*1.35); c.shadowBlur = 0;
      c.fillStyle = renk || "#FFD27A"; c.beginPath(); c.arc(x + T*.7, y + T*.35, T*.06, 0, 7); c.fill(); };
    if(O.kacan) kapi(O.kacan);
    if(O.sahte){ if(!O.sahte.patladi) kapi(O.sahte, "#FFD27A"); else { diken(O.sahte.x*T, O.sahte.y*T, false); } }
    if(O.cikis && !O.kacan && (!O.sahte || O.sahte.patladi)) kapi(O.cikis);
    if(O.ters){ c.fillStyle = "rgba(255,90,106,.08)"; c.fillRect(0,0,tv.width,tv.height); }
    if(!O.bitti || O.kare % 4 < 2){
      const p = O.p, sek = p.yerde && p.vx ? Math.abs(Math.sin(O.kare/3))*T*.08 : 0;
      c.fillStyle = "#E8C98A"; yuvarlakKare(c, p.x, p.y + p.h*.25 - sek, p.w, p.h*.75, 6); c.fill();
      c.fillStyle = "#F6E6C8"; c.beginPath(); c.arc(p.x + p.w/2, p.y + p.h*.22 - sek, p.w*.36, 0, 7); c.fill();
      c.fillStyle = "#1A0A06"; c.fillRect(p.x + p.w/2 + p.yon*p.w*.12 - 2, p.y + p.h*.18 - sek, 4, 4);
      c.fillStyle = "#C22A2A"; c.fillRect(p.x + p.w*.1, p.y + p.h*.5 - sek, p.w*.8, p.h*.1);
    }
    parcacikCiz(c, O.parca);
    O.raf = requestAnimationFrame(dongu);
  };
  OYUN.raf = requestAnimationFrame(dongu);
}

const KG = (a) => gv("kule/" + a);

function kresYukle(liste){ liste.forEach(a=>{ if(!KRES[a]){ const im = new Image(); im.src = KG(a); KRES[a] = im; } }); }
const kresCiz = (c, ad, x, y, boy, ters, aci) => {
  let im = KRES[ad];
  if(!im){ im = new Image(); im.src = KG(ad); KRES[ad] = im; }
  if(!im.complete || !im.naturalWidth) return false;
  const g = boy * im.naturalWidth / im.naturalHeight;
  c.save(); c.translate(x, y); if(aci) c.rotate(aci); if(ters) c.scale(-1, 1);
  c.drawImage(im, -g/2, -boy, g, boy); c.restore(); return true;
};

    O.mermi.push({ t:k.tip, x:k.x, y:k.y, hedef, h:sv.h, a:sv.a, y2:sv.y, tur:tip.zirhDeler ? "kutsal" : tip.tur,
      hiz:k.tip === "okcu" ? 11 : 8, zehir:sv.zehir, sifa:sv.sifa, dondur:sv.dondur });
    if(sv.sifa) O.asker.forEach(a=>{ if(a.olu <= 0 && Math.hypot(a.x-k.x, a.y-k.y) < sv.m) a.can = Math.min(a.max, a.can + a.max*.06); });
  });
  O.mermi.forEach(m=>{
    if(m.t === "ok"){ m.o -= dt*3; if(m.o <= 0) m.bitti = true; return; }
    const h = m.hedef; if(h.olmus && !m.a){ m.bitti = true; return; }
    const dx = h.x-m.x, dy = h.y-m.y, L = Math.hypot(dx,dy), ad = m.hiz*dt;
    if(L <= ad){ m.bitti = true;
      if(m.a){ O.efekt.push({ t:"patla", x:h.x, y:h.y, r:0, o:1, renk: m.t === "ates" ? "#FF7A3A" : "#C8C0B0" });
        O.dusman.forEach(d=>{ if(Math.hypot(d.x-h.x, d.y-h.y) <= m.a) kHasar(d, m.h, m.tur); }); }
      else { kHasar(h, m.h, m.tur);
        if(m.y2){ h.yavas = Math.max(h.yavas, m.y2); h.yavasT = 1.6; }
        if(m.zehir) h.zehir = { h:m.zehir, sure:4 };
        if(m.dondur && Math.random() < .25) h.sersem = 1.2; }
    }else { m.x += dx/L*ad; m.y += dy/L*ad; }
  });
  O.mermi = O.mermi.filter(m=>!m.bitti);
  O.dusman.forEach(d=>{ if(d.zehir){ kHasar(d, d.zehir.h*dt, "buyu"); d.zehir.sure -= dt; if(d.zehir.sure <= 0) d.zehir = null; } });
  O.efekt.forEach(f=>{ f.r += dt*3; f.o -= dt*1.5; }); O.efekt = O.efekt.filter(f=>f.o > 0);
  O.yazi.forEach(y2=>{ y2.y -= dt*.7; y2.o -= dt*.9; }); O.yazi = O.yazi.filter(y2=>y2.o > 0);
  if(O.kare % 8 === 0) kuleUi();
}

    if(!d.boss) kCanCubuk(c, X(d.x), Y(d.y) - S*d.boy*1.5 - yk, S*.62, d.can/d.max, d.elit);
  });
  // kahraman ve kurt
  const E = O.esas, K = O.kurt;
  if(K.olu <= 0) kresCiz(c, kahramanRes.kurt[Math.min(2, KO.lv-1)] + ".webp", X(K.x), Y(K.y) + S*.25, S*.85, E.hx < E.x);
  if(E.olu <= 0){

    if(E.kalkanT > 0){ c.strokeStyle = "rgba(156,245,196,.8)"; c.lineWidth = 4; c.beginPath(); c.arc(X(E.x), Y(E.y) - S*.4, S*.75, 0, 7); c.stroke(); }
    kresCiz(c, res + ".webp", X(E.x), Y(E.y) + S*.35, S*1.7, E.hx < E.x - .05);

  }else { c.fillStyle = "#9CF5C4"; c.font = `${S*.4}px Cinzel, serif`; c.textAlign = "center"; c.fillText("⟳" + Math.ceil(E.olu), X(E.x), Y(E.y)); }
  // mermiler
  O.mermi.forEach(m=>{

    if(m.t === "okcu"){ c.strokeStyle = "#F0DCA8"; c.lineWidth = 4; const a = Math.atan2(m.hedef.y-m.y, m.hedef.x-m.x);
      c.beginPath(); c.moveTo(X(m.x), Y(m.y)); c.lineTo(X(m.x)-Math.cos(a)*S*.3, Y(m.y)-Math.sin(a)*S*.3); c.stroke(); }
    if(m.t === "ates"){ c.fillStyle = "#FFB35A"; c.shadowColor = "#FF6A1A"; c.shadowBlur = 18; c.beginPath(); c.arc(X(m.x), Y(m.y), S*.14, 0, 7); c.fill(); c.shadowBlur = 0; }
    if(m.t === "isik"){ c.fillStyle = "#FFF3C8"; c.shadowColor = "#FFE9A8"; c.shadowBlur = 20; c.beginPath(); c.arc(X(m.x), Y(m.y), S*.12, 0, 7); c.fill(); c.shadowBlur = 0; }
    if(m.t === "buz"){ c.fillStyle = "#BFE6FF"; c.beginPath(); c.arc(X(m.x), Y(m.y), S*.12, 0, 7); c.fill(); }
    if(m.t === "mancinik"){ c.fillStyle = "#8A8290"; c.beginPath(); c.arc(X(m.x), Y(m.y), S*.18, 0, 7); c.fill(); }
  });
  O.efekt.forEach(f=>{ c.globalAlpha = Math.max(0, f.o);
    if(f.t === "patla"){ c.fillStyle = f.renk; c.beginPath(); c.arc(X(f.x), Y(f.y), S*(.2+f.r*.5), 0, 7); c.fill(); }
    if(f.t === "dalga"){ c.strokeStyle = f.renk || "#9CF5C4"; c.lineWidth = 7; c.beginPath(); c.arc(X(f.x), Y(f.y), S*f.r*1.1, 0, 7); c.stroke(); }
    if(f.t === "sifa"){ c.strokeStyle = "#9CF5C4"; c.lineWidth = 6; c.beginPath(); c.arc(X(f.x), Y(f.y), S*(1.6-f.r*.3), 0, 7); c.stroke(); }
  }); c.globalAlpha = 1;
  O.yazi.forEach(y2=>{ c.globalAlpha = Math.max(0, Math.min(1, y2.o)); c.font = `700 ${S*.3}px Cinzel, serif`; c.textAlign = "center";

function kCanCubuk(c, x, y, g, oran, altin){

}

/* ======== SANDIK TASI (sokoban) ======== */
const SANDIK_BOLUM = [
"####\n# .#\n#  ###\n#*@  #\n#  $ #\n#  ###\n####",
"######\n#    #\n# #@ #\n# $* #\n# .* #\n#    #\n######",
"  ####\n###  ####\n#     $ #\n# #  #$ #\n# . .#@ #\n#########",
"########\n#      #\n# .**$@#\n#      #\n#####  #\n    ####",
" #######\n #     #\n # .$. #\n## $@$ #\n#  .$. #\n#      #\n########",
"  #####\n###   #\n# $ # ##\n# #  . #\n#    # #\n## #   #\n #@  ###\n #####"
];

function sandikBasla(bolum){
  const tv = document.getElementById("oTuval"), c = tv.getContext("2d");
  const i = bolum ?? Math.min(+(localStorage.getItem("sandikBolum") || 0), SANDIK_BOLUM.length - 1);
  const satir = SANDIK_BOLUM[i].split("\n");
  const G3 = Math.max(...satir.map(r=>r.length)), Y3 = satir.length;
  const duvar = new Set(), hedef = new Set(), kutu = [];
  let oy = [0,0];
  satir.forEach((r,y)=>[...r].forEach((ch,x)=>{
    if(ch === "#") duvar.add(x+","+y);
    if(".*+".includes(ch)) hedef.add(x+","+y);
    if("$*".includes(ch)) kutu.push([x,y]);
    if("@+".includes(ch)) oy = [x,y];
  }));
  oyunDurdur();
  OYUN = { id:"sandik", bolum:i, duvar, hedef, kutu, oy, gecmis:[], hamle:0, G3, Y3, parca:[], kare:0, bitti:false, yon:[0,1] };
  document.getElementById("oSolBilgi").innerHTML = `BÖLÜM <b>${i+1}/${SANDIK_BOLUM.length}</b> · HAMLE <b id="oSkor">0</b>`;
  oyunMesaj(`${i+1}. BÖLÜM`, 1200);
  kaydirmaDinle(tv, (x,y)=>sandikHamle(x,y));
  OYUN.tus = e => { const m = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
    if(m){ e.preventDefault(); sandikHamle(...m); } if(e.key === "z") sandikGeri(); };
  document.addEventListener("keydown", OYUN.tus);

  const dongu = () => {
    if(!OYUN || OYUN.id !== "sandik") return;
    const O = OYUN; O.kare++;
    const K = Math.min(tv.width / O.G3, tv.height / O.Y3);
    const ox = (tv.width - K*O.G3)/2, oy2 = (tv.height - K*O.Y3)/2;
    c.fillStyle = "#0E0A08"; c.fillRect(0,0,tv.width,tv.height);
    for(let y=0;y<O.Y3;y++) for(let x=0;x<O.G3;x++){
      const px = ox + x*K, py = oy2 + y*K, a = x+","+y;
      if(O.duvar.has(a)){ c.fillStyle = "#3A2C22"; c.fillRect(px,py,K,K); c.fillStyle = "#4E3C2E"; c.fillRect(px+2,py+2,K-4,K*.45);
        c.strokeStyle = "rgba(0,0,0,.5)"; c.strokeRect(px+.5,py+.5,K-1,K-1); }
      else { c.fillStyle = (x+y)%2 ? "#1C1612" : "#221A14"; c.fillRect(px,py,K,K); }
      if(O.hedef.has(a)){ c.strokeStyle = `rgba(123,232,220,${.55 + Math.sin(O.kare/12)*.25})`; c.lineWidth = 3;
        c.shadowColor = "#7BE8DC"; c.shadowBlur = 16; c.beginPath(); c.arc(px+K/2, py+K/2, K*.26, 0, 7); c.stroke();
        c.beginPath(); c.moveTo(px+K/2, py+K*.3); c.lineTo(px+K/2, py+K*.7); c.moveTo(px+K*.3, py+K/2); c.lineTo(px+K*.7, py+K/2); c.stroke(); c.shadowBlur = 0; }
    }
    O.kutu.forEach(([x,y])=>{
      const px = ox + x*K, py = oy2 + y*K, yerinde = O.hedef.has(x+","+y);
      c.shadowColor = yerinde ? "#7BE8DC" : "transparent"; c.shadowBlur = yerinde ? 22 : 0;
      c.fillStyle = yerinde ? "#6A5020" : "#7A4A22"; yuvarlakKare(c, px+K*.1, py+K*.12, K*.8, K*.76, K*.1); c.fill(); c.shadowBlur = 0;
      c.fillStyle = yerinde ? "#FFE070" : "#C9973E"; c.fillRect(px+K*.1, py+K*.38, K*.8, K*.08); c.fillRect(px+K*.46, py+K*.12, K*.08, K*.76);
    });
    const [px, py] = [ox + O.oy[0]*K, oy2 + O.oy[1]*K];
    c.fillStyle = "#E8C98A"; yuvarlakKare(c, px+K*.22, py+K*.35, K*.56, K*.55, K*.12); c.fill();
    c.fillStyle = "#F6E6C8"; c.beginPath(); c.arc(px+K/2, py+K*.3, K*.2, 0, 7); c.fill();
    c.fillStyle = "#2A1A3E"; c.beginPath(); c.moveTo(px+K*.28, py+K*.22); c.lineTo(px+K*.5, py-K*.12); c.lineTo(px+K*.72, py+K*.22); c.fill();
    parcacikCiz(c, O.parca);
    O.raf = requestAnimationFrame(dongu);
  };
  OYUN.raf = requestAnimationFrame(dongu);
}
function sandikHamle(dx, dy){
  const O = OYUN; if(!O || O.id !== "sandik" || O.bitti) return;
  const n = [O.oy[0]+dx, O.oy[1]+dy];
  if(O.duvar.has(n.join(","))) return;
  const ki = O.kutu.findIndex(k=>k[0]===n[0] && k[1]===n[1]);
  if(ki >= 0){ const b = [n[0]+dx, n[1]+dy];
    if(O.duvar.has(b.join(",")) || O.kutu.some(k=>k[0]===b[0] && k[1]===b[1])) return;
    O.gecmis.push({ oy:O.oy.slice(), kutu:O.kutu.map(k=>k.slice()) });
    O.kutu[ki] = b; try{ duelloTik(O.hedef.has(b.join(","))); }catch(e){}
  }else O.gecmis.push({ oy:O.oy.slice(), kutu:O.kutu.map(k=>k.slice()) });
  O.oy = n; O.hamle++; oyunSkor(O.hamle);
  if(O.kutu.every(k=>O.hedef.has(k.join(",")))){
    O.bitti = true; try{ sesSeviye(); }catch(e){}
    const sonraki = O.bolum + 1;
    oyunRekorYaz("sandik", sonraki);
    localStorage.setItem("sandikBolum", Math.min(sonraki, SANDIK_BOLUM.length - 1));
    oyunMesaj(`BÖLÜM TAMAM · ${O.hamle} hamle`, 1600);
    setTimeout(()=>{
      if(sonraki >= SANDIK_BOLUM.length){ oyunBitti("sandik", SANDIK_BOLUM.length, "BÜTÜN RÜNLER YERİNDE!"); localStorage.setItem("sandikBolum", 0); }
      else sandikBasla(sonraki);
    }, 1400);
  }
}
function sandikGeri(){ const O = OYUN; if(!O || O.id !== "sandik" || !O.gecmis.length || O.bitti) return;
  const g = O.gecmis.pop(); O.oy = g.oy; O.kutu = g.kutu; O.hamle = Math.max(0, O.hamle - 1); oyunSkor(O.hamle); }
function sandikYeniden(){ if(OYUN?.id === "sandik") sandikBasla(OYUN.bolum); }

// davul ve seyirci sesleri: dosyasiz
function sesDavul(guclu){
  try{
    const a = sesKutusu(); if(!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(guclu ? 110 : 150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.35);
    g.gain.setValueAtTime(guclu ? 0.7 : 0.45, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.42);
  }catch(e){}
}
function sesSeyirci(){
  try{
    const a = sesKutusu(); if(!a) return;
    const t = a.currentTime, b = a.createBuffer(1, Math.floor(a.sampleRate*1.4), a.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<d.length;i++){ const z = i/d.length; d[i] = (Math.random()*2-1) * Math.sin(Math.PI*z) * 0.9; }
    const src = a.createBufferSource(); src.buffer = b;
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1100; f.Q.value = 0.6;
    const g = a.createGain(); g.gain.value = 0.22;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
  }catch(e){}
}
function duelloFlas(tur){
  const a = document.getElementById("duArena");
  if(!a) return;
  const f = document.createElement("div");
  f.className = "duFlas " + tur; a.appendChild(f);

}

             aktif:null, kilit:false, saat:null, tik:null, baslangic:0 };
  gezginSesKapa();
  const alan = document.getElementById("duAlan");
  const arena = document.getElementById("duArena");
  arena?.classList.remove("ates");
  melkorKonus("Düello başlasın! Bilge, yalanlarını hazırla.", "gezgin");
  for(const [yazi, guclu] of [["3",false],["2",false],["1",false],["DÜELLO!",true]]){
    if(!DUELLO || !alan) return;
    alan.innerHTML = `<div class="duSayac ${guclu?"son":""}">${yazi}</div>`;
    sesDavul(guclu);
    if(guclu){ duelloFlas("g"); sesSeyirci(); }

  }
  if(DUELLO) duelloTur();
}
function gezginSesKapa(){ try{ window.__melkorSes?.pause(); }catch(e){} }

function duelloTur(){
  if(!DUELLO) return;
  if(!DUELLO.kalan.length) DUELLO.kalan = DUELLO_IDDIA.slice().sort(()=>Math.random()-0.5);
  DUELLO.aktif = DUELLO.kalan.pop();
  DUELLO.kilit = false;
  const alan = document.getElementById("duAlan");
  if(!alan) return;
  alan.innerHTML = `
    <div class="duUst">
      <span class="duCan">${"❤".repeat(DUELLO.can)}<i>${"❤".repeat(3-DUELLO.can)}</i></span>
      <span class="duSeri ${DUELLO.seri>=3?"yan":""}">${DUELLO.seri>=3?"x"+(1+Math.floor(DUELLO.seri/3))+" SERİ":""}</span>
      <span class="duPuan">${DUELLO.puan}</span>
    </div>
    <div class="duFitil"><i id="duFitil"></i></div>
    <div class="duKart" id="duKart">
      <small>BİLGE DİYOR Kİ</small>

  duelloKaydir();

  // bilge iddiayi atarken parmagini kaldirir
  const bl = document.getElementById("duBilge");
  if(bl){ bl.src = gv(BILGE.parmak); bl.classList.remove("sars","gul"); }

  // fitil
  const f = document.getElementById("duFitil");
  DUELLO.baslangic = Date.now();
  if(f){
    f.style.transition = "none"; f.style.width = "100%"; void f.offsetWidth;
    f.style.transition = `width ${DUELLO.sure}ms linear`; f.style.width = "0%";
  }
  clearTimeout(DUELLO.saat); clearInterval(DUELLO.tik);
  DUELLO.saat = setTimeout(()=>duelloCevap(null), DUELLO.sure);
  DUELLO.tik = setInterval(()=>{
    const kalanMs = DUELLO.sure - (Date.now() - DUELLO.baslangic);
    if(kalanMs < 2200) duelloTik(kalanMs < 1000);
  }, 380);
}

function duelloTik(sert){
  try{
    const a = sesKutusu(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = "square"; o.frequency.value = sert ? 1320 : 880;
    g.gain.setValueAtTime(0.06, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.06);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.07);
  }catch(e){}
}

// karti kaydirarak cevap: saga gercek, sola yalan
function duelloKaydir(){
  const k = document.getElementById("duKart");
  if(!k) return;
  let bx = null;
  k.onpointerdown = e => { bx = e.clientX; k.setPointerCapture?.(e.pointerId); k.style.transition = "none"; };
  k.onpointermove = e => {
    if(bx == null) return;
    const dx = e.clientX - bx;
    k.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    k.classList.toggle("egilG", dx > 40); k.classList.toggle("egilY", dx < -40);
  };
  const birak = e => {
    if(bx == null) return;
    const dx = e.clientX - bx; bx = null;
    k.style.transition = ""; k.classList.remove("egilG","egilY");
    if(Math.abs(dx) > 90) duelloCevap(dx > 0);
    else k.style.transform = "";
  };
  k.onpointerup = birak; k.onpointercancel = birak;
}

function duelloCevap(secim){
  if(!DUELLO || DUELLO.kilit) return;
  DUELLO.kilit = true;
  clearTimeout(DUELLO.saat); clearInterval(DUELLO.tik);
  const dogru = secim !== null && secim === DUELLO.aktif.d;
  const kart = document.getElementById("duKart");
  const damga = document.getElementById("duDamga");
  const zb = document.getElementById("duZorba");
  const bl = document.getElementById("duBilge");
  const f = document.getElementById("duFitil");
  if(f){ const w = getComputedStyle(f).width; f.style.transition = "none"; f.style.width = w; }

  if(damga){
    damga.textContent = DUELLO.aktif.d ? "GERÇEK" : "YALAN";
    damga.className = "duDamga " + (DUELLO.aktif.d ? "g" : "y");
  }
  if(kart){
    kart.style.transform = "";
    kart.classList.add(dogru ? "iyi" : "kotu");
  }

  if(dogru){
    DUELLO.seri++;
    DUELLO.enSeri = Math.max(DUELLO.enSeri, DUELLO.seri);
    const carpan = 1 + Math.floor(DUELLO.seri / 3);
    const hizBonus = Math.max(0, Math.round((DUELLO.sure - (Date.now() - DUELLO.baslangic)) / 250));
    DUELLO.puan += 10 * carpan + hizBonus;
    DUELLO.sure = Math.max(2800, DUELLO.sure - 280);
    if(zb){ zb.src = gv("maskot-eller.png"); zb.classList.remove("vur"); void zb.offsetWidth; zb.classList.add("vur"); }
    setTimeout(()=>{
      try{ sesTekme(); }catch(e){}
      if(bl){ bl.src = gv(BILGE.dusun); bl.classList.remove("sars"); void bl.offsetWidth; bl.classList.add("sars"); }
    }, 260);
    duelloYazi(ZORBA_TOKAT[Math.floor(Math.random()*ZORBA_TOKAT.length)], "g");
    duelloFlas("g");
    document.getElementById("duArena")?.classList.toggle("ates", DUELLO.seri >= 3);
    if(DUELLO.seri % 3 === 0) sesSeyirci();
    if(DUELLO.seri > 0 && DUELLO.seri % 5 === 0) try{ sesSeviye(); }catch(e){}
  }else{
    DUELLO.can--;
    DUELLO.seri = 0;
    try{ sesIkin(); }catch(e){}
    if(bl){ bl.src = gv(BILGE.duz); bl.classList.remove("gul"); void bl.offsetWidth; bl.classList.add("gul"); }
    if(zb){ zb.classList.remove("uzgun"); void zb.offsetWidth; zb.classList.add("uzgun"); }
    const gulus = secim === null ? "Süre bitti! " + BILGE_GULUS[0] : BILGE_GULUS[Math.floor(Math.random()*BILGE_GULUS.length)];
    duelloYazi(gulus, "y");
    duelloFlas("y");
    document.getElementById("duArena")?.classList.remove("ates");
    if(Math.random() < 0.45) melkorKonus(gulus, "bilge");
  }

  setTimeout(()=>{
    if(zb){ zb.src = gv("maskot-duz.png"); zb.classList.remove("vur","uzgun"); }
    if(!DUELLO) return;
    if(DUELLO.can <= 0) duelloBitti(); else duelloTur();
  }, dogru ? 950 : 1500);
}

function duelloYazi(metin, tur){
  const a = document.getElementById("duArena");
  if(!a) return;
  const y = document.createElement("div");
  y.className = "duUcan " + tur;
  y.textContent = metin;
  a.appendChild(y);
  setTimeout(()=>y.remove(), 1400);
}

function duelloBitti(){
  const anahtar = duelloRekorAnahtar();
  const eski = +(localStorage.getItem(anahtar) || 0);
  const yeniRekor = DUELLO.puan > eski;
  if(yeniRekor) localStorage.setItem(anahtar, DUELLO.puan);
  const alan = document.getElementById("duAlan");
  if(alan) alan.innerHTML = `<div class="duSonuc ${yeniRekor?"rekor":""}">
      <b>${yeniRekor ? "YENİ REKOR!" : "DÜELLO BİTTİ"}</b>
      <div class="duSonucPuan">${DUELLO.puan}</div>
      <span>En uzun seri: ${DUELLO.enSeri} · Önceki rekor: ${eski}</span>
      <button class="duBasla" onclick="duelloBasla()">TEKRAR</button>
      <button class="btn ghost" style="margin-top:8px" onclick="go('ana')">Haritaya Dön</button>
    </div>`;
  melkorKonus(yeniRekor ? "Yeni rekor! Bilgeyi fena dövdük." : "Bilge bu sefer kazandı. Bir dahakine tokadı daha sert atarım.", "gezgin");
  DUELLO = null;
}

function yarismaKapat(){

  go("rehber");

function odulCiz(){

async function yarismaKameraAc(){
  try{
    const akis = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" }, audio:false });
    const kafa = document.getElementById("yKafa");
    if(!kafa) return;
    const v = document.createElement("video");
    v.autoplay = true; v.playsInline = true; v.muted = true; v.srcObject = akis;
    kafa.innerHTML = ""; kafa.appendChild(v);
    kafa.classList.add("kameraAcik");
    window.__yKameraAkis = akis;
    await yBalonYaz("İşte şimdi seni görüyorum. Suratından okuyacağım cevapları.");
  }catch(e){
    await yBalonYaz("Kamerayı vermedin. Saklanmak iyi taktiktir ama bana sökmez.");
  }
}

async function yarismaSoruAl(){
  const alan = document.getElementById("yAlan");
  if(!alan) return;
  alan.innerHTML = `<div class="ySoruKutu bekle"><div class="spin"></div><span>Soru hazırlanıyor…</span></div>`;
  const zorluk = Math.min(5, 1 + Math.floor(YARISMA.adim / 3));
  let veri = null, neden = "fonksiyona ulaşılamadı";
  for(const ad2 of ["rehber","swift-api"]){
    try{
      const { data, error } = await sb.functions.invoke(ad2, {
        body:{ mod:"yarisma", zorluk, sorulanlar: YARISMA.sorulanlar }
      });
      if(error){ neden = ad2 + ": " + (error.message || "çağrı hatası"); continue; }
      // cevap hangi bicimde gelirse gelsin oku
      const aday = data?.soruVerisi || data?.veri || (data?.soru && data?.siklar ? data : null);
      if(aday && Array.isArray(aday.siklar) && aday.siklar.length === 4 && typeof aday.dogru === "number"){
        veri = aday; break;
      }
      if(data?.hata) neden = data.hata;
    }catch(e){ neden = ad2 + ": " + (e.message || e); }
  }
  // yapay zeka olmazsa yerel bankadan, daha once sorulmamis bir soru
  if(!veri){
    console.log("yarisma yapay zeka:", neden);
    const kalan = YEREL_SORULAR.filter(q=>!YARISMA.sorulanlar.includes(q.soru.slice(0,60)));
    const havuz = kalan.length ? kalan : YEREL_SORULAR;
    veri = havuz[Math.floor(Math.random()*havuz.length)];
  }
  YARISMA.soruVerisi = veri;
  YARISMA.secilen = null; YARISMA.kilit = false; YARISMA.elenen = []; YARISMA.onaySayac = 0;
  YARISMA.sorulanlar.push(String(veri.soru).slice(0,60));
  yarismaCiz();
  await yarismaSoruOku();
}

async function yarismaSoruOku(){
  const v = YARISMA?.soruVerisi;
  if(!v) return;
  const harf = ["A","B","C","D"];
  await yBalonYaz(`${YARISMA.adim + 1}. soru, ${ODUL[YARISMA.adim]} lira. ${v.soru}`);
  for(let i = 0; i < v.siklar.length; i++){
    const b2 = document.querySelectorAll(".ySik")[i];
    b2?.classList.add("okunuyor");
    await yBalonYaz(`${harf[i]}: ${v.siklar[i]}`, true);
    b2?.classList.remove("okunuyor");
  }
}

function yarismaCiz(){
  const alan = document.getElementById("yAlan");
  const v = YARISMA?.soruVerisi;
  if(!alan || !v) return;
  const harf = ["A","B","C","D"];
  alan.innerHTML = `
    <div class="ySoruKutu"><b>${esc(v.soru)}</b></div>
    <div class="ySiklar">
      ${v.siklar.map((sk,i)=>`
        <button class="ySik ${YARISMA.elenen.includes(i)?"elendi":""} ${YARISMA.secilen===i?"secili":""}"
          ${YARISMA.elenen.includes(i)||YARISMA.kilit?"disabled":""}
          onclick="yarismaSec(${i})"><i>${harf[i]}</i><span>${esc(sk)}</span></button>`).join("")}
    </div>
    <div class="yJoker">
      <button ${YARISMA.jokerYari?"":"disabled"} onclick="jokerYari()">50:50</button>
      <button ${YARISMA.jokerTelefon?"":"disabled"} onclick="jokerTelefon()">TELEFON</button>
      <button ${YARISMA.jokerSeyirci?"":"disabled"} onclick="jokerSeyirci()">SEYİRCİ</button>
    </div>
    <div id="yOnay"></div>`;
}

async function yarismaSec(i){
  if(!YARISMA || YARISMA.kilit) return;
  YARISMA.secilen = i; YARISMA.onaySayac = 1;
  yarismaCiz();
  await yBalonYaz(`${["A","B","C","D"][i]} diyorsun. Emin misin?`);
  yarismaOnayKutusu();
}

function yarismaOnayKutusu(){
  const onay = document.getElementById("yOnay");
  if(!onay) return;
  onay.innerHTML = `<div class="yOnay">
      <button class="pri" onclick="yarismaOnay(true)">EVET</button>
      <button onclick="yarismaOnay(false)">HAYIR</button></div>`;
}

async function yarismaOnay(evet){
  const onay = document.getElementById("yOnay");
  if(onay) onay.innerHTML = "";
  if(!evet){
    YARISMA.secilen = null; YARISMA.onaySayac = 0;
    yarismaCiz();
    await yBalonYaz("İyi düşün. Acele eden kaybeder, o sözü de ben söylemiştim.");
    return;
  }
  if(YARISMA.onaySayac === 1){
    YARISMA.onaySayac = 2;
    await yBalonYaz("Son kararın mı?");
    yarismaOnayKutusu();
    return;
  }
  yarismaKilitle();
}

async function yarismaKilitle(){
  if(!YARISMA || YARISMA.kilit) return;
  YARISMA.kilit = true;
  yarismaCiz();
  document.querySelectorAll(".ySik")[YARISMA.secilen]?.classList.add("kilitli");
  await yBalonYaz("Kilitlendi.");
  seyirciTepki();
  await new Promise(r=>setTimeout(r, 1500));
  const dogru = YARISMA.soruVerisi.dogru;
  const kazandi = YARISMA.secilen === dogru;
  const harf = ["A","B","C","D"];
  document.querySelectorAll(".ySik").forEach((b2,i)=>{
    if(i === dogru) b2.classList.add("dogru");
    else if(i === YARISMA.secilen) b2.classList.add("yanlis");
  });
  if(kazandi){
    try{ sesSeviye(); }catch(e){}
    YARISMA.adim++; odulCiz(); seyirciTepki();
    await yBalonYaz(`Doğru! ${ODUL[Math.min(YARISMA.adim,ODUL.length-1)]} liralık soruya geçiyoruz.`);
    if(YARISMA.adim >= ODUL.length) return yarismaBitir(true);
    setTimeout(yarismaSoruAl, 700);
  }else{
    try{ sesTekme(); }catch(e){}
    await yBalonYaz(`Yanlış. Doğrusu ${harf[dogru]} idi. ${YARISMA.soruVerisi.aciklama || ""}`);
    setTimeout(()=>yarismaBitir(false), 700);
  }
}

function yarismaBitir(kazandi){
  const alan = document.getElementById("yAlan");
  if(!alan) return;
  const kazanc = YARISMA.adim > 0 ? ODUL[YARISMA.adim-1] : "0";
  alan.innerHTML = `<div class="ySonuc ${kazandi?"iyi":"kotu"}">
      <b>${kazandi ? "500 MİLYAR!" : "OYUN BİTTİ"}</b>
      <span>Kazandığın: ${kazanc} ₺ · ${YARISMA.adim} soru</span>
      <button class="btn" style="margin-top:14px" onclick="yarismaEkran()">Yeniden Oyna</button>
      <button class="btn ghost" style="margin-top:8px" onclick="yarismaKapat()">Rehber'e Dön</button>
    </div>`;
  yBalonYaz(kazandi ? "İnanamıyorum. Demek bir şeyler biliyormuşsun."
    : "Böyle bitti. Ben olsam bilirdim ama ben zaten her şeyi bilirim.");
}

async function jokerYari(){
  if(!YARISMA?.jokerYari || !YARISMA.soruVerisi) return;
  YARISMA.jokerYari = false;
  const dogru = YARISMA.soruVerisi.dogru;
  YARISMA.elenen = [0,1,2,3].filter(i=>i !== dogru).sort(()=>Math.random()-0.5).slice(0,2);
  yarismaCiz();
  await yBalonYaz("İki şıkkı sildim. Rica ederim, hep böyle cömertimdir.");
}

async function jokerSeyirci(){
  if(!YARISMA?.jokerSeyirci || !YARISMA.soruVerisi) return;
  YARISMA.jokerSeyirci = false;
  const dogru = YARISMA.soruVerisi.dogru;
  const oran = [0,0,0,0];
  let kalan = 100;
  const dogruPay = 44 + Math.floor(Math.random()*32);
  oran[dogru] = dogruPay; kalan -= dogruPay;
  [0,1,2,3].filter(i=>i!==dogru && !YARISMA.elenen.includes(i)).forEach((i,ix,dizi)=>{
    const p = ix === dizi.length-1 ? kalan : Math.floor(Math.random()*kalan);
    oran[i] = p; kalan -= p;
  });
  seyirciTepki(true);
  document.querySelectorAll(".ySik").forEach((b2,i)=>{
    if(YARISMA.elenen.includes(i)) return;
    const c = document.createElement("span");
    c.className = "yOran"; c.textContent = "%" + oran[i];
    b2.appendChild(c);
  });
  await yBalonYaz("Seyirci konuştu. Ama unutma, onlar da benim kadar akıllı değil.");
}

async function jokerTelefon(){
  if(!YARISMA?.jokerTelefon || !YARISMA.soruVerisi) return;
  YARISMA.jokerTelefon = false;
  await yBalonYaz("Telefon açılıyor. Kendimi arıyorum, başka kimi arayacaktım?");
  const harf = ["A","B","C","D"];
  const dogru = YARISMA.soruVerisi.dogru;
  const durust = Math.random() < 0.7;
  const tahmin = durust ? dogru : [0,1,2,3].filter(i=>i!==dogru)[Math.floor(Math.random()*3)];
  await yBalonYaz(durust ? `Bana kalırsa ${harf[tahmin]}. Eminim, çünkü bu soruyu ben yazdım.`
    : `Kesinlikle ${harf[tahmin]}. Güven bana, hiç yanılmadım.`);
}

function yBalonYaz(metin, kisa){
  const b2 = document.getElementById("yBalon");
  if(b2){ b2.textContent = metin; b2.classList.remove("yaz"); void b2.offsetWidth; b2.classList.add("yaz"); }
  const s2 = document.getElementById("sunucu");
  if(s2){
    s2.src = gv("maskot-konus.png");
    clearTimeout(window.__yPoz);
    window.__yPoz = setTimeout(()=>{ s2.src = gv("maskot-duz.png"); }, Math.min(9000, 1500 + metin.length*60));
  }
  return melkorKonus(metin).then(()=>new Promise(r=>setTimeout(r, kisa ? 150 : 400)));
}

function seyirciTepki(el){
  document.querySelectorAll("#seyirci .kafa").forEach(k=>{
    k.classList.remove("alkis","elKaldir"); void k.offsetWidth;
    k.classList.add(el ? "elKaldir" : "alkis");
    setTimeout(()=>k.classList.remove("alkis","elKaldir"), 2200);
  });
}

function sahneBaslat(){
  document.getElementById("tBaslangic")?.remove();
  const t = document.getElementById("tiyatro");
  t?.classList.add("acik");
  setTimeout(()=>{ document.getElementById("tBilge")?.classList.add("sahnede"); }, 900);
  setTimeout(sahneSonraki, 1700);
}

function sahneSonraki(){
  if(!SAHNE || SAHNE.bitti) return;
  SAHNE.i++;
  if(SAHNE.i >= SAHNE1.length) return sahneBitir();
  const p = SAHNE1[SAHNE.i];
  const kim = p.s, el = document.getElementById(kim === "bilge" ? "tBilge" : "tKahraman");
  const oteki = document.getElementById(kim === "bilge" ? "tKahraman" : "tBilge");
  const t = document.getElementById("tiyatro");
  if(p.giris && el){ el.classList.add("sahnede","girisYap"); try{ sesDavul(true); }catch(e){} setTimeout(()=>el.classList.remove("girisYap"), 900); }
  if(el) el.classList.add("konusan"); if(oteki) oteki.classList.remove("konusan");
  const ad = document.getElementById("tAd");
  if(ad){ ad.textContent = kim === "bilge" ? "BİLGE" : "ESAS OĞLAN"; ad.className = "tAd " + kim;
    ad.classList.remove("yeni"); void ad.offsetWidth; ad.classList.add("yeni"); }
  const cub = document.getElementById("tCubuk");
  if(cub) cub.style.width = ((SAHNE.i + 1) / SAHNE1.length * 100) + "%";

  // poz dongusu: konusurken vucut dili degissin
  let k = 0;
  const pozVer = () => { if(el) el.src = gv(SAHNE_RES[kim][p.poz[k % p.poz.length]] || SAHNE_RES[kim].duz); k++; };
  pozVer();
  clearInterval(SAHNE.pozSaat);
  SAHNE.pozSaat = setInterval(pozVer, 1500 + Math.random()*700);

  try{ SAHNE.ses?.pause(); }catch(e){}
  const a = new Audio(gv(`cark/sahne-1-${kim}-${p.n}.mp3`));
  SAHNE.ses = a;
  const devam = () => { clearInterval(SAHNE.pozSaat);
    if(el) el.src = gv(SAHNE_RES[kim].duz);
    setTimeout(sahneSonraki, 420); };
  a.onended = devam;
  a.onerror = () => setTimeout(devam, 2500);
  a.play().catch(()=>setTimeout(devam, 2500));
}

  if(!SAHNE || SAHNE.bitti) return;

async function yedekVerisi(bildir){
  const paket = { surum: SURUM, tarih: new Date().toISOString(), ekip: ME.team_id, tablolar: {} };
  for(const t of YEDEK_TABLOLAR){
    if(bildir) bildir(`${t} okunuyor…`);
    try{
      const { data, error } = await sb.from(t).select("*");
      if(!error && data) paket.tablolar[t] = data;
    }catch(e){}
  }
  return paket;
}

function yedekDosyaAdi(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `parselparsel-yedek-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}

async function yedekAl(){
  const kutu = document.getElementById("yedekDurum");
  const yaz = t => { if(kutu) kutu.textContent = t; };
  yaz("Hazırlanıyor…");
  try{
    const paket = await yedekVerisi(yaz);
    const metin = JSON.stringify(paket);
    const bl = new Blob([metin], { type:"application/json" });
    const u = URL.createObjectURL(bl);
    const a = document.createElement("a");
    a.href = u; a.download = yedekDosyaAdi(); a.click();
    setTimeout(()=>URL.revokeObjectURL(u), 5000);
    localStorage.setItem("sonYedek", new Date().toISOString());
    const kayit = Object.values(paket.tablolar).reduce((t,d)=>t + d.length, 0);
    yaz(`Hazır · ${nf(kayit)} kayıt · ${boyut(bl.size)}`);
    toast("Yedek indirildi");
  }catch(e){ yaz("Olmadı: " + (e.message||e)); }
}

async function yedekPaylas(){
  const kutu = document.getElementById("yedekDurum");
  const yaz = t => { if(kutu) kutu.textContent = t; };
  yaz("Hazırlanıyor…");
  try{
    const paket = await yedekVerisi(yaz);
    const bl = new Blob([JSON.stringify(paket)], { type:"application/json" });
    const f = new File([bl], yedekDosyaAdi(), { type:"application/json" });
    localStorage.setItem("sonYedek", new Date().toISOString());
    yaz(`Hazır · ${boyut(bl.size)}`);
    if(navigator.canShare && navigator.canShare({ files:[f] })){
      await navigator.share({ files:[f], title:"Parsel Parsel yedeği" });
    }else{
      const u = URL.createObjectURL(bl);
      const a = document.createElement("a"); a.href = u; a.download = f.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(u), 5000);
      toast("Paylaşım desteklenmiyor, indirildi");
    }
  }catch(e){ if(e.name !== "AbortError") yaz("Olmadı: " + (e.message||e)); }
}

async function belgeListesiIndir(){
  try{
    const { data } = await sb.from("documents").select("kind,file_name,file_path,created_at,parcel_id");
    const satirlar = ["tür;dosya;yol;tarih;parsel"].concat(
      (data||[]).map(o=>[o.kind, o.file_name, o.file_path,
        o.created_at ? new Date(o.created_at).toLocaleDateString("tr-TR") : "", o.parcel_id].join(";")));
    const bl = new Blob(["\ufeff" + satirlar.join("\n")], { type:"text/csv;charset=utf-8" });
    const u = URL.createObjectURL(bl);
    const a = document.createElement("a");
    a.href = u; a.download = "belge-listesi.csv"; a.click();
    setTimeout(()=>URL.revokeObjectURL(u), 5000);
    toast(`${(data||[]).length} belge listelendi`);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

async function yedektenYukle(){
  const f = await dosyaSec("application/json,.json");
  if(!f) return;
  if(!confirm("Yedekteki kayıtlar geri yazılacak. Devam edilsin mi?")) return;
  const kutu = document.getElementById("yedekDurum");
  const yaz = t => { if(kutu) kutu.textContent = t; };
  try{
    const paket = JSON.parse(await f.text());
    if(!paket?.tablolar) return toast("Bu dosya yedek değil");
    let toplam = 0;
    for(const t of YEDEK_TABLOLAR){
      const satir = paket.tablolar[t];
      if(!satir?.length) continue;
      yaz(`${t} yazılıyor…`);
      for(let i = 0; i < satir.length; i += 100){
        const { error } = await sb.from(t).upsert(satir.slice(i, i+100), { onConflict:"id" });
        if(error){ yaz(`${t}: ${error.message}`); break; }
      }
      toplam += satir.length;
    }
    yaz(`Bitti · ${nf(toplam)} kayıt yazıldı`);
    toast("Geri yükleme tamam");
  }catch(e){ yaz("Olmadı: " + (e.message||e)); }
}

// ---------- kamera: kaydirma, yakinlastirma, ucus ----------
const KAMERA = { x:0, y:0, olcek:1, min:1, max:2.6 };

function haritaKur(){
  const kap = document.getElementById("hKap");
  const dunya = document.getElementById("hDunya");
  const img = document.getElementById("hResim");
  if(!kap || !dunya || !img) return;

  const hazir = () => {
    // dunya genisligi = ekran genisligi, yukseklik resmin oraninda
    const G = kap.clientWidth;
    const Y = G * (img.naturalHeight / img.naturalWidth || 1672/941);
    dunya.style.width = G + "px";
    dunya.style.height = Y + "px";
    KAMERA.min = Math.max(1, kap.clientHeight / Y);
    KAMERA.olcek = Math.max(KAMERA.min, 1);
    haritaUc(50, 43, KAMERA.olcek, false);
  };
  if(img.complete && img.naturalWidth) hazir(); else img.onload = hazir;

  // ---- dokunma: tek parmak kaydir, iki parmak yakinlastir ----
  const parmaklar = new Map();
  let bas = null;
  let uzunBas = null;
  kap.onpointerdown = e => {
    kap.setPointerCapture?.(e.pointerId);
    parmaklar.set(e.pointerId, { x:e.clientX, y:e.clientY });
    // uzun basma: maskot oraya yurusun
    clearTimeout(uzunBas);
    if(parmaklar.size === 1 && !e.target.closest(".hNokta,.hGezgin")){
      const bx = e.clientX, by = e.clientY;
      uzunBas = setTimeout(()=>{
        const r = kap.getBoundingClientRect();
        const px = ((bx - r.left - KAMERA.x) / KAMERA.olcek) / dunya.offsetWidth * 100;
        const py = ((by - r.top - KAMERA.y) / KAMERA.olcek) / dunya.offsetHeight * 100;
        if(px > 2 && px < 98 && py > 5 && py < 97) gezginOrayaGit(px, py);
        uzunBas = null;
      }, 650);
    }
    dunya.style.transition = "none";
    if(parmaklar.size === 1) bas = { x:e.clientX, y:e.clientY, kx:KAMERA.x, ky:KAMERA.y };
    if(parmaklar.size === 2){
      const [a,b2] = [...parmaklar.values()];
      bas = { mesafe:Math.hypot(a.x-b2.x, a.y-b2.y), olcek:KAMERA.olcek,
              ox:(a.x+b2.x)/2, oy:(a.y+b2.y)/2, kx:KAMERA.x, ky:KAMERA.y };
    }
  };
  kap.onpointermove = e => {
    if(!parmaklar.has(e.pointerId) || !bas) return;
    const onceki = parmaklar.get(e.pointerId);
    if(onceki && Math.hypot(e.clientX - onceki.x, e.clientY - onceki.y) > 6){ clearTimeout(uzunBas); }
    parmaklar.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(parmaklar.size === 1 && bas.kx != null && bas.mesafe == null){
      KAMERA.x = bas.kx + (e.clientX - bas.x);
      KAMERA.y = bas.ky + (e.clientY - bas.y);
    }else if(parmaklar.size === 2 && bas.mesafe){
      const [a,b2] = [...parmaklar.values()];
      const m = Math.hypot(a.x-b2.x, a.y-b2.y);
      const yeni = Math.min(KAMERA.max, Math.max(KAMERA.min, bas.olcek * m / bas.mesafe));
      const r = kap.getBoundingClientRect();
      const ox = bas.ox - r.left, oy = bas.oy - r.top;
      // parmaklarin ortasi sabit kalsin
      KAMERA.x = ox - (ox - bas.kx) * (yeni / bas.olcek);
      KAMERA.y = oy - (oy - bas.ky) * (yeni / bas.olcek);
      KAMERA.olcek = yeni;
    }
    haritaSinirla(); haritaUygula();
  };
  const birak = e => {
    clearTimeout(uzunBas);
    parmaklar.delete(e.pointerId);
    if(parmaklar.size === 1){
      const [a] = [...parmaklar.values()];
      bas = { x:a.x, y:a.y, kx:KAMERA.x, ky:KAMERA.y };
    }else if(!parmaklar.size) bas = null;
  };
  kap.onpointerup = birak; kap.onpointercancel = birak;

  // cift dokunusla yakinlas
  let sonDokunus = 0;
  kap.addEventListener("click", e => {
    const simdi = Date.now();
    if(simdi - sonDokunus < 300){
      const r = kap.getBoundingClientRect();
      const px = ((e.clientX - r.left - KAMERA.x) / KAMERA.olcek) / dunya.offsetWidth * 100;
      const py = ((e.clientY - r.top - KAMERA.y) / KAMERA.olcek) / dunya.offsetHeight * 100;
      haritaUc(px, py, KAMERA.olcek < 1.6 ? 2 : KAMERA.min, true);
    }
    sonDokunus = simdi;
  });

  haritaAtmosfer();
  if(localStorage.getItem("maceraBasla") === "1"){
    localStorage.removeItem("maceraBasla");
    setTimeout(maceraKosusu, 500);
  }else gezginDongu();
}

function haritaSinirla(){
  const kap = document.getElementById("hKap");
  const dunya = document.getElementById("hDunya");
  if(!kap || !dunya) return;
  const G = dunya.offsetWidth * KAMERA.olcek, Y = dunya.offsetHeight * KAMERA.olcek;
  const KG = kap.clientWidth, KY = kap.clientHeight;
  KAMERA.x = G <= KG ? (KG - G)/2 : Math.min(0, Math.max(KG - G, KAMERA.x));
  KAMERA.y = Y <= KY ? (KY - Y)/2 : Math.min(0, Math.max(KY - Y, KAMERA.y));
}

function haritaUygula(){
  const dunya = document.getElementById("hDunya");
  if(dunya) dunya.style.transform = `translate(${KAMERA.x}px,${KAMERA.y}px) scale(${KAMERA.olcek})`;

  document.getElementById("hKap")?.classList.toggle("yakin", KAMERA.olcek > 1.35);
}

// kamerayi yuzde koordinata uc
function haritaUc(px, py, olcek, animasyon){
  const kap = document.getElementById("hKap");
  const dunya = document.getElementById("hDunya");
  if(!kap || !dunya) return;
  KAMERA.olcek = Math.min(KAMERA.max, Math.max(KAMERA.min, olcek || KAMERA.olcek));
  const hx = dunya.offsetWidth * px/100 * KAMERA.olcek;
  const hy = dunya.offsetHeight * py/100 * KAMERA.olcek;
  KAMERA.x = kap.clientWidth/2 - hx;
  KAMERA.y = kap.clientHeight/2 - hy;
  haritaSinirla();
  dunya.style.transition = animasyon ? "transform .75s cubic-bezier(.22,1,.36,1)" : "none";
  haritaUygula();
}

// ---- Melkor sesleri: dosya gerekmez, anlik uretilir ----
const SES_ACIK = () => localStorage.getItem("sesKapali") !== "1";
let SESKUTU = null;
function sesKutusu(){
  if(!SES_ACIK()) return null;
  try{
    SESKUTU = SESKUTU || new (window.AudioContext || window.webkitAudioContext)();
    if(SESKUTU.state === "suspended") SESKUTU.resume();
    return SESKUTU;
  }catch(e){ return null; }
}

// ikinma: inip cikan titrek uguldama
function sesIkin(){
  const a = sesKutusu(); if(!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(90, t);
  o.frequency.exponentialRampToValueAtTime(190, t+0.28);
  o.frequency.exponentialRampToValueAtTime(70, t+0.52);
  f.type = "lowpass"; f.frequency.setValueAtTime(900, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.26, t+0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.55);
  o.connect(f); f.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+0.6);
  const lfo = a.createOscillator(), lg = a.createGain();
  lfo.frequency.value = 17; lg.gain.value = 26;
  lfo.connect(lg); lg.connect(o.frequency);
  lfo.start(t); lfo.stop(t+0.55);
}

// tekme carpmasi
function sesTekme(){
  const a = sesKutusu(); if(!a) return;
  const t = a.currentTime;
  const b = a.createBuffer(1, Math.floor(a.sampleRate*0.2), a.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3);
  const src = a.createBufferSource(); src.buffer = b;
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420;
  const g = a.createGain(); g.gain.value = 0.5;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t);
}

// seviye atlama ezgisi
function sesSeviye(){
  const a = sesKutusu(); if(!a) return;
  const t = a.currentTime;
  [[523.25,0],[659.25,.1],[783.99,.2],[1046.5,.3],[1318.5,.44]].forEach(([hz,gec],i)=>{
    const o = a.createOscillator(), g = a.createGain();
    o.type = i === 4 ? "triangle" : "square";
    o.frequency.value = hz;
    const b2 = t + gec;
    g.gain.setValueAtTime(0.0001, b2);
    g.gain.exponentialRampToValueAtTime(0.2, b2+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, b2 + (i===4 ? 0.7 : 0.16));
    o.connect(g); g.connect(a.destination);
    o.start(b2); o.stop(b2 + (i===4 ? 0.75 : 0.2));
  });
}

// maskot menuye seke seke gider ve tekme atar
function maskotTekme(kart){
  return new Promise(cozum=>{
    const k = document.getElementById("maskot");
    if(!k || !MASKOT || !kart) return cozum();
    const hedef = kart.getBoundingClientRect();
    const gen = k.offsetWidth || 126, boy = k.offsetHeight || 180;
    const varisX = Math.max(4, Math.min(window.innerWidth - gen - 4,
      hedef.left + hedef.width/2 - gen/2));
    const varisY = Math.max(70, Math.min(window.innerHeight - boy - 10,
      hedef.top + hedef.height/2 - boy/2));

    const mesafe = Math.hypot(varisX - MASKOT.x, varisY - MASKOT.y);
    const sure = Math.min(850, Math.max(280, mesafe * 2.4));

    k.classList.toggle("ters", varisX < MASKOT.x);
    k.classList.add("yuru");
    k.style.transition = `left ${sure}ms cubic-bezier(.3,.7,.4,1), top ${sure}ms cubic-bezier(.3,.7,.4,1)`;
    MASKOT.x = varisX; MASKOT.y = varisY;
    MASKOT.sonHareket = Date.now();
    maskotYerlestir();

    setTimeout(()=>{
      k.classList.remove("yuru");
      k.style.transition = "";
      maskotPoz("eller");
      sesIkin();
      k.classList.add("tekme");
      setTimeout(()=>{
        sesTekme();
        kart.classList.add("sarsil");
        setTimeout(()=>kart.classList.remove("sarsil"), 420);
      }, 200);
      setTimeout(()=>{
        k.classList.remove("tekme");
        maskotPoz("duz");
        cozum();
      }, 580);
    }, sure + 60);
  });
}

async function melkorAcIc(el, ekran, slug, zorla){
  if(!el || el.classList.contains("acilan") || window.__melkorMesgul) return;
  window.__melkorMesgul = true;
  try{ await maskotTekme(el); }catch(e){}
  try{ await seviyeAtla(); }catch(e){}
  window.__melkorMesgul = false;

  // video daha once izlendiyse dogrudan gec
  if(!zorla && window.__melkorIzlenen[slug]){ go(ekran); return; }
  window.__melkorIzlenen[slug] = true;

  // kart hangi yapida olursa olsun gorseli ve adi bul
  const gEl = el.querySelector(".dGorsel, .mGorsel");
  const kartGorsel = gEl ? (gEl.style.backgroundImage || "").replace(/^url\(["']?|["']?\)$/g, "") : "";
  const kartAdi = (el.querySelector(".dAlt b, .mYazi b")?.textContent || "").trim();

  const kutu = el.getBoundingClientRect();

  const perde = document.createElement("div");
  perde.className = "mPerde";
  perde.dataset.canli = "1";
  document.body.appendChild(perde);

  const kopya = document.createElement("div");
  kopya.className = "mAcilan";
  kopya.dataset.canli = "1";
  kopya.style.cssText = `left:${kutu.left}px;top:${kutu.top}px;width:${kutu.width}px;height:${kutu.height}px`;
  kopya.innerHTML = `
    <div class="mGorsel" style="background-image:url('${kartGorsel}')"></div>
    <video playsinline autoplay muted="false" onerror="this.style.display='none'">
      <source src="${gv("melkor-" + slug + ".mp4")}" type="video/mp4"></video>
    <div class="mYazi"><b>${esc(kartAdi)}</b></div>
    <span class="mCerceve"></span>`;
  document.body.appendChild(kopya);

  // hedef olcu: ekrani kaplamaz, menunun buyumus hali
  const G = Math.min(window.innerWidth * 0.86, 430);
  let Y = Math.min(window.innerHeight * 0.62, G * 1.05);
  requestAnimationFrame(()=>{
    perde.classList.add("acik");
    kopya.classList.add("buyu");
    kopya.style.left = ((window.innerWidth - G)/2) + "px";
    kopya.style.top = ((window.innerHeight - Y)/2) + "px";
    kopya.style.width = G + "px";
    kopya.style.height = Y + "px";
  });

  let bitti = false;
  const kapat = () => {
    if(bitti) return;
    bitti = true;
    clearTimeout(emniyet); clearTimeout(window.__melkorEmniyet);
    kopya.classList.add("cik");
    perde.classList.add("cik");
    delete kopya.dataset.canli; delete perde.dataset.canli;
    setTimeout(()=>{ kopya.remove(); perde.remove(); }, 420);
    go(ekran);
  };
  // once guvenlik zamanlayicisi: ne olursa olsun ekran acilir
  let emniyet = setTimeout(kapat, 4200);
  perde.addEventListener("click", kapat);
  kopya.addEventListener("click", kapat);

  try{
    const v = kopya.querySelector("video");
    if(v){
      v.volume = SES_ACIK() ? 0.85 : 0;
      v.muted = !SES_ACIK();
      // kutuyu videonun oranina uydur: siyah bosluk ya da tasma olmasin
      v.addEventListener("loadedmetadata", ()=>{
        if(!v.videoWidth || !v.videoHeight) return;
        const oran = v.videoHeight / v.videoWidth;
        const yeniY = Math.min(window.innerHeight * 0.74, G * oran);
        kopya.style.height = yeniY + "px";
        kopya.style.top = ((window.innerHeight - yeniY)/2) + "px";
        // videonun kendi suresi kadar bekle, erken kesme
        const sure = isFinite(v.duration) ? v.duration : 4;
        clearTimeout(emniyet);
        window.__melkorEmniyet = setTimeout(kapat, (sure + 0.6) * 1000);
      });
      v.addEventListener("ended", kapat);
      // dosya yoksa kaynak hatasi verir: hemen gec
      v.addEventListener("error", ()=>{ clearTimeout(emniyet); clearTimeout(window.__melkorEmniyet);
        setTimeout(kapat, 450); }, true);
      const kaynak = v.querySelector("source");
      if(kaynak) kaynak.addEventListener("error", ()=>{ clearTimeout(emniyet);
        clearTimeout(window.__melkorEmniyet); setTimeout(kapat, 450); });
      v.play().catch(()=>{ v.muted = true; v.play().catch(()=>{}); });
    }else{
      clearTimeout(emniyet);
      setTimeout(kapat, 700);
    }
  }catch(e){
    clearTimeout(emniyet);
    setTimeout(kapat, 300);
  }
}
