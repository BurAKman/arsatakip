<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F0D">
<title>ArsaTakip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#F2EFE8; --ink-2:#B9C2BB; --ink-3:#7E8A84;
  --gold:#E3C05A; --gold-soft:rgba(227,192,90,.16);
  --green:#5FD79A; --green-soft:rgba(95,215,154,.16);
  --red:#F0705C; --red-soft:rgba(240,112,92,.16);
  --blue:#6FB0F5; --blue-soft:rgba(111,176,245,.16);
  --cam:rgba(255,255,255,.065);
  --cam-2:rgba(255,255,255,.10);
  --cizgi:rgba(255,255,255,.13);
  --cizgi-2:rgba(255,255,255,.22);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);
  font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
  background:
    radial-gradient(900px 620px at 78% -8%, rgba(95,215,154,.13), transparent 60%),
    radial-gradient(760px 520px at 8% 12%, rgba(111,176,245,.10), transparent 62%),
    radial-gradient(700px 700px at 50% 108%, rgba(227,192,90,.07), transparent 60%),
    #070A09;
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:62px 62px;
}
.wrap{position:relative;max-width:520px;margin:0 auto;padding:0 15px 52px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold);text-decoration:none}
.hide{display:none!important}

/* ---- ust bar ---- */
.top{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.top h1{font-size:19px;flex:1}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,rgba(95,215,154,.32),rgba(227,192,90,.20));
  border:1px solid var(--cizgi-2);display:grid;place-items:center;flex:0 0 auto}
.logo .mark svg{width:19px;height:19px;stroke:var(--green);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo b{font-size:18px;font-weight:700;letter-spacing:-.025em;display:block;line-height:1.1}
.logo span{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);display:block;margin-top:1px}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--cizgi-2);background:var(--cam);
  display:grid;place-items:center;flex:0 0 auto;color:var(--ink);backdrop-filter:blur(10px)}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.ak{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34)}
.ibtn.cik{color:var(--red);background:var(--red-soft);border-color:rgba(240,112,92,.42)}
.ibtn.geri{font-size:20px;line-height:1}
.zaman{text-align:right;font-size:11px;color:var(--ink-3);margin:0 2px 10px;font-family:"IBM Plex Mono",monospace}

/* ---- kur ---- */
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 16px}
.rate{background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.30);border-radius:12px;padding:8px 9px;min-width:0;backdrop-filter:blur(14px)}
.rate .v{color:#fff}
.rate .k{font-size:9.5px;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate .v{font-size:12.5px;font-weight:600;margin-top:2px;font-family:"IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- kategori kartlari ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:var(--r);padding:16px 14px;text-align:left;position:relative;overflow:hidden;
  border:1px solid var(--cizgi-2);backdrop-filter:blur(14px);transition:transform .16s,filter .16s;
  background:linear-gradient(155deg,rgba(255,255,255,.13),rgba(255,255,255,.045))}
.tile:active{transform:scale(.98);filter:brightness(1.15)}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2)}
.tile .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15px;font-weight:600;color:#fff}
.tile small{display:block;font-size:12px;color:rgba(255,255,255,.62);margin-top:2px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.tile.wide .ic{margin:0}
.tile.kirmizi{background:linear-gradient(155deg,rgba(240,112,92,.30),rgba(240,112,92,.09));border-color:rgba(240,112,92,.42)}
.tile.kirmizi .ic{color:#FFC9BF}
.tile.yesil{background:linear-gradient(155deg,rgba(95,215,154,.30),rgba(95,215,154,.09));border-color:rgba(95,215,154,.42)}
.tile.yesil .ic{color:#C4F5DC}
.tile.gri{background:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,.055));border-color:rgba(255,255,255,.28)}
.tile.gri .ic{color:#fff}
.tile.mavi{background:linear-gradient(155deg,rgba(111,176,245,.30),rgba(111,176,245,.09));border-color:rgba(111,176,245,.42)}
.tile.mavi .ic{color:#CFE6FF}
.tile.sari{background:linear-gradient(155deg,rgba(227,192,90,.28),rgba(227,192,90,.08));border-color:rgba(227,192,90,.42)}
.tile.sari .ic{color:#F6E3AA}
.tile.soon::after{content:"yakında";position:absolute;top:12px;right:12px;font-size:10px;color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:2px 8px}

/* ---- form ---- */
label{display:block;font-size:12px;color:var(--ink-2);margin:0 0 6px}
input,select,textarea{
  width:100%;background:rgba(255,255,255,.07);border:1px solid var(--cizgi);border-radius:12px;
  padding:12px 13px;outline:none;transition:border-color .15s,background .15s;backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#101614;color:var(--ink)}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;background:linear-gradient(160deg,#F0D278,#D9B248);color:#1A1403;font-weight:700;
  border-radius:13px;padding:14px;text-align:center;letter-spacing:-.01em;border:1px solid rgba(255,255,255,.25)}
.btn:active{filter:brightness(1.08)}
.btn.ghost{background:var(--cam-2);color:#fff;border:1px solid var(--cizgi-2);font-weight:600}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(240,112,92,.4)}
.btn[disabled]{opacity:.55}

/* ---- listeler / kartlar ---- */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.year{border:1px solid var(--cizgi-2);border-radius:22px;padding:8px 15px;font-size:13px;background:var(--cam);width:auto;min-width:98px}
.search{flex:1}
.card{background:var(--cam);border:1px solid var(--cizgi);border-radius:var(--r);padding:15px;margin-bottom:11px;backdrop-filter:blur(14px)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px}
.kv span{color:var(--ink-2);flex:0 0 auto}
.kv b{text-align:right;min-width:0}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.grp{margin-bottom:11px;border:1px solid var(--cizgi);border-radius:var(--r);background:var(--cam);overflow:hidden;backdrop-filter:blur(14px)}
.ghd{display:flex;align-items:center;gap:11px;padding:15px 14px;width:100%;text-align:left}
.ghd .pinico{width:33px;height:33px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:0 0 auto;border:1px solid rgba(95,215,154,.28)}
.ghd .pinico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ghd .txt{flex:1;min-width:0}
.ghd .txt b{display:block;font-size:14.5px;font-weight:600}
.ghd .txt small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ghd .say{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:20px;padding:4px 11px;font-weight:600;border:1px solid rgba(95,215,154,.28)}
.ghd .chev{color:var(--ink-2);transition:transform .2s;font-size:17px}
.ghd.open .chev{transform:rotate(90deg)}
.rw{display:flex;align-items:center;gap:11px;padding:13px 14px;border-top:1px solid var(--cizgi);background:rgba(255,255,255,.03)}
.rw .kod{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--gold);background:var(--gold-soft);
  border:1px solid rgba(227,192,90,.3);border-radius:9px;padding:7px 10px;flex:0 0 auto;letter-spacing:-.02em}
.rw .orta{flex:1;min-width:0;text-align:left}
.rw .orta b{display:block;font-size:14px;font-weight:500}
.rw .orta small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rw .sag{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sil{width:33px;height:33px;border-radius:10px;border:1px solid rgba(240,112,92,.35);background:var(--red-soft);
  color:var(--red);display:grid;place-items:center;flex:0 0 auto}
.sil svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%}
.dot.on{background:var(--green);box-shadow:0 0 8px rgba(95,215,154,.6)}
.dot.off{background:var(--red);box-shadow:0 0 8px rgba(240,112,92,.5)}
.pill{font-size:11.5px;border-radius:20px;padding:5px 11px;border:1px solid transparent;display:inline-block}
.pill.on{background:var(--green-soft);color:var(--green);border-color:rgba(95,215,154,.3)}
.pill.off{background:var(--red-soft);color:var(--red);border-color:rgba(240,112,92,.3)}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:rgba(227,192,90,.32)}
.pill.sade{background:var(--cam-2);color:var(--ink-2);border-color:var(--cizgi)}

/* ---- belge satirlari ---- */
.dosya{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--cizgi)}
.dosya:first-child{border-top:none}
.dosya .tip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--cam-2);border:1px solid var(--cizgi);color:var(--ink-2)}
.dosya .tip svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dosya .bilgi{flex:1;min-width:0;text-align:left}
.dosya .bilgi b{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dosya .bilgi small{display:block;font-size:11px;color:var(--ink-3)}
.dosya .ops{display:flex;gap:6px;flex:0 0 auto}
.dosya .ops button{width:32px;height:32px;border-radius:9px;border:1px solid var(--cizgi-2);background:var(--cam-2);
  color:var(--ink);display:grid;place-items:center}
.dosya .ops button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dosya .ops button.kirmizi{color:var(--red);border-color:rgba(240,112,92,.35);background:var(--red-soft)}

/* ---- harita ---- */
#map,#minimap{height:300px;border-radius:var(--r);border:1px solid var(--cizgi-2);overflow:hidden;background:var(--cam);margin-bottom:14px}
#minimap{height:240px}
.leaflet-container{background:#0B100E}
.leaflet-control-attribution{background:rgba(7,10,9,.8)!important;color:var(--ink-3)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-bar a{background:rgba(20,26,24,.94)!important;color:var(--ink)!important;border-color:var(--cizgi)!important}
.ipt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ipt select,.ipt input{width:auto;flex:1 1 46%;padding:11px 12px;font-size:14px}
.ipt select{background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px}
.ipt .full{flex:1 1 100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{flex:1 1 30%;border:1px solid var(--cizgi-2);border-radius:12px;padding:11px 8px;font-size:13px;
  font-weight:600;background:var(--cam-2);color:var(--ink);backdrop-filter:blur(10px)}
.acts button:active{background:rgba(255,255,255,.18)}
.acts button.pri{background:linear-gradient(160deg,#F0D278,#D9B248);color:#1A1403;border-color:rgba(255,255,255,.25)}
.ipuc{font-size:12px;color:var(--ink-3);margin:-4px 2px 12px}

.fab{position:fixed;right:calc(50% - 260px + 16px);bottom:24px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(160deg,#F0D278,#D9B248);color:#1A1403;font-size:27px;display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:20;border:1px solid rgba(255,255,255,.3)}
@media(max-width:552px){.fab{right:16px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:rgba(22,28,26,.96);
  border:1px solid rgba(227,192,90,.5);border-radius:13px;padding:13px 18px;font-size:14px;font-weight:600;
  z-index:60;max-width:88%;text-align:center;box-shadow:0 10px 32px rgba(0,0,0,.6);backdrop-filter:blur(14px)}
.spin{width:24px;height:24px;border:2px solid var(--cizgi-2);border-top-color:var(--gold);border-radius:50%;animation:s .7s linear infinite;margin:44px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin"></div></div>
<div id="toast"></div>

<script>
(function(){
  var kutu = document.getElementById("app");
  function yaz(baslik, detay){
    if(!kutu) return;
    kutu.innerHTML = '<div class="empty"><b>'+baslik+'</b>'
      + '<div style="font-size:12px;color:var(--ink-3);margin:10px 0 16px;word-break:break-word">'+detay+'</div>'
      + '<button class="btn ghost" onclick="location.reload()">Tekrar dene</button></div>';
  }
  window.__yaz = yaz;
  window.addEventListener("error", function(e){
    if(window.__acildi) return;
    if(e.target && e.target.tagName === "SCRIPT")
      return yaz("Kütüphane yüklenemedi", "Engellenen adres: " + (e.target.src||"?") + " — ağ ya da reklam engelleyici olabilir.");
    yaz("Kod hatası", (e.message||"bilinmiyor") + " (satır " + (e.lineno||"?") + ")");
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    if(window.__acildi) return;
    yaz("Bağlantı hatası", String((e.reason && e.reason.message) || e.reason || "bilinmiyor"));
  });
  setTimeout(function(){
    if(window.__acildi) return;
    if(typeof window.supabase === "undefined") return yaz("Supabase kütüphanesi gelmedi", "cdn.jsdelivr.net adresine ulaşılamıyor olabilir.");
    if(typeof window.L === "undefined") return yaz("Harita kütüphanesi gelmedi", "cdnjs.cloudflare.com adresine ulaşılamıyor olabilir.");
    if(kutu && kutu.querySelector(".spin")) yaz("Sunucu cevap vermedi", "Supabase'e ulaşılamadı ya da açılış kodu takıldı.");
  }, 12000);
})();
</script>

// TKGM alani "7,722.87" gonderir: virgul binlik ayraci, nokta ondalik
function alanCoz(x){
  if(x == null) return null;
  const n = parseFloat(String(x).replace(/\s/g,"").replace(/,/g,""));
  return isFinite(n) ? n : null;
}

function payOran(s){
  if(!s) return 1;
  const m = s.trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  if(!m || +m[2]===0) return null;
  return +m[1]/+m[2];
}

const TB   = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api";
const TB3  = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api";

let FN = null;                              // calisan fonksiyon adi
const FN_ADAYLARI = ["tkgm","quick-task"];

async function tkgm(u){
  const adaylar = FN ? [FN] : FN_ADAYLARI;
  let sonHata = null;
  for(const ad2 of adaylar){
    const { data, error } = await sb.functions.invoke(ad2, { body:{ u } });
    if(error){ sonHata = error; continue; }          // fonksiyon yok, digerini dene
    FN = ad2;
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  throw new Error(sonHata?.message || "aracıya ulaşılamadı");
}
const dizi = d => {
  if(Array.isArray(d)) return d;
  if(!d || typeof d !== "object") return [];
  if(Array.isArray(d.features)) return d.features;
  for(const k of ["data","liste","items","result","results","rows","value"])
    if(Array.isArray(d[k])) return d[k];
  const ilk = Object.values(d).find(v=>Array.isArray(v));
  return ilk || [];
};
const duz = o => (o && typeof o === "object" && o.properties) ? { ...o.properties, ...o } : o;
const ad = o => {
  if(typeof o === "string") return o;
  o = duz(o); if(!o || typeof o !== "object") return String(o ?? "");
  const g = Object.keys(o).find(k=>/^(text|ad|adi|ad_i|name|isim|label|title|.*Ad|.*Adi)$/i.test(k) && typeof o[k]==="string" && o[k].trim());
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="string" && v.trim() && !/^\d+$/.test(v) && !/id$/i.test(k));
  return h ? h[1] : "";
};
const kim = o => {
  o = duz(o); if(!o || typeof o !== "object") return "";
  const g = Object.keys(o).find(k=>/^(id|value|.*Id|kod|no)$/i.test(k) && (typeof o[k]==="number" || /^\d+$/.test(String(o[k]??""))));
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="number" || /^\d+$/.test(String(v??"")));
  return h ? h[1] : "";
};

const zamanAsimi = (p, ms=9000) => Promise.race([p,
  new Promise((_,r)=>setTimeout(()=>r(new Error("zaman aşımı")), ms))]);

// adaylari sirayla dener, dolu liste donen ilkini kullanir
async function ilkCalisan(adaylar){
  const hatalar = [];
  for(const u of adaylar){
    try{
      const d = dizi(await zamanAsimi(tkgm(u)));
      if(d.length) return { u, d };
      hatalar.push(`${u} → boş döndü`);
    }catch(e){ hatalar.push(`${u} → ${e.message||e}`); }
  }
  const hata = new Error("hiçbir uç cevap vermedi");
  hata.detay = hatalar.join("\n\n");
  throw hata;
}

async function idariKur(pre, sonrasi){
  const S = k => document.getElementById(pre + k);
  const doldur = (el, list, bos) => {
    const temiz = list.map(o=>({ a:String(ad(o)||"").trim(), k:String(kim(o)||"") }))
                      .filter(o=>o.a && o.k)
                      .sort((x,y)=>x.a.localeCompare(y.a,"tr"));
    if(!temiz.length) throw new Error("liste okunamadı");
    el.innerHTML = `<option value="">${bos}</option>` +
      temiz.map(o=>`<option value="${esc(o.k)}">${esc(o.a)}</option>`).join("");
    el.disabled = false;
  };
  const coz = () => {
    ["il","ilce","mah"].forEach(k=>{
      const el = S(k);
      el.outerHTML = `<input id="${pre}${k}" class="${el.className}" placeholder="${
        k==="il"?"İl":k==="ilce"?"İlçe":"Mahalle / köy"}">`;
    });
  };
  try{
    const { d:iller } = await ilkCalisan(IL_UCLARI);
    doldur(S("il"), iller, "İl seç");
    S("ilce").disabled = true; S("mah").disabled = true;

    S("il").onchange = async () => {
      S("ilce").innerHTML = `<option value="">yükleniyor…</option>`;
      S("mah").innerHTML = `<option value="">önce ilçe seç</option>`; S("mah").disabled = true;
      if(!S("il").value) return;
      try{
        const { d } = await ilkCalisan(ILCE_UCLARI(S("il").value));
        doldur(S("ilce"), d, "İlçe seç");
      }catch(e){
        S("ilce").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("İlçe listesi gelmedi", e.detay || e.message);
      }
    };
    S("ilce").onchange = async () => {
      S("mah").innerHTML = `<option value="">yükleniyor…</option>`;
      if(!S("ilce").value) return;
      try{
        const { d } = await ilkCalisan(MAH_UCLARI(S("ilce").value));
        doldur(S("mah"), d, "Mahalle / köy seç");
      }catch(e){
        S("mah").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("Köy listesi gelmedi", e.detay || e.message);
      }
    };
    if(sonrasi) S("mah").onchange = sonrasi;
  }catch(e){
    coz();
    taniYaz("İl listesi gelmedi, elle yazabilirsin", e.detay || e.message);
  }
}

function ciz(f){
  if(!f || !f.geometry) throw new Error("Parsel bulunamadı");
  SONPARSEL = f;
  if(KATMAN) HARITA.removeLayer(KATMAN);
  KATMAN = L.geoJSON(f, { style:{ color:"#C9A227", weight:2.5, fillColor:"#C9A227", fillOpacity:.18 } }).addTo(HARITA);
  HARITA.fitBounds(KATMAN.getBounds(), { padding:[30,30], maxZoom:18 });
  const p = f.properties || {};
  document.getElementById("bilgi").innerHTML = `
    <div class="card">
      <div style="font-size:12px;color:var(--ink-3)">${esc(p.ilAd||"")} · ${esc(p.ilceAd||"")} · ${esc(p.mahalleAd||"")}</div>
      <div style="font-size:18px;font-weight:600;margin-top:3px">Ada ${esc(p.adaNo||"—")} · Parsel ${esc(p.parselNo||"—")}</div>
      <div class="kv" style="margin-top:10px"><span>Yüzölçümü</span><b class="mono">${esc(p.alan||"—")} m²</b></div>
      <div class="kv"><span>Niteliği</span><b>${esc(p.nitelik||"—")}</b></div>
      <div class="kv"><span>Mevkii</span><b>${esc(p.mevkii||"—")}</b></div>
      <div class="acts">
        <button onclick="kmlIndir()">KML indir</button>
        <button onclick="earthAc()">Earth'te aç</button>
        ${ME.role==='admin'?`<button class="pri" onclick="haritadanKaydet()">Kaydet</button>`:""}
        <button onclick="cevreRaporu()">Çevre raporu</button>
        <button onclick="go('emsal')">Emsal araştır</button>
      </div>
    </div>`;
}

function merkez(f){
  const c = []; JSON.stringify(f.geometry.coordinates).replace(/\[(-?\d+\.?\d*),(-?\d+\.?\d*)\]/g,(m,a,b)=>{c.push([+a,+b]);return m;});
  const lng = c.reduce((s,p)=>s+p[0],0)/c.length, lat = c.reduce((s,p)=>s+p[1],0)/c.length;
  return { lat, lng };
}

function kmlMetni(f){
  const p = f.properties||{};
  const halka = g => (g.type==="Polygon"?[g.coordinates]:g.coordinates)
    .map(poly => poly[0].map(c=>`${c[0]},${c[1]},0`).join(" ")).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${p.ozet||"parsel"}</name>
<Style id="s"><LineStyle><color>ff27a2c9</color><width>3</width></LineStyle>
<PolyStyle><color>4027a2c9</color></PolyStyle></Style>
<Placemark><name>${p.mahalleAd||""} ${p.adaNo||""}/${p.parselNo||""}</name>
<description>${p.alan||""} m² · ${p.nitelik||""}</description><styleUrl>#s</styleUrl>
<Polygon><outerBoundaryIs><LinearRing><coordinates>${halka(f.geometry)}</coordinates>
</LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
}

function kmlIndir(){
  if(!SONPARSEL) return;
  const p = SONPARSEL.properties||{};
  const b = new Blob([kmlMetni(SONPARSEL)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${(p.mahalleAd||"parsel")}-${p.adaNo||0}-${p.parselNo||0}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

function earthAc(){
  if(!SONPARSEL) return;
  const { lat, lng } = merkez(SONPARSEL);
  window.open(`https://earth.google.com/web/@${lat},${lng},0a,600d,35y,0h,45t,0r`, "_blank");
}

async function haritadanKaydet(){
  if(!SONPARSEL) return;

  if(kutu) kutu.innerHTML = `<div style="flex:1 1 100%;text-align:center;color:var(--ink-3);font-size:13px">kaydediliyor…</div>`;

    .eq("mahalle", p.mahalleAd||"").eq("parsel", String(p.parselNo||""))
    .eq("ada", p.adaNo||null).limit(1);

  let kayitId = var_?.[0]?.id;
  if(!kayitId){
    const alan = alanCoz(p.alan);
    const { data:kayit, error } = await sb.from("parcels").insert({
      team_id:ME.team_id, il:p.ilAd||"", ilce:p.ilceAd||"", mahalle:p.mahalleAd||"",
      ada:p.adaNo||null, parsel:String(p.parselNo||""), alan_m2:alan, nitelik:p.nitelik||null,
      mevkii:p.mevkii||null, lat:m.lat, lng:m.lng, geojson:SONPARSEL, created_by:ME.id
    }).select().single();
    if(error){ ciz(SONPARSEL); return toast("Olmadı: "+error.message); }
    kayitId = kayit.id;
  }

  const { data:yKayit, error:yHata } = await sb.from("parcel_years")
    .insert({ parcel_id:kayitId, team_id:ME.team_id, yil:YEAR, aktif:true }).select().single();

  if(yHata && /duplicate|unique/i.test(yHata.message)){

// alanlari birbirine bagla; hesaplayan islevi dondur
function hisseBagla(p, alan){
  const g = k => document.getElementById(p+k);
  const hesap = () => {
    if(!g("bic")) return null;
    const bic = g("bic").value;
    g("oranK").style.display = bic === "oran" ? "block" : "none";
    g("m2K").style.display   = bic === "m2"   ? "block" : "none";
    if(bic === "oran"){
      const o = payOran(g("oran").value);
      if(o === null){ g("bilgi").innerHTML = `<span style="color:var(--red)">1/4 gibi yaz</span>`; return null; }
      const m2 = Math.round(alan * o);
      g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(m2)} m²`;
      return { pay: g("oran").value.trim(), m2 };
    }
    const m2 = parseFloat(String(g("m2").value).replace(",","."));
    if(!isFinite(m2) || m2 <= 0){ g("bilgi").innerHTML = `<span style="color:var(--red)">Metrekare yaz</span>`; return null; }
    const yuzde = alan ? (m2/alan*100) : 0;
    g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(Math.round(m2))} m²${alan?` (%${yuzde.toFixed(1)})`:""}`;
    return { pay: null, m2: Math.round(m2) };
  };
  ["bic","oran","m2"].forEach(k => { const el = g(k); if(el){ el.oninput = hesap; el.onchange = hesap; } });
  hesap();
  return hesap;
}

// dosyayi telefonun paylas menusune ver: whatsapp, mail, ne varsa
async function dosyaPaylas(yol, ad2){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 86400);
  if(error) return toast("Paylaşılamadı: " + error.message);
  try{
    if(navigator.canShare){
      const r = await fetch(data.signedUrl);
      const blob = await r.blob();
      const dosya = new File([blob], ad2, { type: blob.type || "application/octet-stream" });
      if(navigator.canShare({ files:[dosya] })){
        await navigator.share({ files:[dosya], title: ad2 });
        return;
      }
    }
    if(navigator.share){ await navigator.share({ title: ad2, url: data.signedUrl }); return; }
    await navigator.clipboard.writeText(data.signedUrl);
    toast("Bağlantı kopyalandı, yapıştırıp gönderebilirsin");
  }catch(e){
    if(String(e).includes("AbortError")) return;
    try{ await navigator.clipboard.writeText(data.signedUrl); toast("Bağlantı kopyalandı"); }
    catch(_){ toast("Paylaşılamadı"); }
  }
}

async function dosyaIndir(yol, ad2){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 3600, { download: ad2 });
  if(error) return toast("İndirilemedi: " + error.message);
  const a = document.createElement("a");
  a.href = data.signedUrl; a.download = ad2; a.click();
  toast("İndiriliyor");
}

const boyut = b => !b ? "" : b > 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.round(b/1024)+" KB";

let acikGrup = null;
// TR harflerini sadelestirip karsilastir: "MUHACİRKADI" ile "Muhacırkadı" ayni sayilsin
const sade = x => String(x||"")
  .replace(/[İIıi]/g,"i").replace(/[Şş]/g,"s").replace(/[Ğğ]/g,"g")
  .replace(/[Üü]/g,"u").replace(/[Öö]/g,"o").replace(/[Çç]/g,"c")
  .toLowerCase().replace(/[^a-z0-9]/g,"");
const anahtar = p => [sade(p.il), sade(p.ilce), sade(p.mahalle)].join("|");
const duzgun = x => String(x||"").trim().toLocaleLowerCase("tr")
  .replace(/(^|[\s\-\/])([a-zçğıöşü])/g, (m,a,b)=>a+b.toLocaleUpperCase("tr"));

// ayni koydeki parselleri tek baslik altinda topla
function grupla(rows){
  const g = {};
  rows.forEach(r=>{
    const p = r.parcels, k = anahtar(p);
    (g[k] ||= { il:duzgun(p.il), ilce:duzgun(p.ilce), mah:duzgun(p.mahalle), list:[] }).list.push(r);
  });
  return Object.entries(g).sort((a,b)=>a[1].mah.localeCompare(b[1].mah,"tr"));
}

function grupBasi(k, gr, acik, sayiEk){
  return `<button class="ghd${acik?" open":""}" onclick="acikGrup=${acik?"null":`'${k.replace(/'/g,"\\'")}'`};${sayiEk}()">
    <span class="chev">›</span>

    <span class="txt"><b>${esc(gr.mah)}</b><small>${esc(gr.il)} · ${esc(gr.ilce)}</small></span>

}

async function belgeEkle(parselId, tur, donus, donusArg){

    (ekranlar[donus||"parsel"] || parselDetay)(donusArg || parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

async function belgeSilVeYenile(belgeId, yol, donus, donusArg){

}

    if(SONPARSELID){ const g2 = SONPARSELID; SONPARSELID = null; go("parsel", g2); }

/* ================= çevre raporu ve emsal ================= */

const OVER = "https://overpass-api.de/api/interpreter?data=";

function uzaklik(a, b){                       // metre
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b.lng-a.lng) * Math.cos(rad((a.lat+b.lat)/2));
  const df = rad(b.lat-a.lat);
  return Math.round(Math.sqrt(dl*dl + df*df) * R);
}
const km = m => m >= 1000 ? (m/1000).toFixed(1).replace(".",",") + " km" : m + " m";

const YOL_AD = { motorway:"Otoyol", trunk:"Devlet yolu", primary:"Ana yol", secondary:"Tali yol",
  tertiary:"Bağlantı yolu", unclassified:"Köy yolu", residential:"Yerleşim yolu", track:"Tarla yolu",
  service:"Servis yolu" };
const YER_AD = { city:"Şehir", town:"İlçe/kasaba", village:"Köy", hamlet:"Mezra", suburb:"Mahalle" };

async function cevreVerisi(lat, lng){
  const sorgu = `[out:json][timeout:30];(
    node(around:12000,${lat},${lng})[place~"^(city|town|village|hamlet)$"];
    way(around:2500,${lat},${lng})[highway];
    way(around:3000,${lat},${lng})[waterway~"^(river|stream|canal|ditch)$"];
    way(around:3000,${lat},${lng})[natural=water];
    way(around:2000,${lat},${lng})[landuse];
    node(around:8000,${lat},${lng})[amenity~"^(school|hospital|pharmacy|fuel)$"];
    way(around:5000,${lat},${lng})[power=line];
    node(around:8000,${lat},${lng})[man_made=water_well];
  );out center tags;`;
  return await zamanAsimi(tkgm(OVER + encodeURIComponent(sorgu)), 40000);
}

function cevreOzet(veri, merkezNokta){
  const ogeler = (veri?.elements || []).map(e=>{
    const nk = e.center ? { lat:e.center.lat, lng:e.center.lon } : { lat:e.lat, lng:e.lon };
    if(!isFinite(nk.lat)) return null;
    return { t:e.tags || {}, u:uzaklik(merkezNokta, nk) };
  }).filter(Boolean).sort((a,b)=>a.u-b.u);

  const ilk = f => ogeler.find(f);
  const hepsi = f => ogeler.filter(f);

  const yerler = hepsi(o=>o.t.place && o.t.name).slice(0,5);
  const yollar = {};
  hepsi(o=>o.t.highway && YOL_AD[o.t.highway]).forEach(o=>{
    if(!yollar[o.t.highway]) yollar[o.t.highway] = o;
  });
  const su = ilk(o=>o.t.waterway || o.t.natural === "water");
  const okul = ilk(o=>o.t.amenity === "school");
  const saglik = ilk(o=>o.t.amenity === "hospital" || o.t.amenity === "pharmacy");
  const akaryakit = ilk(o=>o.t.amenity === "fuel");
  const elektrik = ilk(o=>o.t.power === "line");
  const kuyu = ilk(o=>o.t.man_made === "water_well");

  const kullanim = {};
  hepsi(o=>o.t.landuse).forEach(o=>{ kullanim[o.t.landuse] = (kullanim[o.t.landuse]||0)+1; });

  return { yerler, yollar, su, okul, saglik, akaryakit, elektrik, kuyu, kullanim };
}

const LANDUSE_AD = { farmland:"Tarım arazisi", meadow:"Çayır", forest:"Orman", orchard:"Meyve bahçesi",
  vineyard:"Bağ", residential:"Yerleşim", industrial:"Sanayi", commercial:"Ticaret", quarry:"Taş ocağı",
  cemetery:"Mezarlık", farmyard:"Çiftlik avlusu", grass:"Otlak", village_green:"Köy meydanı" };

// beyaz zemine rapor cizip PNG dondurur
function raporPng(baslik, altBaslik, bolumler){
  const G = 1000, satirY = 34;
  let Y = 300;
  bolumler.forEach(b=> Y += 70 + b.satirlar.length * satirY + 24);
  Y = Math.max(1400, Y + 120);

  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);
  x.fillStyle = "#2F4A22"; x.fillRect(0,0,G,10);

  x.textAlign = "left"; x.fillStyle = "#111"; x.font = "700 42px Arial";
  x.fillText(baslik, 60, 100);
  x.font = "400 24px Arial"; x.fillStyle = "#555";
  altBaslik.split("\n").forEach((t,i)=> x.fillText(t, 60, 145 + i*32));

  let y = 250;
  bolumler.forEach(b=>{
    x.fillStyle = "#EAF3DE"; x.fillRect(60, y-32, G-120, 46);
    x.fillStyle = "#2F4A22"; x.font = "700 26px Arial";
    x.fillText(b.baslik, 76, y);
    y += 56;
    x.font = "400 23px Arial";
    b.satirlar.forEach(([k,v])=>{
      x.fillStyle = "#555"; x.fillText(k, 76, y);
      x.fillStyle = "#111"; x.textAlign = "right";
      x.fillText(String(v), G-76, y);
      x.textAlign = "left";
      x.strokeStyle = "#EEE"; x.lineWidth = 1;
      x.beginPath(); x.moveTo(76, y+10); x.lineTo(G-76, y+10); x.stroke();
      y += satirY;
    });
    y += 34;
  });

  x.font = "400 19px Arial"; x.fillStyle = "#888";
  x.fillText("Kaynak: TKGM parsel verisi ve OpenStreetMap açık verisi · " + new Date().toLocaleString("tr-TR"), 60, Y-50);
  x.strokeStyle = "#DDD"; x.lineWidth = 2; x.strokeRect(20, 20, G-40, Y-40);
  return { png: c.toDataURL("image/png"), oran: Y/G };
}

function pngToPdfBlob(png, oran){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const gen = 190, yuk = gen * oran;
  if(yuk <= 277){ pdf.addImage(png, "PNG", 10, 10, gen, yuk); }
  else {
    // uzun raporu sayfalara bol
    const sayfa = 277, adet = Math.ceil(yuk/sayfa);
    for(let i=0;i<adet;i++){
      if(i) pdf.addPage();
      pdf.addImage(png, "PNG", 10, 10 - i*sayfa, gen, yuk);
    }
  }
  return pdf.output("blob");
}

function dosyaAdi(p, ek){
  const t = `${p?.adaNo ?? p?.ada ?? 0}-${p?.parselNo ?? p?.parsel ?? 0}`;
  return `${t}-${ek}.pdf`.replace(/\s+/g,"");
}


async function cevreRaporu(){
  if(!SONPARSEL) return toast("Önce bir parsel sorgula");

  const kutu = document.querySelector("#bilgi .acts");

  try{
    const veri = await cevreVerisi(m.lat, m.lng);
    const o = cevreOzet(veri, m);

    const yerSatir = o.yerler.map(y=>[`${YER_AD[y.t.place]||y.t.place}: ${y.t.name}`, km(y.u)]);
    const yolSatir = Object.entries(o.yollar).map(([k,v])=>
      [YOL_AD[k] + (v.t.name ? ` (${v.t.name})` : ""), km(v.u)]);
    const kullanimSatir = Object.entries(o.kullanim).sort((a,b)=>b[1]-a[1]).slice(0,6)
      .map(([k,v])=>[LANDUSE_AD[k]||k, `${v} alan`]);

    const bolumler = [
      { baslik:"Parsel bilgileri", satirlar:[
        ["İl / ilçe / mahalle", `${p.ilAd||""} / ${p.ilceAd||""} / ${p.mahalleAd||""}`],
        ["Ada / parsel", `${p.adaNo||"—"} / ${p.parselNo||"—"}`],
        ["Yüzölçümü", nf(alanCoz(p.alan)) + " m²"],
        ["Niteliği", p.nitelik || "—"],
        ["Mevkii", p.mevkii || "—"],
        ["Koordinat", `${m.lat.toFixed(6)}, ${m.lng.toFixed(6)}`]
      ]},
      { baslik:"Yerleşim yerlerine uzaklık", satirlar: yerSatir.length ? yerSatir : [["Yakında kayıtlı yerleşim yok",""]] },
      { baslik:"Yol durumu", satirlar: yolSatir.length ? yolSatir : [["Yakında kayıtlı yol yok",""]] },
      { baslik:"Altyapı ve su", satirlar:[
        ["En yakın su kaynağı", o.su ? `${o.su.t.name || (o.su.t.waterway ? "akarsu" : "su yüzeyi")} · ${km(o.su.u)}` : "kayıt yok"],
        ["Su kuyusu", o.kuyu ? km(o.kuyu.u) : "kayıt yok"],
        ["Elektrik hattı", o.elektrik ? km(o.elektrik.u) : "kayıt yok"],
        ["Akaryakıt istasyonu", o.akaryakit ? km(o.akaryakit.u) : "kayıt yok"]
      ]},
      { baslik:"Sosyal donatı", satirlar:[
        ["En yakın okul", o.okul ? `${o.okul.t.name||"okul"} · ${km(o.okul.u)}` : "kayıt yok"],
        ["Sağlık tesisi", o.saglik ? `${o.saglik.t.name||"sağlık"} · ${km(o.saglik.u)}` : "kayıt yok"]
      ]},
      { baslik:"Çevredeki arazi kullanımı", satirlar: kullanimSatir.length ? kullanimSatir : [["Kayıt yok",""]] }
    ];

    const { png, oran } = raporPng(
      `Çevre raporu · ${p.adaNo||"—"}/${p.parselNo||"—"}`,
      `${p.mahalleAd||""} — ${p.ilceAd||""} / ${p.ilAd||""}\n2 km yarıçapındaki yollar, 12 km yarıçapındaki yerleşimler taranmıştır.`,
      bolumler);

    const blob = pngToPdfBlob(png, oran);
    const ad2 = dosyaAdi(p, "cevre-raporu");
    indirBlob(blob, ad2);
    await parseleIliskilendir(p, blob, ad2, "arastirma");
    document.getElementById("rapdurum")?.remove();

  }catch(e){
    document.getElementById("rapdurum")?.remove();
    toast("Olmadı: " + (e.message||e));
  }
}

function indirBlob(blob, ad2){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = ad2; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

async function parseleIliskilendir(p, blob, ad2, tur){

  try{ await dosyaYukle(new File([blob], ad2, { type:"application/pdf" }), tur, id);
       toast("Rapor parselin belgelerine de eklendi"); }catch(e){}
}

// iki koordinat arasi mesafe (metre)
function mesafe(a, b){
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b[0]-a[0]) * Math.cos(rad((a[1]+b[1])/2));
  const df = rad(b[1]-a[1]);
  return Math.round(Math.sqrt(dl*dl + df*df) * R * 10)/10;
}


/* ---- geometri: metreye cevir, alan, yariduzlem kirpma, parcala ---- */

function metreye(halka){
  const lat0 = halka.reduce((t,k)=>t+k[1],0)/halka.length;
  const kx = Math.cos(lat0*Math.PI/180) * 111320, ky = 110540;
  const x0 = halka[0][0], y0 = halka[0][1];
  return halka.map(k=>[ (k[0]-x0)*kx, (k[1]-y0)*ky ]);
}

function alanHesap(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    a += pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
  }
  return Math.abs(a)/2;
}

// n·p <= d yarim duzlemine kirp (Sutherland-Hodgman)
function kirp(poly, n, d){
  const cik = [];
  for(let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const da = n[0]*a[0]+n[1]*a[1]-d, db = n[0]*b[0]+n[1]*b[1]-d;
    if(da <= 0) cik.push(a);
    if((da < 0 && db > 0) || (da > 0 && db < 0)){
      const t = da/(da-db);
      cik.push([ a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1]) ]);
    }
  }
  return cik;
}

// en uzun ekseni bul, o yone dik seritlere bol; her serit hedef alani tutsun
function parcala(pts, hedefler){
  let enUzun = 0, yon = [1,0];
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    const dx = pts[j][0]-pts[i][0], dy = pts[j][1]-pts[i][1];
    const u = Math.hypot(dx,dy);
    if(u > enUzun){ enUzun = u; yon = [dx/u, dy/u]; }
  }
  const izd = pts.map(p=>p[0]*yon[0]+p[1]*yon[1]);
  let alt = Math.min(...izd), ust = Math.max(...izd);
  const toplam = alanHesap(pts);
  const oran = hedefler.reduce((t,h)=>t+h,0) || toplam;

  const parcalar = [];
  let sinir = alt;
  for(let i=0;i<hedefler.length;i++){
    if(i === hedefler.length-1){
      parcalar.push(kirp(pts, [-yon[0],-yon[1]], -sinir));
      break;
    }
    const hedef = toplam * (hedefler[i]/oran);
    let a = sinir, b = ust, kes = ust;
    for(let k=0;k<40;k++){
      kes = (a+b)/2;
      const dilim = kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir);
      const al = dilim.length > 2 ? alanHesap(dilim) : 0;
      if(al < hedef) a = kes; else b = kes;
    }
    parcalar.push(kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir));
    sinir = kes;
  }
  return parcalar.filter(p=>p.length > 2);
}

function agirlikMerkezi(pts){
  let x=0, y=0, a=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    const c = pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
    a += c; x += (pts[i][0]+pts[j][0])*c; y += (pts[i][1]+pts[j][1])*c;
  }
  a *= 0.5;
  return a ? [x/(6*a), y/(6*a)] : [pts[0][0], pts[0][1]];
}

async function capCiz(parselId, parcalar){
  const { data:p } = await sb.from("parcels").select("*").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  toast("Çap çiziliyor…");

                           { type:"application/pdf" });
    await dosyaYukle(dosya, "cap", parselId);
    toast("Çap hazırlandı ve parsele eklendi");
    go("cap");
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

// parsel sinirindan olcekli cap cizimi uretir
function capCizPng(p, parcalar){
  const g = p.geojson.geometry;
  const halka = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(halka.length > 1 &&
     halka[0][0] === halka[halka.length-1][0] && halka[0][1] === halka[halka.length-1][1]) halka.pop();

  const G = 1000, Y = 1400, ust = 210, alt = 250, kenar = 70;
  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);

  const M = metreye(halka);
  const minX = Math.min(...M.map(k=>k[0])), maxX = Math.max(...M.map(k=>k[0]));
  const minY = Math.min(...M.map(k=>k[1])), maxY = Math.max(...M.map(k=>k[1]));
  const alanG = G - kenar*2, alanY = Y - ust - alt;
  const olcek = Math.min(alanG/((maxX-minX)||1e-9), alanY/((maxY-minY)||1e-9));
  const gX = kenar + (alanG - (maxX-minX)*olcek)/2;
  const gY = ust  + (alanY - (maxY-minY)*olcek)/2;
  const E = m => [ gX + (m[0]-minX)*olcek, gY + (maxY-m[1])*olcek ];
  const N = M.map(E);

  const yol = pts => { x.beginPath(); pts.forEach((k,i)=> i ? x.lineTo(k[0],k[1]) : x.moveTo(k[0],k[1])); x.closePath(); };

  // parcalar
  const liste = (parcalar && parcalar.length > 1) ? parcalar : null;
  if(liste){
    const dilimler = parcala(M, liste.map(o=>o.m2));
    dilimler.forEach((d,i)=>{
      const ekran = d.map(E);
      yol(ekran);
      x.fillStyle = liste[i]?.renk || "#9BBB59"; x.globalAlpha = .45; x.fill(); x.globalAlpha = 1;
      x.lineWidth = 2.5; x.strokeStyle = "#33482A"; x.stroke();
      const om = E(agirlikMerkezi(d));
      x.textAlign = "center"; x.textBaseline = "middle";
      x.font = "700 40px Arial"; x.fillStyle = "#1B2A14";
      x.fillText(liste[i]?.no ?? String(i+1), om[0], om[1]-16);
      x.font = "600 24px Arial";
      x.fillText(nf(Math.round(alanHesap(d))) + " m²", om[0], om[1]+22);
    });
  }else{
    yol(N); x.fillStyle = "#EAF3DE"; x.fill();
  }

  // dis sinir
  yol(N); x.lineWidth = 4; x.strokeStyle = "#2F4A22"; x.stroke();

  // kenar uzunluklari
  x.font = "600 22px Arial"; x.textAlign = "center"; x.textBaseline = "middle";
  for(let i=0;i<N.length;i++){
    const j = (i+1) % N.length;
    const m = Math.round(Math.hypot(M[j][0]-M[i][0], M[j][1]-M[i][1]) * 10)/10;
    if(m < 1) continue;
    const ox = (N[i][0]+N[j][0])/2, oy = (N[i][1]+N[j][1])/2;
    const dx = N[j][0]-N[i][0], dy = N[j][1]-N[i][1], u = Math.hypot(dx,dy) || 1;
    const nx = ox + (-dy/u)*26, ny = oy + (dx/u)*26;
    const yazi = m.toFixed(1).replace(".",",") + " m";
    const gen = x.measureText(yazi).width + 12;
    x.fillStyle = "rgba(255,255,255,.92)"; x.fillRect(nx-gen/2, ny-15, gen, 30);
    x.fillStyle = "#20301A"; x.fillText(yazi, nx, ny);
  }
  N.forEach(k=>{ x.beginPath(); x.arc(k[0],k[1],5,0,7); x.fillStyle="#2F4A22"; x.fill(); });

  // baslik
  x.textAlign = "left"; x.textBaseline = "alphabetic"; x.fillStyle = "#111";
  x.font = "700 44px Arial";
  x.fillText(`Ada ${p.ada||"—"} · Parsel ${p.parsel}`, kenar, 78);
  x.font = "400 26px Arial"; x.fillStyle = "#444";
  x.fillText(`${duzgun(p.il)} / ${duzgun(p.ilce)} / ${duzgun(p.mahalle)}`, kenar, 118);
  if(p.mevkii) x.fillText(`Mevkii: ${p.mevkii}`, kenar, 155);

  // kuzey oku
  const kzX = G - kenar - 30, kzY = 110;
  x.beginPath(); x.moveTo(kzX, kzY-42); x.lineTo(kzX-16, kzY+14); x.lineTo(kzX, kzY+2); x.lineTo(kzX+16, kzY+14);
  x.closePath(); x.fillStyle = "#2F4A22"; x.fill();
  x.font = "700 24px Arial"; x.textAlign = "center"; x.fillStyle = "#2F4A22"; x.fillText("K", kzX, kzY+38);

  // alt bilgi
  const ay = Y - alt + 56;
  x.textAlign = "left"; x.fillStyle = "#111"; x.font = "700 30px Arial";
  x.fillText(`Yüzölçümü: ${nf(p.alan_m2)} m²`, kenar, ay);
  x.font = "400 24px Arial"; x.fillStyle = "#444";
  x.fillText(`Niteliği: ${p.nitelik || "—"}`, kenar, ay + 40);
  const pxPerM = olcek, pxPerCm = 1000/190*10;
  x.fillText(`Ölçek: 1 cm ≈ ${Math.round(pxPerCm/(pxPerM||1))} m`, kenar, ay + 78);
  x.font = "400 20px Arial"; x.fillStyle = "#777";
  x.fillText(new Date().toLocaleDateString("tr-TR"), kenar, ay + 120);

  x.strokeStyle = "#CCC"; x.lineWidth = 2; x.strokeRect(20, 20, G-40, Y-40);
  return c.toDataURL("image/png");
}

async function kmlIndirParsel(parselId){
  const { data:p } = await sb.from("parcels").select("geojson,mahalle,ada,parsel").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  const f = p.geojson;
  const b = new Blob([kmlMetni(f)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${p.mahalle||"parsel"}-${p.ada||0}-${p.parsel}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

async function miniHarita(parselId){

  kutu.innerHTML = `<div id="minimap" style="margin-top:12px"></div>`;
  const { data:p } = await sb.from("parcels").select("geojson,lat,lng").eq("id",parselId).single();
  MINI = L.map("minimap", { zoomControl:true }).setView([p.lat, p.lng], 16);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Uydu: Esri · Parsel: TKGM" }).addTo(MINI);

  }
  setTimeout(()=>MINI.invalidateSize(), 200);
}

  if(!confirm(`${ad2} kaydı silinsin mi? Yüklenen belgeler depoda kalır.`)) return;
  const { error } = await sb.from("ekler").delete().eq("id", kisiId);
  if(error) return toast("Olmadı: " + error.message);
  toast("Silindi"); eklerListele();
}

/* ================= ayarlar ================= */

async function ayarlar(){
  app.innerHTML = head("Ayarlar","go('ana')") + `<div class="spin"></div>`;
  const { data:kisiler } = await sb.from("profiles").select("id,full_name,email,role").order("created_at");
  const rolAd = { admin:"Admin", yonetici:"Yönetici", uye:"Üye" };
  app.innerHTML = head("Ayarlar","go('ana')") + `
    <div class="card">
      <div class="kv"><span>Hesap</span><b>${esc(ME.email||"")}</b></div>
      <div class="kv"><span>Yetki</span><b>${rolAd[ME.role]}</b></div>
      <div class="kv"><span>Sürüm</span><b>${SURUM}</b></div>
    </div>
    <h3 style="font-size:14px;margin:22px 0 10px">Kullanıcılar</h3>
    ${(kisiler||[]).map(k=>{
      const isim = (k.full_name && !k.full_name.includes("@")) ? k.full_name : (k.email||"").split("@")[0];
      const bas = (isim||"?").slice(0,2).toLocaleUpperCase("tr");
      const benMi = k.id === ME.id;
      return `<div class="card">
        <div style="display:flex;align-items:center;gap:11px">
          <span style="width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);
            display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto">${esc(bas)}</span>
          <div style="flex:1;min-width:0">
            <b style="font-size:15px;font-weight:600;display:block">${esc(isim)}${benMi?" · sen":""}</b>
            <div style="font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k.email||"")}</div>
          </div>
          <span class="pill ${k.role==='admin'?'gold':'sade'}" style="flex:0 0 auto">${rolAd[k.role]}</span>
        </div>
        ${ME.role==='admin' && !benMi ? `<div style="display:flex;gap:8px;align-items:center;margin-top:11px">
          <select style="flex:1;padding:10px 30px 10px 12px;font-size:13px" onchange="rolDegistir('${k.id}',this.value)">
            <option value="uye"${k.role==='uye'?' selected':''}>Üye · sadece görüntüler</option>
            <option value="yonetici"${k.role==='yonetici'?' selected':''}>Yönetici · kullanır, kayıt değiştiremez</option>
            <option value="admin"${k.role==='admin'?' selected':''}>Admin · tam yetki</option>
          </select>
          <button class="sil" onclick="kullaniciSil('${k.id}','${esc(isim)}')" aria-label="Kullanıcıyı çıkar">${svg("trash")}</button>
        </div>` : ""}
      </div>`;
    }).join("")}
    <p style="color:var(--ink-3);font-size:12px;margin:2px 2px 0">Uygulamayı kurup giren herkes önce üye olur. Yetkiyi buradan sen verirsin.</p>`;
}

async function kullaniciSil(id, isim){
  if(!confirm(`${isim} ekipten çıkarılsın mı?\n\nEklediği kayıtlar ve notlar durur. Aynı hesapla tekrar girerse üye olarak geri gelir; kalıcı engellemek istersen bana söyle.`)) return;
  const { error } = await sb.from("profiles").delete().eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"kullanıcı çıkarıldı", entity:"profiles", entity_id:id, detail:isim });
  toast("Çıkarıldı"); ayarlar();
}

async function rolDegistir(id, rol){
  const { error } = await sb.from("profiles").update({ role: rol }).eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"yetki değişti", entity:"profiles", entity_id:id, detail:rol });
  toast("Yetki güncellendi");
}
async function cikis(){ await sb.auth.signOut(); location.reload(); }

/* ================= yonlendirme ================= */

const ekranlar = { ana:anaMenu, harita:harita, araziler:araziler, ekler:ekler, kml:kmlEkran, cap:capEkran, capAyar:capAyar, emsal:emsal, yeni:yeniParsel, parsel:parselDetay,
                   fiyat:fiyat, fiyatDuzen:fiyatDuzen, ayarlar:ayarlar };
function go(r,arg){ (ekranlar[r]||anaMenu)(arg); window.scrollTo(0,0); }

function acilisHatasi(mesaj){
  app.innerHTML = `<div class="empty"><b>Açılamadı</b>
    <div style="font-size:11px;color:var(--ink-3)">sürüm ${SURUM}</div>
    <div style="font-size:12px;color:var(--ink-3);margin:10px 0 16px;word-break:break-word">${esc(mesaj)}</div>
    <button class="btn ghost" onclick="location.reload()">Tekrar dene</button>
    <button class="btn danger" style="margin-top:10px" onclick="cikis()">Oturumu sıfırla</button></div>`;
}
const bekletme = 0;

async function baslat(){
 if(window.__basliyor) return;
 window.__basliyor = true;
 try{
  const { data:{ session } } = await zamanAsimi(sb.auth.getSession(), 8000);
  if(!session){ window.__acildi = true; window.__basliyor = false; return girisEkrani(); }
  let { data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000);
  if(!prof){ await new Promise(r=>setTimeout(r,1200));
    ({ data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000)); }
  window.__acildi = true; window.__basliyor = false;
  if(!prof) return acilisHatasi("Profil kurulamadı. Oturumu sıfırlayıp tekrar gir.");
  ME = prof; anaMenu();
 }catch(e){ window.__acildi = true; window.__basliyor = false; acilisHatasi(String(e.message||e)); }
}
baslat();

sb.auth.onAuthStateChange((olay) => {
  if(olay === "SIGNED_IN" && !ME && !window.__basliyor) baslat();
});
</script>
