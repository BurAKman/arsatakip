<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F0D">
<title>Parsel Parsel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#F2EFE8; --ink-2:#B9C2BB; --ink-3:#7E8A84;
  --gold:#E3C05A; --gold-soft:rgba(227,192,90,.16);
  --green:#5FD79A; --green-soft:rgba(95,215,154,.16);
  --red:#F0705C; --red-soft:rgba(240,112,92,.16);
  --blue:#6FB0F5; --blue-soft:rgba(111,176,245,.16);
  --cam:rgba(255,255,255,.065);
  --cam-2:rgba(255,255,255,.10);
  --cizgi:rgba(255,255,255,.13);
  --cizgi-2:rgba(255,255,255,.22);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);
  font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
  background:
    radial-gradient(900px 620px at 78% -8%, rgba(95,215,154,.13), transparent 60%),
    radial-gradient(760px 520px at 8% 12%, rgba(111,176,245,.10), transparent 62%),
    radial-gradient(700px 700px at 50% 108%, rgba(227,192,90,.07), transparent 60%),
    #070A09;
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:62px 62px;
}
.wrap{position:relative;max-width:520px;margin:0 auto;padding:0 15px 52px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold);text-decoration:none}
.hide{display:none!important}

/* ---- acilis ekrani ---- */
#acilis{position:fixed;inset:0;z-index:200;background:#05070A;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;transition:opacity .6s ease}
#acilis.git{opacity:0;pointer-events:none}
#acilis video{width:min(86vw,420px);max-height:56vh;border-radius:18px;display:block;object-fit:contain}
#acilis .ad{margin-top:22px;font-size:26px;font-weight:700;letter-spacing:.16em;color:#fff;
  text-shadow:0 2px 18px rgba(0,0,0,.8)}
#acilis .yuk{margin-top:9px;font-size:13.5px;color:rgba(255,255,255,.62);letter-spacing:.04em}
#acilis .yuk i{font-style:normal}
#acilis .yuk i::after{content:"";animation:acNokta 1.2s steps(4,end) infinite}
@keyframes acNokta{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---- ust bar ---- */
.top{display:flex;align-items:center;gap:11px;padding:14px 0 12px}
.top h1{font-size:19px;flex:1}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo .mark{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  border:1.5px solid rgba(255,255,255,.55);background:#0A0C0B;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.logo .mark img{width:100%;height:100%;object-fit:cover;display:block}
.logo b{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1;color:#FFFFFF;
  text-shadow:0 1px 8px rgba(0,0,0,.55)}
.logo span{font-size:9px;letter-spacing:.15em;text-transform:uppercase;display:block;margin-top:2px;
  color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--cizgi-2);background:var(--cam);
  display:grid;place-items:center;flex:0 0 auto;color:var(--ink);backdrop-filter:blur(10px)}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.ak{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34)}
.ibtn.cik{color:var(--red);background:var(--red-soft);border-color:rgba(240,112,92,.42)}
.ibtn.geri{font-size:20px;line-height:1}
.zaman{text-align:right;font-size:11px;color:var(--ink-3);margin:0 2px 10px;font-family:"IBM Plex Mono",monospace}

/* ---- kur ---- */
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 16px}
.rate{background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.30);border-radius:12px;padding:8px 9px;min-width:0;backdrop-filter:blur(14px)}
.rate .v{color:#fff}
.rate .k{font-size:9.5px;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate .v{font-size:12.5px;font-weight:600;margin-top:2px;font-family:"IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- kategori kartlari ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:var(--r);padding:16px 14px;text-align:left;position:relative;overflow:hidden;
  border:1px solid var(--cizgi-2);backdrop-filter:blur(14px);transition:transform .16s,filter .16s;
  background:linear-gradient(155deg,rgba(255,255,255,.13),rgba(255,255,255,.045))}
.tile:active{transform:scale(.98);filter:brightness(1.15)}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2)}
.tile .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15px;font-weight:600;color:#fff}
.tile small{display:block;font-size:12px;color:rgba(255,255,255,.62);margin-top:2px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.tile.wide .ic{margin:0}
.tile.kirmizi{background:linear-gradient(155deg,rgba(240,112,92,.30),rgba(240,112,92,.09));border-color:rgba(240,112,92,.42)}
.tile.kirmizi .ic{color:#FFC9BF}
.tile.yesil{background:linear-gradient(155deg,rgba(95,215,154,.30),rgba(95,215,154,.09));border-color:rgba(95,215,154,.42)}
.tile.yesil .ic{color:#C4F5DC}
.tile.gri{background:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,.055));border-color:rgba(255,255,255,.28)}
.tile.gri .ic{color:#fff}
.tile.mavi{background:linear-gradient(155deg,rgba(111,176,245,.30),rgba(111,176,245,.09));border-color:rgba(111,176,245,.42)}
.tile.mavi .ic{color:#CFE6FF}
.tile.sari{background:linear-gradient(155deg,rgba(227,192,90,.28),rgba(227,192,90,.08));border-color:rgba(227,192,90,.42)}
.tile.sari .ic{color:#F6E3AA}
.tile .gorsel{position:absolute;inset:0;background-repeat:no-repeat;background-position:center top;
  background-size:cover;pointer-events:none}
.tile .perde{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(4,7,6,.9) 0%,rgba(4,7,6,.5) 26%,rgba(4,7,6,.06) 55%,rgba(4,7,6,0) 100%)}
.tile .icerik{position:relative;z-index:2}
.tile.gorselli{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 13px}
.tile.gorselli .icerik b{font-size:17px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.tile.gorselli .icerik small{color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(0,0,0,.7)}
.tile.wide.gorselli{aspect-ratio:3/1;display:block;padding:14px 15px}
.tile.mini{padding:13px 12px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.tile.mini b{font-size:14.5px}
.tile.mini small{font-size:11.5px;margin-top:1px}
.tile.wide.gorselli .icerik{position:absolute;left:15px;bottom:13px;right:15px}
.tile.soon::after{content:"yakında";position:absolute;top:12px;right:12px;font-size:10px;color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:2px 8px}

/* ---- form ---- */
label{display:block;font-size:12px;color:var(--ink-2);margin:0 0 6px}
input,select,textarea{
  width:100%;background:rgba(255,255,255,.07);border:1px solid var(--cizgi);border-radius:12px;
  padding:12px 13px;outline:none;transition:border-color .15s,background .15s;backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#101614;color:var(--ink)}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;background:linear-gradient(160deg,#F0D278,#D9B248);color:#1A1403;font-weight:700;
  border-radius:13px;padding:14px;text-align:center;letter-spacing:-.01em;border:1px solid rgba(255,255,255,.25)}
.btn:active{filter:brightness(1.08)}
.btn.ghost{background:var(--cam-2);color:#fff;border:1px solid var(--cizgi-2);font-weight:600}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(240,112,92,.4)}
.btn[disabled]{opacity:.55}

/* ---- listeler / kartlar ---- */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.year{border:1px solid var(--cizgi-2);border-radius:22px;padding:8px 15px;font-size:13px;background:var(--cam);width:auto;min-width:98px}
.search{flex:1}
.card{background:var(--cam);border:1px solid var(--cizgi);border-radius:var(--r);padding:15px;margin-bottom:11px;backdrop-filter:blur(14px)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px}
.kv span{color:var(--ink-2);flex:0 0 auto}
.kv b{text-align:right;min-width:0}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.grp{margin-bottom:11px;border:1px solid var(--cizgi);border-radius:var(--r);background:var(--cam);overflow:hidden;backdrop-filter:blur(14px)}
.ghd{display:flex;align-items:center;gap:11px;padding:15px 14px;width:100%;text-align:left}
.ghd .pinico{width:33px;height:33px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:0 0 auto;border:1px solid rgba(95,215,154,.28)}
.ghd .pinico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ghd .txt{flex:1;min-width:0}
.ghd .txt b{display:block;font-size:14.5px;font-weight:600}
.ghd .txt small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ghd .say{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:20px;padding:4px 11px;font-weight:600;border:1px solid rgba(95,215,154,.28)}
.ghd .chev{color:var(--ink-2);transition:transform .2s;font-size:17px}
.ghd.open .chev{transform:rotate(90deg)}
.rw{display:flex;align-items:center;gap:11px;padding:13px 14px;border-top:1px solid var(--cizgi);background:rgba(255,255,255,.03)}
.rw .kod{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--gold);background:var(--gold-soft);
  border:1px solid rgba(227,192,90,.3);border-radius:9px;padding:7px 10px;flex:0 0 auto;letter-spacing:-.02em}
.rw .orta{flex:1;min-width:0;text-align:left}
.rw .orta b{display:block;font-size:14px;font-weight:500}
.rw .orta small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rw .sag{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sil{width:33px;height:33px;border-radius:10px;border:1px solid rgba(240,112,92,.35);background:var(--red-soft);
  color:var(--red);display:grid;place-items:center;flex:0 0 auto}
.sil svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%}
.dot.on{background:var(--green);box-shadow:0 0 8px rgba(95,215,154,.6)}
.dot.off{background:var(--red);box-shadow:0 0 8px rgba(240,112,92,.5)}
.pill{font-size:11.5px;border-radius:20px;padding:5px 11px;border:1px solid transparent;display:inline-block}
.pill.on{background:var(--green-soft);color:var(--green);border-color:rgba(95,215,154,.3)}
.pill.off{background:var(--red-soft);color:var(--red);border-color:rgba(240,112,92,.3)}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:rgba(227,192,90,.32)}
.pill.sade{background:var(--cam-2);color:var(--ink-2);border-color:var(--cizgi)}

/* ---- sorgu animasyonu ---- */
#sorguKat{position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  background:rgba(10,12,11,.86);backdrop-filter:blur(6px);animation:sorguGir .22s ease}
#sorguKat.cik{animation:sorguCik .3s ease forwards}
@keyframes sorguGir{from{opacity:0}to{opacity:1}}
@keyframes sorguCik{to{opacity:0}}
#sorguKat .kutu{text-align:center;max-width:min(76vw,320px)}
#sorguKat video{width:100%;max-width:260px;border-radius:18px;display:block;margin:0 auto}
#sorguKat .yazi{margin-top:14px;font-size:14.5px;font-weight:600;color:#fff}
#sorguKat .alt{margin-top:5px;font-size:12px;color:var(--ink-3)}
#sorguKat .nokta::after{content:"";animation:nokta 1.2s steps(4,end) infinite}
@keyframes nokta{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---- metalik panjur ---- */
.panjur{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,#2B2F33,#1C2023 40%,#23272B);
  box-shadow:0 6px 18px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.1)}
.panjur-bas{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:none;
  border:0;color:var(--ink);cursor:pointer;position:relative}
.panjur-bas::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px)}
.panjur-bas .rates{flex:1;margin:0}
.panjur-ok{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;flex:0 0 auto;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:transform .28s ease}
.panjur-ok i{display:block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:7px solid var(--gold);margin-top:2px}
.panjur.acik .panjur-ok{transform:rotate(180deg)}
.panjur-ic{max-height:0;overflow:hidden;transition:max-height .34s cubic-bezier(.4,0,.2,1)}
.panjur.acik .panjur-ic{max-height:220px}
.panjur-sat{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:rgba(0,0,0,.28);
  border:0;border-top:1px solid rgba(255,255,255,.08);color:var(--ink);text-align:left;cursor:pointer}
.panjur-sat:active{background:rgba(255,255,255,.06)}
.panjur-sat .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--gold-soft);border:1px solid rgba(227,192,90,.3);color:var(--gold)}
.panjur-sat .ic svg{width:17px;height:17px}
.panjur-sat b{font-size:14px;font-weight:600;display:block}
.panjur-sat small{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}
.panjur-sat .rozet{margin-left:auto;font-size:11px;font-weight:700;color:#1A1A1A;background:var(--gold);
  border-radius:20px;padding:2px 8px;min-width:20px;text-align:center}
.panjur-sat .rozet:empty{display:none}

/* ---- bolum basliklari ---- */
.bolum{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bolum .rz{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.18)}
.bolum .rz svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bolum b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;flex:1}
.bolum .sayi{font-size:11px;color:var(--ink-3);background:var(--cam-2);border:1px solid var(--cizgi);
  border-radius:20px;padding:3px 10px}
.rz.altin{background:linear-gradient(155deg,rgba(227,192,90,.30),rgba(227,192,90,.08));color:var(--gold)}
.rz.yesil{background:linear-gradient(155deg,rgba(95,215,154,.30),rgba(95,215,154,.08));color:var(--green)}
.rz.mavi{background:linear-gradient(155deg,rgba(111,176,245,.30),rgba(111,176,245,.08));color:var(--blue)}
.rz.kirmizi{background:linear-gradient(155deg,rgba(240,112,92,.30),rgba(240,112,92,.08));color:var(--red)}
.tur{font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;
  margin:12px 0 4px;display:flex;align-items:center;gap:9px}
.tur::after{content:"";flex:1;height:1px;background:var(--cizgi)}
.acts button.kirmizi{background:linear-gradient(155deg,rgba(240,112,92,.34),rgba(240,112,92,.12));
  border-color:rgba(240,112,92,.5);color:#FFD9D1}
.acts button.yesilb{background:linear-gradient(155deg,rgba(95,215,154,.32),rgba(95,215,154,.10));
  border-color:rgba(95,215,154,.5);color:#DCFFEE}
.acts button.mavib{background:linear-gradient(155deg,rgba(111,176,245,.32),rgba(111,176,245,.10));
  border-color:rgba(111,176,245,.5);color:#DCEEFF}

/* ---- belge satirlari ---- */
.dosya{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--cizgi)}
.dosya:first-child{border-top:none}
.dosya .tip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(155deg,rgba(227,192,90,.28),rgba(227,192,90,.08));
  border:1px solid rgba(227,192,90,.35);color:var(--gold)}
.dosya .tip svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dosya .bilgi{flex:1;min-width:0;text-align:left}
.dosya .bilgi b{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dosya .bilgi small{display:block;font-size:11px;color:var(--ink-3)}
.dosya .ops{display:flex;gap:6px;flex:0 0 auto}
.dosya .ops button{width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.2);
  background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,.06));
  color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.dosya .ops button:active{background:rgba(255,255,255,.3)}
.dosya .ops button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dosya .ops button.kirmizi{color:var(--red);border-color:rgba(240,112,92,.35);background:var(--red-soft)}


/* ---- sunum düzenleyici ---- */
#tuval{position:relative;width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--cizgi-2);
  background:#0B100E;touch-action:none;user-select:none;margin-bottom:12px}
#tuval .arka{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;pointer-events:none}
#tuval .olcu{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;
  padding:3px 8px;border-radius:20px;pointer-events:none;font-family:"IBM Plex Mono",monospace}
.oge{position:absolute;transform-origin:center center;touch-action:none;cursor:move}
.oge.sec{outline:2px dashed var(--gold);outline-offset:3px}
.oge img{width:100%;height:100%;display:block;pointer-events:none}
.oge .kutu{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;

// TKGM alani "7,722.87" gonderir: virgul binlik ayraci, nokta ondalik
function alanCoz(x){
  if(x == null) return null;
  const n = parseFloat(String(x).replace(/\s/g,"").replace(/,/g,""));
  return isFinite(n) ? n : null;
}

// "599.000" -> 599000 ; "1.496,5" -> 1496.5 ; "22000" -> 22000
function sayiCoz(x){
  if(x == null) return NaN;
  let t = String(x).trim().replace(/\s/g,"").replace(/[^\d.,-]/g,"");
  if(!t) return NaN;
  const nokta = t.lastIndexOf("."), virgul = t.lastIndexOf(",");
  if(nokta > -1 && virgul > -1){
    t = virgul > nokta ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,"");
  } else if(virgul > -1){
    t = (t.length - virgul - 1) === 3 && /^\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g,"") : t.replace(",",".");
  } else if(nokta > -1){
    if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,"");
  }
  const n = parseFloat(t);
  return isFinite(n) ? n : NaN;
}

function payOran(s){
  if(!s) return 1;
  const m = s.trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  if(!m || +m[2]===0) return null;
  return +m[1]/+m[2];
}

let FN = null;                              // calisan fonksiyon adi
const FN_ADAYLARI = ["tkgm","quick-task"];

async function tkgm(u){
  const adaylar = FN ? [FN] : FN_ADAYLARI;
  let sonHata = null;
  for(const ad2 of adaylar){
    const { data, error } = await sb.functions.invoke(ad2, { body:{ u } });
    if(error){ sonHata = error; continue; }          // fonksiyon yok, digerini dene
    FN = ad2;
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  throw new Error(sonHata?.message || "aracıya ulaşılamadı");
}
const dizi = d => {
  if(Array.isArray(d)) return d;
  if(!d || typeof d !== "object") return [];
  if(Array.isArray(d.features)) return d.features;
  for(const k of ["data","liste","items","result","results","rows","value"])
    if(Array.isArray(d[k])) return d[k];
  const ilk = Object.values(d).find(v=>Array.isArray(v));
  return ilk || [];
};
const duz = o => (o && typeof o === "object" && o.properties) ? { ...o.properties, ...o } : o;
const ad = o => {
  if(typeof o === "string") return o;
  o = duz(o); if(!o || typeof o !== "object") return String(o ?? "");
  const g = Object.keys(o).find(k=>/^(text|ad|adi|ad_i|name|isim|label|title|.*Ad|.*Adi)$/i.test(k) && typeof o[k]==="string" && o[k].trim());
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="string" && v.trim() && !/^\d+$/.test(v) && !/id$/i.test(k));
  return h ? h[1] : "";
};
const kim = o => {
  o = duz(o); if(!o || typeof o !== "object") return "";
  const g = Object.keys(o).find(k=>/^(id|value|.*Id|kod|no)$/i.test(k) && (typeof o[k]==="number" || /^\d+$/.test(String(o[k]??""))));
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="number" || /^\d+$/.test(String(v??"")));
  return h ? h[1] : "";
};

const zamanAsimi = (p, ms=9000) => Promise.race([p,
  new Promise((_,r)=>setTimeout(()=>r(new Error("zaman aşımı")), ms))]);

// adaylari sirayla dener, dolu liste donen ilkini kullanir
async function ilkCalisan(adaylar){
  const hatalar = [];
  for(const u of adaylar){
    try{
      const d = dizi(await zamanAsimi(tkgm(u)));
      if(d.length) return { u, d };
      hatalar.push(`${u} → boş döndü`);
    }catch(e){ hatalar.push(`${u} → ${e.message||e}`); }
  }
  const hata = new Error("hiçbir uç cevap vermedi");
  hata.detay = hatalar.join("\n\n");
  throw hata;
}

  `${TB}/idariYapi/mahalleListe/${id}`,

function taniYaz(baslik, detay){
  const kutu = document.getElementById("tani");
  if(!kutu) return toast(baslik);
  kutu.innerHTML = `<div class="card"><b style="font-size:13px">${esc(baslik)}</b>
    <pre style="white-space:pre-wrap;word-break:break-all;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--ink-2);margin:8px 0 0">${esc(detay)}</pre>
    <button class="btn ghost" style="margin-top:10px" onclick="kopyala(this)">Kopyala</button></div>`;
}
function kopyala(btn){
  const t = btn.parentElement.querySelector("pre").textContent;
  navigator.clipboard.writeText(t).then(()=>toast("Kopyalandı"),()=>toast("Kopyalanamadı"));
}
async function idariKur(pre, sonrasi){
  const S = k => document.getElementById(pre + k);
  const doldur = (el, list, bos) => {
    const temiz = list.map(o=>({ a:String(ad(o)||"").trim(), k:String(kim(o)||"") }))
                      .filter(o=>o.a && o.k)
                      .sort((x,y)=>x.a.localeCompare(y.a,"tr"));
    if(!temiz.length) throw new Error("liste okunamadı");
    el.innerHTML = `<option value="">${bos}</option>` +
      temiz.map(o=>`<option value="${esc(o.k)}">${esc(o.a)}</option>`).join("");
    el.disabled = false;
  };
  const coz = () => {
    ["il","ilce","mah"].forEach(k=>{
      const el = S(k);
      el.outerHTML = `<input id="${pre}${k}" class="${el.className}" placeholder="${
        k==="il"?"İl":k==="ilce"?"İlçe":"Mahalle / köy"}">`;
    });
  };
  try{
    const { d:iller } = await ilkCalisan(IL_UCLARI);
    doldur(S("il"), iller, "İl seç");
    S("ilce").disabled = true; S("mah").disabled = true;

    S("il").onchange = async () => {
      S("ilce").innerHTML = `<option value="">yükleniyor…</option>`;
      S("mah").innerHTML = `<option value="">önce ilçe seç</option>`; S("mah").disabled = true;
      if(!S("il").value) return;
      try{
        const { d } = await ilkCalisan(ILCE_UCLARI(S("il").value));
        doldur(S("ilce"), d, "İlçe seç");
      }catch(e){
        S("ilce").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("İlçe listesi gelmedi", e.detay || e.message);
      }
    };
    S("ilce").onchange = async () => {
      S("mah").innerHTML = `<option value="">yükleniyor…</option>`;
      if(!S("ilce").value) return;
      try{
        const { d } = await ilkCalisan(MAH_UCLARI(S("ilce").value));
        doldur(S("mah"), d, "Mahalle / köy seç");
      }catch(e){
        S("mah").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("Köy listesi gelmedi", e.detay || e.message);
      }
    };
    if(sonrasi) S("mah").onchange = sonrasi;
  }catch(e){
    coz();
    taniYaz("İl listesi gelmedi, elle yazabilirsin", e.detay || e.message);
  }
}
const secimAdi = (pre,k) => {
  const el = document.getElementById(pre+k);
  return el.tagName === "SELECT" ? (el.selectedOptions[0]?.textContent || "") : el.value.trim();
};

// Depoya sorgu.webp (animasyon) ve sorgu.mp3 (kisa ses) koyarsan kendiliginden kullanilir.
const SES_ACIK = () => localStorage.getItem("sesKapali") !== "1";

// dosya: sorgu.mp4 gibi; yoksa katman yine acilir, sadece video gorunmez
function sorguAnimasyonAc(baslik, alt, dosya){
  sorguAnimasyonKapat(true);
  const k = document.createElement("div");
  k.id = "sorguKat";
  k.innerHTML = `<div class="kutu">
    <video id="sorguVid" playsinline autoplay ${SES_ACIK() ? "" : "muted"}
      onerror="this.style.display='none'"><source src="${gv(dosya || "sorgu.mp4")}" type="video/mp4"></video>
    <div class="yazi">${esc(baslik || "Hazırlanıyor")}<span class="nokta"></span></div>
    <div class="alt">${esc(alt || "")}</div>
  </div>`;
  document.body.appendChild(k);
  const v = document.getElementById("sorguVid");
  if(v){
    v.volume = 0.7;
    v.play().catch(()=>{ v.muted = true; v.play().catch(()=>{}); });
    // video bitince son karede dursun, basa sarmasin
    v.addEventListener("ended", () => { try{ v.pause(); }catch(e){} });
  }
  return Date.now();
}

// en az belirtilen sure ekranda kalsin ki animasyon tamamlansin
async function sorguAnimasyonKapat(hemen, baslangic, enAz){
  const k = document.getElementById("sorguKat");
  if(!k) return;
  if(!hemen && baslangic){
    const gecen = Date.now() - baslangic;
    const bekle = Math.max(0, (enAz || 2400) - gecen);
    if(bekle) await new Promise(r=>setTimeout(r, bekle));
  }
  k.classList.add("cik");
  setTimeout(()=>k.remove(), 300);
}

async function harita(){
  app.innerHTML = head("Harita","go('ana')") + `
    <div class="ipt">
      <select id="hil" class="full">${""}</select>
      <select id="hilce"></select>
      <select id="hmah" class="full"></select>
      <input id="hada" inputmode="numeric" placeholder="Ada">
      <input id="hpar" inputmode="numeric" placeholder="Parsel">

    </div>

async function adaParselSorgu(){
  const mah = document.getElementById("hmah").value;
  const ada = document.getElementById("hada").value.trim();
  const par = document.getElementById("hpar").value.trim();
  if(!mah || !par) return toast("Mahalle ve parsel gerekli");

  document.getElementById("bilgi").innerHTML = `<div class="spin"></div>`;
  try{ ciz(await tkgm(`${TB3}/parsel/${mah}/${ada||0}/${par}`)); }
  catch(e){ document.getElementById("bilgi").innerHTML = `<div class="empty">Bulunamadı<br><small>${esc(e.message)}</small></div>`; }
}

async function noktaSorgu(lat,lng){
  document.getElementById("bilgi").innerHTML = `<div class="spin"></div>`;
  try{ ciz(await tkgm(`${TB3}/parsel/${lat}/${lng}`)); }
  catch(e){ document.getElementById("bilgi").innerHTML = `<div class="empty">Burada kayıtlı parsel yok</div>`; }
}

function ciz(f){
  if(!f || !f.geometry) throw new Error("Parsel bulunamadı");
  SONPARSEL = f;
  const m = merkez(f);
  if(KATMAN) HARITA.removeLayer(KATMAN);
  KATMAN = L.geoJSON(f, { style:{ color:"#C9A227", weight:2.5, fillColor:"#C9A227", fillOpacity:.18 } }).addTo(HARITA);
  HARITA.fitBounds(KATMAN.getBounds(), { padding:[30,30], maxZoom:18 });
  const p = f.properties || {};
  document.getElementById("bilgi").innerHTML = `
    <div class="card">
      <div style="font-size:12px;color:var(--ink-3)">${esc(p.ilAd||"")} · ${esc(p.ilceAd||"")} · ${esc(p.mahalleAd||"")}</div>
      <div style="font-size:18px;font-weight:600;margin-top:3px">Ada ${esc(p.adaNo||"—")} · Parsel ${esc(p.parselNo||"—")}</div>
      <div class="kv" style="margin-top:10px"><span>Yüzölçümü</span><b class="mono">${esc(p.alan||"—")} m²</b></div>
      <div class="kv"><span>Niteliği</span><b>${esc(p.nitelik||"—")}</b></div>
      <div class="kv"><span>Mevkii</span><b>${esc(p.mevkii||"—")}</b></div>
      <div class="acts">
        <button onclick="kmlIndir()">KML indir</button>
        <a class="dis" href="${earthUrl(m.lat, m.lng)}" target="_blank" rel="noopener">Earth'te aç</a>
        <a class="dis yesilb" href="${yandexUrl(m.lat, m.lng)}" target="_blank" rel="noopener">Yandex uydu</a>
        <a class="dis yesilb" href="${yandexPanoUrl(m.lat, m.lng)}" target="_blank" rel="noopener">Sokak görünümü</a>
        <a class="dis kirmizi" href="https://e-plan.gov.tr/" target="_blank" rel="noopener"
           onclick="eplanKunye(${m.lat},${m.lng})">İmar planı</a>
        ${ME.role==='admin'?`<button class="pri" onclick="haritadanKaydet()">Kaydet</button>`:""}
      </div>
    </div>`;
}

function merkez(f){
  const c = []; JSON.stringify(f.geometry.coordinates).replace(/\[(-?\d+\.?\d*),(-?\d+\.?\d*)\]/g,(m,a,b)=>{c.push([+a,+b]);return m;});
  const lng = c.reduce((s,p)=>s+p[0],0)/c.length, lat = c.reduce((s,p)=>s+p[1],0)/c.length;
  return { lat, lng };
}

function kmlMetni(f){
  const p = f.properties||{};
  const halka = g => (g.type==="Polygon"?[g.coordinates]:g.coordinates)
    .map(poly => poly[0].map(c=>`${c[0]},${c[1]},0`).join(" ")).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${p.ozet||"parsel"}</name>
<Style id="s"><LineStyle><color>ff27a2c9</color><width>3</width></LineStyle>
<PolyStyle><color>4027a2c9</color></PolyStyle></Style>
<Placemark><name>${p.mahalleAd||""} ${p.adaNo||""}/${p.parselNo||""}</name>
<description>${p.alan||""} m² · ${p.nitelik||""}</description><styleUrl>#s</styleUrl>
<Polygon><outerBoundaryIs><LinearRing><coordinates>${halka(f.geometry)}</coordinates>
</LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
}

function kmlIndir(){
  if(!SONPARSEL) return;
  const p = SONPARSEL.properties||{};
  const b = new Blob([kmlMetni(SONPARSEL)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${(p.mahalleAd||"parsel")}-${p.adaNo||0}-${p.parselNo||0}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

async function haritadanKaydet(){
  if(!SONPARSEL) return;
  const p = SONPARSEL.properties||{}, m = merkez(SONPARSEL);
  const kutu = document.querySelector("#bilgi .acts");
  if(kutu) kutu.innerHTML = `<div style="flex:1 1 100%;text-align:center;color:var(--ink-3);font-size:13px">kaydediliyor…</div>`;

  const { data:var_ } = await sb.from("parcels").select("id")
    .eq("mahalle", p.mahalleAd||"").eq("parsel", String(p.parselNo||""))
    .eq("ada", p.adaNo||null).limit(1);

  let kayitId = var_?.[0]?.id;
  if(!kayitId){
    const alan = alanCoz(p.alan);
    const { data:kayit, error } = await sb.from("parcels").insert({
      team_id:ME.team_id, il:p.ilAd||"", ilce:p.ilceAd||"", mahalle:p.mahalleAd||"",
      ada:p.adaNo||null, parsel:String(p.parselNo||""), alan_m2:alan, nitelik:p.nitelik||null,
      mevkii:p.mevkii||null, lat:m.lat, lng:m.lng, geojson:SONPARSEL, created_by:ME.id
    }).select().single();
    if(error){ ciz(SONPARSEL); return toast("Olmadı: "+error.message); }
    kayitId = kayit.id;
  }

  const { data:yKayit, error:yHata } = await sb.from("parcel_years")
    .insert({ parcel_id:kayitId, team_id:ME.team_id, yil:YEAR, aktif:true }).select().single();

  if(yHata && /duplicate|unique/i.test(yHata.message)){
    return sonucGoster(`Bu parsel ${YEAR} yılında zaten kayıtlı`, false);
  }
  if(yHata){ ciz(SONPARSEL); return toast("Olmadı: "+yHata.message); }

  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id, action:"parsel eklendi",
    entity:"parcels", entity_id:kayitId, detail:`${p.ozet||""} (haritadan)` });
  sonucGoster(`${p.mahalleAd||""} ${p.adaNo||""}/${p.parselNo||""} · ${YEAR} yılına kaydedildi`, true);
  const alanD = alanCoz(p.alan) || 0;
  hisseSor(yKayit.id, alanD);
}

// kaydettikten hemen sonra tek soru: tek tapu mu, hisseli mi
function hisseSor(yilKaydiId, alan){
  const kutu = document.querySelector("#bilgi .acts");
  if(!kutu) return;
  kutu.insertAdjacentHTML("beforeend", `
    <div style="flex:1 1 100%;border-top:1px solid var(--cizgi);margin-top:12px;padding-top:14px">
      <label>Bu yer sizde nasıl kayıtlı?</label>
      <select id="ktd">
        <option value="tek">Tek tapu · tamamı bizim</option>
        <option value="hisseli">Hisseli · payımız var</option>
      </select>
      <div id="khp" style="display:none;margin-top:12px">${hisseAlanlari("k")}</div>
      <button class="btn" style="margin-top:14px" id="khk">Bilgiyi kaydet</button>
      <p class="ipuc" style="margin:10px 2px 0">Toplam alan (${nf(alan)} m²) değişmez; sadece payınız kaydedilir.</p>
    </div>`);

  const td = document.getElementById("ktd"), hp = document.getElementById("khp");
  const hesap = hisseBagla("k", alan);
  td.onchange = () => { hp.style.display = td.value === "hisseli" ? "block" : "none"; hesap(); };

  document.getElementById("khk").onclick = async e => {
    const hisseli = td.value === "hisseli";
    const yeni = { tapu_durumu: td.value, hisse_pay: null, hisse_m2: null };
    if(hisseli){
      const r = hesap(); if(!r) return toast("Hisse bilgisini düzelt");
      yeni.hisse_pay = r.pay; yeni.hisse_m2 = r.m2;
    }
    e.target.disabled = true; e.target.textContent = "Kaydediliyor…";
    const { error } = await sb.from("parcel_years").update(yeni).eq("id", yilKaydiId);
    e.target.disabled = false; e.target.textContent = "Bilgiyi kaydet";
    if(error) return toast("Olmadı: "+error.message);
    e.target.parentElement.innerHTML =
      `<div style="color:var(--green);font-size:13px;font-weight:600;padding-top:12px;border-top:1px solid var(--cizgi)">✓ Tapu bilgisi kaydedildi</div>`;
  };
}

// pay girisi: tapudaki oran ya da dogrudan metrekare
function hisseAlanlari(p, mevcutPay, mevcutM2){
  const oranMi = !mevcutM2 || !!mevcutPay;
  return `<label>Payınızı nasıl gireceksin?</label>
    <select id="${p}bic">
      <option value="oran"${oranMi?" selected":""}>Tapudaki oran · 1/4, 3/16…</option>
      <option value="m2"${oranMi?"":" selected"}>Doğrudan metrekare</option>
    </select>
    <div id="${p}oranK" style="margin-top:10px${oranMi?"":";display:none"}">
      <label>Hisse payı</label><input id="${p}oran" value="${esc(mevcutPay||"")}" placeholder="1/16"></div>
    <div id="${p}m2K" style="margin-top:10px${oranMi?";display:none":""}">
      <label>Payınız (m²)</label><input id="${p}m2" inputmode="decimal" value="${mevcutM2??""}" placeholder="236"></div>
    <div id="${p}bilgi" style="font-size:12px;color:var(--ink-3);margin-top:8px"></div>`;
}

// alanlari birbirine bagla; hesaplayan islevi dondur
function hisseBagla(p, alan){
  const g = k => document.getElementById(p+k);
  const hesap = () => {
    if(!g("bic")) return null;
    const bic = g("bic").value;
    g("oranK").style.display = bic === "oran" ? "block" : "none";
    g("m2K").style.display   = bic === "m2"   ? "block" : "none";
    if(bic === "oran"){
      const o = payOran(g("oran").value);
      if(o === null){ g("bilgi").innerHTML = `<span style="color:var(--red)">1/4 gibi yaz</span>`; return null; }
      const m2 = Math.round(alan * o);
      g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(m2)} m²`;
      return { pay: g("oran").value.trim(), m2 };
    }
    const m2 = sayiCoz(g("m2").value);
    if(!isFinite(m2) || m2 <= 0){ g("bilgi").innerHTML = `<span style="color:var(--red)">Metrekare yaz</span>`; return null; }
    const yuzde = alan ? (m2/alan*100) : 0;
    g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(Math.round(m2))} m²${alan?` (%${yuzde.toFixed(1)})`:""}`;
    return { pay: null, m2: Math.round(m2) };
  };
  ["bic","oran","m2"].forEach(k => { const el = g(k); if(el){ el.oninput = hesap; el.onchange = hesap; } });
  hesap();
  return hesap;
}

function sonucGoster(mesaj, basarili){
  const kutu = document.querySelector("#bilgi .acts");
  if(kutu) kutu.innerHTML = `
    <div style="flex:1 1 100%;display:flex;align-items:center;gap:10px;background:${basarili?"var(--green-soft)":"var(--gold-soft)"};
      border-radius:11px;padding:12px 14px;color:${basarili?"var(--green)":"var(--gold)"};font-size:13px;font-weight:600">
      <span style="font-size:16px">${basarili?"✓":"!"}</span><span style="flex:1">${esc(mesaj)}</span></div>
    <button style="flex:1 1 100%" onclick="go('araziler')">Arazilerde gör</button>`;
  toast(mesaj);
}

const BELGE_AD = { tapu:"Tapu", cap:"Çap", kml:"KML", resim:"Fotoğraf", video:"Video",
                   sunum:"Sunum", arastirma:"Araştırma", vekalet:"Vekalet", muvafakat:"Muvafakatname", diger:"Diğer" };

async function dosyaSec(kabul){
  return new Promise(res=>{
    const g = document.createElement("input");
    g.type = "file"; g.accept = kabul || "image/*,application/pdf";
    g.onchange = () => res(g.files[0] || null);
    g.click();
  });
}

async function dosyaYukle(file, tur, parselId, capCfg){
  const uz = (file.name.split(".").pop() || "bin").toLowerCase();
  const yol = `${ME.team_id}/${parselId || "genel"}/${tur}-${Date.now()}.${uz}`;
  const { error } = await sb.storage.from("arsatakip").upload(yol, file);
  if(error) throw error;
  const { data, error:e2 } = await sb.from("documents").insert({
    team_id:ME.team_id, parcel_id:parselId || null, kind:tur, file_path:yol,
    file_name:file.name, mime_type:file.type, size_bytes:file.size, created_by:ME.id,
    ...(capCfg ? { cap_config: capCfg } : {})
  }).select().single();
  if(e2) throw e2;
  return data;
}

async function dosyaAc(yol){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 3600);
  if(error) return toast("Açılamadı: " + error.message);
  window.open(data.signedUrl, "_blank");
}

async function belgeSil(belgeId, yol){
  if(!confirm("Bu belge silinsin mi?")) return false;
  await sb.storage.from("arsatakip").remove([yol]);
  const { error } = await sb.from("documents").delete().eq("id", belgeId);
  if(error){ toast("Olmadı: " + error.message); return false; }
  toast("Silindi"); return true;
}

const BELGE_IKON = { tapu:"file", cap:"vector", kml:"globe", resim:"photo", video:"photo",
                     sunum:"photo", arastirma:"note", vekalet:"file", muvafakat:"file", diger:"file" };

// her yerde ayni gorunen dosya satiri: goruntule + indir + paylas (+ duzenle, sil)
function dosyaSatiri(b, silHtml, duzenleHtml){
  return `<div class="dosya">
    <span class="tip">${svg(BELGE_IKON[b.kind]||"file")}</span>
    <button class="bilgi" onclick="dosyaAc('${esc(b.file_path)}')">
      <b>${esc(b.file_name||"belge")}</b>
      <small>${BELGE_AD[b.kind]||b.kind}${b.size_bytes?" · "+boyut(b.size_bytes):""}${b.created_at?" · "+new Date(b.created_at).toLocaleDateString("tr-TR"):""}</small></button>
    <span class="ops">
      <button onclick="dosyaAc('${esc(b.file_path)}')" aria-label="Görüntüle">${svg("goz")}</button>
      <button onclick="dosyaIndir('${esc(b.file_path)}','${esc(b.file_name||"belge")}')" aria-label="İndir">${svg("indir")}</button>

// dosyayi telefonun paylas menusune ver: whatsapp, mail, ne varsa
async function dosyaPaylas(yol, ad2){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 86400);
  if(error) return toast("Paylaşılamadı: " + error.message);
  try{
    if(navigator.canShare){
      const r = await fetch(data.signedUrl);
      const blob = await r.blob();
      const dosya = new File([blob], ad2, { type: blob.type || "application/octet-stream" });
      if(navigator.canShare({ files:[dosya] })){
        await navigator.share({ files:[dosya], title: ad2 });
        return;
      }
    }
    if(navigator.share){ await navigator.share({ title: ad2, url: data.signedUrl }); return; }
    await navigator.clipboard.writeText(data.signedUrl);
    toast("Bağlantı kopyalandı, yapıştırıp gönderebilirsin");
  }catch(e){
    if(String(e).includes("AbortError")) return;
    try{ await navigator.clipboard.writeText(data.signedUrl); toast("Bağlantı kopyalandı"); }
    catch(_){ toast("Paylaşılamadı"); }
  }
}

async function dosyaIndir(yol, ad2){
  const { data, error } = await sb.storage.from("arsatakip").createSignedUrl(yol, 3600, { download: ad2 });
  if(error) return toast("İndirilemedi: " + error.message);
  const a = document.createElement("a");
  a.href = data.signedUrl; a.download = ad2; a.click();
  toast("İndiriliyor");
}

const boyut = b => !b ? "" : b > 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.round(b/1024)+" KB";

/* ================= araziler ================= */

let acikGrup = null;
// TR harflerini sadelestirip karsilastir: "MUHACİRKADI" ile "Muhacırkadı" ayni sayilsin
const sade = x => String(x||"")
  .replace(/[İIıi]/g,"i").replace(/[Şş]/g,"s").replace(/[Ğğ]/g,"g")
  .replace(/[Üü]/g,"u").replace(/[Öö]/g,"o").replace(/[Çç]/g,"c")
  .toLowerCase().replace(/[^a-z0-9]/g,"");
const anahtar = p => [sade(p.il), sade(p.ilce), sade(p.mahalle)].join("|");
const duzgun = x => String(x||"").trim().toLocaleLowerCase("tr")
  .replace(/(^|[\s\-\/])([a-zçğıöşü])/g, (m,a,b)=>a+b.toLocaleUpperCase("tr"));

// ayni koydeki parselleri tek baslik altinda topla
function grupla(rows){
  const g = {};
  rows.forEach(r=>{
    const p = r.parcels, k = anahtar(p);
    (g[k] ||= { il:duzgun(p.il), ilce:duzgun(p.ilce), mah:duzgun(p.mahalle), list:[] }).list.push(r);
  });
  return Object.entries(g).sort((a,b)=>a[1].mah.localeCompare(b[1].mah,"tr"));
}

function grupBasi(k, gr, acik, sayiEk){
  return `<button class="ghd${acik?" open":""}" onclick="acikGrup=${acik?"null":`'${k.replace(/'/g,"\\'")}'`};${sayiEk}()">
    <span class="chev">›</span>
    <span class="pinico">${svg("pin")}</span>
    <span class="txt"><b>${esc(gr.mah)}</b><small>${esc(gr.il)} · ${esc(gr.ilce)}</small></span>
    <span class="say">${gr.list.length} parsel</span></button>`;
}

async function araziler(){
  app.innerHTML = head("Araziler","go('ana')") + `
    <div class="bar">
      <select class="year" id="yil">${yilSecenek()}</select>
      <input class="search" id="ara" placeholder="129/7 veya köy adı">
    </div><div id="liste"><div class="spin"></div></div>
    ${ME.role==='admin'?`<button class="fab" onclick="go('yeni')">+</button>`:""}`;
  document.getElementById("yil").onchange = e => { YEAR = +e.target.value; araziListele(); };
  document.getElementById("ara").oninput = () => araziListele();
  araziListele();
}
const yilSecenek = () => {
  let o = "";
  for(let i=2060;i>=2020;i--) o += `<option value="${i}"${i===YEAR?" selected":""}>${i}</option>`;
  return o;
};

async function araziListele(){
  const box = document.getElementById("liste");
  const q = (document.getElementById("ara")?.value||"").toLowerCase().trim();
  const { data, error } = await sb.from("parcel_years")
    .select("id,aktif,parcels(id,il,ilce,mahalle,ada,parsel,alan_m2,nitelik)")
    .eq("yil", YEAR);
  if(error) return box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  let rows = (data||[]).filter(r=>r.parcels);
  if(q) rows = rows.filter(r=>{
    const p = r.parcels;
    return `${p.il} ${p.ilce} ${p.mahalle} ${p.ada||""}/${p.parsel}`.toLowerCase().includes(q);
  });
  if(!rows.length) return box.innerHTML = `<div class="empty"><b>${YEAR} boş</b>
    ${ME.role==='admin'?"Haritadan ya da sağ alttaki + ile parsel ekle.":"Bu yıl için henüz kayıt yok."}</div>`;

  box.innerHTML = grupla(rows).map(([k,gr])=>{
    const acik = acikGrup === k;
    return `<div class="grp">${grupBasi(k, gr, acik, "araziListele")}
      ${acik ? gr.list.map(parselSatir).join("") : ""}</div>`;
  }).join("");
}

function parselSatir(r){
  const p = r.parcels;
  return `<div class="rw">
    <span class="kod">${esc(p.ada||"—")}/${esc(p.parsel)}</span>
    <button class="orta" onclick="go('parsel','${p.id}')">
      <b>${esc(p.nitelik||"Parsel")}</b>
      <small>${nf(p.alan_m2)} m²${r.aktif?"":" · pasif"}</small></button>
    <span class="sag">
      <span class="dot ${r.aktif?"on":"off"}"></span>
      ${ME.role==='admin'?`<button class="sil" aria-label="Sil" onclick="parselSil('${r.id}','${p.id}','${esc(p.mahalle)} ${esc(p.ada||"")}/${esc(p.parsel)}')">${svg("trash")}</button>`:""}
    </span></div>`;
}

async function parselSil(yilKaydiId, parselId, etiket){
  if(!confirm(`${etiket}\n\n${YEAR} kaydından silinsin mi? Diğer yıllardaki kaydı ve belgeleri durur.`)) return;
  const { error } = await sb.from("parcel_years").delete().eq("id", yilKaydiId);
  if(error) return toast("Olmadı: "+error.message);
  const { data: kalan } = await sb.from("parcel_years").select("id").eq("parcel_id", parselId);
  if(!kalan || !kalan.length){
    if(confirm("Bu parselin başka yıl kaydı kalmadı. Parseli notları ve belgeleriyle birlikte tamamen silelim mi?"))
      await sb.from("parcels").delete().eq("id", parselId);
  }
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"parsel silindi", entity:"parcels", entity_id:parselId, detail:`${etiket} (${YEAR})` });
  toast("Silindi");
  araziListele();
}

const CLC_AD = {
  "111":"Kesintisiz kent dokusu","112":"Kesintili kent dokusu","121":"Sanayi veya ticaret alanı",
  "122":"Yol ve demiryolu ağı","123":"Liman","124":"Havaalanı","131":"Maden ocağı","132":"Döküm sahası",
  "133":"İnşaat alanı","141":"Kentsel yeşil alan","142":"Spor ve eğlence alanı",
  "211":"Sulanmayan tarım arazisi","212":"Sürekli sulanan tarım arazisi","213":"Çeltik tarlası",
  "221":"Bağ","222":"Meyve bahçesi","223":"Zeytinlik","231":"Otlak / mera",
  "241":"Yıllık ve çok yıllık karışık tarım","242":"Karmaşık ekim düzeni",
  "243":"Doğal bitki örtüsüyle karışık tarım arazisi","244":"Ağaçlı tarım arazisi",
  "311":"Yapraklı orman","312":"İğne yapraklı orman","313":"Karışık orman",
  "321":"Doğal çayır","322":"Fundalık","323":"Maki","324":"Geçiş halinde orman-çalılık",
  "331":"Kumsal / kumul","332":"Çıplak kaya","333":"Seyrek bitki örtülü alan","334":"Yanmış alan",
  "411":"İç sulak alan","412":"Turbalık","421":"Tuzlu bataklık","422":"Tuzla",
  "511":"Akarsu","512":"Su kütlesi","521":"Kıyı lagünü","523":"Deniz"
};

async function corineSinif(lat, lng){
  const d = 0.0009;
  const u = "https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer/identify"
    + `?f=json&geometryType=esriGeometryPoint&sr=4326&layers=all&tolerance=3&returnGeometry=false`
    + `&imageDisplay=400,400,96&mapExtent=${lng-d},${lat-d},${lng+d},${lat+d}`
    + `&geometry=${encodeURIComponent(JSON.stringify({ x:lng, y:lat, spatialReference:{ wkid:4326 } }))}`;
  const r = await zamanAsimi(tkgm(u), 15000);
  const sonuc = r?.results?.[0];
  if(!sonuc) return null;
  const oz = sonuc.attributes || {};
  const metin = Object.values(oz).map(v=>String(v)).join(" ");
  const kod = (metin.match(/\b([1-5]\d\d)\b/) || [])[1];
  return { kod, ad: (kod && CLC_AD[kod]) || sonuc.value || sonuc.layerName || null };
}

const OVER = "https://overpass-api.de/api/interpreter?data=";
let CEVRE_SON = null;   // son cikarilan cevre ozeti

function uzaklik(a, b){                       // metre
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b.lng-a.lng) * Math.cos(rad((a.lat+b.lat)/2));
  const df = rad(b.lat-a.lat);
  return Math.round(Math.sqrt(dl*dl + df*df) * R);
}
const km = m => m >= 1000 ? (m/1000).toFixed(1).replace(".",",") + " km" : m + " m";

const YOL_AD = { motorway:"Otoyol", trunk:"Devlet yolu", primary:"Ana yol", secondary:"Tali yol",
  tertiary:"Bağlantı yolu", unclassified:"Köy yolu", residential:"Yerleşim yolu", track:"Tarla yolu",
  service:"Servis yolu" };
const YER_AD = { city:"Şehir", town:"İlçe/kasaba", village:"Köy", hamlet:"Mezra", suburb:"Mahalle" };

const OVER_SUNUCU = [
  "https://overpass.kumi.systems/api/interpreter?data=",
  "https://overpass-api.de/api/interpreter?data=",
  "https://overpass.osm.ch/api/interpreter?data=",
  "https://overpass.private.coffee/api/interpreter?data="
];

// 0 = tam, 1 = orta, 2 = cok hafif
function cevreSorgusu(lat, lng, kademe){
  if(kademe === 2) return `[out:json][timeout:15];(
    node(around:9000,${lat},${lng})[place~"^(town|village)$"];
    way(around:900,${lat},${lng})[highway];
  );out center tags;`;
  if(kademe === 1) return `[out:json][timeout:20];(
    node(around:10000,${lat},${lng})[place~"^(city|town|village)$"];
    way(around:1200,${lat},${lng})[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|track)$"];
    way(around:1500,${lat},${lng})[waterway~"^(river|stream|canal)$"];
    way(around:1200,${lat},${lng})[landuse];
  );out center tags;`;
  return `[out:json][timeout:30];(

    way(around:2000,${lat},${lng})[highway];

    way(around:2500,${lat},${lng})[natural=water];

    node(around:8000,${lat},${lng})[amenity~"^(school|hospital|pharmacy|fuel)$"];
    way(around:4000,${lat},${lng})[power=line];
    node(around:8000,${lat},${lng})[man_made=water_well];
  );out center tags;`;
}

// sunucular ve sorgu kademeleri arasinda sirayla dener
async function cevreVerisi(lat, lng, bildir){
  const denemeler = [];
  [0,1,2].forEach(kademe=>{
    OVER_SUNUCU.forEach(s2=>denemeler.push({ s:s2, kademe }));
  });
  let sonHata = null;
  for(let i=0;i<denemeler.length;i++){
    const d = denemeler[i];
    if(bildir) bildir(i === 0 ? "Çevre taranıyor…"
      : `Sunucular meşgul, tekrar deneniyor (${i+1}/${denemeler.length})…`);
    try{
      const r = await zamanAsimi(tkgm(d.s + encodeURIComponent(cevreSorgusu(lat, lng, d.kademe))), 35000);
      if(r?.elements?.length) return r;
      sonHata = new Error("boş cevap");
    }catch(e){ sonHata = e; }
    await new Promise(r=>setTimeout(r, 800));
  }
  throw sonHata || new Error("çevre verisi alınamadı");
}

function cevreOzet(veri, merkezNokta){
  const ogeler = (veri?.elements || []).map(e=>{
    const nk = e.center ? { lat:e.center.lat, lng:e.center.lon } : { lat:e.lat, lng:e.lon };
    if(!isFinite(nk.lat)) return null;
    return { t:e.tags || {}, nk, u:uzaklik(merkezNokta, nk) };
  }).filter(Boolean).sort((a,b)=>a.u-b.u);

  const ilk = f => ogeler.find(f);
  const hepsi = f => ogeler.filter(f);

  const yerler = hepsi(o=>o.t.place && o.t.name).slice(0,5);
  const yollar = {};
  hepsi(o=>o.t.highway && YOL_AD[o.t.highway]).forEach(o=>{
    if(!yollar[o.t.highway]) yollar[o.t.highway] = o;
  });
  const su = ilk(o=>o.t.waterway || o.t.natural === "water");
  const okul = ilk(o=>o.t.amenity === "school");
  const saglik = ilk(o=>o.t.amenity === "hospital" || o.t.amenity === "pharmacy");
  const akaryakit = ilk(o=>o.t.amenity === "fuel");
  const elektrik = ilk(o=>o.t.power === "line");
  const kuyu = ilk(o=>o.t.man_made === "water_well");

  const kullanim = {};
  hepsi(o=>o.t.landuse).forEach(o=>{ kullanim[o.t.landuse] = (kullanim[o.t.landuse]||0)+1; });

  return { yerler, yollar, su, okul, saglik, akaryakit, elektrik, kuyu, kullanim };
}

const LANDUSE_AD = { farmland:"Tarım arazisi", meadow:"Çayır", forest:"Orman", orchard:"Meyve bahçesi",
  vineyard:"Bağ", residential:"Yerleşim", industrial:"Sanayi", commercial:"Ticaret", quarry:"Taş ocağı",
  cemetery:"Mezarlık", farmyard:"Çiftlik avlusu", grass:"Otlak", village_green:"Köy meydanı" };

// beyaz zemine kurumsal rapor cizer; satir ortadan bolunmez
const RAP = {
  kirmizi:"#B3232E", koyu:"#7E141C", acik:"#FBE9EA", metin:"#16181A",
  gri:"#5A6169", cizgi:"#E6E8EA", zebra:"#FAFAFB"
};

function raporPng(baslik, altBaslik, bolumler){
  const G = 1000;
  const SAYFA = Math.round(G * 277 / 190);
  const UST = 108, ALT = 118, satirY = 38;

  const yerlestir = (ciz) => {
    let sayfa = 0, y = 0;
    const dip = () => (sayfa+1)*SAYFA - ALT;
    const yeniSayfa = () => { sayfa++; y = sayfa*SAYFA + UST; };
    const yer = h => { if(y + h + 24 > dip()) yeniSayfa(); };

    y = 118;
    ciz && ciz.baslik(y);
    y = 300;

    bolumler.forEach(b2=>{
      if(b2.gorsel){
        const gy = (G-140) * b2.oran;
        yer(58 + gy);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        ciz && ciz.gorsel(b2.gorsel, y, gy);
        y += gy + 16;
      }else if(b2.metin){
        yer(58 + 44*2);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        yaziSar(b2.metin, G-150, 25).forEach(t=>{
          yer(40);
          ciz && ciz.paragraf(t, y);
          y += t === "" ? 18 : 40;
        });
      }else{
        yer(58 + satirY*2);
        ciz && ciz.bolum(b2.baslik, y);
        y += 58;
        (b2.satirlar||[]).forEach(([k,v],i)=>{
          yer(satirY);
          ciz && ciz.satir(k, v, y, i);
          y += satirY;
        });
      }
      y += 40;
    });
    return (sayfa+1) * SAYFA;
  };

  const Y = yerlestir(null);
  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);

  const sayfaSayisi = Math.round(Y/SAYFA);
  for(let i=0;i<sayfaSayisi;i++){
    const t = i*SAYFA;
    if(i === 0){
      const gr = x.createLinearGradient(0,0,G,240);
      gr.addColorStop(0, RAP.koyu); gr.addColorStop(1, RAP.kirmizi);
      x.fillStyle = gr; x.fillRect(0,0,G,240);
      x.fillStyle = "rgba(255,255,255,.16)";
      x.beginPath(); x.moveTo(G-330,0); x.lineTo(G,0); x.lineTo(G,240); x.closePath(); x.fill();
    }else{
      x.fillStyle = RAP.kirmizi; x.fillRect(0,t,G,12);
      x.fillStyle = RAP.gri; x.font = "400 19px Arial"; x.textAlign = "left";
      x.fillText(baslik, 60, t + 58);
    }
    // alt bant
    x.fillStyle = RAP.cizgi; x.fillRect(60, t + SAYFA - 74, G-120, 1);
    x.fillStyle = RAP.gri; x.font = "400 18px Arial";
    x.textAlign = "left";  x.fillText("Parsel Parsel · çapımız alayınıza yeter", 60, t + SAYFA - 44);
    x.textAlign = "right"; x.fillText(`${i+1} / ${sayfaSayisi}`, G-60, t + SAYFA - 44);
    x.textAlign = "left";
  }

  yerlestir({
    baslik: y => {
      x.textAlign = "left";
      x.fillStyle = "#FFFFFF"; x.font = "700 46px Arial";
      x.fillText(baslik, 60, y + 22);
      x.fillStyle = "rgba(255,255,255,.86)"; x.font = "400 23px Arial";
      altBaslik.split("\n").forEach((t,i)=> x.fillText(t, 60, y + 66 + i*32));
      x.fillStyle = RAP.gri; x.font = "400 19px Arial";
      x.fillText(new Date().toLocaleString("tr-TR"), 60, 282);
    },
    bolum: (ad2, y) => {
      x.fillStyle = RAP.acik;
      x.beginPath(); x.roundRect(60, y-34, G-120, 50, 8); x.fill();
      x.fillStyle = RAP.kirmizi;
      x.beginPath(); x.roundRect(60, y-34, 7, 50, 4); x.fill();
      x.fillStyle = RAP.koyu; x.font = "700 25px Arial"; x.textAlign = "left";
      x.fillText(ad2.toLocaleUpperCase("tr"), 82, y);
    },
    satir: (k, v, y, i) => {
      if(i % 2 === 0){ x.fillStyle = RAP.zebra; x.fillRect(60, y-26, G-120, satirY); }
      x.font = "400 23px Arial"; x.fillStyle = RAP.gri; x.textAlign = "left";
      x.fillText(String(k).slice(0,58), 78, y);
      x.font = "700 23px Arial"; x.fillStyle = RAP.metin; x.textAlign = "right";
      x.fillText(String(v), G-78, y);
      x.textAlign = "left";
    },
    gorsel: (im, y, gy) => {
      x.save();
      x.shadowColor = "rgba(0,0,0,.22)"; x.shadowBlur = 18; x.shadowOffsetY = 6;
      x.fillStyle = "#FFF";
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.fill();
      x.restore();
      x.save();
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.clip();
      try{ x.drawImage(im, 70, y, G-140, gy); }catch(e){}
      x.restore();
      x.strokeStyle = RAP.cizgi; x.lineWidth = 2;
      x.beginPath(); x.roundRect(70, y, G-140, gy, 10); x.stroke();
    },
    paragraf: (t, y) => {
      x.font = "400 25px Arial"; x.fillStyle = RAP.metin; x.textAlign = "left";
      x.fillText(t, 78, y);
    }
  });

  return { png: { dataUrl: c.toDataURL("image/png"), canvas: c, sayfaPx: SAYFA }, oran: Y/G };
}

// uzun metni satirlara bol
function yaziSar(metin, genislik, punto){
  OLCER.font = `400 ${punto}px Arial`;
  const cikti = [];
  String(metin).split("\n").forEach(parca=>{
    if(!parca.trim()){ cikti.push(""); return; }
    let satir = "";
    parca.split(" ").forEach(kelime=>{
      const deneme = satir ? satir + " " + kelime : kelime;
      if(OLCER.measureText(deneme).width > genislik){ cikti.push(satir); satir = kelime; }
      else satir = deneme;
    });
    if(satir) cikti.push(satir);
  });
  return cikti;
}

function pngToPdfBlob(kaynak, oran){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const gen = 190, c = kaynak.canvas, sayfaPx = kaynak.sayfaPx || c.height;

  for(let y = 0, i = 0; y < c.height; y += sayfaPx, i++){
    const h = Math.min(sayfaPx, c.height - y);
    const t = document.createElement("canvas");
    t.width = c.width; t.height = h;
    const tx = t.getContext("2d");
    tx.fillStyle = "#FFFFFF"; tx.fillRect(0,0,t.width,t.height);
    tx.drawImage(c, 0, y, c.width, h, 0, 0, c.width, h);
    if(i) pdf.addPage();
    pdf.addImage(t.toDataURL("image/png"), "PNG", 10, 10, gen, gen * (h/c.width));
  }
  return pdf.output("blob");
}

// Sentinel-2 NDVI: bitki ortusu zaman serisi
async function ndviSerisi(geojson, yilSayisi){
  if(!geojson?.geometry) return null;
  const bitis = new Date();
  const baslangic = new Date(bitis.getFullYear() - (yilSayisi||3), bitis.getMonth(), 1);
  const g = geojson.geometry.type === "MultiPolygon"
    ? { type:"Polygon", coordinates: geojson.geometry.coordinates[0] }
    : geojson.geometry;

  const { data, error } = await sb.functions.invoke(FN || "quick-task", { body:{
    mod:"ndvi", geometry:g,
    baslangic: baslangic.toISOString().slice(0,10) + "T00:00:00Z",
    bitis: bitis.toISOString().slice(0,10) + "T23:59:59Z"
  }});
  if(error || !data || data.error) return null;

  const kayitlar = [];
  (data.data||[]).forEach(o=>{
    const d = o.outputs?.ndvi?.bands?.B0?.stats;
    if(!d || d.sampleCount === 0 || d.mean == null) return;
    kayitlar.push({ tarih: o.interval.from.slice(0,7), ort: Math.round(d.mean*1000)/1000 });
  });
  if(kayitlar.length < 4) return null;

  // yillik ortalamalar ve egilim
  const yillar = {};
  kayitlar.forEach(k=>{ const y = k.tarih.slice(0,4); (yillar[y] ||= []).push(k.ort); });
  const yilOrt = Object.entries(yillar).map(([y,a])=>({ yil:y, ort: a.reduce((x,z)=>x+z,0)/a.length }));
  const enYuksek = kayitlar.reduce((a,b)=> b.ort > a.ort ? b : a, kayitlar[0]);
  const enDusuk  = kayitlar.reduce((a,b)=> b.ort < a.ort ? b : a, kayitlar[0]);
  const genelOrt = kayitlar.reduce((t,k)=>t+k.ort,0)/kayitlar.length;

  return { kayitlar, yilOrt, enYuksek, enDusuk, genelOrt: Math.round(genelOrt*1000)/1000 };
}

// TCMB tuketici fiyat endeksi: eski emsalleri bugune tasimak icin
let TUFE_ONBELLEK = null;
async function tufeEndeksi(){
  if(TUFE_ONBELLEK) return TUFE_ONBELLEK;
  const bugun = new Date();
  const bas = new Date(bugun.getFullYear()-4, 0, 1);
  const bicim = d => `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
  try{
    const { data, error } = await sb.functions.invoke(FN || "quick-task", { body:{
      mod:"tcmb", seri:"TP.FG.J0", baslangic:bicim(bas), bitis:bicim(bugun) }});
    if(error || !data || data.error || !data.items) return null;
    const harita = {};

// bir tarihteki fiyati bugune tasi
function bugunkuDeger(fiyat, tarih, endeks){
  if(!endeks || !tarih) return fiyat;
  const anahtarlar = Object.keys(endeks).sort();
  if(!anahtarlar.length) return fiyat;
  const oAy = String(tarih).slice(0,7);
  const oDeger = endeks[oAy] || endeks[anahtarlar.find(k=>k >= oAy)] || null;
  const sonDeger = endeks[anahtarlar[anahtarlar.length-1]];
  if(!oDeger || !sonDeger) return fiyat;
  return fiyat * (sonDeger / oDeger);
}

// parselin sekil ozellikleri
function sekilAnalizi(M){
  if(!M || M.length < 3) return null;
  const alan = alanHesap(M);
  let cevre = 0;
  for(let i=0;i<M.length;i++){
    const j = (i+1)%M.length;
    cevre += Math.hypot(M[j][0]-M[i][0], M[j][1]-M[i][1]);
  }
  const ana = anaYon(M), dik = [-ana[1], ana[0]];
  const a = M.map(p=>p[0]*ana[0]+p[1]*ana[1]);
  const d = M.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  const boy = Math.max(...a)-Math.min(...a);
  const en  = Math.max(...d)-Math.min(...d);
  // duzgunluk: 1 = daireye yakin, 0 = cok girintili
  const duzgunluk = Math.round((4*Math.PI*alan/(cevre*cevre))*100)/100;
  return {
    cevre: Math.round(cevre), boy: Math.round(boy*10)/10, en: Math.round(en*10)/10,
    oran: Math.round((boy/Math.max(1,en))*100)/100, duzgunluk,
    yorum: duzgunluk >= 0.7 ? "düzgün geometri" : duzgunluk >= 0.45 ? "kabul edilebilir geometri" : "girintili / dar geometri"
  };
}

    try{ veri = await zamanAsimi(tkgm(sunucu + encodeURIComponent(sorgu)), 25000); if(veri?.elements) break; }catch(e){}
  }
  if(!veri?.elements?.length) return { uzunluk:0, yol:null };

  const lat0 = halkaCoord.reduce((t,k)=>t+k[1],0)/halkaCoord.length;
  const kx = Math.cos(lat0*Math.PI/180)*111320, ky = 110540;
  const x0 = halkaCoord[0][0], y0 = halkaCoord[0][1];
  const metre = (lo,la) => [ (lo-x0)*kx, (la-y0)*ky ];

  const yollar = [];
  veri.elements.forEach(e=>{
    if(!e.geometry) return;
    const nok = e.geometry.map(g=>metre(g.lon, g.lat));
    for(let i=0;i<nok.length-1;i++) yollar.push({ a:nok[i], b:nok[i+1], ad:e.tags?.name, tip:e.tags?.highway });
  });
  if(!yollar.length) return { uzunluk:0, yol:null };

  const parcaMesafe = (p, s) => {
    const vx = s.b[0]-s.a[0], vy = s.b[1]-s.a[1];
    const uzun = vx*vx + vy*vy;
    let t = uzun ? ((p[0]-s.a[0])*vx + (p[1]-s.a[1])*vy)/uzun : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p[0]-(s.a[0]+t*vx), p[1]-(s.a[1]+t*vy));
  };

  let toplam = 0, enYakinYol = null, enYakinMesafe = Infinity;
  for(let i=0;i<M.length;i++){
    const j = (i+1)%M.length;
    const orta = [ (M[i][0]+M[j][0])/2, (M[i][1]+M[j][1])/2 ];
    const kenarUz = Math.hypot(M[j][0]-M[i][0], M[j][1]-M[i][1]);
    let enAz = Infinity, yol = null;
    yollar.forEach(s2=>{ const m = parcaMesafe(orta, s2); if(m < enAz){ enAz = m; yol = s2; } });
    if(enAz < enYakinMesafe){ enYakinMesafe = enAz; enYakinYol = yol; }
    if(enAz <= 14) toplam += kenarUz;
  }
  return {
    uzunluk: Math.round(toplam*10)/10,
    mesafe: isFinite(enYakinMesafe) ? Math.round(enYakinMesafe) : null,
    yol: enYakinYol ? { ad: enYakinYol.ad, tip: YOL_AD[enYakinYol.tip] || enYakinYol.tip } : null
  };
}

/* ================= potansiyel analizi ================= */
// Ucretsiz ve acik kaynaklardan parselin yatirim potansiyelini olcer:
//  - OpenStreetMap: yerlesim/sanayi/insaat alanlari, bina yogunlugu, yollar
//  - Copernicus CORINE 2018 ve 2012: arazi ortusu ve degisimi
//  - OpenTopoData (SRTM): yukseklik izgarasindan egim ve baki

async function yukseklikIzgarasi(M, merkezNokta){
  // parselin uzerinde 3x3 nokta ornekle
  const lat = merkezNokta.lat, lng = merkezNokta.lng;
  const d = 0.0008;
  const noktalar = [];
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++)
    noktalar.push(`${(lat + i*d).toFixed(6)},${(lng + j*d).toFixed(6)}`);
  const u = "https://api.opentopodata.org/v1/srtm30m?locations=" + encodeURIComponent(noktalar.join("|"));
  const r = await zamanAsimi(tkgm(u), 20000);
  const y = (r?.results||[]).map(o=>o.elevation).filter(v=>typeof v === "number");
  if(y.length < 9) return null;

  // 3x3 izgaradan egim ve baki
  const h = (i,j) => y[i*3 + j];
  const adimX = 111320 * Math.cos(lat*Math.PI/180) * d;
  const adimY = 110540 * d;
  const dzdx = ((h(0,2)+2*h(1,2)+h(2,2)) - (h(0,0)+2*h(1,0)+h(2,0))) / (8*adimX);
  const dzdy = ((h(2,0)+2*h(2,1)+h(2,2)) - (h(0,0)+2*h(0,1)+h(0,2))) / (8*adimY);
  const egimYuzde = Math.sqrt(dzdx*dzdx + dzdy*dzdy) * 100;
  let bakiAci = Math.atan2(dzdy, -dzdx) * 180/Math.PI;
  if(bakiAci < 0) bakiAci += 360;
  const yonAd = ["Kuzey","Kuzeydoğu","Doğu","Güneydoğu","Güney","Güneybatı","Batı","Kuzeybatı"][Math.round(bakiAci/45)%8];
  return {
    ortalama: Math.round(y.reduce((a,b)=>a+b,0)/y.length),
    enDusuk: Math.min(...y), enYuksek: Math.max(...y),
    egim: Math.round(egimYuzde*10)/10,
    baki: yonAd
  };
}

async function yapilasmaVerisi(lat, lng){
  const sorgu = `[out:json][timeout:25];(
    way(around:1500,${lat},${lng})[landuse~"^(residential|industrial|commercial|construction|retail)$"];
    way(around:600,${lat},${lng})[building];
    node(around:1500,${lat},${lng})[place~"^(town|village)$"];
    way(around:2500,${lat},${lng})[highway~"^(motorway|trunk|primary|secondary)$"];
  );out center tags;`;
  for(const sunucu of OVER_SUNUCU){
    try{
      const r = await zamanAsimi(tkgm(sunucu + encodeURIComponent(sorgu)), 30000);
      if(r?.elements) return r;
    }catch(e){}
  }
  return null;
}

async function corineKarsilastir(lat, lng){
  const cek = async (yil) => {
    const d = 0.0009;
    const u = `https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC${yil}_WM/MapServer/identify`
      + `?f=json&geometryType=esriGeometryPoint&sr=4326&layers=all&tolerance=3&returnGeometry=false`
      + `&imageDisplay=400,400,96&mapExtent=${lng-d},${lat-d},${lng+d},${lat+d}`
      + `&geometry=${encodeURIComponent(JSON.stringify({ x:lng, y:lat, spatialReference:{ wkid:4326 } }))}`;
    const r = await zamanAsimi(tkgm(u), 15000);
    const sonuc = r?.results?.[0];
    if(!sonuc) return null;
    const metin = Object.values(sonuc.attributes||{}).map(v=>String(v)).join(" ");
    const kod = (metin.match(/\b([1-5]\d\d)\b/) || [])[1];
    return kod ? { kod, ad: CLC_AD[kod] || sonuc.value } : null;
  };
  const [y2018, y2012] = await Promise.all([cek(2018).catch(()=>null), cek(2012).catch(()=>null)]);
  return { y2018, y2012 };
}

// butun kaynaklari topla ve puanla
async function potansiyelAnalizi(p, bildir, hazirOsm){
  const m = { lat:p.lat, lng:p.lng };
  const M = capHalkasi(p);
  const sonuc = { puan:0, etkiler:[], veri:{} };
  const say = t => { if(bildir) bildir(t); };

  // ayni sorguyu tekrar atmamak icin hazir veri verilebilir
  let osm = hazirOsm || null;
  if(!osm){ say("Yapılaşma verisi taranıyor…"); osm = await yapilasmaVerisi(m.lat, m.lng); }
  if(osm){
    const ogeler = (osm.elements||[]).map(e=>{
      const nk = e.center ? { lat:e.center.lat, lng:e.center.lon } : { lat:e.lat, lng:e.lon };
      if(!isFinite(nk.lat)) return null;
      return { t:e.tags||{}, u:uzaklik(m, nk) };
    }).filter(Boolean).sort((a,b)=>a.u-b.u);

    const binalar = ogeler.filter(o=>o.t.building);
    const yerlesim = ogeler.find(o=>o.t.landuse === "residential");
    const sanayi = ogeler.find(o=>o.t.landuse === "industrial" || o.t.landuse === "commercial" || o.t.landuse === "retail");
    const insaat = ogeler.find(o=>o.t.landuse === "construction");
    const anaYol = ogeler.find(o=>o.t.highway);

    sonuc.veri.binaSayisi = binalar.length;
    sonuc.veri.yerlesim = yerlesim; sonuc.veri.sanayi = sanayi;
    sonuc.veri.insaat = insaat; sonuc.veri.anaYol = anaYol;

    if(yerlesim){
      if(yerlesim.u <= 300) sonuc.etkiler.push(["Yerleşim alanına 300 m'den yakın", 22]);
      else if(yerlesim.u <= 800) sonuc.etkiler.push([`Yerleşim alanına ${km(yerlesim.u)}`, 14]);
      else if(yerlesim.u <= 1500) sonuc.etkiler.push([`Yerleşim alanına ${km(yerlesim.u)}`, 6]);
    }else sonuc.etkiler.push(["Yakında işaretli yerleşim alanı yok", -8]);

    if(sanayi && sanayi.u <= 1000) sonuc.etkiler.push([`Sanayi/ticaret alanına ${km(sanayi.u)}`, 16]);
    if(insaat) sonuc.etkiler.push([`Aktif inşaat alanı ${km(insaat.u)} mesafede`, 12]);
    if(binalar.length >= 30) sonuc.etkiler.push([`600 m içinde ${binalar.length} yapı · yoğun doku`, 14]);
    else if(binalar.length >= 8) sonuc.etkiler.push([`600 m içinde ${binalar.length} yapı`, 8]);
    else if(binalar.length === 0) sonuc.etkiler.push(["600 m içinde yapı yok", -6]);

    if(anaYol){
      if(anaYol.u <= 500) sonuc.etkiler.push([`Ana ulaşım aksına ${km(anaYol.u)}`, 15]);
      else if(anaYol.u <= 2000) sonuc.etkiler.push([`Ana ulaşım aksına ${km(anaYol.u)}`, 7]);
    }
  }

  say("Arazi örtüsü ve değişimi sorgulanıyor…");
  const clc = await corineKarsilastir(m.lat, m.lng).catch(()=>({}));
  sonuc.veri.clc = clc;
  if(clc?.y2018?.kod){
    const k = clc.y2018.kod;
    if(k.startsWith("11") || k === "121" || k === "133")
      sonuc.etkiler.push([`Arazi örtüsü: ${clc.y2018.ad}`, 18]);
    else if(k === "212" || k === "213") sonuc.etkiler.push([`Arazi örtüsü: ${clc.y2018.ad}`, 8]);
    else if(k.startsWith("31") || k.startsWith("32")) sonuc.etkiler.push([`Arazi örtüsü: ${clc.y2018.ad}`, -6]);
    else if(k.startsWith("41") || k.startsWith("51")) sonuc.etkiler.push([`Arazi örtüsü: ${clc.y2018.ad}`, -16]);
  }
  if(clc?.y2012?.kod && clc?.y2018?.kod && clc.y2012.kod !== clc.y2018.kod){
    const yapiya = clc.y2018.kod.startsWith("1") && !clc.y2012.kod.startsWith("1");
    sonuc.etkiler.push([
      `2012'de ${clc.y2012.ad}, 2018'de ${clc.y2018.ad}` + (yapiya ? " · yapılaşmaya dönüşüm" : ""),
      yapiya ? 20 : 4
    ]);
  }

  say("Eğim ve bakı hesaplanıyor…");
  const yuk = await yukseklikIzgarasi(M, m).catch(()=>null);
  sonuc.veri.yukseklik = yuk;
  if(yuk){
    if(yuk.egim <= 3) sonuc.etkiler.push([`Eğim %${yuk.egim} · düz arazi`, 12]);
    else if(yuk.egim <= 8) sonuc.etkiler.push([`Eğim %${yuk.egim} · hafif eğimli`, 5]);
    else if(yuk.egim <= 15) sonuc.etkiler.push([`Eğim %${yuk.egim} · orta eğimli`, -6]);
    else sonuc.etkiler.push([`Eğim %${yuk.egim} · dik arazi`, -16]);
    if(["Güney","Güneydoğu","Güneybatı"].includes(yuk.baki))
      sonuc.etkiler.push([`Bakı: ${yuk.baki} · güneş alan yön`, 6]);
  }

  sonuc.puan = Math.max(0, Math.min(100, 50 + sonuc.etkiler.reduce((t,[,y])=>t+y, 0)));
  sonuc.yorum = sonuc.puan >= 75 ? "Yüksek potansiyel"
    : sonuc.puan >= 60 ? "Potansiyeli güçlü"
    : sonuc.puan >= 45 ? "Orta potansiyel"
    : sonuc.puan >= 30 ? "Sınırlı potansiyel" : "Düşük potansiyel";
  return sonuc;
}

let PARCA_LISTE = [];

function parcaDurum(o){
  if(o.satildi) return { ad:"satıldı", renk:"#6FB0F5", zemin:"rgba(111,176,245,.14)", solgun:false };
  if(o.satilik) return { ad:"satılık", renk:"#5FD79A", zemin:"rgba(95,215,154,.12)", solgun:false };
  return { ad:"pasif", renk:"#7E8A84", zemin:"rgba(255,255,255,.04)", solgun:true };
}

function parcaListeCiz(parselId){
  const kutu = document.getElementById("parcaListe");
  if(!kutu) return;
  if(!PARCA_LISTE.length){
    kutu.innerHTML = `<div class="empty"><b>Parça yok</b>Çaptan alabilir ya da elle ekleyebilirsin.</div>`;
    return;
  }

  kutu.innerHTML = PARCA_LISTE.map((o,i)=>{
    const d = parcaDurum(o);
    return `
      <div class="card" style="padding:12px;background:${d.zemin};border-color:${d.renk}33;${d.solgun?"opacity:.72":""}">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:${d.renk};
            background:rgba(0,0,0,.25);border:1px solid ${d.renk}55;border-radius:9px;padding:6px 11px">
            ${esc(o.no || (i+1))}</span>
          <span style="font-size:11.5px;color:${d.renk};font-weight:600;letter-spacing:.04em;text-transform:uppercase">${d.ad}</span>

          <button class="pill ${o.satildi?"gold":"sade"}" style="flex:1" onclick="parcaDurumDegis(${i},'satildi','${parselId}')">Satıldı</button>
          <button class="pill ${!o.satilik&&!o.satildi?"off":"sade"}" style="flex:1" onclick="parcaDurumDegis(${i},'pasif','${parselId}')">Pasif</button>
        </div>

        <div class="field" style="margin:0 0 10px"><label>Parçanın adı</label>
          <input id="pa${i}" value="${esc(o.ad||"")}" placeholder="1 nolu parça"></div>
        <div class="row2">
          <div class="field" style="margin:0 0 10px"><label>Alan (m²)</label>
            <input id="pm${i}" inputmode="decimal" value="${o.m2 != null ? nfAkilli(o.m2) : ""}"></div>
          <div class="field" style="margin:0 0 10px"><label>Maliyet (₺/m²)</label>
            <input id="pk${i}" inputmode="decimal" value="${o.maliyet_m2 != null ? nfAkilli(o.maliyet_m2) : ""}"></div>
        </div>
        <div class="field" style="margin:0 0 10px"><label>Satış fiyatı (₺/m²)</label>
          <input id="pf${i}" inputmode="decimal" value="${o.m2_fiyat != null ? nfAkilli(o.m2_fiyat) : ""}"></div>

        <div style="background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;margin-bottom:10px" id="ph${i}"></div>

          <input id="pn${i}" value="${esc(o.notu||"")}" placeholder="isteğe bağlı"></div>
      </div>`;
  }).join("") + `<div id="parcaOzet"></div>`;

  PARCA_LISTE.forEach((o,i)=>{

      o.maliyet_m2 = sayiCoz(g("pk").value) || 0;
      o.m2_fiyat = sayiCoz(g("pf").value) || 0;
      o.notu = g("pn").value;

      const satis = o.m2 * o.m2_fiyat;
      const maliyet = o.m2 * o.maliyet_m2;
      const kar = satis - maliyet;
      const oran = maliyet > 0 ? (kar/maliyet*100) : null;
      g("ph").innerHTML = `
        <div class="kv" style="padding:4px 0"><span>Satış bedeli</span>
          <b class="mono">${satis ? nf(Math.round(satis)) + " ₺" : "—"}</b></div>
        <div class="kv" style="padding:4px 0"><span>Maliyet</span>
          <b class="mono">${maliyet ? nf(Math.round(maliyet)) + " ₺" : "—"}</b></div>
        <div class="kv" style="padding:4px 0;border-top:1px solid var(--cizgi);margin-top:4px;padding-top:7px">
          <span style="color:${kar>=0?"var(--green)":"var(--red)"}">Kâr</span>
          <b class="mono" style="color:${kar>=0?"var(--green)":"var(--red)"}">
            ${(satis||maliyet) ? nf(Math.round(kar)) + " ₺" + (oran != null ? ` · %${oran.toFixed(1).replace(".",",")}` : "") : "—"}</b></div>`;
      parcaOzetCiz();
    };
    ["pa","pm","pk","pf","pn"].forEach(k=>{ const el = g(k); if(el) el.oninput = gun; });
    gun();
  });
}

function parcaDurumDegis(i, durum, parselId){
  const o = PARCA_LISTE[i];

  if(durum === "pasif"){ o.satilik = false; o.satildi = false; }
  parcaListeCiz(parselId);
}

  const satilan = say(o=>o.satildi);

    <b class="mono"${renk?` style="color:${renk}"`:""}>${deger}</b></div>`;

    <div class="card" style="border-color:rgba(227,192,90,.3)">
      <div class="bolum"><span class="rz altin">${svg("money")}</span><b>Toplu özet</b></div>
      ${satir("Toplam parça", `${PARCA_LISTE.length} adet`)}
      ${satir("Parçaların toplam alanı", nf2(tumAlan) + " m²")}
      <div class="tur">Satılık</div>
      ${satir("Parça / alan", `${satilik.length} adet · ${nf2(stAlan)} m²`)}
      ${satir("Ortalama m² fiyatı", stAlan ? nf(Math.round(stSatis/stAlan)) + " ₺" : "—")}
      ${satir("Ortalama m² maliyeti", stAlan ? nf(Math.round(stMal/stAlan)) + " ₺" : "—")}
      ${satir("Satış bedeli", nf(Math.round(stSatis)) + " ₺")}
      ${satir("Maliyet", nf(Math.round(stMal)) + " ₺")}
      ${satir("Beklenen kâr", nf(Math.round(bekleyenKar)) + " ₺" + oran(stMal),
              bekleyenKar>=0?"var(--green)":"var(--red)")}
      ${satilan.length ? `<div class="tur">Satılan</div>
        ${satir("Parça / alan", `${satilan.length} adet · ${nf2(sdAlan)} m²`)}
        ${satir("Tahsil edilen", nf(Math.round(sdSatis)) + " ₺")}
        ${satir("Gerçekleşen kâr", nf(Math.round(gerceklesenKar)) + " ₺" + oran(sdMal),

async function parcalariCaptanAl(parselId){
  const { data:p } = await sb.from("parcels").select("cap_config").eq("id",parselId).single();
  const cfg = p?.cap_config;
  if(!cfg || Array.isArray(cfg) || !cfg.parcalar?.length) return toast("Bu parselde kayıtlı çap yok");
  const mevcut = {};
  PARCA_LISTE.forEach(o=>{ if(o.no) mevcut[String(o.no)] = o; });
  PARCA_LISTE = cfg.parcalar.map((o,i)=>{
    const eski = mevcut[String(o.no)] || {};
    return {
      id: eski.id, no: String(o.no || (i+1)),
      ad: eski.ad || `${o.no || (i+1)} nolu parça`,
      m2: +o.m2 || 0,
      satilik: eski.satilik !== undefined ? eski.satilik : true,
      satildi: eski.satildi || false,
      m2_fiyat: eski.m2_fiyat ?? null, maliyet_m2: eski.maliyet_m2 ?? null,
      notu: eski.notu || "", sira: i
    };
  });
  parcaListeCiz(parselId);
  toast(`${PARCA_LISTE.length} parça çaptan alındı, kaydetmeyi unutma`);
}

function parcaSatirEkle(parselId){
  PARCA_LISTE.push({ no: String(PARCA_LISTE.length+1), ad:"", m2:0, satilik:true, satildi:false,
    m2_fiyat:null, maliyet_m2:null, notu:"", sira: PARCA_LISTE.length });
  parcaListeCiz(parselId);
}

function parcaSil(i, parselId){
  const o = PARCA_LISTE[i];
  if(o.id){ o._sil = true; PARCA_LISTE.splice(i,1); SILINECEK_PARCA.push(o.id); }
  else PARCA_LISTE.splice(i,1);
  parcaListeCiz(parselId);
}
let SILINECEK_PARCA = [];

async function parcalariKaydet(parselId){
  try{
    if(SILINECEK_PARCA.length){
      await sb.from("parca").delete().in("id", SILINECEK_PARCA);
      SILINECEK_PARCA = [];
    }
    const yeni = PARCA_LISTE.filter(o=>!o.id).map((o,i)=>({
      team_id:ME.team_id, parcel_id:parselId, no:o.no, ad:o.ad, m2:o.m2||null,
      satilik:!!o.satilik, satildi:!!o.satildi, m2_fiyat:o.m2_fiyat||null,
      maliyet_m2:o.maliyet_m2||null, notu:o.notu||null, sira:o.sira ?? i
    }));
    if(yeni.length) await sb.from("parca").insert(yeni);
    for(const o of PARCA_LISTE.filter(o=>o.id)){
      await sb.from("parca").update({ no:o.no, ad:o.ad, m2:o.m2||null, satilik:!!o.satilik,
        satildi:!!o.satildi, m2_fiyat:o.m2_fiyat||null, maliyet_m2:o.maliyet_m2||null,
        notu:o.notu||null, sira:o.sira ?? 0 }).eq("id", o.id);
    }
    toast("Parçalar kaydedildi");
    go("parsel", parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}
