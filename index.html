<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F0D">
<title>ArsaTakip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0B0F0D;
  --surface:#131917;
  --surface-2:#1A2220;
  --line:rgba(233,226,208,.10);
  --line-2:rgba(233,226,208,.18);
  --ink:#EDE9DE;
  --ink-2:#9AA39C;
  --ink-3:#69736C;
  --gold:#C9A227;
  --gold-soft:rgba(201,162,39,.14);
  --green:#4FB783;
  --green-soft:rgba(79,183,131,.14);
  --red:#D9614F;
  --red-soft:rgba(217,97,79,.14);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(233,226,208,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(233,226,208,.028) 1px,transparent 1px);
  background-size:56px 56px;
}
.wrap{position:relative;max-width:520px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold);text-decoration:none}
.hide{display:none!important}

/* ---- ust bar ---- */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px;position:relative}
.top .back{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:19px;color:var(--ink-2);flex:0 0 auto}
.top .back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top .back.gold{color:var(--gold);border-color:rgba(201,162,39,.35);background:var(--gold-soft)}
.top h1{font-size:19px;flex:1}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}

/* ---- kur seridi ---- */
.rates{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px 16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.rates::-webkit-scrollbar{display:none}
.rate{flex:0 0 auto;min-width:104px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rate .k{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.rate .v{font-size:16px;font-weight:600;margin-top:2px}
.rate .d{font-size:11px;margin-top:1px;color:var(--ink-3)}
.up{color:var(--green)} .down{color:var(--red)}
.stamp{font-size:11px;color:var(--ink-3);margin:-8px 0 18px;display:flex;gap:6px;align-items:center}

/* ---- kategori kartlari ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;position:relative;overflow:hidden;transition:border-color .18s,transform .18s}
.tile:active{transform:scale(.985)}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;margin-bottom:12px}
.tile .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15px;font-weight:600}
.tile small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.tile.wide .ic{margin:0}
.tile.soon::after{content:"yakında";position:absolute;top:12px;right:12px;font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:20px;padding:2px 8px}

/* ---- form ---- */
label{display:block;font-size:12px;color:var(--ink-2);margin:0 0 6px}
input,select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;outline:none;transition:border-color .15s
}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;background:var(--gold);color:#171203;font-weight:700;border-radius:12px;padding:14px;text-align:center;letter-spacing:-.01em}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2);font-weight:600}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-soft)}
.btn[disabled]{opacity:.5}

/* ---- listeler ---- */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.year{border:1px solid var(--line-2);border-radius:20px;padding:7px 14px;font-size:13px;background:var(--surface);width:auto;min-width:96px}
.search{flex:1}
.group{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid transparent}
.ghead.open{border-bottom-color:var(--line)}
.ghead b{font-size:14px;font-weight:600;flex:1}
.ghead small{font-size:12px;color:var(--ink-3)}
.ghead .chev{color:var(--ink-3);transition:transform .2s}
.ghead.open .chev{transform:rotate(90deg)}
.pr{padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;display:block}
.pr:first-child{border-top:none}
.prtop{display:flex;align-items:baseline;gap:8px}
.prtop .n{font-size:11px;color:var(--ink-3);width:14px}
.prtop b{font-size:15px;font-weight:600;flex:1}
.prtop .m2{font-size:13px;color:var(--ink-2)}
.meta{display:flex;gap:14px;align-items:center;margin-top:9px;font-size:12px;color:var(--ink-3)}
.meta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;vertical-align:-3px;margin-right:4px}
.dot{width:9px;height:9px;border-radius:50%;margin-left:auto}
.dot.on{background:var(--green)} .dot.off{background:var(--red)}
.pill{font-size:11px;border-radius:20px;padding:3px 10px}
.pill.on{background:var(--green-soft);color:var(--green)}
.pill.off{background:var(--red-soft);color:var(--red)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.kv span{color:var(--ink-2)}
.fab{position:fixed;right:calc(50% - 260px + 16px);bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#171203;font-size:26px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:20}
@media(max-width:552px){.fab{right:16px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--surface-2);border:1px solid rgba(201,162,39,.5);border-radius:12px;padding:13px 18px;font-size:14px;font-weight:600;z-index:60;max-width:88%;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.spin{width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--gold);border-radius:50%;animation:s .7s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- harita ---- */
#map{height:320px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--surface);margin-bottom:14px}
.leaflet-container{background:#0F1412}
.leaflet-control-attribution{background:rgba(11,15,13,.75)!important;color:var(--ink-3)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-bar a{background:var(--surface-2)!important;color:var(--ink)!important;border-color:var(--line)!important}
.ipt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ipt select,.ipt input{width:auto;flex:1 1 46%;padding:11px 12px;font-size:14px}
.ipt select{background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px}
.ipt .full{flex:1 1 100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{flex:1 1 30%;border:1px solid var(--line-2);border-radius:11px;padding:11px 8px;font-size:13px;font-weight:600;background:var(--surface-2)}
.acts button.pri{background:var(--gold);color:#171203;border-color:var(--gold)}
.ipuc{font-size:12px;color:var(--ink-3);margin:-4px 2px 12px}

/* ---- grup listesi ---- */
.grp{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ghd{display:flex;align-items:center;gap:11px;padding:15px 14px;width:100%;text-align:left}
.ghd .pinico{width:32px;height:32px;border-radius:9px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:0 0 auto}
.ghd .pinico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ghd .txt{flex:1;min-width:0}
.ghd .txt b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ghd .txt small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ghd .say{font-size:11px;color:var(--gold);background:var(--gold-soft);border-radius:20px;padding:4px 11px;font-weight:600}
.ghd .chev{color:var(--ink-3);transition:transform .2s;font-size:17px}
.ghd.open .chev{transform:rotate(90deg)}
.rw{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.rw .kod{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:7px 10px;flex:0 0 auto;letter-spacing:-.02em}
.rw .orta{flex:1;min-width:0;text-align:left}
.rw .orta b{display:block;font-size:14px;font-weight:500}
.rw .orta small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rw .sag{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.rw .sil{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);color:var(--ink-3);display:grid;place-items:center}
.rw .sil svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rw .sil:active{color:var(--red);border-color:var(--red-soft)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin"></div></div>
<div id="toast"></div>

<script>
(function(){
  var kutu = document.getElementById("app");
  function yaz(baslik, detay){
    if(!kutu) return;
    kutu.innerHTML = '<div class="empty"><b>'+baslik+'</b>'
      + '<div style="font-size:12px;color:var(--ink-3);margin:10px 0 16px;word-break:break-word">'+detay+'</div>'
      + '<button class="btn ghost" onclick="location.reload()">Tekrar dene</button></div>';
  }
  window.__yaz = yaz;
  window.addEventListener("error", function(e){
    if(window.__acildi) return;
    if(e.target && e.target.tagName === "SCRIPT")
      return yaz("Kütüphane yüklenemedi", "Engellenen adres: " + (e.target.src||"?") + " — ağ ya da reklam engelleyici olabilir.");
    yaz("Kod hatası", (e.message||"bilinmiyor") + " (satır " + (e.lineno||"?") + ")");
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    if(window.__acildi) return;
    yaz("Bağlantı hatası", String((e.reason && e.reason.message) || e.reason || "bilinmiyor"));
  });
  setTimeout(function(){
    if(window.__acildi) return;
    if(typeof window.supabase === "undefined") return yaz("Supabase kütüphanesi gelmedi", "cdn.jsdelivr.net adresine ulaşılamıyor olabilir.");
    if(typeof window.L === "undefined") return yaz("Harita kütüphanesi gelmedi", "cdnjs.cloudflare.com adresine ulaşılamıyor olabilir.");
    if(kutu && kutu.querySelector(".spin")) yaz("Sunucu cevap vermedi", "Supabase'e ulaşılamadı ya da açılış kodu takıldı.");
  }, 12000);
})();
</script>

function alanCoz(x){
  if(x == null) return null;
  const n = parseFloat(String(x).replace(/\s/g,"").replace(/,/g,""));
  return isFinite(n) ? n : null;
}

function payOran(s){
  if(!s) return 1;
  const m = s.trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  if(!m || +m[2]===0) return null;
  return +m[1]/+m[2];
}

function girisEkrani(){
  app.innerHTML = `

/* ================= ust bar ================= */

function head(title, back){

const TB   = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api";
const TB3  = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api";

let FN = null;                              // calisan fonksiyon adi
const FN_ADAYLARI = ["tkgm","quick-task"];

async function tkgm(u){
  const adaylar = FN ? [FN] : FN_ADAYLARI;
  let sonHata = null;
  for(const ad2 of adaylar){
    const { data, error } = await sb.functions.invoke(ad2, { body:{ u } });
    if(error){ sonHata = error; continue; }          // fonksiyon yok, digerini dene
    FN = ad2;
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  throw new Error(sonHata?.message || "aracıya ulaşılamadı");
}
const dizi = d => {
  if(Array.isArray(d)) return d;
  if(!d || typeof d !== "object") return [];
  if(Array.isArray(d.features)) return d.features;
  for(const k of ["data","liste","items","result","results","rows","value"])
    if(Array.isArray(d[k])) return d[k];
  const ilk = Object.values(d).find(v=>Array.isArray(v));
  return ilk || [];
};
const duz = o => (o && typeof o === "object" && o.properties) ? { ...o.properties, ...o } : o;
const ad = o => {
  if(typeof o === "string") return o;
  o = duz(o); if(!o || typeof o !== "object") return String(o ?? "");
  const g = Object.keys(o).find(k=>/^(text|ad|adi|ad_i|name|isim|label|title|.*Ad|.*Adi)$/i.test(k) && typeof o[k]==="string" && o[k].trim());
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="string" && v.trim() && !/^\d+$/.test(v) && !/id$/i.test(k));
  return h ? h[1] : "";
};
const kim = o => {
  o = duz(o); if(!o || typeof o !== "object") return "";
  const g = Object.keys(o).find(k=>/^(id|value|.*Id|kod|no)$/i.test(k) && (typeof o[k]==="number" || /^\d+$/.test(String(o[k]??""))));
  if(g) return o[g];
  const h = Object.entries(o).find(([k,v])=>typeof v==="number" || /^\d+$/.test(String(v??"")));
  return h ? h[1] : "";
};

const zamanAsimi = (p, ms=9000) => Promise.race([p,
  new Promise((_,r)=>setTimeout(()=>r(new Error("zaman aşımı")), ms))]);

// adaylari sirayla dener, dolu liste donen ilkini kullanir
async function ilkCalisan(adaylar){
  const hatalar = [];
  for(const u of adaylar){
    try{
      const d = dizi(await zamanAsimi(tkgm(u)));
      if(d.length) return { u, d };
      hatalar.push(`${u} → boş döndü`);
    }catch(e){ hatalar.push(`${u} → ${e.message||e}`); }
  }
  const hata = new Error("hiçbir uç cevap vermedi");
  hata.detay = hatalar.join("\n\n");
  throw hata;
}

async function idariKur(pre, sonrasi){
  const S = k => document.getElementById(pre + k);
  const doldur = (el, list, bos) => {
    const temiz = list.map(o=>({ a:String(ad(o)||"").trim(), k:String(kim(o)||"") }))
                      .filter(o=>o.a && o.k)
                      .sort((x,y)=>x.a.localeCompare(y.a,"tr"));
    if(!temiz.length) throw new Error("liste okunamadı");
    el.innerHTML = `<option value="">${bos}</option>` +
      temiz.map(o=>`<option value="${esc(o.k)}">${esc(o.a)}</option>`).join("");
    el.disabled = false;
  };
  const coz = () => {
    ["il","ilce","mah"].forEach(k=>{
      const el = S(k);
      el.outerHTML = `<input id="${pre}${k}" class="${el.className}" placeholder="${
        k==="il"?"İl":k==="ilce"?"İlçe":"Mahalle / köy"}">`;
    });
  };
  try{
    const { d:iller } = await ilkCalisan(IL_UCLARI);
    doldur(S("il"), iller, "İl seç");
    S("ilce").disabled = true; S("mah").disabled = true;

    S("il").onchange = async () => {
      S("ilce").innerHTML = `<option value="">yükleniyor…</option>`;
      S("mah").innerHTML = `<option value="">önce ilçe seç</option>`; S("mah").disabled = true;
      if(!S("il").value) return;
      try{
        const { d } = await ilkCalisan(ILCE_UCLARI(S("il").value));
        doldur(S("ilce"), d, "İlçe seç");
      }catch(e){
        S("ilce").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("İlçe listesi gelmedi", e.detay || e.message);
      }
    };
    S("ilce").onchange = async () => {
      S("mah").innerHTML = `<option value="">yükleniyor…</option>`;
      if(!S("ilce").value) return;
      try{
        const { d } = await ilkCalisan(MAH_UCLARI(S("ilce").value));
        doldur(S("mah"), d, "Mahalle / köy seç");
      }catch(e){
        S("mah").innerHTML = `<option value="">gelmedi</option>`;
        taniYaz("Köy listesi gelmedi", e.detay || e.message);
      }
    };
    if(sonrasi) S("mah").onchange = sonrasi;
  }catch(e){
    coz();
    taniYaz("İl listesi gelmedi, elle yazabilirsin", e.detay || e.message);
  }
}

function ciz(f){
  if(!f || !f.geometry) throw new Error("Parsel bulunamadı");
  SONPARSEL = f;
  if(KATMAN) HARITA.removeLayer(KATMAN);
  KATMAN = L.geoJSON(f, { style:{ color:"#C9A227", weight:2.5, fillColor:"#C9A227", fillOpacity:.18 } }).addTo(HARITA);
  HARITA.fitBounds(KATMAN.getBounds(), { padding:[30,30], maxZoom:18 });
  const p = f.properties || {};
  document.getElementById("bilgi").innerHTML = `
    <div class="card">
      <div style="font-size:12px;color:var(--ink-3)">${esc(p.ilAd||"")} · ${esc(p.ilceAd||"")} · ${esc(p.mahalleAd||"")}</div>
      <div style="font-size:18px;font-weight:600;margin-top:3px">Ada ${esc(p.adaNo||"—")} · Parsel ${esc(p.parselNo||"—")}</div>
      <div class="kv" style="margin-top:10px"><span>Yüzölçümü</span><b class="mono">${esc(p.alan||"—")} m²</b></div>
      <div class="kv"><span>Niteliği</span><b>${esc(p.nitelik||"—")}</b></div>
      <div class="kv"><span>Mevkii</span><b>${esc(p.mevkii||"—")}</b></div>
      <div class="acts">
        <button onclick="kmlIndir()">KML indir</button>
        <button onclick="earthAc()">Earth'te aç</button>
        ${ME.role==='admin'?`<button class="pri" onclick="haritadanKaydet()">Kaydet</button>`:""}
      </div>
    </div>`;
}

function merkez(f){
  const c = []; JSON.stringify(f.geometry.coordinates).replace(/\[(-?\d+\.?\d*),(-?\d+\.?\d*)\]/g,(m,a,b)=>{c.push([+a,+b]);return m;});
  const lng = c.reduce((s,p)=>s+p[0],0)/c.length, lat = c.reduce((s,p)=>s+p[1],0)/c.length;
  return { lat, lng };
}

function kmlMetni(f){
  const p = f.properties||{};
  const halka = g => (g.type==="Polygon"?[g.coordinates]:g.coordinates)
    .map(poly => poly[0].map(c=>`${c[0]},${c[1]},0`).join(" ")).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${p.ozet||"parsel"}</name>
<Style id="s"><LineStyle><color>ff27a2c9</color><width>3</width></LineStyle>
<PolyStyle><color>4027a2c9</color></PolyStyle></Style>
<Placemark><name>${p.mahalleAd||""} ${p.adaNo||""}/${p.parselNo||""}</name>
<description>${p.alan||""} m² · ${p.nitelik||""}</description><styleUrl>#s</styleUrl>
<Polygon><outerBoundaryIs><LinearRing><coordinates>${halka(f.geometry)}</coordinates>
</LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
}

function kmlIndir(){
  if(!SONPARSEL) return;
  const p = SONPARSEL.properties||{};
  const b = new Blob([kmlMetni(SONPARSEL)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${(p.mahalleAd||"parsel")}-${p.adaNo||0}-${p.parselNo||0}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

function earthAc(){

}

function hisseSor(yilKaydiId, alan){
  const kutu = document.querySelector("#bilgi .acts");

  kutu.insertAdjacentHTML("beforeend", `

      <p class="ipuc" style="margin:10px 2px 0">Toplam alan (${nf(alan)} m²) değişmez; sadece payınız kaydedilir.</p>
    </div>`);

  const td = document.getElementById("ktd"), hp = document.getElementById("khp");
  const hesap = hisseBagla("k", alan);
  td.onchange = () => { hp.style.display = td.value === "hisseli" ? "block" : "none"; hesap(); };

  document.getElementById("khk").onclick = async e => {
    const hisseli = td.value === "hisseli";

    if(hisseli){
      const r = hesap(); if(!r) return toast("Hisse bilgisini düzelt");
      yeni.hisse_pay = r.pay; yeni.hisse_m2 = r.m2;
    }
    e.target.disabled = true; e.target.textContent = "Kaydediliyor…";
    const { error } = await sb.from("parcel_years").update(yeni).eq("id", yilKaydiId);
    e.target.disabled = false; e.target.textContent = "Bilgiyi kaydet";

// alanlari birbirine bagla; hesaplayan islevi dondur
function hisseBagla(p, alan){
  const g = k => document.getElementById(p+k);
  const hesap = () => {
    if(!g("bic")) return null;
    const bic = g("bic").value;
    g("oranK").style.display = bic === "oran" ? "block" : "none";
    g("m2K").style.display   = bic === "m2"   ? "block" : "none";
    if(bic === "oran"){
      const o = payOran(g("oran").value);
      if(o === null){ g("bilgi").innerHTML = `<span style="color:var(--red)">1/4 gibi yaz</span>`; return null; }
      const m2 = Math.round(alan * o);
      g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(m2)} m²`;
      return { pay: g("oran").value.trim(), m2 };
    }
    const m2 = parseFloat(String(g("m2").value).replace(",","."));
    if(!isFinite(m2) || m2 <= 0){ g("bilgi").innerHTML = `<span style="color:var(--red)">Metrekare yaz</span>`; return null; }
    const yuzde = alan ? (m2/alan*100) : 0;
    g("bilgi").textContent = `Toplam ${nf(alan)} m² · payınız ${nf(Math.round(m2))} m²${alan?` (%${yuzde.toFixed(1)})`:""}`;
    return { pay: null, m2: Math.round(m2) };
  };
  ["bic","oran","m2"].forEach(k => { const el = g(k); if(el){ el.oninput = hesap; el.onchange = hesap; } });
  hesap();
  return hesap;
}

function sonucGoster(mesaj, basarili){
  const kutu = document.querySelector("#bilgi .acts");
  if(kutu) kutu.innerHTML = `
    <div style="flex:1 1 100%;display:flex;align-items:center;gap:10px;background:${basarili?"var(--green-soft)":"var(--gold-soft)"};
      border-radius:11px;padding:12px 14px;color:${basarili?"var(--green)":"var(--gold)"};font-size:13px;font-weight:600">
      <span style="font-size:16px">${basarili?"✓":"!"}</span><span style="flex:1">${esc(mesaj)}</span></div>
    <button style="flex:1 1 100%" onclick="go('araziler')">Arazilerde gör</button>`;
  toast(mesaj);
}

/* ================= araziler ================= */

let acikGrup = null;
const buyuk = x => String(x||"").trim().toLocaleUpperCase("tr");
const anahtar = p => [buyuk(p.il), buyuk(p.ilce), buyuk(p.mahalle)].join("|");
const duzgun = x => String(x||"").trim().toLocaleLowerCase("tr")
  .replace(/(^|[\s\-\/])([a-zçğıöşü])/g, (m,a,b)=>a+b.toLocaleUpperCase("tr"));

// ayni koydeki parselleri tek baslik altinda topla
function grupla(rows){
  const g = {};
  rows.forEach(r=>{
    const p = r.parcels, k = anahtar(p);
    (g[k] ||= { il:duzgun(p.il), ilce:duzgun(p.ilce), mah:duzgun(p.mahalle), list:[] }).list.push(r);
  });
  return Object.entries(g).sort((a,b)=>a[1].mah.localeCompare(b[1].mah,"tr"));
}

function grupBasi(k, gr, acik, sayiEk){
  return `<button class="ghd${acik?" open":""}" onclick="acikGrup=${acik?"null":`'${k.replace(/'/g,"\\'")}'`};${sayiEk}()">
    <span class="chev">›</span>
    <span class="pinico">${svg("pin")}</span>
    <span class="txt"><b>${esc(gr.mah)}</b><small>${esc(gr.il)} · ${esc(gr.ilce)}</small></span>
    <span class="say">${gr.list.length} parsel</span></button>`;
}

async function araziler(){
  app.innerHTML = head("Araziler","go('ana')") + `
    <div class="bar">
      <select class="year" id="yil">${yilSecenek()}</select>
      <input class="search" id="ara" placeholder="129/7 veya köy adı">
    </div><div id="liste"><div class="spin"></div></div>
    ${ME.role==='admin'?`<button class="fab" onclick="go('yeni')">+</button>`:""}`;
  document.getElementById("yil").onchange = e => { YEAR = +e.target.value; araziListele(); };
  document.getElementById("ara").oninput = () => araziListele();
  araziListele();
}
const yilSecenek = () => {
  const y = new Date().getFullYear(); let o="";
  for(let i=y+2;i>=y-4;i--) o += `<option value="${i}"${i===YEAR?" selected":""}>${i}</option>`;
  return o;
};

async function araziListele(){
  const box = document.getElementById("liste");
  const q = (document.getElementById("ara")?.value||"").toLowerCase().trim();
  const { data, error } = await sb.from("parcel_years")
    .select("id,aktif,parcels(id,il,ilce,mahalle,ada,parsel,alan_m2,nitelik)")
    .eq("yil", YEAR);
  if(error) return box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  let rows = (data||[]).filter(r=>r.parcels);
  if(q) rows = rows.filter(r=>{
    const p = r.parcels;
    return `${p.il} ${p.ilce} ${p.mahalle} ${p.ada||""}/${p.parsel}`.toLowerCase().includes(q);
  });
  if(!rows.length) return box.innerHTML = `<div class="empty"><b>${YEAR} boş</b>
    ${ME.role==='admin'?"Haritadan ya da sağ alttaki + ile parsel ekle.":"Bu yıl için henüz kayıt yok."}</div>`;

  box.innerHTML = grupla(rows).map(([k,gr])=>{
    const acik = acikGrup === k;
    return `<div class="grp">${grupBasi(k, gr, acik, "araziListele")}
      ${acik ? gr.list.map(parselSatir).join("") : ""}</div>`;
  }).join("");
}

function parselSatir(r){
  const p = r.parcels;
  return `<div class="rw">
    <span class="kod">${esc(p.ada||"—")}/${esc(p.parsel)}</span>
    <button class="orta" onclick="go('parsel','${p.id}')">
      <b>${esc(p.nitelik||"Parsel")}</b>
      <small>${nf(p.alan_m2)} m²${r.aktif?"":" · pasif"}</small></button>
    <span class="sag">
      <span class="dot ${r.aktif?"on":"off"}"></span>
      ${ME.role==='admin'?`<button class="sil" aria-label="Sil" onclick="parselSil('${r.id}','${p.id}','${esc(p.mahalle)} ${esc(p.ada||"")}/${esc(p.parsel)}')">${svg("trash")}</button>`:""}
    </span></div>`;
}

async function parselSil(yilKaydiId, parselId, etiket){
  if(!confirm(`${etiket}\n\n${YEAR} kaydından silinsin mi? Diğer yıllardaki kaydı ve belgeleri durur.`)) return;
  const { error } = await sb.from("parcel_years").delete().eq("id", yilKaydiId);
  if(error) return toast("Olmadı: "+error.message);
  const { data: kalan } = await sb.from("parcel_years").select("id").eq("parcel_id", parselId);
  if(!kalan || !kalan.length){
    if(confirm("Bu parselin başka yıl kaydı kalmadı. Parseli notları ve belgeleriyle birlikte tamamen silelim mi?"))
      await sb.from("parcels").delete().eq("id", parselId);
  }
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"parsel silindi", entity:"parcels", entity_id:parselId, detail:`${etiket} (${YEAR})` });
  toast("Silindi");
  araziListele();
}

/* ================= yeni parsel ================= */

function yeniParsel(){
  app.innerHTML = head("Yeni parsel","go('araziler')") + `
    <div class="ipt">
      <select id="yil_il" class="full"></select>
      <select id="yil_ilce" class="full"></select>
      <select id="yil_mah" class="full"></select>
    </div>
    <div class="row2"><div class="field"><label>Ada</label><input id="ada" inputmode="numeric" placeholder="108"></div>
    <div class="field"><label>Parsel</label><input id="par" inputmode="numeric" placeholder="9"></div></div>
    <div class="row2"><div class="field"><label>Yüzölçümü (m²)</label><input id="m2" inputmode="decimal" placeholder="1496"></div>
    <div class="field"><label>Niteliği</label><input id="nit" placeholder="Tarla"></div></div>
    <div class="field"><label>Kayıt yılı</label><select id="yil2">${yilSecenek()}</select></div>
    <div id="tani"></div>
    <button class="btn" id="kaydet">Kaydet</button>
    <p class="ipuc" style="margin-top:16px">Haritadan eklersen yüzölçümü, niteliği ve sınır çizimi kendiliğinden dolar.</p>`;
  idariKur("yil_");
  document.getElementById("kaydet").onclick = async e => {
    const v = id => document.getElementById(id).value.trim();
    const il = secimAdi("yil_","il"), ilce = secimAdi("yil_","ilce"), mah = secimAdi("yil_","mah");
    if(!il||!ilce||!mah||!v("par")) return toast("İl, ilçe, köy ve parsel şart");
    e.target.disabled = true; e.target.textContent = "Kaydediliyor…";
    const { data:p, error } = await sb.from("parcels").insert({
      team_id: ME.team_id, il, ilce, mahalle: mah,
      ada:v("ada")||null, parsel:v("par"), alan_m2:v("m2")||null, nitelik:v("nit")||null, created_by:ME.id
    }).select().single();
    if(error){ e.target.disabled=false; e.target.textContent="Kaydet"; return toast("Olmadı: "+error.message); }
    const yil = +document.getElementById("yil2").value;
    await sb.from("parcel_years").insert({ parcel_id:p.id, team_id:ME.team_id, yil, aktif:true });
    await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id, action:"parsel eklendi",
      entity:"parcels", entity_id:p.id, detail:`${p.mahalle} ${p.ada||""}/${p.parsel}` });
    YEAR = yil; toast("Kaydedildi"); go("araziler");
  };
}

/* ================= parsel detay ================= */

async function parselDetay(id){
  app.innerHTML = head("Parsel","go('araziler')") + `<div class="spin"></div>`;
  const { data:p } = await sb.from("parcels").select("*").eq("id",id).single();
  if(!p) return;
  const { data:notlar } = await sb.from("notes")
    .select("content,created_at,profiles(full_name)").eq("parcel_id",id).order("created_at",{ascending:false});
  app.innerHTML = head(`${p.ada||"—"}/${p.parsel}`,"go('araziler')") + `
    <div class="card">
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">${esc(p.il)} · ${esc(p.ilce)} · ${esc(p.mahalle)}</div>
      <div style="font-size:19px;font-weight:600">Ada ${esc(p.ada||"—")} · Parsel ${esc(p.parsel)}</div>
      <div class="kv" style="margin-top:10px"><span>Yüzölçümü</span><b class="mono">${nf(p.alan_m2)} m²</b></div>
      <div class="kv"><span>Niteliği</span><b>${esc(p.nitelik||"—")}</b></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="color:var(--gold)">${svg("note")}</div><b style="font-size:14px">Notlar</b>
        <span style="margin-left:auto;font-size:12px;color:var(--ink-3)">${(notlar||[]).length}</span></div>
      ${ME.role!=='uye'?`<div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="not" placeholder="Not yaz…"><button class="btn" style="width:auto;padding:12px 18px" id="notEkle">Ekle</button></div>`:""}
      ${(notlar||[]).length? notlar.map(n=>`<div style="border-top:1px solid var(--line);padding:10px 0">
          <div style="font-size:11px;color:var(--ink-3)">${new Date(n.created_at).toLocaleString("tr-TR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})} · ${esc(n.profiles?.full_name||"")}</div>
          <div style="font-size:14px;margin-top:3px">${esc(n.content)}</div></div>`).join("")
        : `<div style="color:var(--ink-3);font-size:13px">Henüz not yok.</div>`}
    </div>`;
  const btn = document.getElementById("notEkle");
  if(btn) btn.onclick = async () => {

    if(!c) return;

    if(error) return toast("Olmadı: "+error.message);
    parselDetay(id);
  };
}

/* ================= fiyat ve hisse ================= */

async function fiyat(){
  app.innerHTML = head("Fiyat ve hisse","go('ana')") + `
    <div class="bar"><select class="year" id="yil3">${yilSecenek()}</select></div>
    <div id="fl"><div class="spin"></div></div>`;
  document.getElementById("yil3").onchange = e => { YEAR = +e.target.value; fiyatListele(); };
  fiyatListele();
}

async function fiyatListele(){
  const box = document.getElementById("fl");
  const { data, error } = await sb.from("parcel_years")
    .select("*,parcels(id,il,ilce,mahalle,ada,parsel,alan_m2)").eq("yil",YEAR);
  if(error) return box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  const rows = (data||[]).filter(r=>r.parcels);
  if(!rows.length) return box.innerHTML = `<div class="empty"><b>${YEAR} boş</b>Önce haritadan parsel ekle.</div>`;
  box.innerHTML = grupla(rows).map(([k,gr])=>{
    const acik = acikGrup === k;
    return `<div class="grp">${grupBasi(k, gr, acik, "fiyatListele")}
      ${acik ? gr.list.map(fiyatSatir).join("") : ""}</div>`;
  }).join("");
}

function fiyatSatir(r){
  const p = r.parcels, hisseli = r.tapu_durumu === "hisseli";
  return `<div style="border-top:1px solid var(--line);background:var(--surface-2);padding:14px" ${r.aktif?"":'data-p="1" style="opacity:.55"'}>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="kod" style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:6px 10px">${esc(p.ada||"—")}/${esc(p.parsel)}</span>
      <span class="pill ${hisseli?"gold":"on"}">${hisseli?"hisseli · "+esc(r.hisse_pay||"?"):"tek tapu"}</span>
      <span class="dot ${r.aktif?"on":"off"}" style="margin-left:auto"></span></div>
    <div class="kv" style="margin-top:10px"><span>Alan</span><b class="mono">${nf(p.alan_m2)} m²</b></div>
    <div class="kv"><span>Payınız</span><b class="mono">${hisseli?nf(r.hisse_m2)+" m²":"tamamı"}</b></div>
    <div class="kv"><span>m² fiyatı</span><b class="mono">${nf(r.m2_fiyat)} ₺</b></div>
    <div class="kv"><span>Toplam</span><b class="mono">${nf(r.toplam_fiyat)} ₺</b></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${r.ilan_url?`<a class="pill gold" href="${esc(r.ilan_url)}" target="_blank">sahibinden ilanı</a>`:""}
      ${ME.role==='admin'?`<button class="pill gold" onclick="go('fiyatDuzen','${r.id}')">düzenle</button>`:""}
    </div></div>`;
}

async function fiyatDuzen(id){
  const { data:r } = await sb.from("parcel_years").select("*,parcels(alan_m2,ada,parsel,mahalle)").eq("id",id).single();
  if(!r) return;
  app.innerHTML = head(`${r.parcels.ada||"—"}/${r.parcels.parsel}`,"go('fiyat')") + `
    <div class="field"><label>Tapu durumu</label><select id="td">
      <option value="tek"${r.tapu_durumu!=="hisseli"?" selected":""}>Tek tapu</option>
      <option value="hisseli"${r.tapu_durumu==="hisseli"?" selected":""}>Hisseli</option></select></div>
    <div class="field" id="hpAlan">${hisseAlanlari("f", r.hisse_pay, r.hisse_m2)}</div>
    <div class="field"><label>m² fiyatı (₺)</label><input id="mf" inputmode="decimal" value="${r.m2_fiyat??""}"></div>
    <div class="field"><label>sahibinden ilan bağlantısı</label><input id="il2" value="${esc(r.ilan_url||"")}" placeholder="https://..."></div>
    <div class="field"><label>Durum</label><select id="ak">
      <option value="1"${r.aktif?" selected":""}>Aktif · satışta</option>
      <option value="0"${!r.aktif?" selected":""}>Pasif · satışta değil</option></select></div>
    <div id="onizle" class="card" style="font-size:13px"></div>
    <button class="btn" id="kay">Kaydet</button>`;

  const alan = +r.parcels.alan_m2 || 0;
  const hisseHesap = hisseBagla("f", alan);
  const g = k => document.getElementById(k);

  const hesapla = () => {
    const hisseli = g("td").value === "hisseli";
    g("hpAlan").style.display = hisseli ? "block" : "none";
    let pay = alan, kod = null;
    if(hisseli){
      const rr = hisseHesap();
      if(!rr){ g("onizle").innerHTML = `<span style="color:var(--red)">Hisse bilgisini düzelt</span>`; return null; }
      pay = rr.m2; kod = rr.pay;
    }
    const mf = +g("mf").value || 0;
    const toplam = Math.round(pay * mf);
    g("onizle").innerHTML =
      `<div class="kv"><span>Parselin toplam alanı</span><b class="mono">${nf(alan)} m²</b></div>
       <div class="kv"><span>Payınıza düşen</span><b class="mono">${nf(pay)} m²</b></div>
       <div class="kv"><span>Toplam değer</span><b class="mono">${nf(toplam)} ₺</b></div>`;
    return { pay, toplam, kod };
  };
  ["td","mf","fbic","foran","fm2"].forEach(k => { const el = g(k); if(el){ el.oninput = hesapla; el.onchange = hesapla; } });
  hesapla();

  document.getElementById("kay").onclick = async e => {
    const h = hesapla(); if(!h) return toast("Hisse bilgisini düzelt");
    const hisseli = g("td").value === "hisseli";
    e.target.disabled = true;
    const { error } = await sb.from("parcel_years").update({
      tapu_durumu: g("td").value,
      hisse_pay: hisseli ? h.kod : null,
      hisse_m2: hisseli ? h.pay : null,
      m2_fiyat: +g("mf").value || null,
      toplam_fiyat: h.toplam,
      ilan_url: g("il2").value.trim() || null,
      aktif: g("ak").value === "1"
    }).eq("id", id);
    e.target.disabled = false;
    if(error) return toast("Olmadı: "+error.message);
    toast("Kaydedildi"); go("fiyat");
  };
}

/* ================= ayarlar ================= */

  app.innerHTML = head("Ayarlar","go('ana')") + `<div class="spin"></div>`;

      <div class="kv"><span>Hesap</span><b>${esc(ME.email||"")}</b></div>

    </div>
    <h3 style="font-size:14px;margin:22px 0 10px">Kullanıcılar</h3>
    ${(kisiler||[]).map(k=>`<div class="card" style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0"><b style="font-size:14px">${esc(k.full_name||k.email)}</b>

             <option value="uye"${k.role==='uye'?' selected':''}>Üye</option>

             <option value="admin"${k.role==='admin'?' selected':''}>Admin</option></select>`

async function rolDegistir(id, rol){
  const { error } = await sb.from("profiles").update({ role: rol }).eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"yetki değişti", entity:"profiles", entity_id:id, detail:rol });
  toast("Yetki güncellendi");
}
async function cikis(){ await sb.auth.signOut(); location.reload(); }

/* ================= yonlendirme ================= */

const ekranlar = { ana:anaMenu, harita:harita, araziler:araziler, yeni:yeniParsel, parsel:parselDetay,
                   fiyat:fiyat, fiyatDuzen:fiyatDuzen, ayarlar:ayarlar };
function go(r,arg){ (ekranlar[r]||anaMenu)(arg); window.scrollTo(0,0); }

function acilisHatasi(mesaj){
  app.innerHTML = `<div class="empty"><b>Açılamadı</b>
    <div style="font-size:11px;color:var(--ink-3)">sürüm ${SURUM}</div>
    <div style="font-size:12px;color:var(--ink-3);margin:10px 0 16px;word-break:break-word">${esc(mesaj)}</div>
    <button class="btn ghost" onclick="location.reload()">Tekrar dene</button>
    <button class="btn danger" style="margin-top:10px" onclick="cikis()">Oturumu sıfırla</button></div>`;
}
const bekletme = 0;

async function baslat(){
 if(window.__basliyor) return;
 window.__basliyor = true;
 try{
  const { data:{ session } } = await zamanAsimi(sb.auth.getSession(), 8000);
  if(!session){ window.__acildi = true; window.__basliyor = false; return girisEkrani(); }
  let { data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000);
  if(!prof){ await new Promise(r=>setTimeout(r,1200));
    ({ data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000)); }
  window.__acildi = true; window.__basliyor = false;
  if(!prof) return acilisHatasi("Profil kurulamadı. Oturumu sıfırlayıp tekrar gir.");
  ME = prof; anaMenu();
 }catch(e){ window.__acildi = true; window.__basliyor = false; acilisHatasi(String(e.message||e)); }
}
baslat();

sb.auth.onAuthStateChange((olay) => {
  if(olay === "SIGNED_IN" && !ME && !window.__basliyor) baslat();
});
</script>
