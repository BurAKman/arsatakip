let HESAP_TIP = "alacak";

async function hesap(){
  app.innerHTML = head("Hesap - Kitap","go('ana')") + `
    <div class="acts" style="margin-bottom:14px">
      <button class="${HESAP_TIP==="alacak"?"pri":""}" onclick="HESAP_TIP='alacak';hesap()">Alacaklarım</button>
      <button class="${HESAP_TIP==="borc"?"pri":""}" onclick="HESAP_TIP='borc';hesap()">Borçlarım</button>
    </div>
    <div id="hlist"><div class="spin"></div></div>
    ${ME.role!=='uye'?`<button class="fab" onclick="hesapYeni()">+</button>`:""}`;
  hesapListele();
}

async function hesapListele(){
  const kutu = document.getElementById("hlist");
  const { data, error } = await sb.from("hesap").select("*").eq("tip", HESAP_TIP).order("tarih",{nullsFirst:false});
  if(error) return kutu.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  const kayitlar = data || [];
  if(!kayitlar.length) return kutu.innerHTML =
    `<div class="empty"><b>Kayıt yok</b>${ME.role!=='uye'?"Sağ alttaki + ile ekle.":""}</div>`;

  const { data:vadeler } = await sb.from("hesap_vade").select("*").in("hesap_id", kayitlar.map(k=>k.id));
  const grup = {};
  (vadeler||[]).forEach(v=>(grup[v.hesap_id] ||= []).push(v));

  const bugun = new Date(); bugun.setHours(0,0,0,0);
  const gun = t => Math.round((new Date(t) - bugun) / 86400000);

  let acikToplam = 0, yaklasan = 0;
  kayitlar.forEach(k=>{
    if(k.kapandi) return;
    const vs = grup[k.id] || [];
    if(k.vadeli && vs.length){
      vs.forEach(v=>{ if(!v.odendi){ acikToplam += +v.tutar||0; if(gun(v.tarih) <= 20) yaklasan++; } });
    }else{
      acikToplam += +k.tutar||0;
      if(k.tarih && gun(k.tarih) <= 20) yaklasan++;
    }
  });

  kutu.innerHTML = `
    <div class="card">
      <div class="kv"><span>Açık ${HESAP_TIP==="alacak"?"alacak":"borç"}</span>
        <b class="mono" style="color:${HESAP_TIP==="alacak"?"var(--green)":"var(--red)"}">${nf(Math.round(acikToplam))} ₺</b></div>
      <div class="kv"><span>20 gün içinde vadesi gelen</span><b class="mono">${yaklasan}</b></div>
    </div>
    ${kayitlar.map(k=>{
      const vs = (grup[k.id]||[]).sort((a,b)=>a.tarih.localeCompare(b.tarih));
      const acik = vs.filter(v=>!v.odendi);
      const sonraki = acik[0];
      const g = sonraki ? gun(sonraki.tarih) : (k.tarih ? gun(k.tarih) : null);
      const renk = k.kapandi ? "var(--ink-3)" : (g != null && g <= 20 ? (g < 0 ? "var(--red)" : "var(--gold)") : "var(--ink-2)");
      const durum = k.kapandi ? "kapandı"
        : g == null ? "tarihsiz"
        : g < 0 ? `${Math.abs(g)} gün geçti`
        : g === 0 ? "bugün" : `${g} gün kaldı`;
      return `<div class="card" style="${k.kapandi?"opacity:.55":""}">
        <div style="display:flex;align-items:center;gap:10px">
          <b style="font-size:15px;flex:1">${esc(k.kisi)}</b>
          <b class="mono" style="color:${HESAP_TIP==="alacak"?"var(--green)":"var(--red)"}">${nf(Math.round(k.tutar))} ₺</b></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
          <span class="pill sade">${k.vadeli ? `${vs.length} vade` : "tek ödeme"}</span>
          <span class="pill" style="background:transparent;color:${renk};border-color:${renk}">${durum}</span>
          ${k.tarih && !k.vadeli ? `<span class="pill sade">${new Date(k.tarih).toLocaleDateString("tr-TR")}</span>` : ""}
          <span style="flex:1"></span>
          ${ME.role!=='uye'?`<button class="pill gold" onclick="hesapAc('${k.id}')">detay</button>`:""}
        </div>
        ${k.notu?`<div style="font-size:13px;color:var(--ink-2);margin-top:8px">${esc(k.notu)}</div>`:""}
      </div>`;
    }).join("")}`;
}

function hesapYeni(){
  app.innerHTML = head("Yeni kayıt","go('hesap')") + `
    <div class="field"><label>Tür</label><select id="htip">
      <option value="alacak"${HESAP_TIP==="alacak"?" selected":""}>Alacağım</option>
      <option value="borc"${HESAP_TIP==="borc"?" selected":""}>Borcum</option></select></div>
    <div class="field"><label>Kişi / kurum</label><input id="hkisi" placeholder="Ad soyad"></div>
    <div class="field"><label>Toplam tutar (₺)</label><input id="htutar" inputmode="decimal"></div>
    <div class="field"><label>Ödeme biçimi</label><select id="hvadeli">
      <option value="0">Tek ödeme</option><option value="1">Vadeli</option></select></div>
    <div class="field" id="htarihK"><label>Tarih</label><input id="htarih" type="date"></div>
    <div id="hvadeK" style="display:none">
      <div class="row2">
        <div class="field"><label>Vade sayısı</label><input id="hadet" type="number" min="1" max="120" value="6"></div>
        <div class="field"><label>İlk vade</label><input id="hilk" type="date"></div>
      </div>
      <p class="ipuc">Tutar vadelere eşit bölünür; sonra tek tek düzenleyebilirsin.</p>
    </div>
    <div class="field"><label>Not (isteğe bağlı)</label><input id="hnot" placeholder="Tek satır not"></div>
    <button class="btn" id="hkay">Kaydet</button>`;

  const vd = document.getElementById("hvadeli");
  vd.onchange = () => {
    const v = vd.value === "1";
    document.getElementById("hvadeK").style.display = v ? "block" : "none";
    document.getElementById("htarihK").style.display = v ? "none" : "block";
  };

  document.getElementById("hkay").onclick = async e => {
    const kisi = document.getElementById("hkisi").value.trim();
    const tutar = sayiCoz(document.getElementById("htutar").value) || 0;
    if(!kisi) return toast("Kişi adı yaz");
    if(tutar <= 0) return toast("Tutar yaz");
    const vadeli = vd.value === "1";
    e.target.disabled = true;
    const { data:k, error } = await sb.from("hesap").insert({
      team_id:ME.team_id, tip:document.getElementById("htip").value, kisi, tutar,
      vadeli, tarih: vadeli ? null : (document.getElementById("htarih").value || null),
      notu: document.getElementById("hnot").value.trim() || null, created_by:ME.id
    }).select().single();
    if(error){ e.target.disabled = false; return toast("Olmadı: "+error.message); }

    if(vadeli){
      const adet = Math.max(1, Math.min(120, +document.getElementById("hadet").value || 1));
      const ilk = document.getElementById("hilk").value;
      const pay = Math.round(tutar/adet);
      const satirlar = Array.from({length:adet},(_,i)=>{
        const t = ilk ? new Date(ilk) : new Date();
        t.setMonth(t.getMonth() + i);
        return { hesap_id:k.id, team_id:ME.team_id, tarih:t.toISOString().slice(0,10),
                 tutar: i === adet-1 ? tutar - pay*(adet-1) : pay };
      });
      await sb.from("hesap_vade").insert(satirlar);
    }
    HESAP_TIP = k.tip;
    toast("Kaydedildi"); go("hesap");
  };
}

async function hesapGuncelle(id){
  const v = x => document.getElementById(x).value;
  const kisi = v("dkisi").trim();
  if(!kisi) return toast("Kişi adı boş olamaz");
  const { error } = await sb.from("hesap").update({
    tip: v("dtip"), kisi, tutar: sayiCoz(v("dtutar")) || 0,
    tarih: v("dtarih") || null, notu: v("dnot").trim() || null
  }).eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  toast("Kaydedildi"); hesapAc(id);
}
async function hesapKapat(id, deger){ await sb.from("hesap").update({ kapandi: deger }).eq("id", id); hesapAc(id); }
async function hesapSil(id){
  if(!confirm("Bu kayıt ve vadeleri silinsin mi?")) return;
  const { error } = await sb.from("hesap").delete().eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  toast("Silindi"); go("hesap");
}
async function vadeIsaret(vid, hid, deger){ await sb.from("hesap_vade").update({ odendi: deger }).eq("id", vid); hesapAc(hid); }
async function vadeKaydet(vid, hid){
  const t = document.getElementById("vt"+vid).value;
  const m = sayiCoz(document.getElementById("vm"+vid).value) || 0;
  if(!t) return toast("Tarih seç");
  const { error } = await sb.from("hesap_vade").update({ tarih:t, tutar:m }).eq("id", vid);
  if(error) return toast("Olmadı: " + error.message);
  toast("Vade kaydedildi"); hesapAc(hid);
}
async function vadeSil(vid, hid){
  if(!confirm("Bu vade silinsin mi?")) return;
  await sb.from("hesap_vade").delete().eq("id", vid);
  hesapAc(hid);
}
async function vadeEkle(hid){
  const { data:son } = await sb.from("hesap_vade").select("tarih,tutar").eq("hesap_id",hid)
    .order("tarih",{ascending:false}).limit(1);
  const t = son?.[0]?.tarih ? new Date(son[0].tarih) : new Date();
  t.setMonth(t.getMonth() + 1);
  const { error } = await sb.from("hesap_vade").insert({
    hesap_id:hid, team_id:ME.team_id, tarih:t.toISOString().slice(0,10), tutar: son?.[0]?.tutar || 0 });
  if(error) return toast("Olmadı: " + error.message);
  hesapAc(hid);
}

async function yaklasanlar(){
  app.innerHTML = head("Yaklaşanlar","go('ana')") + `<div id="ylist"><div class="spin"></div></div>`;
  const bugun = new Date(); bugun.setHours(0,0,0,0);
  const gun = t => Math.round((new Date(t) - bugun) / 86400000);

  const [{ data:ekler }, { data:vadeler }] = await Promise.all([
    sb.from("ekler").select("*"),
    sb.from("hesap_vade").select("*, hesap(kisi,tip)").eq("odendi", false)
  ]);

  const satirlar = [];
  (ekler||[]).forEach(k=>{
    if(k.suresiz || !k.gecerlilik_tarihi) return;
    satirlar.push({ tur:"Vekalet", baslik:k.ad_soyad, alt:"vekalet geçerliliği",
      g:gun(k.gecerlilik_tarihi), tarih:k.gecerlilik_tarihi, git:"go('ekler')" });
  });
  (vadeler||[]).forEach(v=>{
    satirlar.push({ tur: v.hesap?.tip === "borc" ? "Borç" : "Alacak",
      baslik: v.hesap?.kisi || "—", alt: nf(Math.round(v.tutar)) + " ₺ vade",
      g:gun(v.tarih), tarih:v.tarih, git:"go('hesap')" });
  });

  satirlar.sort((a,b)=>a.g - b.g);
  const yakin = satirlar.filter(o=>o.g <= 30);

  document.getElementById("ylist").innerHTML = `
    <div class="card">
      <div class="kv"><span>Süresi geçmiş</span>
        <b class="mono" style="color:var(--red)">${satirlar.filter(o=>o.g < 0).length}</b></div>
      <div class="kv"><span>30 gün içinde</span>
        <b class="mono" style="color:var(--gold)">${satirlar.filter(o=>o.g >= 0 && o.g <= 30).length}</b></div>
      <div class="kv"><span>Toplam takip</span><b class="mono">${satirlar.length}</b></div>
    </div>
    ${yakin.length ? yakin.map(o=>{
      const renk = o.g < 0 ? "var(--red)" : o.g <= 7 ? "var(--gold)" : "var(--ink-2)";
      const durum = o.g < 0 ? `${Math.abs(o.g)} gün geçti` : o.g === 0 ? "bugün" : `${o.g} gün kaldı`;
      return `<button class="card" style="display:block;width:100%;text-align:left" onclick="${o.git}">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="pill sade">${o.tur}</span>
          <b style="flex:1;font-size:15px">${esc(o.baslik)}</b>
          <span style="font-size:12px;color:${renk};font-weight:600">${durum}</span></div>
        <div style="font-size:12px;color:var(--ink-3);margin-top:5px">
          ${esc(o.alt)} · ${new Date(o.tarih).toLocaleDateString("tr-TR")}</div></button>`;
    }).join("") : `<div class="empty"><b>Yaklaşan bir şey yok</b>Vekalet süreleri ve vadeler burada toplanır.</div>`}`;
}

// kutu yolunu ciz (kose bicimine gore)
function kutuYolu(x, w, h, kose){
  const r = kose === "yuvarlak" ? Math.min(h*.28, w*.12) : kose === "kesik" ? Math.min(h*.30, w*.10) : 0;
  x.beginPath();
  if(kose === "kesik"){
    x.moveTo(r,0); x.lineTo(w-r,0); x.lineTo(w,r); x.lineTo(w,h-r);
    x.lineTo(w-r,h); x.lineTo(r,h); x.lineTo(0,h-r); x.lineTo(0,r); x.closePath();
  }else if(r){
    x.moveTo(r,0); x.arcTo(w,0,w,h,r); x.arcTo(w,h,0,h,r); x.arcTo(0,h,0,0,r); x.arcTo(0,0,w,0,r); x.closePath();
  }else{
    x.rect(0,0,w,h);
  }
}

// metni kutuya sigdiran punto bul
const OLCER = document.createElement("canvas").getContext("2d");
function sigdir(x, metin, genislik, baslangic){
  let p = Math.max(6, Math.round(baslangic));
  if(!metin) return p;
  x.font = `700 ${p}px Arial`;
  while(p > 6 && x.measureText(metin).width > genislik){ p -= 1; x.font = `700 ${p}px Arial`; }
  return p;
}

// kutunun icindeki yazi yerlesimini hesapla (tek kaynak)
function kutuMetrik(o, w, h){
  const pad = Math.max(6, Math.min(w*.05, h*.14));
  const kullan = Math.max(10, w - pad*2);
  const satirlar = String(o.alt || "").split("\n").filter(t=>t.trim());
  const SATIR = 1.2;

  let ustP = 0;
  if(o.ust) ustP = sigdir(OLCER, o.ust, kullan, Math.min(h*.20, 40 + h*.02));

  const ustAlan = ustP ? ustP*1.5 : 0;
  const kalan = Math.max(8, h - pad*2 - ustAlan);
  let altP = satirlar.length ? Math.floor(kalan / (satirlar.length * SATIR)) : 0;
  altP = Math.min(altP, Math.floor(h*.42));
  const enUzun = satirlar.reduce((a,b)=> a.length>b.length?a:b, "");
  if(altP > 0) altP = sigdir(OLCER, enUzun, kullan, altP);
  altP = Math.max(satirlar.length ? 7 : 0, altP);

  const toplam = ustAlan + satirlar.length*altP*SATIR;
  const bas = Math.max(pad*.6, (h - toplam)/2);
  return { pad, kullan, satirlar, ustP, altP, SATIR, ustY: bas, altY: bas + ustAlan };
}

// kutuyu canvas'a ciz
function kutuCiz(x, o, w, h){
  const st = KUTU_STIL[o.stil ?? 0];
  x.save();
  if(st.golge){ x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = h*.14; x.shadowOffsetY = h*.05; }
  const gr = x.createLinearGradient(0,0,w*.25,h);
  st.zemin.forEach(([d,c])=>gr.addColorStop(d,c));
  kutuYolu(x, w, h, st.kose); x.fillStyle = gr; x.fill();
  x.shadowColor = "transparent";
  x.lineWidth = Math.max(2, h*st.kalinlik); x.strokeStyle = st.cerceve;
  kutuYolu(x, w, h, st.kose); x.stroke();
  if(st.ic){
    const p = Math.max(4, h*.07);
    x.save(); x.translate(p,p);
    x.lineWidth = Math.max(1, h*.012); x.strokeStyle = st.ic;
    kutuYolu(x, w-p*2, h-p*2, st.kose); x.stroke(); x.restore();
  }
  x.restore();

  const m = kutuMetrik(o, w, h);
  x.textBaseline = "top";
  if(o.ust && m.ustP){
    x.fillStyle = st.ustRenk; x.font = `700 ${m.ustP}px Arial`;
    x.fillText(o.ust, m.pad, m.ustY);
  }
  if(m.altP){
    x.fillStyle = st.altRenk; x.font = `700 ${m.altP}px Arial`;
    m.satirlar.forEach((t,i)=> x.fillText(t, m.pad, m.altY + i*m.altP*m.SATIR));
  }
}

// onizleme icin CSS karsiligi
function kutuCss(o){
  const st = KUTU_STIL[o.stil ?? 0];
  const gr = st.zemin.map(([d,c])=>`${c} ${Math.round(d*100)}%`).join(",");
  const kose = st.kose === "yuvarlak" ? "12px" : "0";
  return `background:linear-gradient(150deg,${gr});border:2px solid ${st.cerceve};border-radius:${kose};
    box-shadow:${st.golge?"0 6px 18px rgba(0,0,0,.45)":"none"};`;
}

// capi seffaf PNG olarak uret: mod 1 sinir, 2 parcali, 3 parcali + yazi
function capSeffafPng(p, cfg, mod, ayar){
  const parcalar = cfg?.parcalar || null;
  const a = ayar || {};
  const tema = CAP_TEMA[a.tema ?? 0];
  const disRenk = a.dis || tema.dis;
  const icRenk  = a.ic  || tema.ic;

  const g = p.geojson.geometry;
  const halka = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(halka.length>1 && halka[0][0]===halka[halka.length-1][0] && halka[0][1]===halka[halka.length-1][1]) halka.pop();
  const M = metreye(halka);
  const minX = Math.min(...M.map(k=>k[0])), maxX = Math.max(...M.map(k=>k[0]));
  const minY = Math.min(...M.map(k=>k[1])), maxY = Math.max(...M.map(k=>k[1]));
  const B = 1600, pay = 50;
  const olcek = Math.min((B-pay*2)/((maxX-minX)||1), (B-pay*2)/((maxY-minY)||1));
  const W = Math.round((maxX-minX)*olcek + pay*2), H = Math.round((maxY-minY)*olcek + pay*2);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const E = m => [ pay + (m[0]-minX)*olcek, pay + (maxY-m[1])*olcek ];
  const N = M.map(E);
  const yol = pts => { x.beginPath(); pts.forEach((k,i)=> i?x.lineTo(k[0],k[1]):x.moveTo(k[0],k[1])); x.closePath(); };

  if(mod !== 1 && parcalar && parcalar.length > 1){
    const yer = capYerlesim(M, cfg);
    yer.parcalar.forEach((o,i)=>{
      const d = o.poly, bilgi = o.bilgi || parcalar[i] || {};
      yol(d.map(E));
      const pr = bilgi.renk || "#FFFFFF";
      if(tema.metalik){
        const gr = x.createLinearGradient(0,0,W*.3,H);
        gr.addColorStop(0, pr); gr.addColorStop(.42, "#FFFFFF");
        gr.addColorStop(.58, pr); gr.addColorStop(1, "#DDE0E3");
        x.fillStyle = gr; x.globalAlpha = tema.dolgu;
      }else{
        x.fillStyle = pr; x.globalAlpha = a.dolgu ?? tema.dolgu;
      }
      x.fill(); x.globalAlpha = 1;
      x.lineWidth = 5; x.strokeStyle = icRenk; x.stroke();

      if(mod === 3){
        const om = E(agirlikMerkezi(d));
        const ol = parcaOlcu(d);
        x.textAlign = "center"; x.textBaseline = "middle";
        x.lineWidth = 7; x.strokeStyle = tema.yaziGolge;
        x.font = "700 60px Arial";
        const no = String(bilgi.no || (i+1));
        x.strokeText(no, om[0], om[1]-34); x.fillStyle = tema.yaziRenk; x.fillText(no, om[0], om[1]-34);
        x.font = "700 34px Arial";
        const m2 = nfAkilli(bilgi.m2 ?? alanHesap(d)) + " m²";
        x.strokeText(m2, om[0], om[1]+14); x.fillText(m2, om[0], om[1]+14);
        x.font = "700 24px Arial";
        const ov = `${ol.en.toFixed(1).replace(".",",")} × ${ol.boy.toFixed(1).replace(".",",")} m`;
        x.strokeText(ov, om[0], om[1]+52); x.fillText(ov, om[0], om[1]+52);
      }
    });

    (yer.yol||[]).forEach(yp=>{
      if(yp.length < 3) return;
      yol(yp.map(E));
      x.fillStyle = tema.metalik ? "rgba(70,70,70,.6)" : "rgba(255,255,255,.30)";
      x.fill();
      x.setLineDash([18,14]); x.lineWidth = 3; x.globalAlpha = .85;
      x.strokeStyle = icRenk; x.stroke(); x.globalAlpha = 1; x.setLineDash([]);
    });
  }else if(mod === 1){
    yol(N); x.fillStyle = tema.metalik ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.14)"; x.fill();
  }

  yol(N);
  x.lineWidth = 12; x.strokeStyle = tema.golge; x.stroke();
  x.lineWidth = 6; x.strokeStyle = disRenk; x.stroke();

  // hizalama icin uzun eksenin iki ucu (goruntuye gore oranli)
  const anaY = anaYon(M);
  const izd = M.map(p=>p[0]*anaY[0]+p[1]*anaY[1]);
  const i1 = izd.indexOf(Math.min(...izd)), i2 = izd.indexOf(Math.max(...izd));
  const e1 = E(M[i1]), e2 = E(M[i2]);
  SON_CAP_ANKRAJ = [[e1[0]/W, e1[1]/H], [e2[0]/W, e2[1]/H]];
  return c.toDataURL("image/png");
}

function sunumOlaylar(t, W, H){
  // hizalama modunda tuvale dokunuslari topla
  t.onpointerdown = e => {
    if(!SUNUM.hizala) return;
    const bx = t.getBoundingClientRect();
    SUNUM.hizala.noktalar.push([e.clientX - bx.left, e.clientY - bx.top]);
    const not = document.getElementById("hizalaNot");
    if(SUNUM.hizala.noktalar.length === 1){
      if(not) not.textContent = "Şimdi karşı uca dokun.";
      toast("İkinci noktaya dokun");
    }else{
      hizalamayiUygula(W, H);
    }
  };

  t.querySelectorAll(".oge").forEach(d=>{
    const parmaklar = new Map();
    let bas = null;

    d.onpointerdown = e => {
      if(SUNUM.hizala) return;                 // hizalama modunda oge surukleme kapali
      const i = +d.dataset.i, o = SUNUM.ogeler[i];
      const tut = e.target.dataset?.tut;
      if(tut === "kapat"){ SUNUM.ogeler.splice(i,1); SUNUM.secili = null; sunumEkran(); return; }
      if(tut === "kalem"){
        SUNUM.secili = i;
        if(o.tur === "cap") return sunumCap(i);
        sunumEkran();
        document.getElementById("dzUst")?.scrollIntoView({ behavior:"smooth", block:"center" });
        return;
      }
      if(SUNUM.secili !== i){ SUNUM.secili = i; sunumEkran(); return; }

      e.preventDefault();
      d.setPointerCapture(e.pointerId);
      parmaklar.set(e.pointerId, { x:e.clientX, y:e.clientY });

      const bx = t.getBoundingClientRect();
      bas = {
        x:o.x, y:o.y, w:o.w, h:o.h, rot:o.rot||0,
        px:e.clientX, py:e.clientY,
        mx: bx.left + (o.x + o.w/2)*W, my: bx.top + (o.y + o.h/2)*H,
        tut
      };
      if(bas.tut === "don") bas.aci = Math.atan2(e.clientY-bas.my, e.clientX-bas.mx)*180/Math.PI;

      if(parmaklar.size === 2){
        const [a,b2] = [...parmaklar.values()];
        bas.mesafe = Math.hypot(a.x-b2.x, a.y-b2.y) || 1;
        bas.aci2 = Math.atan2(b2.y-a.y, b2.x-a.x)*180/Math.PI;
        bas.w2 = o.w; bas.h2 = o.h; bas.rot2 = o.rot||0;
      }
    };

    d.onpointermove = ev => {
      if(!bas || !parmaklar.has(ev.pointerId)) return;
      parmaklar.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
      const i = +d.dataset.i, o = SUNUM.ogeler[i];

      if(parmaklar.size === 2){
        const [a,b2] = [...parmaklar.values()];
        const m = Math.hypot(a.x-b2.x, a.y-b2.y) || 1;
        const ac = Math.atan2(b2.y-a.y, b2.x-a.x)*180/Math.PI;
        if(bas.mesafe){
          const k = m / bas.mesafe;
          const mx = o.x + o.w/2, my = o.y + o.h/2;
          o.w = Math.max(.05, bas.w2 * k);
          o.h = Math.max(.03, bas.h2 * k);
          o.x = mx - o.w/2; o.y = my - o.h/2;
          o.rot = Math.round(bas.rot2 + (ac - bas.aci2));
        }
      }else{
        const dx = (ev.clientX - bas.px)/W, dy = (ev.clientY - bas.py)/H;
        if(bas.tut === "boy"){
          o.w = Math.max(.05, bas.w + dx); o.h = Math.max(.03, bas.h + dy);
        }else if(bas.tut === "don"){
          const aci = Math.atan2(ev.clientY-bas.my, ev.clientX-bas.mx)*180/Math.PI;
          o.rot = Math.round(bas.rot + (aci - bas.aci));
        }else{
          o.x = bas.x + dx; o.y = bas.y + dy;
        }
      }
      d.style.left = (o.x*W)+"px"; d.style.top = (o.y*H)+"px";
      d.style.width = (o.w*W)+"px"; d.style.height = (o.h*H)+"px";
      d.style.transform = `rotate(${o.rot||0}deg)`;
    };

    const bitir = ev => {
      parmaklar.delete(ev.pointerId);
      if(!parmaklar.size){ bas = null; sunumCiz(); }
    };
    d.onpointerup = bitir;
    d.onpointercancel = bitir;
  });
}

// iki nokta ile capi fotografa oturt
function hizalamayiUygula(W, H){
  const { i, noktalar } = SUNUM.hizala;
  SUNUM.hizala = null;
  const o = SUNUM.ogeler[i];
  if(!o || !o.ank || noktalar.length < 2) return sunumEkran();

  const [A, B] = noktalar;
  const im = new Image();
  im.onload = () => {
    const iw = im.naturalWidth, ih = im.naturalHeight;
    const [a1, a2] = o.ank;                       // goruntudeki oranli ankraj noktalari
    const ux = (a2[0]-a1[0])*iw, uy = (a2[1]-a1[1])*ih;
    const uzUnlu = Math.hypot(ux, uy) || 1;
    const tx = B[0]-A[0], ty = B[1]-A[1];
    const hedefUz = Math.hypot(tx, ty) || 1;

    const k = hedefUz / uzUnlu;                   // piksel basina olcek
    const aci = (Math.atan2(ty, tx) - Math.atan2(uy, ux)) * 180/Math.PI;
    const wpx = iw * k, hpx = ih * k;
    const r = aci * Math.PI/180;
    const d1x = (a1[0]-0.5)*wpx, d1y = (a1[1]-0.5)*hpx;
    const cx = A[0] - (d1x*Math.cos(r) - d1y*Math.sin(r));
    const cy = A[1] - (d1x*Math.sin(r) + d1y*Math.cos(r));

    o.w = wpx/W; o.h = hpx/H;
    o.x = (cx - wpx/2)/W; o.y = (cy - hpx/2)/H;
    o.rot = Math.round(aci);
    toast("Çap hizalandı");
    sunumEkran();
  };
  im.onerror = () => sunumEkran();
  im.src = o.src;
}

async function sunumUret(){
  if(!SUNUM.arka) return toast("Önce arka plan görseli yükle");
  toast("Görsel hazırlanıyor…");
  const oran = ORANLAR[SUNUM.oranIx];
  const W = oran.w, H = oran.h;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const arka = await yukleGorsel(SUNUM.arka.url);

  // "cover" kirpma: onizlemedeki background-size:cover ile birebir ayni
  const ol = Math.max(W/arka.naturalWidth, H/arka.naturalHeight);
  const dw = arka.naturalWidth*ol, dh = arka.naturalHeight*ol;
  x.fillStyle = "#000"; x.fillRect(0,0,W,H);
  x.drawImage(arka, (W-dw)/2, (H-dh)*(SUNUM.kaydir/100), dw, dh);

  for(const o of SUNUM.ogeler){
    const ox = o.x*W, oy = o.y*H, ow = o.w*W, oh = o.h*H;
    x.save();
    x.translate(ox + ow/2, oy + oh/2);
    x.rotate((o.rot||0) * Math.PI/180);
    x.translate(-ow/2, -oh/2);
    if(o.tur === "cap"){
      const im = await yukleGorsel(o.src);
      x.globalAlpha = o.saydam ?? 1;
      x.drawImage(im, 0, 0, ow, oh);
      x.globalAlpha = 1;
    }else{
      kutuCiz(x, o, ow, oh);
    }
    x.restore();
  }

  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.92));
  const p = SUNUM.p;
  const ad2 = `${p.ada||0}-${p.parsel}-sunum-${Date.now().toString().slice(-5)}.jpg`;
  indirBlob(blob, ad2);
  try{
    await dosyaYukle(new File([blob], ad2, { type:"image/jpeg" }), "sunum", SUNUM.parselId);
    toast("Sunum görseli kaydedildi");
  }catch(e){ toast("İndirildi ama kaydedilemedi: " + (e.message||e)); }
}

const yukleGorsel = src => new Promise((res,rej)=>{
  const i = new Image(); i.crossOrigin = "anonymous";
  i.onload = ()=>res(i); i.onerror = rej; i.src = src;
});

// iki koordinat arasi mesafe (metre)
function mesafe(a, b){
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b[0]-a[0]) * Math.cos(rad((a[1]+b[1])/2));
  const df = rad(b[1]-a[1]);
  return Math.round(Math.sqrt(dl*dl + df*df) * R * 10)/10;
}


/* ---- geometri: metreye cevir, alan, yariduzlem kirpma, parcala ---- */

// parselin dis halkasini metre duzlemine cevir
// Kayitli alani dogrula.
// Eski surumde "7,116.82" gibi degerler yanlis okunup 7.11682 olarak kaydedilmisti.
// Once 1000 ile carpip geometriye uyuyor mu bakariz (boylece TKGM'nin resmi rakamini
// birebir geri kazaniriz); uymuyorsa son care geometriden olcume duseriz.
function gercekAlan(p){
  const kayitli = +p?.alan_m2 || 0;
  let geo = 0;
  try{ const M = capHalkasi(p); if(M) geo = alanHesap(M); }catch(e){}
  if(!geo) return kayitli;
  const yakin = (a,b) => Math.abs(a-b) <= b*0.06;      // cizim olcumu %6'ya kadar sapabilir
  if(yakin(kayitli, geo)) return kayitli;              // kayit zaten dogru
  for(const k of [1000, 100, 10]){                     // bozuk kaydi geri kazan
    if(yakin(kayitli*k, geo)) return Math.round(kayitli*k*100)/100;
  }
  return geo;                                          // kurtarilamadi, olcumu kullan
}

function capHalkasi(p){
  if(!p?.geojson?.geometry) return null;
  const g = p.geojson.geometry;
  const h = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(h.length>1 && h[0][0]===h[h.length-1][0] && h[0][1]===h[h.length-1][1]) h.pop();
  return metreye(h);
}

function metreye(halka){
  const lat0 = halka.reduce((t,k)=>t+k[1],0)/halka.length;
  const kx = Math.cos(lat0*Math.PI/180) * 111320, ky = 110540;
  const x0 = halka[0][0], y0 = halka[0][1];
  return halka.map(k=>[ (k[0]-x0)*kx, (k[1]-y0)*ky ]);
}

function alanHesap(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    a += pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
  }
  return Math.abs(a)/2;
}

// n·p <= d yarim duzlemine kirp (Sutherland-Hodgman)
function kirp(poly, n, d){
  const cik = [];
  for(let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const da = n[0]*a[0]+n[1]*a[1]-d, db = n[0]*b[0]+n[1]*b[1]-d;
    if(da <= 0) cik.push(a);
    if((da < 0 && db > 0) || (da > 0 && db < 0)){
      const t = da/(da-db);
      cik.push([ a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1]) ]);
    }
  }
  return cik;
}

// parselin en uzun kenar yonu
function anaYon(pts){
  let enUzun = 0, yon = [1,0];
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    const dx = pts[j][0]-pts[i][0], dy = pts[j][1]-pts[i][1];
    const u = Math.hypot(dx,dy);
    if(u > enUzun){ enUzun = u; yon = [dx/u, dy/u]; }
  }
  return yon;
}

// verilen yone dik seritlere bol
// mutlak=true ise hedefler m2 olarak birebir uygulanir (orantilanmaz)
function parcala(pts, hedefler, yonVer, mutlak){
  const yon = yonVer || anaYon(pts);
  const izd = pts.map(p=>p[0]*yon[0]+p[1]*yon[1]);
  let alt = Math.min(...izd), ust = Math.max(...izd);
  const toplam = alanHesap(pts);
  const oran = hedefler.reduce((t,h)=>t+h,0) || toplam;

  const parcalar = [];
  let sinir = alt;
  for(let i=0;i<hedefler.length;i++){
    if(i === hedefler.length-1){
      parcalar.push(kirp(pts, [-yon[0],-yon[1]], -sinir));
      break;
    }
    const hedef = mutlak ? hedefler[i] : toplam * (hedefler[i]/oran);
    let a = sinir, b = ust, kes = ust;
    for(let k=0;k<44;k++){
      kes = (a+b)/2;
      const dilim = kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir);
      const al = dilim.length > 2 ? alanHesap(dilim) : 0;
      if(al < hedef) a = kes; else b = kes;
    }
    parcalar.push(kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir));
    sinir = kes;
  }
  return parcalar.filter(p=>p.length > 2);
}

// izgara: once sutunlara, sonra her sutunu satirlara bol
function parcalaIzgara(pts, sutun, satir, hedefler){
  const ana = anaYon(pts);
  const dik = [-ana[1], ana[0]];
  const sutunHedef = [];
  for(let s2=0;s2<sutun;s2++){
    let t = 0;
    for(let r=0;r<satir;r++) t += hedefler[s2*satir + r] || 0;
    sutunHedef.push(t || 1);
  }
  const sutunlar = parcala(pts, sutunHedef, dik);
  const cikti = [];
  sutunlar.forEach((sp, s2)=>{
    const satirHedef = [];
    for(let r=0;r<satir;r++) satirHedef.push(hedefler[s2*satir + r] || 1);
    const parcalari = satir > 1 ? parcala(sp, satirHedef, ana) : [sp];
    parcalari.forEach(pp=>cikti.push(pp));
  });
  return cikti;
}

// parselin ortasindan uzun eksen boyunca yol seridi ayir
function yolAyir(pts, genislik){
  const ana = anaYon(pts);
  const dik = [-ana[1], ana[0]];
  const izd = pts.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  const orta = (Math.min(...izd) + Math.max(...izd)) / 2;
  const y1 = orta - genislik/2, y2 = orta + genislik/2;
  return {
    yol: kirp(kirp(pts, dik, y2), [-dik[0],-dik[1]], -y1),
    sol: kirp(pts, dik, y1),
    sag: kirp(pts, [-dik[0],-dik[1]], -y2),
    ana, dik
  };
}

// parselin buyuklugune gore makul yol genisligi
function yolGenisligiOner(alan){
  if(alan < 5000) return 5;
  if(alan < 20000) return 7;
  return 10;
}

// blok tarifine gore parcalari ve yolu uret
// cfg = { bloklar:[ {tip:"tam", parcalar:[...]} | {tip:"yol", sol:[...], sag:[...]} ], enAzYol, ters }
function capYerlesim(M, cfg){
  let ana = anaYon(M);
  if(cfg.ters) ana = [-ana[0], -ana[1]];
  const dik = [-ana[1], ana[0]];
  const bos = { parcalar:[], yol:[], ana, dik, yolGenislik:0, yolAlan:0 };

  const bloklar = (cfg.bloklar||[]).map(b=>{
    if(b.tip === "yol") return { tip:"yol",
      sol:(b.sol||[]).map(o=>({ ...o, m2:Math.max(1,+o.m2||1) })),
      sag:(b.sag||[]).map(o=>({ ...o, m2:Math.max(1,+o.m2||1) })) };
    return { tip:"tam", parcalar:(b.parcalar||[]).map(o=>({ ...o, m2:Math.max(1,+o.m2||1) })) };
  }).filter(b=> b.tip === "yol" ? (b.sol.length + b.sag.length) : b.parcalar.length);
  if(!bloklar.length) return bos;

  const A = alanHesap(M);
  const izdA = M.map(p=>p[0]*ana[0]+p[1]*ana[1]);
  const izdD = M.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  const aMin = Math.min(...izdA), aMax = Math.max(...izdA);
  const dMin = Math.min(...izdD), dMax = Math.max(...izdD);
  const W = dMax - dMin, boy = aMax - aMin;
  const enAz = 3;

  const blokAlan = bloklar.map(b=> b.tip === "yol"
    ? b.sol.concat(b.sag).reduce((t,o)=>t+o.m2,0)
    : b.parcalar.reduce((t,o)=>t+o.m2,0));
  const T = blokAlan.reduce((a,b)=>a+b,0);

  // yol her zaman 3 m; girilen metrekareler hicbir zaman degistirilmez
  const w = Math.min(enAz, W*0.35);
  const carpan = 1;
  const yolAlan = w * boy;

  const kA = (poly, deger, ust) => ust ? kirp(poly, ana, deger) : kirp(poly, [-ana[0],-ana[1]], -deger);
  const kD = (poly, deger, ust) => ust ? kirp(poly, dik, deger) : kirp(poly, [-dik[0],-dik[1]], -deger);
  const serit = (a0, a1, d0, d1) => {
    let p = kA(kA(M, a1, true), a0, false);
    if(p.length < 3) return null;
    p = kD(kD(p, d1, true), d0, false);
    return p.length > 2 ? p : null;
  };

  // bloklari uzun eksen boyunca alanlarina gore ayir
  const blokHedef = blokAlan.slice();
  const sinirlar = [aMin];
  const olcekK = A / Math.max(1, T);          // girilen alanlari parsele olcekle
  let s2 = aMin;
  blokHedef.forEach((h,i)=>{
    if(i === blokHedef.length-1){ sinirlar.push(aMax); return; }
    let lo = s2, hi = aMax, kes = aMax;
    for(let k=0;k<40;k++){
      kes = (lo+hi)/2;
      const dilim = kA(kA(M, kes, true), s2, false);
      const al = dilim.length > 2 ? alanHesap(dilim) : 0;
      if(al < h*olcekK) lo = kes; else hi = kes;
    }
    sinirlar.push(kes); s2 = kes;
  });

  const konum = cfg.yolKonum || "oto";
  const solMerkez = dMin + w/2, sagMerkez = dMax - w/2, ortaMerkez = (dMin + dMax)/2;
  const kenarMerkez = konum === "sag" ? sagMerkez : konum === "orta" ? ortaMerkez : solMerkez;
  const merkez = bloklar.map(b=>{
    if(konum === "sol") return solMerkez;
    if(konum === "sag") return sagMerkez;
    if(konum === "orta") return ortaMerkez;
    return b.tip === "yol" ? ortaMerkez : kenarMerkez;   // otomatik
  });

  const cikti = [], yolParcalari = [];

  bloklar.forEach((b, i)=>{
    const a0 = sinirlar[i], a1 = sinirlar[i+1];
    let dc = merkez[i];
    if(b.tip === "yol"){
      const oS = b.sol.reduce((t,o)=>t+o.m2,0), oG = b.sag.reduce((t,o)=>t+o.m2,0);
      dc = dMin + W * (oS / Math.max(1, oS + oG));
    }
    const yd0 = dc - w/2, yd1 = dc + w/2;

    const ys = serit(a0, a1, yd0, yd1);
    if(ys) yolParcalari.push(ys);

    if(i > 0 && Math.abs(merkez[i] - merkez[i-1]) > 0.01){
      const d0 = Math.min(merkez[i], merkez[i-1]);
      const d1 = Math.max(merkez[i], merkez[i-1]);
      const bag = serit(a0 - w/2, a0 + w/2, d0, d1);
      if(bag) yolParcalari.push(bag);
    }

    const bant = kA(kA(M, a1, true), a0, false);
    if(bant.length < 3) return;

    if(b.tip === "tam"){
      const kalanBant = bant;
      const hedefler = b.parcalar.map(o=>o.m2);
      const kaynak = kalanBant.length > 2 ? kalanBant : bant;
      parcala(kaynak, hedefler, ana, false).forEach((p,k)=>{
        if(b.parcalar[k]) cikti.push({ poly:p, bilgi:b.parcalar[k] });
      });
      return;
    }

    const ortaD = (dMin + dMax) / 2;
    const oranSol = b.sol.reduce((t,o)=>t+o.m2,0);
    const oranSag = b.sag.reduce((t,o)=>t+o.m2,0);
    const ayirici = dMin + W * (oranSol / Math.max(1, oranSol + oranSag));
    const sol = kD(bant, ayirici, true);
    const sag = kD(bant, ayirici, false);
    if(b.sol.length && sol.length > 2)
      parcala(sol, b.sol.map(o=>o.m2), ana, false).forEach((p,k)=>{
        if(b.sol[k]) cikti.push({ poly:p, bilgi:b.sol[k] });
      });
    if(b.sag.length && sag.length > 2)
      parcala(sag, b.sag.map(o=>o.m2), ana, false).forEach((p,k)=>{
        if(b.sag[k]) cikti.push({ poly:p, bilgi:b.sag[k] });
      });
  });

  return { parcalar: cikti, yol: yolParcalari, ana, dik,
           yolGenislik: w, yolAlan: Math.round(yolAlan),
           kucultme: 0 };
}

function parcalariUret(M, cfg){
  return capYerlesim(M, cfg).parcalar.map(o=>o.poly);
}

function cfgParcalari(cfg){
  const liste = [];
  (cfg.bloklar||[]).forEach(b=>{
    if(b.tip === "yol"){ (b.sol||[]).forEach(o=>liste.push({ ...o })); (b.sag||[]).forEach(o=>liste.push({ ...o })); }
    else (b.parcalar||[]).forEach(o=>liste.push({ ...o }));
  });
  return liste;
}

// parcanin ana ve dik eksendeki olculeri (cephe x derinlik)
function parcaOlcu(pts){
  const ana = anaYon(pts), dik = [-ana[1], ana[0]];
  const a = pts.map(p=>p[0]*ana[0]+p[1]*ana[1]);
  const d = pts.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  return { boy: Math.max(...a)-Math.min(...a), en: Math.max(...d)-Math.min(...d) };
}

function agirlikMerkezi(pts){
  let x=0, y=0, a=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    const c = pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
    a += c; x += (pts[i][0]+pts[j][0])*c; y += (pts[i][1]+pts[j][1])*c;
  }
  a *= 0.5;
  return a ? [x/(6*a), y/(6*a)] : [pts[0][0], pts[0][1]];
}

async function capCiz(parselId, cfg, belgeId){
  const { data:p } = await sb.from("parcels").select("*").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  toast("Çap çiziliyor…");
  try{
    const { jsPDF } = window.jspdf;
    let pdf;
    {
      // iki sayfa yan yana: tek yatay A4
      const G2 = 2000, Y2 = 1400;
      const birlesik = document.createElement("canvas");
      birlesik.width = G2; birlesik.height = Y2;
      const bx = birlesik.getContext("2d");
      bx.fillStyle = "#FFFFFF"; bx.fillRect(0,0,G2,Y2);
      const sol = await yukleGorsel(capCizPng(p, cfg));
      const sag = await yukleGorsel(muvafakatPng(p, 1000, 1400));
      bx.drawImage(sol, 0, 0, 1000, 1400);
      bx.drawImage(sag, 1000, 0, 1000, 1400);
      bx.strokeStyle = "#D8DBDE"; bx.lineWidth = 2;
      bx.beginPath(); bx.moveTo(1000, 40); bx.lineTo(1000, Y2-40); bx.stroke();
      pdf = new jsPDF({ orientation:"landscape", unit:"mm", format:"a4" });
      const gen = 277, yuk = gen * (Y2/G2);
      pdf.addImage(birlesik.toDataURL("image/png"), "PNG", 10, (210-yuk)/2, gen, yuk);
    }
    const blob = pdf.output("blob");
    const dosya = new File([blob], capDosyaAdi(p, "pdf"), { type:"application/pdf" });
    if(belgeId){
      const { data:b2 } = await sb.from("documents").select("file_path,file_name").eq("id", belgeId).single();
      if(b2){
        // depo kurallari uzerine yazmaya izin vermiyor: once sil, sonra ayni yola yukle
        await sb.storage.from("arsatakip").remove([b2.file_path]);
        const { error } = await sb.storage.from("arsatakip").upload(b2.file_path, dosya);
        if(error) throw error;
        const { error:e2 } = await sb.from("documents")
          .update({ size_bytes: dosya.size, cap_config: cfg }).eq("id", belgeId);
        if(e2) throw e2;
      }else await dosyaYukle(dosya, "cap", parselId, cfg);
    }else{
      await dosyaYukle(dosya, "cap", parselId, cfg);
    }
    if(cfg && cfg.parcalar?.length) await sb.from("parcels").update({ cap_config: cfg }).eq("id", parselId);
    toast(belgeId ? "Çap güncellendi" : "Çap hazırlandı ve parsele eklendi");
    go("parsel", parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

// turkce karakter icermeyen dosya adi: kustepe-114-1-15-09-2026.pdf
function sadeAd(x){
  return String(x||"")
    .replace(/[ıİ]/g,"i").replace(/[şŞ]/g,"s").replace(/[ğĞ]/g,"g")
    .replace(/[üÜ]/g,"u").replace(/[öÖ]/g,"o").replace(/[çÇ]/g,"c")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function capDosyaAdi(p, uzanti){
  const t = new Date();
  const ik = n => String(n).padStart(2,"0");
  const tarih = `${ik(t.getDate())}-${ik(t.getMonth()+1)}-${t.getFullYear()}`;
  return [sadeAd(p.mahalle) || "parsel", p.ada || 0, p.parsel, tarih].join("-") + "." + uzanti;
}

function dxfUret(p, cfg){
  const M = capHalkasi(p);
  if(!M) throw new Error("sınır çizimi yok");
  const yer = capYerlesim(M, cfg);
  const L = [];
  const g = (kod, deger) => { L.push(String(kod)); L.push(String(deger)); };

  g(0,"SECTION"); g(2,"HEADER"); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"TABLES");
  g(0,"TABLE"); g(2,"LAYER"); g(70,4);
  [["PARSEL_SINIR",1],["PARCALAR",3],["YOL",8],["YAZI",2]].forEach(([ad2,renk])=>{
    g(0,"LAYER"); g(2,ad2); g(70,0); g(62,renk); g(6,"CONTINUOUS");
  });
  g(0,"ENDTAB"); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"ENTITIES");

  const cizgi = (a,b,katman) => {
    g(0,"LINE"); g(8,katman);
    g(10,a[0].toFixed(3)); g(20,a[1].toFixed(3)); g(30,"0.0");
    g(11,b[0].toFixed(3)); g(21,b[1].toFixed(3)); g(31,"0.0");
  };
  const halka = (pts,katman) => { for(let i=0;i<pts.length;i++) cizgi(pts[i], pts[(i+1)%pts.length], katman); };
  const yazi = (nokta, metin, boy) => {
    g(0,"TEXT"); g(8,"YAZI");
    g(10,nokta[0].toFixed(3)); g(20,nokta[1].toFixed(3)); g(30,"0.0");
    g(40,boy.toFixed(2)); g(1,String(metin)); g(72,1); g(11,nokta[0].toFixed(3)); g(21,nokta[1].toFixed(3)); g(31,"0.0");
  };

  halka(M, "PARSEL_SINIR");
  (yer.yol||[]).forEach(yp=>{ if(yp && yp.length>2) halka(yp, "YOL"); });
  yer.parcalar.forEach((o,i)=>{
    if(!o.poly || o.poly.length < 3) return;
    halka(o.poly, "PARCALAR");
    const om = agirlikMerkezi(o.poly);
    const b2 = o.bilgi || {};
    yazi(om, String(b2.no || (i+1)), 3);
    yazi([om[0], om[1]-4], `${(b2.m2 ?? alanHesap(o.poly)).toFixed(2)} m2`, 2);
  });

  g(0,"ENDSEC"); g(0,"EOF");
  return L.join("\r\n");
}

/* ---- cap sayfasi tasarimi: cerceve, kunye, muvafakatname ---- */

const CAP_R = { kirmizi:"#A3242C", gri:"#8B9096", sari:"#FCF3CF", cizgi:"#3A3A3A" };

// kurumsal kirmizi-gri cerceve
function capCerceve(x, G, Y, baslik){
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);

  // ince cift cerceve
  x.strokeStyle = CAP_R.kirmizi; x.lineWidth = 3;
  x.strokeRect(26, 26, G-52, Y-52);
  x.strokeStyle = "#C9CDD2"; x.lineWidth = 1;
  x.strokeRect(34, 34, G-68, Y-68);

  // kose aksanlari
  const k = 34, u = 46;
  x.strokeStyle = CAP_R.kirmizi; x.lineWidth = 6;
  [[k,k,1,1],[G-k,k,-1,1],[k,Y-k,1,-1],[G-k,Y-k,-1,-1]].forEach(([cx,cy,sx,sy])=>{
    x.beginPath(); x.moveTo(cx + sx*u, cy); x.lineTo(cx, cy); x.lineTo(cx, cy + sy*u); x.stroke();
  });

  // ust serit
  if(baslik){
    x.fillStyle = CAP_R.kirmizi;
    x.fillRect(34, 34, G-68, 6);
    x.textAlign = "center"; x.textBaseline = "alphabetic";
    x.fillStyle = "#1A1A1A"; x.font = "400 34px Georgia, serif";
    x.fillText(baslik, G/2, 104);
    x.strokeStyle = "#D8DBDE"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(G*0.30, 120); x.lineTo(G*0.70, 120); x.stroke();
  }
}

// kunye tablosu (sari basliklar)
function capKunye(x, p, sol, ust, gen){
  const sy = 34, yariGen = gen/2, etiketGen = yariGen*0.42;
  const satirlar = [
    ["İL", duzgun(p.il), "ADA", p.ada || "—"],
    ["İLÇE", duzgun(p.ilce), "PARSEL", p.parsel],
    ["KÖY / MAH.", duzgun(p.mahalle), "YÜZÖLÇÜMÜ", nf2(gercekAlan(p)) + " m²"]
  ];
  x.lineWidth = 1.2; x.strokeStyle = CAP_R.cizgi;
  satirlar.forEach((r,i)=>{
    const y = ust + i*sy;
    [[sol, etiketGen, r[0], true], [sol+etiketGen, yariGen-etiketGen, r[1], false],
     [sol+yariGen, etiketGen, r[2], true], [sol+yariGen+etiketGen, yariGen-etiketGen, r[3], false]]
    .forEach(([hx, hw, metin, basMi])=>{
      x.fillStyle = basMi ? CAP_R.sari : "#FFFFFF";
      x.fillRect(hx, y, hw, sy);
      x.strokeRect(hx, y, hw, sy);
      x.fillStyle = "#111"; x.font = `${basMi?"700":"400"} 15px Arial`;
      x.textAlign = "left"; x.textBaseline = "middle";
      x.fillText(String(metin).slice(0,26), hx + 10, y + sy/2);
    });
  });
  return ust + satirlar.length*sy;
}

// ikinci sayfa: muvafakatname

  // ozel parselasyon bilgileri
  const sy = 34;
  x.lineWidth = 1.2; x.strokeStyle = CAP_R.cizgi;
  x.fillStyle = CAP_R.sari; x.fillRect(sol, 160, gen, sy); x.strokeRect(sol, 160, gen, sy);
  x.fillStyle = "#111"; x.font = "400 17px Georgia, serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText("ÖZEL PARSELASYON BİLGİLERİ", sol + gen/2, 160 + sy/2);
  [["PARSELASYON NO", ""], ["HİSSE YÜZÖLÇÜMÜ", ""]].forEach(([ad2,deger],i)=>{
    const y = 160 + sy*(i+1), w1 = gen*0.42;
    x.fillStyle = CAP_R.sari; x.fillRect(sol, y, gen, sy);
    x.strokeRect(sol, y, w1, sy); x.strokeRect(sol+w1, y, gen-w1, sy);
    x.fillStyle = "#111"; x.font = "400 16px Georgia, serif"; x.textAlign = "left";
    x.fillText(ad2, sol + 10, y + sy/2);
  });

  // metin
  const metinler = [
    "",
    "Ben …..................... oğlu/kızı …......................................",
    "",
    "Yukarıda ve yanda açık bilgileri yazılı olan …........ vasfındaki gayrımenkulü, …..................... oğlu/kızı …............................................... sattım. Satmış olduğum gayrımenkulde hiçbir tasarrufum kalmamıştır. Alıcı, satın almış olduğu gayrımenkulün tasarrufu esnasında komşu hisselere ve yol paylarına tecavüz edemez. Aksi halde doğacak olan tüm olumsuzluklardan alıcı bizzat sorumlu olup, maddi ve manevi giderleri karşılamayı peşinen taahhüt eder.",
    "",
    "",
    "Ben …..................... oğlu/kızı …......................................",
    "",
    "Yukarıda ve yanda açık bilgileri yazılı olan ........ vasfındaki gayrımenkulden …......... m² hisse satın aldım. Aldığım hissenin sınırları dışına çıkmayacağımı, diğer hisse sınırlarına ve yol paylarına tecavüz etmeyeceğimi ve izale-i şuyu ile şufa davaları açmayacağımı taahhüt ederim. Aksi halde, T.C. Mahkemeleri nezdinde aleyhimdeki hiçbir karara itiraz etmeyeceğimi bu muvafakatnameyle taahhüt ederim."
  ];
  x.textAlign = "left"; x.fillStyle = "#111";
  let y = 160 + sy*3 + 52;
  metinler.forEach(par=>{
    if(!par){ y += 16; return; }
    OLCER.font = "400 17px Georgia, serif";
    const satirlar = [];
    let satir = "";
    par.split(" ").forEach(k=>{
      const dene = satir ? satir + " " + k : k;
      if(OLCER.measureText(dene).width > gen - 20){ satirlar.push(satir); satir = k; }
      else satir = dene;
    });
    if(satir) satirlar.push(satir);
    x.font = "400 17px Georgia, serif";
    satirlar.forEach(t=>{ x.fillText(t, sol + 10, y); y += 27; });
    y += 10;
  });

  // alici - satici
  y = Math.max(y + 60, Y - 300);
  const kolon = [["ALICI:", sol + 40], ["SATICI:", sol + gen*0.55]];
  kolon.forEach(([ad2, kx])=>{
    x.font = "400 20px Georgia, serif"; x.fillStyle = "#111";
    x.fillText(ad2, kx, y);
    x.strokeStyle = CAP_R.cizgi; x.lineWidth = 1;
    x.beginPath(); x.moveTo(kx - 8, y + 10); x.lineTo(kx + 170, y + 10); x.stroke();
    x.font = "400 18px Georgia, serif";
    ["ADI:", "SOYADI:", "İMZASI:"].forEach((t,i)=> x.fillText(t, kx, y + 50 + i*34));

  return c.toDataURL("image/png");
}

// donmus yazinin eksen hizali sinir kutusu
function yaziKutusu(cx, cy, gen, yuk, aci){
  const c = Math.abs(Math.cos(aci)), si = Math.abs(Math.sin(aci));
  const w = gen*c + yuk*si, h = gen*si + yuk*c;
  return { x1:cx - w/2, y1:cy - h/2, x2:cx + w/2, y2:cy + h/2 };
}
const kutuCakisiyor = (a,b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);

// resmi capa benzer cizim: kunye tablosu, kuzey gulu, parcalar ve olculer
function capCizPng(p, cfg, kucuk){
  const parcalar = cfg?.parcalar || null;
  const M = capHalkasi(p);
  if(!M) throw new Error("sınır çizimi yok");

  const G = kucuk ? 700 : 1000, Y = kucuk ? 900 : 1400;
  const ustAlan = kucuk ? 110 : 330, altAlan = kucuk ? 30 : 90, kenar = kucuk ? 40 : 80;
  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  if(kucuk){ x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y); }
  else capCerceve(x, G, Y, "PARSELASYON KROKİSİ");
  const S = k => kucuk ? Math.max(8, Math.round(k*0.66)) : k;

  const minX = Math.min(...M.map(k=>k[0])), maxX = Math.max(...M.map(k=>k[0]));
  const minY = Math.min(...M.map(k=>k[1])), maxY = Math.max(...M.map(k=>k[1]));
  const alanG = G - kenar*2, alanY = Y - ustAlan - altAlan;
  const olcek = Math.min(alanG/((maxX-minX)||1e-9), alanY/((maxY-minY)||1e-9));
  const gX = kenar + (alanG - (maxX-minX)*olcek)/2;
  const gY = ustAlan + (alanY - (maxY-minY)*olcek)/2;
  const E = m => [ gX + (m[0]-minX)*olcek, gY + (maxY-m[1])*olcek ];
  const N = M.map(E);
  const yol = pts => { x.beginPath(); pts.forEach((k,i)=> i ? x.lineTo(k[0],k[1]) : x.moveTo(k[0],k[1])); x.closePath(); };

  // ---- baslik ve kunye ----
  if(!kucuk){
    capKunye(x, p, 62, 142, G - 124);

    // kuzey gulu
    const kx2 = 96, ky2 = 300;
    x.save(); x.translate(kx2, ky2);
    x.fillStyle = "#111"; x.font = "700 13px Arial"; x.textAlign = "center";
    x.fillText("KUZEY", 0, -30);
    x.beginPath(); x.arc(0,0,17,0,7); x.strokeStyle = "#333"; x.lineWidth = 1.2; x.stroke();
    x.beginPath(); x.moveTo(0,-22); x.lineTo(-8,10); x.lineTo(0,3); x.lineTo(8,10); x.closePath();
    x.fillStyle = "#111"; x.fill();
    x.restore();
  }

  const etiketler = [], dolu = [], bekleyen = [];
  const liste = (parcalar && parcalar.length > 1) ? parcalar : null;
  if(liste){
    const yer = capYerlesim(M, cfg);

    yer.parcalar.forEach((o,i)=>{
      const d = o.poly, ek = d.map(E), bilgi = o.bilgi || liste[i] || {};
      yol(ek);
      x.fillStyle = bilgi.renk || "#FFFFFF"; x.globalAlpha = .55; x.fill(); x.globalAlpha = 1;
      x.lineWidth = 1.6; x.strokeStyle = "#222"; x.stroke();

      const om = E(agirlikMerkezi(d));
      x.textAlign = "center"; x.textBaseline = "middle";
      x.font = `700 ${S(20)}px Arial`; x.fillStyle = "#111";
      x.fillText(String(bilgi.no || (i+1)), om[0], om[1] - S(12));
      x.font = `400 ${S(15)}px Arial`;
      const m2Metin = nfAkilli(bilgi.m2 ?? alanHesap(d)) + " m2";
      x.fillText(m2Metin, om[0], om[1] + S(10));
      // no ve m2 blogunu dolu alan olarak isaretle
      const blokGen = Math.max(x.measureText(m2Metin).width, S(30)) + S(10);
      dolu.push({ x1:om[0]-blokGen/2, y1:om[1]-S(26), x2:om[0]+blokGen/2, y2:om[1]+S(20) });

      // kenar olculeri: konumu sonra, carpismaya bakarak belirlenecek
      if(cfg.olculer !== false && !kucuk){
        for(let k=0;k<d.length;k++){
          const j = (k+1) % d.length;
          const uz = Math.hypot(d[j][0]-d[k][0], d[j][1]-d[k][1]);
          if(uz < 4) continue;
          const a1 = ek[k], a2 = ek[j];
          const dx = a2[0]-a1[0], dy = a2[1]-a1[1], u = Math.hypot(dx,dy) || 1;
          if(u < 30) continue;
          bekleyen.push({ a1, a2, dx, dy, u, om, metin: uz.toFixed(1).replace(".",",") + " m" });
        }
      }
    });

    // parsel yolu: once tum parcalar dolgu (birlesik gorunsun), sonra seyrek cizgiler
    (yer.yol||[]).forEach(yp=>{
      if(!yp || yp.length < 3) return;
      yol(yp.map(E)); x.fillStyle = "#EDF0F3"; x.fill();
    });
    x.save();
    x.beginPath();
    (yer.yol||[]).forEach(yp=>{ if(yp && yp.length > 2){ const e2 = yp.map(E);
      e2.forEach((k,i)=> i ? x.lineTo(k[0],k[1]) : x.moveTo(k[0],k[1])); x.closePath(); } });
    x.clip();
    x.strokeStyle = "#C2C9D0"; x.lineWidth = 1; x.setLineDash([5,9]);
    const adim = kucuk ? 7 : 11;
    const kose = Math.atan2(yer.ana[1], yer.ana[0]);
    for(let t=-Y; t<G+Y; t+=adim){
      x.beginPath();
      x.moveTo(t, 0); x.lineTo(t + Y*Math.tan(kose), Y);
      x.stroke();
    }
    x.setLineDash([]); x.restore();
    if((yer.yol||[]).length && !kucuk){
      const enBuyuk = yer.yol.reduce((a,b2)=>
        (b2.length>2 && alanHesap(b2) > (a && a.length>2 ? alanHesap(a) : 0)) ? b2 : a, yer.yol[0]);
      if(enBuyuk && enBuyuk.length > 2){
        const om = E(agirlikMerkezi(enBuyuk));
        x.save(); x.translate(om[0], om[1]);
        let ac = Math.atan2(yer.ana[1], yer.ana[0]);
        x.rotate(-ac + (Math.abs(ac) > Math.PI/2 ? Math.PI : 0));
        x.textAlign = "center"; x.textBaseline = "middle";
        x.font = "700 12px Arial"; x.fillStyle = "#5A6169";
        x.fillText(cfg.yolTipi === "resmi" ? "RESMİ YOL" : "PARSEL YOLU", 0, 0);
        x.restore();
      }
    }
  }else{
    yol(N); x.fillStyle = "#F4F6F0"; x.fill();
  }

  // ---- kenar olculerini carpismadan yerlestir ----
  if(bekleyen.length){
    x.font = `400 ${S(11)}px Arial`; x.textAlign = "center"; x.textBaseline = "middle";
    const konumlar = [0.5, 0.36, 0.64, 0.24, 0.76];
    const uzakliklar = [9, 15, 22, 30];
    bekleyen.forEach(b2=>{
      const nx = -b2.dy/b2.u, ny = b2.dx/b2.u;
      let ac = Math.atan2(b2.dy, b2.dx);
      if(Math.abs(ac) > Math.PI/2) ac += Math.PI;
      const gen = x.measureText(b2.metin).width + 4, yuk = S(13);

      let yerlesti = false;
      for(const uzk of uzakliklar){
        for(const t of konumlar){
          for(const yon of [-1, 1]){
            const ox = b2.a1[0] + b2.dx*t, oy = b2.a1[1] + b2.dy*t;
            const mx = b2.om[0] - ox, my = b2.om[1] - oy;
            const disa = (nx*mx + ny*my) > 0 ? -1 : 1;
            const s2 = yon === -1 ? disa : -disa;      // once disari, olmazsa iceri
            const px = ox + nx*uzk*s2, py = oy + ny*uzk*s2;
            const kutu = yaziKutusu(px, py, gen, yuk, ac);
            if(kutu.x1 < 40 || kutu.y1 < 40 || kutu.x2 > G-40 || kutu.y2 > Y-40) continue;
            if(dolu.some(k=>kutuCakisiyor(kutu, k))) continue;
            dolu.push(kutu);
            x.save(); x.translate(px, py); x.rotate(ac);
            x.fillStyle = "rgba(255,255,255,.75)"; x.fillRect(-gen/2, -yuk/2, gen, yuk);
            x.fillStyle = "#333"; x.fillText(b2.metin, 0, 0);
            x.restore();
            yerlesti = true; break;
          }
          if(yerlesti) break;
        }
        if(yerlesti) break;
      }
    });
  }

  SON_ETIKETLER = etiketler;

  // dis sinir
  yol(N); x.lineWidth = kucuk ? 2 : 3; x.strokeStyle = "#111"; x.stroke();

  return c.toDataURL("image/png");
}

async function kmlIndirParsel(parselId){
  const { data:p } = await sb.from("parcels").select("geojson,mahalle,ada,parsel").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  const f = p.geojson;
  const b = new Blob([kmlMetni(f)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${p.mahalle||"parsel"}-${p.ada||0}-${p.parsel}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

let MINI = null;
async function miniHarita(parselId){
  const kutu = document.getElementById("minikutu");
  if(!kutu) return;
  if(kutu.innerHTML){ kutu.innerHTML = ""; MINI = null; return; }
  kutu.innerHTML = `<div id="minimap" style="margin-top:12px"></div>`;
  const { data:p } = await sb.from("parcels").select("geojson,lat,lng").eq("id",parselId).single();
  MINI = L.map("minimap", { zoomControl:true }).setView([p.lat, p.lng], 16);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Uydu: Esri · Parsel: TKGM" }).addTo(MINI);
  if(p.geojson){
    const kat = L.geoJSON(p.geojson, { style:{ color:"#E3C05A", weight:2.5, fillColor:"#E3C05A", fillOpacity:.18 } }).addTo(MINI);
    MINI.fitBounds(kat.getBounds(), { padding:[24,24], maxZoom:18 });
  }
  setTimeout(()=>MINI.invalidateSize(), 200);
}

      </div>
      <div class="kv" style="margin-top:10px"><span>Vekalet</span>
        ${belgeHucre(bul(k.vekalet_doc_id), k.id, "vekalet")}</div>
      <div class="kv"><span>Muvafakatname</span>
        ${belgeHucre(bul(k.muvafakat_doc_id), k.id, "muvafakat")}</div>
      <div class="kv"><span>Vekalet geçerliliği</span>
        ${ME.role==='admin'
          ? `<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
              <select style="width:auto;padding:7px 30px 7px 10px;font-size:13px" onchange="suresizGuncelle('${k.id}',this.value)">
                <option value="tarih"${k.suresiz?"":" selected"}>Tarihli</option>
                <option value="suresiz"${k.suresiz?" selected":""}>Süresiz</option></select>
              ${k.suresiz ? "" : `<input type="date" style="width:auto;padding:7px 10px;font-size:13px" value="${k.gecerlilik_tarihi||""}"
                 onchange="tarihGuncelle('${k.id}',this.value)">`}</span>`
          : `<b>${k.suresiz ? "Süresiz" : (k.gecerlilik_tarihi ? new Date(k.gecerlilik_tarihi).toLocaleDateString("tr-TR") : "—")}</b>`}</div>
      ${durum ? `<div style="font-size:12px;color:${renk};margin-top:6px;text-align:right;font-weight:600">${durum}</div>` : ""}
    </div>`;
  }).join("");
}

function belgeHucre(belge, kisiId, tur){
  if(belge) return `<span style="display:flex;gap:8px;align-items:center">
    <button class="pill gold" onclick="dosyaAc('${esc(belge.file_path)}')">aç</button>
    ${ME.role!=='uye'?`<button class="pill" style="background:var(--cam-2);color:var(--ink-3)" onclick="ekBelgeYukle('${kisiId}','${tur}')">değiştir</button>`:""}</span>`;
  return ME.role!=='uye'
    ? `<button class="pill gold" onclick="ekBelgeYukle('${kisiId}','${tur}')">yükle</button>`
    : `<b style="color:var(--ink-3)">—</b>`;
}

async function ekBelgeYukle(kisiId, tur){
  const f = await dosyaSec();
  if(!f) return;
  toast("Yükleniyor…");
  try{
    const b = await dosyaYukle(f, tur, null);
    const alan = tur === "vekalet" ? "vekalet_doc_id" : "muvafakat_doc_id";
    const { error } = await sb.from("ekler").update({ [alan]: b.id }).eq("id", kisiId);
    if(error) throw error;
    toast("Yüklendi"); eklerListele();
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

async function suresizGuncelle(kisiId, deger){
  const { error } = await sb.from("ekler").update({ suresiz: deger === "suresiz" }).eq("id", kisiId);
  if(error) return toast("Olmadı: " + error.message);
  eklerListele();
}

async function tarihGuncelle(kisiId, tarih){
  const { error } = await sb.from("ekler").update({ gecerlilik_tarihi: tarih || null }).eq("id", kisiId);
  if(error) return toast("Olmadı: " + error.message);
  toast("Tarih kaydedildi"); eklerListele();
}

function kisiEkle(){
  app.innerHTML = head("Kişi ekle","go('ekler')") + `
    <div class="field"><label>Ad soyad</label><input id="as" placeholder="Ad ve soyad"></div>
    <div class="field"><label>Vekalet geçerlilik tarihi</label><input id="gt" type="date"></div>
    <div class="field"><label>İlgili parsel (isteğe bağlı)</label><select id="pr"><option value="">Seçme, genel kalsın</option></select></div>
    <button class="btn" id="kay">Kaydet</button>
    <p class="ipuc" style="margin-top:16px">Belgeleri kaydettikten sonra listeden yükleyeceksin.</p>`;
  sb.from("parcels").select("id,mahalle,ada,parsel").order("mahalle").then(({data})=>{
    const sel = document.getElementById("pr");
    if(sel && data) sel.innerHTML += data.map(p=>
      `<option value="${p.id}">${esc(duzgun(p.mahalle))} ${esc(p.ada||"")}/${esc(p.parsel)}</option>`).join("");
  });
  document.getElementById("kay").onclick = async e => {
    const ad2 = document.getElementById("as").value.trim();
    if(!ad2) return toast("Ad soyad yaz");
    e.target.disabled = true;
    const { error } = await sb.from("ekler").insert({ team_id:ME.team_id, ad_soyad:ad2,
      parcel_id: document.getElementById("pr").value || null,
      gecerlilik_tarihi: document.getElementById("gt").value || null });
    e.target.disabled = false;
    if(error) return toast("Olmadı: " + error.message);
    toast("Eklendi"); go("ekler");
  };
}

async function kisiSil(kisiId, ad2){
  if(!confirm(`${ad2} kaydı silinsin mi? Yüklenen belgeler depoda kalır.`)) return;
  const { error } = await sb.from("ekler").delete().eq("id", kisiId);
  if(error) return toast("Olmadı: " + error.message);
  toast("Silindi"); eklerListele();
}

/* ================= ayarlar ================= */

async function ayarlar(){
  app.innerHTML = head("Ayarlar","go('ana')") + `<div class="spin"></div>`;
  const { data:kisiler } = await sb.from("profiles").select("id,full_name,email,role").order("created_at");
  const rolAd = { admin:"Admin", yonetici:"Yönetici", uye:"Üye" };
  app.innerHTML = head("Ayarlar","go('ana')") + `
    <div class="card">
      <div class="kv"><span>Hesap</span><b>${esc((ME.full_name && !ME.full_name.includes("@")) ? ME.full_name : (ME.email||"").split("@")[0])}</b></div>
      <div class="kv"><span>E-posta</span><b>${esc(ME.email||"")}</b></div>
      <div class="kv"><span>Yetki</span><b>${rolAd[ME.role]}</b></div>
      <label style="display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:13.5px;color:var(--ink)">
        <input type="checkbox" id="sesKutu" style="width:20px;height:20px"
          ${localStorage.getItem("sesKapali") === "1" ? "" : "checked"}
          onchange="localStorage.setItem('sesKapali', this.checked ? '0' : '1')">
        <span style="flex:1">Sorgu sesi açık</span></label>
    </div>
    <h3 style="font-size:14px;margin:22px 0 10px">Kullanıcılar</h3>
    ${(kisiler||[]).map(k=>{
      const isim = (k.full_name && !k.full_name.includes("@")) ? k.full_name : (k.email||"").split("@")[0];
      const bas = (isim||"?").slice(0,2).toLocaleUpperCase("tr");
      const benMi = k.id === ME.id;
      return `<div class="card">
        <div style="display:flex;align-items:center;gap:11px">
          <span style="width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);
            display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto">${esc(bas)}</span>
          <div style="flex:1;min-width:0">
            <b style="font-size:15px;font-weight:600;display:block">${esc(isim)}${benMi?" · sen":""}</b>
            <div style="font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k.email||"")}</div>
          </div>
          <span class="pill ${k.role==='admin'?'gold':'sade'}" style="flex:0 0 auto">${rolAd[k.role]}</span>
        </div>
        ${ME.role==='admin' && !benMi ? `<div style="display:flex;gap:8px;align-items:center;margin-top:11px">
          <select style="flex:1;padding:10px 30px 10px 12px;font-size:13px" onchange="rolDegistir('${k.id}',this.value)">
            <option value="uye"${k.role==='uye'?' selected':''}>Üye · sadece görüntüler</option>
            <option value="yonetici"${k.role==='yonetici'?' selected':''}>Yönetici · kullanır, kayıt değiştiremez</option>
            <option value="admin"${k.role==='admin'?' selected':''}>Admin · tam yetki</option>
          </select>
          <button class="sil" onclick="kullaniciSil('${k.id}','${esc(isim)}')" aria-label="Kullanıcıyı çıkar">${svg("trash")}</button>
        </div>` : ""}
      </div>`;
    }).join("")}
    <p style="color:var(--ink-3);font-size:12px;margin:2px 2px 0">Uygulamayı kurup giren herkes önce üye olur. Yetkiyi buradan sen verirsin.</p>`;
}

async function kullaniciSil(id, isim){
  if(!confirm(`${isim} ekipten çıkarılsın mı?\n\nEklediği kayıtlar ve notlar durur. Aynı hesapla tekrar girerse üye olarak geri gelir; kalıcı engellemek istersen bana söyle.`)) return;
  const { error } = await sb.from("profiles").delete().eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"kullanıcı çıkarıldı", entity:"profiles", entity_id:id, detail:isim });
  toast("Çıkarıldı"); ayarlar();
}

async function rolDegistir(id, rol){
  const { error } = await sb.from("profiles").update({ role: rol }).eq("id", id);
  if(error) return toast("Olmadı: " + error.message);
  await sb.from("activity_log").insert({ team_id:ME.team_id, user_id:ME.id,
    action:"yetki değişti", entity:"profiles", entity_id:id, detail:rol });
  toast("Yetki güncellendi");
}
async function cikis(){ await sb.auth.signOut(); location.reload(); }

/* ================= yonlendirme ================= */

const ekranlar = { ana:anaMenu, harita:harita, araziler:araziler, ekler:ekler, kml:kmlEkran, cap:capEkran, capAyar:capAyar, sunum:sunum, yz:yapayZeka, yaklasan:yaklasanlar, hesap:hesap, parcalar:parcalarEkran, yeni:yeniParsel, parsel:parselDetay,
                   fiyat:fiyat, fiyatDuzen:fiyatDuzen, ayarlar:ayarlar };
// gezinti gecmisi: telefonun geri tusu uygulamadan cikmasin, bir ekran geri gitsin
let GEZINTI = [{ r:"ana", arg:undefined }];

function ekraniCiz(r, arg){
  (ekranlar[r] || anaMenu)(arg);
  window.scrollTo(0, 0);
}

function go(r, arg){
  const son = GEZINTI[GEZINTI.length-1];
  if(!son || son.r !== r || son.arg !== arg){
    GEZINTI.push({ r, arg });
    try{ history.pushState({ n: GEZINTI.length }, ""); }catch(e){}
  }
  ekraniCiz(r, arg);
}

window.addEventListener("popstate", () => {
  if(!window.__acildi) return;
  if(GEZINTI.length > 1){
    GEZINTI.pop();
    const h = GEZINTI[GEZINTI.length-1];
    ekraniCiz(h.r, h.arg);
    // bir adim daha geri gidilebilsin diye gecmise yeniden yer ac
    try{ history.pushState({ n: GEZINTI.length }, ""); }catch(e){}
  }else{
    ekraniCiz("ana");
    try{ history.pushState({ n: 1 }, ""); }catch(e){}
  }
});

function acilisiKapat(){
  const a = document.getElementById("acilis");
  if(!a || a.classList.contains("git")) return;
  a.classList.add("git");
  setTimeout(()=>a.remove(), 600);
}
// video bir kere oynar, bitince acilis kapanir; video yoksa 3 saniyede kapanir
(function(){
  const v = document.getElementById("acilisVid");
  if(v){
    v.addEventListener("ended", () => acilisiKapat());
    v.play().catch(()=>{});
    setTimeout(acilisiKapat, 9000);   // guvenlik: video takilirsa bekletme
  }else setTimeout(acilisiKapat, 3000);
})();

function acilisHatasi(mesaj){
  app.innerHTML = `<div class="empty"><b>Açılamadı</b>
    <div style="font-size:11px;color:var(--ink-3)">sürüm ${SURUM}</div>
    <div style="font-size:12px;color:var(--ink-3);margin:10px 0 16px;word-break:break-word">${esc(mesaj)}</div>
    <button class="btn ghost" onclick="location.reload()">Tekrar dene</button>
    <button class="btn danger" style="margin-top:10px" onclick="cikis()">Oturumu sıfırla</button></div>`;
}
const bekletme = 0;

async function baslat(){
 if(window.__basliyor) return;
 window.__basliyor = true;
 try{
  const { data:{ session } } = await zamanAsimi(sb.auth.getSession(), 8000);
  if(!session){ window.__acildi = true; window.__basliyor = false; return girisEkrani(); }
  let { data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000);
  if(!prof){ await new Promise(r=>setTimeout(r,1200));
    ({ data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000)); }
  window.__acildi = true; window.__basliyor = false;
  if(!prof) return acilisHatasi("Profil kurulamadı. Oturumu sıfırlayıp tekrar gir.");
  // isim mail gibi kalmissa Google'dan gelen ad soyadi yaz
  const gAd = session.user.user_metadata?.full_name || session.user.user_metadata?.name;
  if(gAd && (!prof.full_name || prof.full_name.includes("@"))){
    try{ await sb.from("profiles").update({ full_name: gAd }).eq("id", prof.id); prof.full_name = gAd; }catch(e){}
  }
  ME = prof;
  GEZINTI = [{ r:"ana", arg:undefined }];
  try{ history.pushState({ n:1 }, ""); }catch(e){}
  anaMenu();
 }catch(e){ window.__acildi = true; window.__basliyor = false; acilisHatasi(String(e.message||e)); }
}
baslat();

// servis calisani: kurulabilirlik ve cevrimdisi acilis
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

sb.auth.onAuthStateChange((olay) => {
  if(olay === "SIGNED_IN" && !ME && !window.__basliyor) baslat();

// servis calisani: kurulabilirlik ve cevrimdisi acilis
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
});
</script>
