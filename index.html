function kutuMetrik(o, w, h){
  const pad = Math.max(6, Math.min(w*.05, h*.14));
  const kullan = Math.max(10, w - pad*2);
  const satirlar = String(o.alt || "").split("\n").filter(t=>t.trim());
  const SATIR = 1.2;

  let ustP = 0;
  if(o.ust) ustP = sigdir(OLCER, o.ust, kullan, Math.min(h*.20, 40 + h*.02));

  const ustAlan = ustP ? ustP*1.5 : 0;
  const kalan = Math.max(8, h - pad*2 - ustAlan);
  let altP = satirlar.length ? Math.floor(kalan / (satirlar.length * SATIR)) : 0;
  altP = Math.min(altP, Math.floor(h*.42));
  const enUzun = satirlar.reduce((a,b)=> a.length>b.length?a:b, "");
  if(altP > 0) altP = sigdir(OLCER, enUzun, kullan, altP);
  altP = Math.max(satirlar.length ? 7 : 0, altP);

  const toplam = ustAlan + satirlar.length*altP*SATIR;
  const bas = Math.max(pad*.6, (h - toplam)/2);
  return { pad, kullan, satirlar, ustP, altP, SATIR, ustY: bas, altY: bas + ustAlan };
}

// kutuyu canvas'a ciz
// kucuk onizleme: secim kartlarinda kullanilir
function kutuOnizleme(canvas, stilIx, ust, alt){
  const G = 220, Y = 110;
  canvas.width = G; canvas.height = Y;
  const x = canvas.getContext("2d");
  x.clearRect(0,0,G,Y);
  // arka plan: koyu zemin uzerine kutu
  x.fillStyle = "#12161A"; x.fillRect(0,0,G,Y);
  try{
    kutuCiz(x, { stil: stilIx, ust: ust || "", alt: alt || "" }, G, Y);
  }catch(e){}
}

function kutuCiz(x, o, w, h){
  const st = KUTU_STIL[o.stil ?? 0];
  x.save();
  if(st.golge){ x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = h*.14; x.shadowOffsetY = h*.05; }
  const gr = x.createLinearGradient(0,0,w*.25,h);
  st.zemin.forEach(([d,c])=>gr.addColorStop(d,c));
  kutuYolu(x, w, h, st.kose); x.fillStyle = gr; x.fill();
  x.shadowColor = "transparent";
  x.lineWidth = Math.max(2, h*st.kalinlik); x.strokeStyle = st.cerceve;
  kutuYolu(x, w, h, st.kose); x.stroke();
  if(st.ic){
    const p = Math.max(4, h*.07);
    x.save(); x.translate(p,p);
    x.lineWidth = Math.max(1, h*.012); x.strokeStyle = st.ic;
    kutuYolu(x, w-p*2, h-p*2, st.kose); x.stroke(); x.restore();
  }
  x.restore();

  const m = kutuMetrik(o, w, h);
  x.textBaseline = "top";
  if(o.ust && m.ustP){
    x.fillStyle = st.ustRenk; x.font = `700 ${m.ustP}px Arial`;
    x.fillText(o.ust, m.pad, m.ustY);
  }
  if(m.altP){
    x.fillStyle = st.altRenk; x.font = `700 ${m.altP}px Arial`;
    m.satirlar.forEach((t,i)=> x.fillText(t, m.pad, m.altY + i*m.altP*m.SATIR));
  }
}

// onizleme icin CSS karsiligi
function kutuCss(o){
  const st = KUTU_STIL[o.stil ?? 0];
  const gr = st.zemin.map(([d,c])=>`${c} ${Math.round(d*100)}%`).join(",");
  const kose = st.kose === "yuvarlak" ? "12px" : "0";
  return `background:linear-gradient(150deg,${gr});border:2px solid ${st.cerceve};border-radius:${kose};
    box-shadow:${st.golge?"0 6px 18px rgba(0,0,0,.45)":"none"};`;
}

// capi seffaf PNG olarak uret: mod 1 sinir, 2 parcali, 3 parcali + yazi
function capSeffafPng(p, cfg, mod, ayar){
  const parcalar = cfg?.parcalar || null;
  const a = ayar || {};
  const tema = CAP_TEMA[a.tema ?? 0];
  const disRenk = a.dis || tema.dis;
  const icRenk  = a.ic  || tema.ic;

  const g = p.geojson.geometry;
  const halka = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(halka.length>1 && halka[0][0]===halka[halka.length-1][0] && halka[0][1]===halka[halka.length-1][1]) halka.pop();
  const M = metreye(halka);
  // resmi yol disarida kaldigi icin cizim sinirlarina onu da kat
  let kapsam = M.slice();
  try{
    const on = capYerlesim(M, cfg || {});
    if(on.resmiYol && on.resmiYol.length > 2) kapsam = kapsam.concat(on.resmiYol);
    (on.yol||[]).forEach(p=>{ if(p && p.length > 2) kapsam = kapsam.concat(p); });
  }catch(e){}
  const minX = Math.min(...kapsam.map(k=>k[0])), maxX = Math.max(...kapsam.map(k=>k[0]));
  const minY = Math.min(...kapsam.map(k=>k[1])), maxY = Math.max(...kapsam.map(k=>k[1]));
  const B = 1600, pay = 50;
  const olcek = Math.min((B-pay*2)/((maxX-minX)||1), (B-pay*2)/((maxY-minY)||1));
  const W = Math.round((maxX-minX)*olcek + pay*2), H = Math.round((maxY-minY)*olcek + pay*2);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const E = m => [ pay + (m[0]-minX)*olcek, pay + (maxY-m[1])*olcek ];
  const N = M.map(E);
  const yol = pts => { x.beginPath(); pts.forEach((k,i)=> i?x.lineTo(k[0],k[1]):x.moveTo(k[0],k[1])); x.closePath(); };

  if(mod !== 1 && parcalar && parcalar.length > 1){
    const yer = capYerlesim(M, cfg);
    yer.parcalar.forEach((o,i)=>{
      const d = o.poly, bilgi = o.bilgi || parcalar[i] || {};
      yol(d.map(E));
      const pr = bilgi.renk || "#FFFFFF";
      if(tema.metalik){
        const gr = x.createLinearGradient(0,0,W*.3,H);
        gr.addColorStop(0, pr); gr.addColorStop(.42, "#FFFFFF");
        gr.addColorStop(.58, pr); gr.addColorStop(1, "#DDE0E3");
        x.fillStyle = gr; x.globalAlpha = tema.dolgu;
      }else{
        x.fillStyle = pr; x.globalAlpha = a.dolgu ?? tema.dolgu;
      }
      x.fill(); x.globalAlpha = 1;
      x.lineWidth = 5; x.strokeStyle = icRenk; x.stroke();

      if(mod === 3){
        const om = E(agirlikMerkezi(d));
        x.textAlign = "center"; x.textBaseline = "middle";
        x.lineWidth = 7; x.strokeStyle = tema.yaziGolge;
        x.font = "700 62px Arial";
        const no = String(bilgi.no || (i+1));
        x.strokeText(no, om[0], om[1]-20); x.fillStyle = tema.yaziRenk; x.fillText(no, om[0], om[1]-20);
        x.font = "700 36px Arial";
        const m2 = nfAkilli(isFinite(+bilgi.m2) && +bilgi.m2 > 0 ? +bilgi.m2 : alanHesap(d)) + " m²";
        x.strokeText(m2, om[0], om[1]+28); x.fillText(m2, om[0], om[1]+28);
      }
    });

    (yer.yol||[]).forEach(yp=>{
      if(yp.length < 3) return;
      yol(yp.map(E));
      x.fillStyle = tema.metalik ? "rgba(70,70,70,.6)" : "rgba(255,255,255,.30)";
      x.fill();
      x.setLineDash([18,14]); x.lineWidth = 3; x.globalAlpha = .85;
      x.strokeStyle = icRenk; x.stroke(); x.globalAlpha = 1; x.setLineDash([]);
    });
  }else if(mod === 1){
    yol(N); x.fillStyle = tema.metalik ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.14)"; x.fill();
  }

  yol(N);
  x.lineWidth = 12; x.strokeStyle = tema.golge; x.stroke();
  x.lineWidth = 6; x.strokeStyle = disRenk; x.stroke();

  // hizalama icin uzun eksenin iki ucu (goruntuye gore oranli)
  const anaY = anaYon(M);
  const izd = M.map(p=>p[0]*anaY[0]+p[1]*anaY[1]);
  const i1 = izd.indexOf(Math.min(...izd)), i2 = izd.indexOf(Math.max(...izd));
  const e1 = E(M[i1]), e2 = E(M[i2]);
  SON_CAP_ANKRAJ = [[e1[0]/W, e1[1]/H], [e2[0]/W, e2[1]/H]];
  return c.toDataURL("image/png");
}

async function sablonKaydet(){
  const kutular = SUNUM.ogeler.filter(o=>o.tur !== "cap");
  if(!kutular.length) return toast("Önce kutu ekle");
  const ad2 = prompt("Şablonun adı:", "Satılık tarla ilanı");

  const veri = {
    oranIx: SUNUM.oranIx, perde: SUNUM.perde,
    ogeler: kutular.map(o=>({ tur:o.tur, rol:o.rol, ust:o.ust, alt:o.alt, stil:o.stil,
                              x:o.x, y:o.y, w:o.w, h:o.h, rot:o.rot }))
  };
  const { error } = await sb.from("sunum_sablon").insert({
    team_id: ME.team_id, ad: ad2.trim(), veri, created_by: ME.id });

async function sablonUygula(id){
  const { data:o } = await sb.from("sunum_sablon").select("veri").eq("id",id).single();
  if(!o?.veri) return toast("Şablon okunamadı");
  const cap = SUNUM.ogeler.filter(x=>x.tur === "cap");
  SUNUM.oranIx = o.veri.oranIx ?? SUNUM.oranIx;
  SUNUM.perde = o.veri.perde ?? SUNUM.perde;
  // kutulari guncel parsel bilgileriyle yeniden doldur
  SUNUM.ogeler = cap.concat((o.veri.ogeler||[]).map(k=>{
    const taze = sunumKutuIcerik(k.rol);
    return { ...k, tur:"kutu",
             ust: (k.rol && k.rol !== "serbest" && taze) ? taze.ust : k.ust,
             alt: (k.rol && k.rol !== "serbest" && taze) ? taze.alt : k.alt };
  }));
  SUNUM.secili = null;
  toast("Şablon uygulandı");
  sunumEkran();
}

async function sablonSil(id){
  if(!confirm("Bu şablon silinsin mi?")) return;
  await sb.from("sunum_sablon").delete().eq("id", id);
  sablonlariListele();
}

async function sunumArka(){
  const f = await dosyaSec("image/*");
  if(!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    SUNUM.arka = { url, w:img.naturalWidth, h:img.naturalHeight };
    sunumEkran();
  };
  img.src = url;
}

    ? p.cap_config : null;
  const a = mevcutOge?.ayar || {};
  const varsayilanKaynak = a.kaynak || (kayitli ? "kayit" : "sinir");

  app.innerHTML = head(duzenleIx!=null ? "Çapı Düzenle" : "Çap Ekle", "geriSunum()") + `
    <div class="card">
      <div class="bolum"><span class="rz altin">${svg("vector")}</span><b>Çap Nereden Gelsin</b></div>
      <div class="field" style="margin:0"><select id="ckaynak">
        ${kayitli?`<option value="kayit"${varsayilanKaynak==="kayit"?" selected":""}>Çizdirdiğim çap · ${kayitli.parcalar.length} parça</option>`:""}
        <option value="sinir"${varsayilanKaynak==="sinir"?" selected":""}>Sadece parsel sınırı</option>
        <option value="yukle"${varsayilanKaynak==="yukle"?" selected":""}>Kendi görselimi yükle</option>
      </select></div>
      ${kayitli?"":`<p class="ipuc" style="margin:10px 2px 0">Bu parselde kayıtlı çap yok.
        Parçalı çap için önce Çap menüsünden çizdir.</p>`}
    </div>

    <div id="yukleBolum" style="display:none">
      <button class="btn ghost" id="capDosya">Çap Görselini Seç</button>
      <p class="ipuc" style="margin-top:10px">Arka planı saydam PNG olmalı.</p>
    </div>

    <div id="cizBolum">
      ${kayitli?`<div class="card">
        <div class="bolum"><span class="rz yesil">${svg("tag")}</span><b>Görünüm</b></div>
        <div class="field" style="margin:0"><select id="cmod">
          <option value="3"${(a.mod??3)==3?" selected":""}>Parçalı · numara ve m² yazılı</option>
          <option value="2"${a.mod==2?" selected":""}>Parçalı · yazısız</option>
          <option value="1"${a.mod==1?" selected":""}>Sadece sınır çizgisi</option></select></div>
      </div>`:""}

      <div class="card">
        <div class="bolum"><span class="rz mavi">${svg("photo")}</span><b>Tema</b></div>
        <div class="stilSecim" id="temaSecim"></div>
      </div>

      ${kayitli?`<div class="card" id="renkKart">
        <div class="bolum"><span class="rz kirmizi">${svg("tag")}</span><b>Parça Renkleri</b>
          <button class="pill sade" onclick="capRenkSifirla()">sıfırla</button></div>
        <p class="ipuc" style="margin:0 0 10px">Bu renkler sadece bu sunum görselinde geçerli;
          çap dosyandaki renkler değişmez.</p>
        <div id="renkSecim" style="display:flex;flex-wrap:wrap;gap:9px"></div>
      </div>`:""}

      <div class="card">
        <div class="bolum"><span class="rz altin">${svg("tag")}</span><b>İnce Ayar</b></div>
        <div class="row2">
          <div class="field"><label>Dış çizgi</label><input type="color" id="cdis" value="${a.dis||"#FFFFFF"}" style="height:46px"></div>
          <div class="field"><label>Parça çizgisi</label><input type="color" id="cic" value="${a.ic||"#FFFFFF"}" style="height:46px"></div>
        </div>
        <div class="field" style="margin:0"><label>Dolgu koyuluğu</label>
          <input type="range" id="cdolgu" min="0" max="100" value="${Math.round((a.dolgu??.9)*100)}" style="padding:0">
          <p class="ipuc" style="margin:8px 2px 0">Sola çekersen saydam, sağa çekersen parçalar dümdüz renk olur.</p></div>
      </div>

      <div class="card">
        <div class="bolum"><span class="rz yesil">${svg("vector")}</span><b>Önizleme</b></div>
        <div id="capOnizKutu" style="background:#1A1F24;border-radius:12px;padding:14px;display:grid;place-items:center">
          <img id="capOniz" style="max-width:100%;max-height:220px;display:block">
        </div>
      </div>
    </div>

    <button class="btn" id="capOnay">${duzenleIx!=null ? "Değişikliği Uygula" : "Çapı Tuvale Ekle"}</button>`;

  const g = k => document.getElementById(k);
  let yuklenen = a.kaynak === "yukle" ? mevcutOge?.src : null;
  let temaIx = a.tema ?? 0;
  let renkler = { ...(a.renkler || {}) };

  const ayarTopla = () => ({
    kaynak: g("ckaynak").value,
    mod: kayitli ? +(g("cmod")?.value || 3) : 1,
    tema: temaIx, dis: g("cdis").value, ic: g("cic").value,
    dolgu: (+g("cdolgu").value)/100,
    renkler: { ...renkler }
  });

  const onizle = () => {
    const ay = ayarTopla();
    if(ay.kaynak === "yukle") return;
    try{
      const cfg = (ay.mod === 1 || !kayitli) ? null : capRenkUygula(kayitli, renkler);
      const png = capSeffafPng(p, cfg, ay.mod, ay);
      g("capOniz").src = png;
    }catch(e){ toast("Önizleme çizilemedi: " + (e.message||e)); }
  };

  const renkCiz = () => {
    const kutu = g("renkSecim");
    if(!kutu || !kayitli) return;
    kutu.innerHTML = (kayitli.parcalar||[]).map((o,i)=>`
      <label style="display:flex;flex-direction:column;align-items:center;gap:4px;margin:0">

        <span style="font-size:10.5px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace">${esc(o.no||(i+1))}</span>
      </label>`).join("");
    (kayitli.parcalar||[]).forEach((o,i)=>{
      const el = g("pr_"+i);
      if(el) el.oninput = () => { renkler[i] = el.value; onizle(); };
    });
  };
  capRenkSifirla = () => { renkler = {}; renkCiz(); onizle(); };

  const temaCiz = () => {
    const kutu = g("temaSecim");
    kutu.innerHTML = CAP_TEMA.map((t,i)=>`
      <button class="stilKart ${i===temaIx?"aktif":""}" onclick="capTemaSec(${i})">
        <canvas class="onizleme" data-tema="${i}"></canvas>
        <span>${esc(t.ad)}</span></button>`).join("");
    CAP_TEMA.forEach((t,i)=>{
      const c = kutu.querySelector(`canvas[data-tema="${i}"]`);
      if(c) capTemaOnizleme(c, i);
    });
  };
  capTemaSec = i => { temaIx = i; temaCiz(); onizle(); };

  const kaynakGun = () => {
    const k = g("ckaynak").value;
    g("yukleBolum").style.display = k === "yukle" ? "block" : "none";
    g("cizBolum").style.display   = k === "yukle" ? "none" : "block";
    if(k !== "yukle") onizle();
  };

  g("ckaynak").onchange = kaynakGun;
  if(g("cmod")) g("cmod").onchange = onizle;
  g("cdis").oninput = onizle;
  g("cic").oninput = onizle;
  g("cdolgu").oninput = onizle;
  temaCiz();
  renkCiz();
  kaynakGun();

  g("capDosya").onclick = async () => {
    const f = await dosyaSec("image/png,image/*");
    if(!f) return;
    yuklenen = await new Promise(res=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.readAsDataURL(f); });
    toast("Çap görseli hazır");
  };

  g("capOnay").onclick = () => {
    const ay = ayarTopla();
    let src, ank = null;
    if(ay.kaynak === "yukle"){
      if(!yuklenen) return toast("Önce çap görselini seç");
      src = yuklenen;
    }else{
      if(!p.geojson) return toast("Bu parselin sınır çizimi yok");
      try{
        const cfg = (ay.mod === 1 || !kayitli) ? null : capRenkUygula(kayitli, renkler);
        src = capSeffafPng(p, cfg, ay.mod, ay);
        ank = SON_CAP_ANKRAJ;
      }catch(e){ return toast("Çap çizilemedi: " + (e.message||e)); }
    }
    if(mevcutOge){ mevcutOge.src = src; mevcutOge.ayar = ay; mevcutOge.ank = ank; }
    else{
      SUNUM.ogeler.push({ tur:"cap", rol:"cap", src, ayar:ay, ank, saydam:1, x:.18, y:.26, w:.64, h:.46, rot:0 });
      SUNUM.secili = SUNUM.ogeler.length-1;
    }
    SUNUM_SEKME = "cap";
    sunumEkran();
  };
}

let capTemaSec = () => {};
let capRenkSifirla = () => {};

// sunuma ozel renkleri capin kayitli duzenine uygula
function capRenkUygula(kayitli, renkler){
  if(!kayitli) return kayitli;
  const kopya = JSON.parse(JSON.stringify(kayitli));
  let ix = 0;
  const boya = liste => (liste||[]).forEach(o=>{
    if(renkler && renkler[ix]) o.renk = renkler[ix];
    ix++;
  });
  (kopya.bloklar||[]).forEach(b=>{
    if(b.tip === "yol"){ boya(b.sol); boya(b.sag); }
    else boya(b.parcalar);
  });
  // duz liste de guncellensin
  ix = 0;
  (kopya.parcalar||[]).forEach(o=>{ if(renkler && renkler[ix]) o.renk = renkler[ix]; ix++; });
  return kopya;
}

// tema onizleme karesi
function capTemaOnizleme(canvas, ix){
  const G = 220, Y = 110;
  canvas.width = G; canvas.height = Y;
  const x = canvas.getContext("2d");
  const t = CAP_TEMA[ix];
  // koyu zemin + ornek parsel
  x.fillStyle = "#20262C"; x.fillRect(0,0,G,Y);
  const p = [[24,18],[196,26],[186,92],[34,84]];
  const yol = () => { x.beginPath(); p.forEach((k,i)=> i ? x.lineTo(k[0],k[1]) : x.moveTo(k[0],k[1])); x.closePath(); };
  yol();
  if(t.metalik){
    const gr = x.createLinearGradient(0,0,G,Y);
    gr.addColorStop(0,"#FFFFFF"); gr.addColorStop(.45,"#C9CDD1"); gr.addColorStop(1,"#F2F4F6");
    x.fillStyle = gr; x.globalAlpha = t.dolgu ?? .5;
  }else{ x.fillStyle = "#FFFFFF"; x.globalAlpha = t.dolgu ?? .4; }
  x.fill(); x.globalAlpha = 1;
  x.lineWidth = 5; x.strokeStyle = t.golge || "rgba(0,0,0,.5)"; x.stroke();
  x.lineWidth = 2.6; x.strokeStyle = t.dis || "#FFFFFF"; x.stroke();
  x.beginPath(); x.moveTo(110,22); x.lineTo(104,88); x.lineWidth = 2; x.strokeStyle = t.ic || "#FFFFFF"; x.stroke();
  x.textAlign = "center"; x.textBaseline = "middle";
  x.font = "700 18px Arial"; x.lineWidth = 4; x.strokeStyle = t.yaziGolge || "rgba(0,0,0,.6)";
  x.strokeText("1", 66, 54); x.fillStyle = t.yaziRenk || "#FFF"; x.fillText("1", 66, 54);
  x.strokeText("2", 148, 56); x.fillText("2", 148, 56);
}

// role gore guncel parsel bilgisini uret
function sunumKutuIcerik(rol){
  const p = SUNUM.p, y = SUNUM.y || {};
  if(rol === "baslik") return {
    ust: `${duzgun(p.mahalle).toLocaleUpperCase("tr")} · ${p.ada||""}/${p.parsel}`,
    alt: `${nf2(gercekAlan(p))} m²  ·  ${p.nitelik||""}`,
    yer: { x:.06, y:.04, w:.70, h:.13 } };
  if(rol === "fiyat"){
    const parcaFiyat = (SUNUM.parcalar||[]).filter(o=>o.satilik && !o.satildi && o.m2_fiyat);
    const toplam = parcaFiyat.reduce((t,o)=>t + (+o.m2||0)*(+o.m2_fiyat||0), 0);
    return { ust:"FİYAT",
      alt: toplam ? nf(Math.round(toplam)) + " ₺" : (y.toplam_fiyat ? nf(y.toplam_fiyat) + " ₺" : "Fiyat girin"),
      yer: { x:.06, y:.82, w:.46, h:.12 } };
  }
  if(rol === "ozellik") return {
    ust:"ÖZELLİKLER",
    alt:(SUNUM.etiketler||[]).slice(0,5).join("\n") || "Özellik ekleyin",
    yer: { x:.52, y:.66, w:.42, h:.24 } };
  return null;
}

function sunumKutu(rol, ust, alt, altaOdaklan){
  const stil = SUNUM.sonStil ?? 0;
  const hazir = sunumKutuIcerik(rol);
  let u = ust ?? "", a = alt ?? "", k = { x:.08, y:.44, w:.55, h:.13 };
  if(hazir){ u = hazir.ust; a = hazir.alt; k = hazir.yer; }
  SUNUM.ogeler.push({ tur:"kutu", rol, ust:u, alt:a, stil, ...k, rot:0 });
  SUNUM.secili = SUNUM.ogeler.length-1;
  if(altaOdaklan) SUNUM.odakAlt = true;
  SUNUM_SEKME = "kutu";
  sunumEkran();
}

function sunumCiz(){
  const t = document.getElementById("tuval");
  if(!t) return;
  if(!SUNUM.arka){
    t.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--ink-3);font-size:13px">Arka plan görseli seçilmedi</div>`;
    t.style.height = "auto";
    return;
  }
  const oran = ORANLAR[SUNUM.oranIx];
  const W = t.clientWidth, H = W * (oran.h / oran.w);
  t.style.height = H + "px";
  t.innerHTML = `<div class="arka" style="background-image:url('${SUNUM.arka.url}');
     background-position:50% ${SUNUM.kaydir}%;background-size:${Math.round((SUNUM.zum||1)*100)}% auto"></div>
     <div class="altPerde" style="opacity:${SUNUM.perde ?? .35}"></div>
     <div class="olcu">${oran.w}×${oran.h}</div>
     ${SUNUM.hizala ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,.25);display:grid;place-items:center;
       color:#fff;font-size:13px;font-weight:600;pointer-events:none">
       ${SUNUM.hizala.noktalar.length ? "Karşı uca dokun" : "Parselin bir ucuna dokun"}</div>` : ""}`;

  SUNUM.ogeler.forEach((o,i)=>{
    const d = document.createElement("div");
    d.className = "oge" + (SUNUM.secili===i ? " sec" : "");
    d.style.left = (o.x*W)+"px"; d.style.top = (o.y*H)+"px";
    d.style.width = (o.w*W)+"px"; d.style.height = (o.h*H)+"px";
    d.style.transform = `rotate(${o.rot||0}deg)`;
    d.dataset.i = i;

    if(o.tur === "cap"){
      d.innerHTML = `<img src="${o.src}" style="opacity:${o.saydam ?? 1}">`;
    }else{
      const kw = o.w*W, kh = o.h*H, st = KUTU_STIL[o.stil ?? 0];
      const m = kutuMetrik(o, kw, kh);
      d.innerHTML = `<div class="kutu" style="${kutuCss(o)}justify-content:flex-start;padding:0">
        <div style="position:absolute;left:${m.pad}px;top:${m.ustY}px;width:${m.kullan}px">
        ${o.ust&&m.ustP?`<div style="color:${st.ustRenk};font-weight:700;letter-spacing:.06em;
          font-size:${m.ustP}px;line-height:1.5;white-space:nowrap">${esc(o.ust)}</div>`:""}
        ${m.altP?`<div style="color:${st.altRenk};font-weight:700;white-space:pre-line;
          line-height:${m.SATIR};font-size:${m.altP}px">${esc(m.satirlar.join("\n"))}</div>`:""}
        </div></div>`;
    }

    if(SUNUM.secili === i) d.innerHTML +=
      `<div class="tut boy" data-tut="boy">⤢</div><div class="tut don" data-tut="don">⟳</div>
       <div class="tut kapat" data-tut="kapat">×</div><div class="tut kalem" data-tut="kalem">✎</div>`;
    t.appendChild(d);
  });

  sunumOlaylar(t, W, H);
}

function sunumOlaylar(t, W, H){
  // hizalama modunda tuvale dokunuslari topla
  t.onpointerdown = e => {
    if(!SUNUM.hizala) return;
    const bx = t.getBoundingClientRect();
    SUNUM.hizala.noktalar.push([e.clientX - bx.left, e.clientY - bx.top]);
    const not = document.getElementById("hizalaNot");
    if(SUNUM.hizala.noktalar.length === 1){
      if(not) not.textContent = "Şimdi karşı uca dokun.";
      toast("İkinci noktaya dokun");
    }else{
      hizalamayiUygula(W, H);
    }
  };

  t.querySelectorAll(".oge").forEach(d=>{
    const parmaklar = new Map();
    let bas = null;

    d.onpointerdown = e => {
      if(SUNUM.hizala) return;                 // hizalama modunda oge surukleme kapali
      const i = +d.dataset.i, o = SUNUM.ogeler[i];
      const tut = e.target.dataset?.tut;
      if(tut === "kapat"){ SUNUM.ogeler.splice(i,1); SUNUM.secili = null; sunumEkran(); return; }
      if(tut === "kalem"){
        SUNUM.secili = i;
        if(o.tur === "cap") return sunumCap(i);
        sunumEkran();
        document.getElementById("dzUst")?.scrollIntoView({ behavior:"smooth", block:"center" });
        return;
      }
      if(SUNUM.secili !== i){ SUNUM.secili = i; sunumEkran(); return; }

      e.preventDefault();
      d.setPointerCapture(e.pointerId);
      parmaklar.set(e.pointerId, { x:e.clientX, y:e.clientY });

      const bx = t.getBoundingClientRect();
      bas = {
        x:o.x, y:o.y, w:o.w, h:o.h, rot:o.rot||0,
        px:e.clientX, py:e.clientY,
        mx: bx.left + (o.x + o.w/2)*W, my: bx.top + (o.y + o.h/2)*H,
        tut
      };
      if(bas.tut === "don") bas.aci = Math.atan2(e.clientY-bas.my, e.clientX-bas.mx)*180/Math.PI;

      if(parmaklar.size === 2){
        const [a,b2] = [...parmaklar.values()];
        bas.mesafe = Math.hypot(a.x-b2.x, a.y-b2.y) || 1;
        bas.aci2 = Math.atan2(b2.y-a.y, b2.x-a.x)*180/Math.PI;
        bas.w2 = o.w; bas.h2 = o.h; bas.rot2 = o.rot||0;
      }
    };

    d.onpointermove = ev => {
      if(!bas || !parmaklar.has(ev.pointerId)) return;
      parmaklar.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
      const i = +d.dataset.i, o = SUNUM.ogeler[i];

      if(parmaklar.size === 2){
        const [a,b2] = [...parmaklar.values()];
        const m = Math.hypot(a.x-b2.x, a.y-b2.y) || 1;
        const ac = Math.atan2(b2.y-a.y, b2.x-a.x)*180/Math.PI;
        if(bas.mesafe){
          const k = m / bas.mesafe;
          const mx = o.x + o.w/2, my = o.y + o.h/2;
          o.w = Math.max(.05, bas.w2 * k);
          o.h = Math.max(.03, bas.h2 * k);
          o.x = mx - o.w/2; o.y = my - o.h/2;
          o.rot = Math.round(bas.rot2 + (ac - bas.aci2));
        }
      }else{
        const dx = (ev.clientX - bas.px)/W, dy = (ev.clientY - bas.py)/H;
        if(bas.tut === "boy"){
          o.w = Math.max(.05, bas.w + dx); o.h = Math.max(.03, bas.h + dy);
        }else if(bas.tut === "don"){
          const aci = Math.atan2(ev.clientY-bas.my, ev.clientX-bas.mx)*180/Math.PI;
          o.rot = Math.round(bas.rot + (aci - bas.aci));
        }else{
          o.x = bas.x + dx; o.y = bas.y + dy;
        }
      }
      d.style.left = (o.x*W)+"px"; d.style.top = (o.y*H)+"px";
      d.style.width = (o.w*W)+"px"; d.style.height = (o.h*H)+"px";
      d.style.transform = `rotate(${o.rot||0}deg)`;
    };

    const bitir = ev => {
      parmaklar.delete(ev.pointerId);
      if(!parmaklar.size){ bas = null; sunumCiz(); }
    };
    d.onpointerup = bitir;
    d.onpointercancel = bitir;
  });
}

// iki nokta ile capi fotografa oturt
function hizalamayiUygula(W, H){
  const { i, noktalar } = SUNUM.hizala;
  SUNUM.hizala = null;
  const o = SUNUM.ogeler[i];
  if(!o || !o.ank || noktalar.length < 2) return sunumEkran();

  const [A, B] = noktalar;
  const im = new Image();
  im.onload = () => {
    const iw = im.naturalWidth, ih = im.naturalHeight;
    const [a1, a2] = o.ank;                       // goruntudeki oranli ankraj noktalari
    const ux = (a2[0]-a1[0])*iw, uy = (a2[1]-a1[1])*ih;
    const uzUnlu = Math.hypot(ux, uy) || 1;
    const tx = B[0]-A[0], ty = B[1]-A[1];
    const hedefUz = Math.hypot(tx, ty) || 1;

    const k = hedefUz / uzUnlu;                   // piksel basina olcek
    const aci = (Math.atan2(ty, tx) - Math.atan2(uy, ux)) * 180/Math.PI;
    const wpx = iw * k, hpx = ih * k;
    const r = aci * Math.PI/180;
    const d1x = (a1[0]-0.5)*wpx, d1y = (a1[1]-0.5)*hpx;
    const cx = A[0] - (d1x*Math.cos(r) - d1y*Math.sin(r));
    const cy = A[1] - (d1x*Math.sin(r) + d1y*Math.cos(r));

    o.w = wpx/W; o.h = hpx/H;
    o.x = (cx - wpx/2)/W; o.y = (cy - hpx/2)/H;
    o.rot = Math.round(aci);
    toast("Çap hizalandı");
    sunumEkran();
  };

  im.src = o.src;
}

async function sunumUret(){
  if(!SUNUM.arka) return toast("Önce arka plan görseli yükle");
  toast("Görsel hazırlanıyor…");
  const oran = ORANLAR[SUNUM.oranIx];
  const W = oran.w, H = oran.h;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const arka = await yukleGorsel(SUNUM.arka.url);

  // "cover" kirpma: onizlemedeki background-size:cover ile birebir ayni
  const ol = Math.max(W/arka.naturalWidth, H/arka.naturalHeight) * (SUNUM.zum || 1);
  const dw = arka.naturalWidth*ol, dh = arka.naturalHeight*ol;
  x.fillStyle = "#000"; x.fillRect(0,0,W,H);
  x.drawImage(arka, (W-dw)/2, (H-dh)*(SUNUM.kaydir/100), dw, dh);

  // alt karartma: yazilar okunsun
  const perde = SUNUM.perde ?? .35;
  if(perde > 0){
    const gr = x.createLinearGradient(0, H, 0, H*0.45);
    gr.addColorStop(0, `rgba(0,0,0,${(perde*0.95).toFixed(2)})`);
    gr.addColorStop(.55, `rgba(0,0,0,${(perde*0.45).toFixed(2)})`);
    gr.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = gr; x.fillRect(0, H*0.45, W, H*0.55);
  }

  for(const o of SUNUM.ogeler){
    const ox = o.x*W, oy = o.y*H, ow = o.w*W, oh = o.h*H;
    x.save();
    x.translate(ox + ow/2, oy + oh/2);
    x.rotate((o.rot||0) * Math.PI/180);
    x.translate(-ow/2, -oh/2);
    if(o.tur === "cap"){
      const im = await yukleGorsel(o.src);
      x.globalAlpha = o.saydam ?? 1;
      x.drawImage(im, 0, 0, ow, oh);
      x.globalAlpha = 1;
    }else{
      kutuCiz(x, o, ow, oh);
    }
    x.restore();
  }

  // marka kimligi: tanimliysa sag alta basilir, tanimsizsa hicbir ibare cikmaz
  if(markaVarMi()){
    const pay = Math.round(W*0.035);
    const yazilar = [MARKA.ad, MARKA.telefon, MARKA.notu].filter(Boolean);
    const punto = Math.round(W*0.026);
    x.font = `600 ${punto}px Arial`;
    const genislik = Math.max(...yazilar.map(t=>x.measureText(t).width), 0);
    let logo = null, logoBoy = 0;
    if(MARKA.logo){
      try{ logo = await yukleGorsel(MARKA.logo); logoBoy = Math.round(W*0.085); }catch(e){}
    }
    const satirY = punto*1.5;
    const kutuY = Math.max(logoBoy, yazilar.length*satirY) + pay;
    const kutuG = genislik + pay*2 + (logo ? logoBoy + pay*0.6 : 0);
    const bx = W - kutuG - pay, by = H - kutuY - pay;

    x.save();
    x.fillStyle = "rgba(8,10,12,.62)";
    x.beginPath(); x.roundRect(bx, by, kutuG, kutuY, Math.round(W*0.022)); x.fill();
    x.strokeStyle = "rgba(227,192,90,.45)"; x.lineWidth = Math.max(1, W*0.0018); x.stroke();

    let tx = bx + pay;
    if(logo){
      x.drawImage(logo, tx, by + (kutuY-logoBoy)/2, logoBoy, logoBoy);
      tx += logoBoy + pay*0.6;
    }
    x.textAlign = "left"; x.textBaseline = "middle";
    const basla = by + (kutuY - yazilar.length*satirY)/2 + satirY/2;
    yazilar.forEach((t,i)=>{
      x.font = i === 0 ? `700 ${punto}px Arial` : `400 ${Math.round(punto*0.86)}px Arial`;
      x.fillStyle = i === 0 ? "#F2E7C9" : "rgba(255,255,255,.82)";
      x.fillText(t, tx, basla + i*satirY);
    });
    x.restore();
  }

  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.92));
  const p = SUNUM.p;
  const ad2 = `${p.ada||0}-${p.parsel}-sunum-${Date.now().toString().slice(-5)}.jpg`;
  indirBlob(blob, ad2);
  try{
    await dosyaYukle(new File([blob], ad2, { type:"image/jpeg" }), "sunum", SUNUM.parselId);
    toast("Sunum görseli kaydedildi");
  }catch(e){ toast("İndirildi ama kaydedilemedi: " + (e.message||e)); }
}

});

// iki koordinat arasi mesafe (metre)
function mesafe(a, b){
  const R = 6371000, rad = x => x*Math.PI/180;
  const dl = rad(b[0]-a[0]) * Math.cos(rad((a[1]+b[1])/2));
  const df = rad(b[1]-a[1]);
  return Math.round(Math.sqrt(dl*dl + df*df) * R * 10)/10;
}


/* ---- geometri: metreye cevir, alan, yariduzlem kirpma, parcala ---- */

// parselin dis halkasini metre duzlemine cevir
// Kayitli alani dogrula.
// Eski surumde "7,116.82" gibi degerler yanlis okunup 7.11682 olarak kaydedilmisti.
// Once 1000 ile carpip geometriye uyuyor mu bakariz (boylece TKGM'nin resmi rakamini
// birebir geri kazaniriz); uymuyorsa son care geometriden olcume duseriz.
function gercekAlan(p){
  const kayitli = +p?.alan_m2 || 0;
  let geo = 0;
  try{ const M = capHalkasi(p); if(M) geo = alanHesap(M); }catch(e){}
  if(!geo) return kayitli;
  const yakin = (a,b) => Math.abs(a-b) <= b*0.06;      // cizim olcumu %6'ya kadar sapabilir
  if(yakin(kayitli, geo)) return kayitli;              // kayit zaten dogru
  for(const k of [1000, 100, 10]){                     // bozuk kaydi geri kazan
    if(yakin(kayitli*k, geo)) return Math.round(kayitli*k*100)/100;
  }
  return geo;                                          // kurtarilamadi, olcumu kullan
}

function capHalkasi(p){
  if(!p?.geojson?.geometry) return null;
  const g = p.geojson.geometry;
  const h = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(h.length>1 && h[0][0]===h[h.length-1][0] && h[0][1]===h[h.length-1][1]) h.pop();
  return metreye(h);
}

function metreye(halka){
  const lat0 = halka.reduce((t,k)=>t+k[1],0)/halka.length;
  const kx = Math.cos(lat0*Math.PI/180) * 111320, ky = 110540;
  const x0 = halka[0][0], y0 = halka[0][1];
  return halka.map(k=>[ (k[0]-x0)*kx, (k[1]-y0)*ky ]);
}

function alanHesap(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    a += pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
  }
  return Math.abs(a)/2;
}

// n·p <= d yarim duzlemine kirp (Sutherland-Hodgman)
function kirp(poly, n, d){
  const cik = [];
  for(let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const da = n[0]*a[0]+n[1]*a[1]-d, db = n[0]*b[0]+n[1]*b[1]-d;
    if(da <= 0) cik.push(a);
    if((da < 0 && db > 0) || (da > 0 && db < 0)){
      const t = da/(da-db);
      cik.push([ a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1]) ]);
    }
  }
  return cik;
}

// parselin en uzun kenar yonu
function anaYon(pts){
  let enUzun = 0, yon = [1,0];
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    const dx = pts[j][0]-pts[i][0], dy = pts[j][1]-pts[i][1];
    const u = Math.hypot(dx,dy);
    if(u > enUzun){ enUzun = u; yon = [dx/u, dy/u]; }
  }
  return yon;
}

// verilen yone dik seritlere bol
// mutlak=true ise hedefler m2 olarak birebir uygulanir (orantilanmaz)
function parcala(pts, hedefler, yonVer, mutlak){
  const yon = yonVer || anaYon(pts);
  const izd = pts.map(p=>p[0]*yon[0]+p[1]*yon[1]);
  let alt = Math.min(...izd), ust = Math.max(...izd);
  const toplam = alanHesap(pts);
  const oran = hedefler.reduce((t,h)=>t+h,0) || toplam;

  const parcalar = [];
  let sinir = alt;
  for(let i=0;i<hedefler.length;i++){
    if(i === hedefler.length-1){
      parcalar.push(kirp(pts, [-yon[0],-yon[1]], -sinir));
      break;
    }
    const hedef = mutlak ? hedefler[i] : toplam * (hedefler[i]/oran);
    let a = sinir, b = ust, kes = ust;
    for(let k=0;k<44;k++){
      kes = (a+b)/2;
      const dilim = kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir);
      const al = dilim.length > 2 ? alanHesap(dilim) : 0;
      if(al < hedef) a = kes; else b = kes;
    }
    parcalar.push(kirp(kirp(pts, yon, kes), [-yon[0],-yon[1]], -sinir));
    sinir = kes;
  }
  return parcalar.filter(p=>p.length > 2);
}

// izgara: once sutunlara, sonra her sutunu satirlara bol
function parcalaIzgara(pts, sutun, satir, hedefler){
  const ana = anaYon(pts);
  const dik = [-ana[1], ana[0]];
  const sutunHedef = [];
  for(let s2=0;s2<sutun;s2++){
    let t = 0;
    for(let r=0;r<satir;r++) t += hedefler[s2*satir + r] || 0;
    sutunHedef.push(t || 1);
  }
  const sutunlar = parcala(pts, sutunHedef, dik);
  const cikti = [];
  sutunlar.forEach((sp, s2)=>{
    const satirHedef = [];
    for(let r=0;r<satir;r++) satirHedef.push(hedefler[s2*satir + r] || 1);
    const parcalari = satir > 1 ? parcala(sp, satirHedef, ana) : [sp];
    parcalari.forEach(pp=>cikti.push(pp));
  });
  return cikti;
}

// parselin ortasindan uzun eksen boyunca yol seridi ayir
function yolAyir(pts, genislik){
  const ana = anaYon(pts);
  const dik = [-ana[1], ana[0]];
  const izd = pts.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  const orta = (Math.min(...izd) + Math.max(...izd)) / 2;
  const y1 = orta - genislik/2, y2 = orta + genislik/2;
  return {
    yol: kirp(kirp(pts, dik, y2), [-dik[0],-dik[1]], -y1),
    sol: kirp(pts, dik, y1),
    sag: kirp(pts, [-dik[0],-dik[1]], -y2),
    ana, dik
  };
}


/* ---- resmi yol tespiti: komsu parsellerin niteligine bakar ---- */

// bir kenarin disina cikip oradaki parseli TKGM'ye sorar
async function kenarKomsusu(halka, i, disaMetre){
  const j = (i+1) % halka.length;
  const a = halka[i], b = halka[j];
  const ortaLon = (a[0]+b[0])/2, ortaLat = (a[1]+b[1])/2;
  // kenarin disa bakan normali
  const merkezLon = halka.reduce((t,k)=>t+k[0],0)/halka.length;
  const merkezLat = halka.reduce((t,k)=>t+k[1],0)/halka.length;
  const kx = Math.cos(ortaLat*Math.PI/180)*111320, ky = 110540;
  const dx = (b[0]-a[0])*kx, dy = (b[1]-a[1])*ky;
  const u = Math.hypot(dx,dy) || 1;
  let nx = -dy/u, ny = dx/u;
  const mx = (merkezLon-ortaLon)*kx, my = (merkezLat-ortaLat)*ky;
  if(nx*mx + ny*my > 0){ nx = -nx; ny = -ny; }   // merkezin tersi = disari
  const d = disaMetre || 12;
  const lon = ortaLon + (nx*d)/kx, lat = ortaLat + (ny*d)/ky;
  try{
    const f = await zamanAsimi(tkgm(`${TB3}/parsel/${lat.toFixed(7)}/${lon.toFixed(7)}`), 15000);
    return f?.properties || null;
  }catch(e){ return null; }
}

// Bir kenarin disinda ne var?  bitisik komsu mu, bosluk (yol) mu
//   3 m disarida parsel varsa  -> komsu bitisik, yol yok
//   3 m'de bos, 12 m'de parsel -> arada bosluk var, burasi RESMI YOL
async function kenarDurumu(halka, i){
  const yakin = await kenarKomsusu(halka, i, 3);
  const nitelik = String(yakin?.nitelik || "").toLocaleLowerCase("tr");
  if(yakin && /yol|cadde|sokak|karayol/.test(nitelik)) return { yol:true, sebep:"komşu kaydı yol" };
  if(yakin) return { yol:false, sebep:"bitişik komşu parsel" };
  const uzak = await kenarKomsusu(halka, i, 12);
  if(uzak) return { yol:true, sebep:"arada boşluk var, karşıda parsel" };
  return { yol:true, sebep:"kayıtlı komşu yok" };
}

// hangi kenarlar resmi yola bakiyor
async function resmiYolKenarlari(p, bildir){
  if(!p?.geojson?.geometry) return [];
  const g = p.geojson.geometry;
  const halka = (g.type === "Polygon" ? g.coordinates[0] : g.coordinates[0][0]).slice();
  if(halka.length>1 && halka[0][0]===halka[halka.length-1][0] && halka[0][1]===halka[halka.length-1][1]) halka.pop();

  const M = metreye(halka);
  const sonuc = [];
  for(let i=0;i<halka.length;i++){
    const j = (i+1) % halka.length;
    const uzunluk = Math.hypot(M[j][0]-M[i][0], M[j][1]-M[i][1]);
    if(uzunluk < 6) continue;                   // cok kisa kenari sorma
    if(bildir) bildir(`Komşu parseller sorgulanıyor… ${i+1}/${halka.length}`);
    const d = await kenarDurumu(halka, i);
    if(d.yol) sonuc.push({ i, uzunluk: Math.round(uzunluk*10)/10, nitelik: d.sebep });
    await new Promise(r=>setTimeout(r, 150));
  }
  // en uzun kenar basta
  return sonuc.sort((a,b)=>b.uzunluk - a.uzunluk);
}

// parselin buyuklugune gore makul yol genisligi

// blok tarifine gore parcalari ve yolu uret
// cfg = { bloklar:[ {tip:"tam", parcalar:[...]} | {tip:"yol", sol:[...], sag:[...]} ], enAzYol, ters }
function capYerlesim(M, cfg){
  let ana = anaYon(M);
  if(cfg.ters) ana = [-ana[0], -ana[1]];
  let dik = [-ana[1], ana[0]];
  const yatayMi = Math.abs(dik[0]) >= Math.abs(dik[1]);
  if((yatayMi && dik[0] < 0) || (!yatayMi && dik[1] < 0)) dik = [-dik[0], -dik[1]];

  const bloklar = (cfg.bloklar||[]).map(b2=>({
    tip: b2.tip === "yol" ? "yol" : "tam",
    parcalar: (b2.parcalar||[]).map(o=>({ ...o, m2: Math.max(0.01, +o.m2 || 1) })),
    sol: (b2.sol||[]).map(o=>({ ...o, m2: Math.max(0.01, +o.m2 || 1) })),
    sag: (b2.sag||[]).map(o=>({ ...o, m2: Math.max(0.01, +o.m2 || 1) }))
  })).filter(b2=> b2.tip === "tam" ? b2.parcalar.length : (b2.sol.length + b2.sag.length));

  const bos = { parcalar:[], yol:[], resmiYol:null, ana, dik,
                yolGenislik:0, yolAlan:0, resmiAlan:0, kalanAlan:0, kucultme:0 };
  if(!bloklar.length) return bos;

  const izdA = M.map(p=>p[0]*ana[0]+p[1]*ana[1]);
  const izdD = M.map(p=>p[0]*dik[0]+p[1]*dik[1]);
  const aMin = Math.min(...izdA), aMax = Math.max(...izdA);
  const dMin = Math.min(...izdD), dMax = Math.max(...izdD);
  const cW = dMax - dMin;

  const kA = (poly, deger, ust) => ust ? kirp(poly, ana, deger) : kirp(poly, [-ana[0],-ana[1]], -deger);
  const kD = (poly, deger, ust) => ust ? kirp(poly, dik, deger) : kirp(poly, [-dik[0],-dik[1]], -deger);
  const dilim = (a0, a1) => { const p = kA(kA(M, a1, true), a0, false); return p.length > 2 ? p : null; };
  const kutu = (a0, a1, d0, d1) => {
    let p = dilim(a0, a1); if(!p) return null;
    p = kD(kD(p, d1, true), d0, false);
    return p.length > 2 ? p : null;
  };
  const alan = p => (p && p.length > 2) ? Math.abs(alanHesap(p)) : 0;

  // ---------- resmi yol: parselin DISINDA, alandan dusulmez ----------
  let resmiYol = null, resmiAlan = 0;
  const rg = +cfg.resmiGenislik || 0;
  const rKenar = cfg.resmiKenar || "alt";
  if(rg > 0){
    const sinirDegeri = { alt:aMin, ust:aMax, sol:dMin, sag:dMax }[rKenar];
    const eksenDeger = (rKenar === "alt" || rKenar === "ust") ? izdA : izdD;
    const yakinlar = M.map((k,i2)=>({ k, fark: Math.abs(eksenDeger[i2] - sinirDegeri) }))
      .sort((x,y)=>x.fark - y.fark).slice(0,2).map(o=>o.k);
    if(yakinlar.length === 2){
      const yon = (rKenar === "alt") ? [-ana[0],-ana[1]] : (rKenar === "ust") ? ana
                : (rKenar === "sol") ? [-dik[0],-dik[1]] : dik;
      const [q1, q2] = yakinlar;
      resmiYol = [ q1, q2,
        [ q2[0] + yon[0]*rg, q2[1] + yon[1]*rg ],
        [ q1[0] + yon[0]*rg, q1[1] + yon[1]*rg ] ];
      resmiAlan = alan(resmiYol);
    }
  }

  const toplamAlan = Math.abs(alanHesap(M));
  const w = Math.max(0.5, Math.min(+cfg.enAzYol || 3, cW*0.35));

  // her yol blogunun kolon ayirici konumu
  // Kolonlari ayiran cizgi: genislige gore degil, GERCEK ALANA gore bulunur.
  // Parsel daralan bir sekilse genislik orani yaniltir ve uctaki parca ezilir.
  const ayiriciDeger = (b2, a0, a1) => {
    const oS = b2.sol.reduce((t,o)=>t+o.m2,0), oG = b2.sag.reduce((t,o)=>t+o.m2,0);
    const kaydir = cW * (+cfg.yolKaydir || 0);
    if(cfg.yolKonum === "orta")
      return Math.max(dMin + w, Math.min(dMax - w, dMin + cW/2 + kaydir));

    const p = (a0 != null && a1 != null) ? dilim(a0, a1) : M;
    const hedefOran = oS / Math.max(1e-6, oS + oG);
    if(!p) return Math.max(dMin + w, Math.min(dMax - w, dMin + cW*hedefOran + kaydir));

    // yolun kendi genisligi disinda kalan sol/sag alanlarin orani hedefe esitlenir
    let lo = dMin, hi = dMax, mid = dMin + cW*hedefOran;
    for(let k = 0; k < 36; k++){
      mid = (lo + hi)/2;
      const solA = alan(kD(p, mid - w/2, true));
      const sagA = alan(kD(p, mid + w/2, false));
      const oran = solA / Math.max(1e-6, solA + sagA);
      if(oran < hedefOran) lo = mid; else hi = mid;
    }
    return Math.max(dMin + w, Math.min(dMax - w, mid + kaydir));
  };

  // bloklar her zaman aMin'den yukari dizilir; resmi yol hangi uctaysa
  // kenar yolu o uctan en yakin kolonlu bloga kadar uzanir
  const ilkYol = bloklar.findIndex(b2=>b2.tip === "yol");
  const sonYol = bloklar.map(b2=>b2.tip).lastIndexOf("yol");
  const ustten = (rKenar === "ust");
  // alt/ust kenarda resmi yol varsa kolonlu bloga ulasmak icin kenar yolu gerekir;
  // sol/sag kenarda bloklar arasi bant zaten o kenara degiyor
  const baglanacak = ustten ? sonYol : ilkYol;
  const kenarGerekli = rg > 0 && (rKenar === "alt" || rKenar === "ust")
    && baglanacak >= 0 && (ustten ? baglanacak < bloklar.length-1 : baglanacak > 0);

  // Kenar yolu parselin GERCEK kenarina yaslanir: egik kenari birebir takip eder,
  // boylece her yerde 3 m kalir ve parcalar kenara paralel kalir.
  let kenarNormal = null, kenarSinir = 0, kenarKenari = null;
  if(kenarGerekli){
    const ay = ayiriciDeger(bloklar[baglanacak]);
    const solaYakin = (cfg.yolKonum === "sol") ? true
      : (cfg.yolKonum === "sag") ? false
      : (ay - dMin) <= (dMax - ay);

    const merkez = [ M.reduce((t,k)=>t+k[0],0)/M.length, M.reduce((t,k)=>t+k[1],0)/M.length ];
    // once YAN kenarlari ayikla: yonu parselin uzun eksenine yakin olanlar.
    // alt/ust kenar (resmi yolun degdigi kenar) asla kenar yolu tasiyicisi olamaz.
    const adaylar = [];
    for(let i2 = 0; i2 < M.length; i2++){
      const j2 = (i2+1) % M.length;
      const ex = M[j2][0]-M[i2][0], ey = M[j2][1]-M[i2][1];
      const uzun = Math.hypot(ex, ey);
      if(uzun < 5) continue;
      const orta = [ (M[i2][0]+M[j2][0])/2, (M[i2][1]+M[j2][1])/2 ];
      const paralellik = Math.abs((ex*ana[0] + ey*ana[1]) / uzun);   // 1 = uzun eksene paralel
      adaylar.push({ i:i2, j:j2, orta, ex, ey, uzun, paralellik,
                     dProj: orta[0]*dik[0] + orta[1]*dik[1] });
    }
    let havuz = adaylar.filter(o=>o.paralellik > 0.5);
    if(!havuz.length) havuz = adaylar.filter(o=>o.paralellik > 0.25);
    if(!havuz.length) havuz = adaylar;
    // istenen taraftaki en uc kenar; esitlikte daha uzun olan
    let enIyi = null;
    havuz.forEach(o=>{
      const skor = (solaYakin ? -o.dProj : o.dProj) + o.uzun * 0.01;
      if(!enIyi || skor > enIyi.skor) enIyi = { ...o, skor };
    });
    if(enIyi){
      let n = [ -enIyi.ey/enIyi.uzun, enIyi.ex/enIyi.uzun ];
      const ic = [ merkez[0]-enIyi.orta[0], merkez[1]-enIyi.orta[1] ];
      if(n[0]*ic[0] + n[1]*ic[1] < 0) n = [-n[0], -n[1]];
      kenarNormal = n;
      kenarSinir = (M[enIyi.i][0]*n[0] + M[enIyi.i][1]*n[1]) + w;
      kenarKenari = { q: M[enIyi.i], e: [ enIyi.ex/enIyi.uzun, enIyi.ey/enIyi.uzun ] };
    }
  }
  const kenarVarMi = kenarGerekli && !!kenarNormal;
  // Kenar yolu varsayilan olarak parselin DISINDA cizilir: parcalar tam
  // genisliginde kalir, siluet bozulmaz. Istenirse parselin icinden de gecebilir.
  const disaridan = true;   // gorsel olarak her zaman parselin disindan gecer

  // parselin icinde serit
  const kenarSeridiIc = (a0, a1) => {
    const p = dilim(a0, a1);
    if(!p || !kenarNormal) return null;
    const k = kirp(p, kenarNormal, kenarSinir);
    return k.length > 2 ? k : null;
  };

  // Parselin disinda, secilen kenarin TAMAMINI takip eden serit.
  // Kenar kirikliysa (birden fazla dogru parcasindan olusuyorsa) serit de kirilir,
  // boylece hicbir noktada daralmaz.
  const kenarSeridiDis = (a0, a1) => {
    if(!kenarNormal) return null;
    const alt = Math.min(a0, a1), ust = Math.max(a0, a1);
    const merkezD = M.reduce((t,k)=>t + (k[0]*dik[0] + k[1]*dik[1]), 0) / M.length;
    const solTaraf = (kenarNormal[0]*dik[0] + kenarNormal[1]*dik[1]) > 0;  // ic normal saga bakiyorsa kenar solda

    // sinir uzerinde a araliginda kalan, secilen taraftaki nokta zinciri
    const zincir = [];
    for(let i2 = 0; i2 < M.length; i2++){
      const j2 = (i2+1) % M.length;
      const p1 = M[i2], p2 = M[j2];
      const a1p = p1[0]*ana[0] + p1[1]*ana[1], a2p = p2[0]*ana[0] + p2[1]*ana[1];
      // sadece YAN kenarlar: alt/ust kenarlari zincire alma
      const ex2 = p2[0]-p1[0], ey2 = p2[1]-p1[1];
      const u2 = Math.hypot(ex2, ey2);
      if(u2 < 0.5) continue;
      if(Math.abs((ex2*ana[0] + ey2*ana[1]) / u2) < 0.35) continue;
      const ortaD = ((p1[0]+p2[0])/2)*dik[0] + ((p1[1]+p2[1])/2)*dik[1];
      const buTaraf = solTaraf ? (ortaD < merkezD) : (ortaD > merkezD);
      if(!buTaraf) continue;
      // kenari a araligina kirp
      const kes = (a) => {
        const t = (a - a1p) / (a2p - a1p);
        return [ p1[0] + (p2[0]-p1[0])*t, p1[1] + (p2[1]-p1[1])*t ];
      };
      let q1 = p1, q2 = p2;
      const kucuk2 = Math.min(a1p, a2p), buyuk2 = Math.max(a1p, a2p);
      if(buyuk2 < alt - 0.01 || kucuk2 > ust + 0.01) continue;
      if(Math.abs(a2p - a1p) > 1e-6){
        if(a1p < alt) q1 = kes(alt); else if(a1p > ust) q1 = kes(ust);
        if(a2p < alt) q2 = kes(alt); else if(a2p > ust) q2 = kes(ust);
      }
      zincir.push([q1, q2]);
    }
    if(!zincir.length) return null;

    // zinciri a yonunde sirala ve uc uca ekle
    const anaP = k2 => k2[0]*ana[0] + k2[1]*ana[1];
    zincir.forEach(par=>{ if(anaP(par[0]) > anaP(par[1])) par.reverse(); });
    zincir.sort((x,y2)=>anaP(x[0]) - anaP(y2[0]));

    const ham2 = [];
    zincir.forEach(par=>{ ham2.push(par[0], par[1]); });
    // ust uste binen noktalari ele
    const ic = [];
    ham2.forEach(nk=>{
      const son2 = ic[ic.length-1];
      if(!son2 || Math.hypot(son2[0]-nk[0], son2[1]-nk[1]) > 0.05) ic.push(nk);
    });
    if(ic.length < 2) return null;

    // disa dogru w kadar otele: her nokta komsu kenarlarin ortalama normali boyunca
    const dis = ic.map((nk, i2)=>{
      const onceki = ic[Math.max(0, i2-1)], sonraki = ic[Math.min(ic.length-1, i2+1)];
      const ex = sonraki[0]-onceki[0], ey = sonraki[1]-onceki[1];
      const u = Math.hypot(ex, ey) || 1;
      let n = [ -ey/u, ex/u ];
      if(n[0]*kenarNormal[0] + n[1]*kenarNormal[1] > 0) n = [-n[0], -n[1]];  // disari baksin
      return [ nk[0] + n[0]*w, nk[1] + n[1]*w ];
    });

    return ic.concat(dis.reverse());
  };

  const kenarSeridi = (a0, a1) => disaridan ? kenarSeridiDis(a0, a1) : kenarSeridiIc(a0, a1);
  const kenarDisi = p => {
    if(!kenarNormal || disaridan) return p;      // disaridan geciyorsa parca kesilmez
    const k = kirp(p, [-kenarNormal[0], -kenarNormal[1]], -kenarSinir);
    return k.length > 2 ? k : p;
  };

  const blokAgirlik = bloklar.map(b2=> b2.tip === "tam"
    ? b2.parcalar.reduce((t,o)=>t+o.m2,0)
    : b2.sol.concat(b2.sag).reduce((t,o)=>t+o.m2,0));
  const T = blokAgirlik.reduce((a,b2)=>a+b2,0) || 1;

  // bir blogun [a0,a1] araliginda parcalara kalan net alani
  const netAlan = (b2, a0, a1, kenarVar) => {
    const p = dilim(a0, a1);
    if(!p) return 0;
    let net = alan(p);
    if(b2.tip === "yol"){
      const ay = ayiriciDeger(b2, a0, a1);
      net -= alan(kutu(a0, a1, ay - w/2, ay + w/2));
    }
    // Kenar yolu parselin disinda cizilir; alani blogun icinden degil,
    // toplam yol payindan (carpan uzerinden) butun parcalardan dusulur.
    return net;
  };

  // ---------- yerlesim: her blok kendi hedef alanini tutana kadar buyur ----------
  let carpan = 1, sonuc = null;
  for(let tur = 0; tur < 4; tur++){
    const yerler = [];
    let imlec = aMin;
    let tasti = false;

    bloklar.forEach((b2, i2)=>{
      const hedef = blokAgirlik[i2] * carpan;
      // kenar yolu hangi bloklarin yanindan gecer
      const kenarVar = kenarVarMi && (ustten ? i2 > baglanacak : i2 < baglanacak);
      let lo = imlec, hi = aMax, kes = hi;
      for(let k = 0; k < 44; k++){
        kes = (lo + hi)/2;
        const net = netAlan(b2, imlec, kes, kenarVar);
        if(net < hedef) lo = kes; else hi = kes;
      }
      yerler.push({ b:b2, a0:imlec, a1:kes, kenarVar });
      if(Math.abs(kes - aMax) < 0.01) tasti = true;
      imlec = kes + w;                   // bloklar arasinda tam genislik yol bandi
    });

    // yollarin gercek alani
    const yollar = [];
    yerler.forEach((y, i2)=>{
      if(y.b.tip === "yol"){
        const ay = ayiriciDeger(y.b, y.a0, y.a1);
        const k = kutu(y.a0, y.a1, ay - w/2, ay + w/2);
        if(k) yollar.push(k);
      }
      if(i2 < yerler.length - 1){       // bloklar arasi tam genislik bant
        const bant = dilim(y.a1, yerler[i2+1].a0);
        if(bant) yollar.push(bant);
      }
    });
    if(kenarVarMi){
      const bas = ustten ? yerler[baglanacak].a1 : aMin;
      const son = ustten ? aMax : yerler[baglanacak].a0;
      const k = kenarSeridi(bas, son);
      if(k) yollar.push(k);
    }
    // Iki ayri toplam:
    //  - icYol: parselin icinden gecen yollar. Cizim bunlara gore yerlesir,
    //           boylece parcalar parseli bosluk birakmadan doldurur.
    //  - yolAlan: kenar yolu dahil tum yollar. Ozet bunu parcalardan dusuk gosterir.
    const disSerit = kenarVarMi ? yollar[yollar.length-1] : null;
    const icYol = yollar.reduce((t,p)=>t + (p === disSerit ? 0 : alan(p)), 0);
    const yolAlan = yollar.reduce((t,p)=>t + alan(p), 0);
    sonuc = { yerler, yollar, yolAlan, icYol, tasti };
    const yeniCarpan = (toplamAlan - icYol) / T;
    if(Math.abs(yeniCarpan - carpan) < 0.0005) break;
    carpan = yeniCarpan;
  }

  // ---------- parcalari uret ----------
  const cikti = [];
  sonuc.yerler.forEach(y=>{
    let p = dilim(y.a0, y.a1);
    if(!p) return;
    if(y.kenarVar) p = kenarDisi(p);       // kenar yolunu blogun disinda birak
    if(y.b.tip === "tam"){
      parcala(p, y.b.parcalar.map(o=>o.m2*carpan), ana, true)
        .forEach((q,k)=>cikti.push({ poly:q, bilgi:y.b.parcalar[k] }));
      return;
    }
    const ay = ayiriciDeger(y.b, y.a0, y.a1);
    const sol = kD(p, ay - w/2, true), sag = kD(p, ay + w/2, false);
    if(y.b.sol.length && sol.length > 2)
      parcala(sol, y.b.sol.map(o=>o.m2*carpan), ana, true)
        .forEach((q,k)=>cikti.push({ poly:q, bilgi:y.b.sol[k] }));
    if(y.b.sag.length && sag.length > 2)
      parcala(sag, y.b.sag.map(o=>o.m2*carpan), ana, true)
        .forEach((q,k)=>cikti.push({ poly:q, bilgi:y.b.sag[k] }));
  });

  // ---- disaridan gecen kenar yolunun alanini parcalardan gercekten dus ----
  // Her parca cevresi boyunca esit miktarda daraltilir: parsel bosluksuz dolar,
  // toplam alan birebir tutar, parcalar arasinda ince ayrim cizgisi olusur.
  {
    const disSerit = kenarVarMi ? sonuc.yollar[sonuc.yollar.length-1] : null;
    const disAlan = disSerit ? alan(disSerit) : 0;
    if(disAlan > 0.5 && cikti.length){
      const cevre = p => {
        let t = 0;
        for(let i2 = 0; i2 < p.length; i2++){
          const j2 = (i2+1) % p.length;
          t += Math.hypot(p[j2][0]-p[i2][0], p[j2][1]-p[i2][1]);
        }
        return t;
      };
      // pay alana gore dagitilir: her parca kendi alaniyla orantili kadar kaybeder
      const toplamAlanP = cikti.reduce((t,o)=>t + alan(o.poly), 0) || 1;
      cikti.forEach(o=>{
        const a2 = alan(o.poly);
        const c2 = cevre(o.poly) || 1;
        o.daralt = Math.min((disAlan * (a2/toplamAlanP)) / c2, w/3);
      });
      {
        cikti.forEach(o=>{
          const d = o.daralt || 0;
          if(d <= 0.005) return;
          const p = o.poly;
          const mx = p.reduce((t,k)=>t+k[0],0)/p.length, my = p.reduce((t,k)=>t+k[1],0)/p.length;
          let q = p;
          for(let i2 = 0; i2 < p.length; i2++){
            const j2 = (i2+1) % p.length;
            const ex = p[j2][0]-p[i2][0], ey = p[j2][1]-p[i2][1];
            const u = Math.hypot(ex, ey);
            if(u < 0.01) continue;
            let n = [ -ey/u, ex/u ];
            if(n[0]*(mx-p[i2][0]) + n[1]*(my-p[i2][1]) < 0) n = [-n[0], -n[1]];
            const sinirD = n[0]*p[i2][0] + n[1]*p[i2][1] + d;
            const k = kirp(q, [-n[0], -n[1]], -sinirD);
            if(k.length > 2) q = k;
          }
          if(q.length > 2) o.poly = q;
          delete o.daralt;
        });
      }
    }
  }

  // ayni parca birden fazla parcaya bolunduyse yaziyi sadece en buyugune koy
  {
    const grup = new Map();
    cikti.forEach(o=>{
      const a2 = alan(o.poly);
      const enIyi2 = grup.get(o.bilgi);
      if(!enIyi2 || a2 > enIyi2.a) grup.set(o.bilgi, { o, a:a2 });
    });
    cikti.forEach(o=>{ o.ikizi = grup.get(o.bilgi)?.o !== o; });
  }

  return { parcalar: cikti, yol: sonuc.yollar, resmiYol, ana, dik,
           yolGenislik: w,
           yolAlan: Math.round(sonuc.yolAlan*100)/100,
           icYolAlan: Math.round(sonuc.icYol*100)/100,
           resmiAlan: Math.round(resmiAlan*100)/100,
           kalanAlan: Math.round((toplamAlan - sonuc.yolAlan)*100)/100,
           kucultme: carpan < 1 ? Math.round((1-carpan)*1000)/10 : 0,
           tasti: sonuc.tasti };
}

function parcalariUret(M, cfg){
  return capYerlesim(M, cfg).parcalar.map(o=>o.poly);
}

function cfgParcalari(cfg){
  const liste = [];
  (cfg.bloklar||[]).forEach(b=>{
    if(b.tip === "yol"){ (b.sol||[]).forEach(o=>liste.push({ ...o })); (b.sag||[]).forEach(o=>liste.push({ ...o })); }
    else (b.parcalar||[]).forEach(o=>liste.push({ ...o }));
  });
  return liste;
}

// parcanin ana ve dik eksendeki olculeri (cephe x derinlik)

function agirlikMerkezi(pts){
  let x=0, y=0, a=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    const c = pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1];
    a += c; x += (pts[i][0]+pts[j][0])*c; y += (pts[i][1]+pts[j][1])*c;
  }
  a *= 0.5;
  return a ? [x/(6*a), y/(6*a)] : [pts[0][0], pts[0][1]];
}

  if(belgeId){

  }
  PARCA.p = p;

    if(g2("pyg")) g2("pyg").value = PARCA.enAzYol;
    if(g2("pyk")) g2("pyk").value = Math.round(PARCA.yolKaydir*100);
    if(g2("prg")) g2("prg").value = String(PARCA.resmiGenislik);

    e.target.disabled = true; const eskiYazi = e.target.textContent; e.target.textContent = "Çiziliyor…";

async function capCiz(parselId, cfg, belgeId){
  const { data:p } = await sb.from("parcels").select("*").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  toast("Çap çiziliyor…");
  try{
    const { jsPDF } = window.jspdf;
    let pdf;
    {
      // iki sayfa yan yana: tek yatay A4
      const G2 = 2000, Y2 = 1400;
      const birlesik = document.createElement("canvas");
      birlesik.width = G2; birlesik.height = Y2;
      const bx = birlesik.getContext("2d");
      bx.fillStyle = "#FFFFFF"; bx.fillRect(0,0,G2,Y2);
      const sol = await yukleGorsel(capCizPng(p, cfg));
      const sag = await yukleGorsel(muvafakatPng(p, 1000, 1400));
      bx.drawImage(sol, 0, 0, 1000, 1400);
      bx.drawImage(sag, 1000, 0, 1000, 1400);
      bx.strokeStyle = "#D8DBDE"; bx.lineWidth = 2;
      bx.beginPath(); bx.moveTo(1000, 40); bx.lineTo(1000, Y2-40); bx.stroke();
      pdf = new jsPDF({ orientation:"landscape", unit:"mm", format:"a4" });
      const gen = 277, yuk = gen * (Y2/G2);
      pdf.addImage(birlesik.toDataURL("image/png"), "PNG", 10, (210-yuk)/2, gen, yuk);
    }
    const blob = pdf.output("blob");
    const dosya = new File([blob], capDosyaAdi(p, "pdf"), { type:"application/pdf" });
    if(belgeId){
      const { data:b2 } = await sb.from("documents").select("file_path,file_name").eq("id", belgeId).single();
      if(b2){
        // depo kurallari uzerine yazmaya izin vermiyor: once sil, sonra ayni yola yukle
        await sb.storage.from("arsatakip").remove([b2.file_path]);
        const { error } = await sb.storage.from("arsatakip").upload(b2.file_path, dosya);
        if(error) throw error;
        const { error:e2 } = await sb.from("documents")
          .update({ size_bytes: dosya.size, cap_config: cfg }).eq("id", belgeId);
        if(e2) throw e2;
      }else await dosyaYukle(dosya, "cap", parselId, cfg);
    }else{
      await dosyaYukle(dosya, "cap", parselId, cfg);
    }
    if(cfg && cfg.parcalar?.length) await sb.from("parcels").update({ cap_config: cfg }).eq("id", parselId);
    toast(belgeId ? "Çap güncellendi" : "Çap hazırlandı ve parsele eklendi");
    go("parsel", parselId);
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

// parsel sinirindan olcekli cap cizimi uretir


// turkce karakter icermeyen dosya adi: kustepe-114-1-15-09-2026.pdf
function sadeAd(x){
  return String(x||"")
    .replace(/[ıİ]/g,"i").replace(/[şŞ]/g,"s").replace(/[ğĞ]/g,"g")
    .replace(/[üÜ]/g,"u").replace(/[öÖ]/g,"o").replace(/[çÇ]/g,"c")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function capDosyaAdi(p, uzanti){
  const t = new Date();
  const ik = n => String(n).padStart(2,"0");
  const tarih = `${ik(t.getDate())}-${ik(t.getMonth()+1)}-${t.getFullYear()}`;
  return [sadeAd(p.mahalle) || "parsel", p.ada || 0, p.parsel, tarih].join("-") + "." + uzanti;
}

/* ---- DXF disa aktarma ---- */

function dxfUret(p, cfg){
  const M = capHalkasi(p);
  if(!M) throw new Error("sınır çizimi yok");
  const yer = capYerlesim(M, cfg);
  const L = [];
  const g = (kod, deger) => { L.push(String(kod)); L.push(String(deger)); };

  g(0,"SECTION"); g(2,"HEADER"); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"TABLES");
  g(0,"TABLE"); g(2,"LAYER"); g(70,4);
  [["PARSEL_SINIR",1],["PARCALAR",3],["YOL",8],["YAZI",2]].forEach(([ad2,renk])=>{
    g(0,"LAYER"); g(2,ad2); g(70,0); g(62,renk); g(6,"CONTINUOUS");
  });
  g(0,"ENDTAB"); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"ENTITIES");

  const cizgi = (a,b,katman) => {
    g(0,"LINE"); g(8,katman);
    g(10,a[0].toFixed(3)); g(20,a[1].toFixed(3)); g(30,"0.0");
    g(11,b[0].toFixed(3)); g(21,b[1].toFixed(3)); g(31,"0.0");
  };
  const halka = (pts,katman) => { for(let i=0;i<pts.length;i++) cizgi(pts[i], pts[(i+1)%pts.length], katman); };
  const yazi = (nokta, metin, boy) => {
    g(0,"TEXT"); g(8,"YAZI");
    g(10,nokta[0].toFixed(3)); g(20,nokta[1].toFixed(3)); g(30,"0.0");
    g(40,boy.toFixed(2)); g(1,String(metin)); g(72,1); g(11,nokta[0].toFixed(3)); g(21,nokta[1].toFixed(3)); g(31,"0.0");
  };

  halka(M, "PARSEL_SINIR");
  (yer.yol||[]).forEach(yp=>{ if(yp && yp.length>2) halka(yp, "YOL"); });
  yer.parcalar.forEach((o,i)=>{
    if(!o.poly || o.poly.length < 3) return;
    halka(o.poly, "PARCALAR");
    const om = agirlikMerkezi(o.poly);
    const b2 = o.bilgi || {};
    yazi(om, String(b2.no || (i+1)), 3);
    yazi([om[0], om[1]-4], `${(b2.m2 ?? alanHesap(o.poly)).toFixed(2)} m2`, 2);
  });

  g(0,"ENDSEC"); g(0,"EOF");
  return L.join("\r\n");
}

function dxfIndir(){
  if(!PARCA.p) return toast("Önce parseli aç");
  try{
    const metin = dxfUret(PARCA.p, parcaCfg());
    const p = PARCA.p;
    const blob = new Blob([metin], { type:"application/dxf" });
    indirBlob(blob, capDosyaAdi(p, "dxf"));
    toast("DXF indirildi");
  }catch(e){ toast("Olmadı: " + (e.message||e)); }
}

const CAP_R = { kirmizi:"#A3242C", gri:"#8B9096", sari:"#FCF3CF", cizgi:"#3A3A3A" };

// kurumsal kirmizi-gri cerceve
function capCerceve(x, G, Y, baslik){
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y);

  // ince cift cerceve
  x.strokeStyle = CAP_R.kirmizi; x.lineWidth = 3;
  x.strokeRect(26, 26, G-52, Y-52);
  x.strokeStyle = "#C9CDD2"; x.lineWidth = 1;
  x.strokeRect(34, 34, G-68, Y-68);

  // kose aksanlari
  const k = 34, u = 46;
  x.strokeStyle = CAP_R.kirmizi; x.lineWidth = 6;
  [[k,k,1,1],[G-k,k,-1,1],[k,Y-k,1,-1],[G-k,Y-k,-1,-1]].forEach(([cx,cy,sx,sy])=>{
    x.beginPath(); x.moveTo(cx + sx*u, cy); x.lineTo(cx, cy); x.lineTo(cx, cy + sy*u); x.stroke();
  });

  // ust serit
  if(baslik){
    x.fillStyle = CAP_R.kirmizi;
    x.fillRect(34, 34, G-68, 6);
    x.textAlign = "center"; x.textBaseline = "alphabetic";
    x.fillStyle = "#1A1A1A"; x.font = "400 34px Georgia, serif";
    x.fillText(baslik, G/2, 104);
    x.strokeStyle = "#D8DBDE"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(G*0.30, 120); x.lineTo(G*0.70, 120); x.stroke();
  }
}

// kunye tablosu (sari basliklar)
function capKunye(x, p, sol, ust, gen){
  const sy = 34, yariGen = gen/2, etiketGen = yariGen*0.42;
  const satirlar = [
    ["İL", duzgun(p.il), "ADA", p.ada || "—"],
    ["İLÇE", duzgun(p.ilce), "PARSEL", p.parsel],
    ["KÖY / MAH.", duzgun(p.mahalle), "YÜZÖLÇÜMÜ", nf2(gercekAlan(p)) + " m²"]
  ];
  x.lineWidth = 1.2; x.strokeStyle = CAP_R.cizgi;
  satirlar.forEach((r,i)=>{
    const y = ust + i*sy;
    [[sol, etiketGen, r[0], true], [sol+etiketGen, yariGen-etiketGen, r[1], false],
     [sol+yariGen, etiketGen, r[2], true], [sol+yariGen+etiketGen, yariGen-etiketGen, r[3], false]]
    .forEach(([hx, hw, metin, basMi])=>{
      x.fillStyle = basMi ? CAP_R.sari : "#FFFFFF";
      x.fillRect(hx, y, hw, sy);
      x.strokeRect(hx, y, hw, sy);
      x.fillStyle = "#111"; x.font = `${basMi?"700":"400"} 15px Arial`;
      x.textAlign = "left"; x.textBaseline = "middle";
      x.fillText(String(metin).slice(0,26), hx + 10, y + sy/2);
    });
  });
  return ust + satirlar.length*sy;
}

// donmus yazinin eksen hizali sinir kutusu
function yaziKutusu(cx, cy, gen, yuk, aci){
  const c = Math.abs(Math.cos(aci)), si = Math.abs(Math.sin(aci));
  const w = gen*c + yuk*si, h = gen*si + yuk*c;
  return { x1:cx - w/2, y1:cy - h/2, x2:cx + w/2, y2:cy + h/2 };
}
const kutuCakisiyor = (a,b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);

// resmi capa benzer cizim: kunye tablosu, kuzey gulu, parcalar ve olculer
function capCizPng(p, cfg, kucuk){
  const parcalar = cfg?.parcalar || null;
  const M = capHalkasi(p);
  if(!M) throw new Error("sınır çizimi yok");

  const G = kucuk ? 700 : 1000, Y = kucuk ? 900 : 1400;
  const ustAlan = kucuk ? 110 : 330, altAlan = kucuk ? 30 : 90, kenar = kucuk ? 40 : 80;
  const c = document.createElement("canvas"); c.width = G; c.height = Y;
  const x = c.getContext("2d");
  if(kucuk){ x.fillStyle = "#FFFFFF"; x.fillRect(0,0,G,Y); }
  else capCerceve(x, G, Y, "PARSELASYON KROKİSİ");
  const S = k => kucuk ? Math.max(8, Math.round(k*0.66)) : k;

  // resmi yol disarida kaldigi icin cizim sinirlarina onu da kat
  let kapsam = M.slice();
  try{
    const on = capYerlesim(M, cfg || {});
    if(on.resmiYol && on.resmiYol.length > 2) kapsam = kapsam.concat(on.resmiYol);
    (on.yol||[]).forEach(p=>{ if(p && p.length > 2) kapsam = kapsam.concat(p); });
  }catch(e){}
  const minX = Math.min(...kapsam.map(k=>k[0])), maxX = Math.max(...kapsam.map(k=>k[0]));
  const minY = Math.min(...kapsam.map(k=>k[1])), maxY = Math.max(...kapsam.map(k=>k[1]));
  const alanG = G - kenar*2, alanY = Y - ustAlan - altAlan;
  const olcek = Math.min(alanG/((maxX-minX)||1e-9), alanY/((maxY-minY)||1e-9));
  const gX = kenar + (alanG - (maxX-minX)*olcek)/2;
  const gY = ustAlan + (alanY - (maxY-minY)*olcek)/2;
  const E = m => [ gX + (m[0]-minX)*olcek, gY + (maxY-m[1])*olcek ];
  const N = M.map(E);
  const yol = pts => { x.beginPath(); pts.forEach((k,i)=> i ? x.lineTo(k[0],k[1]) : x.moveTo(k[0],k[1])); x.closePath(); };

  // ---- baslik ve kunye ----
  if(!kucuk){
    capKunye(x, p, 62, 142, G - 124);

    // kuzey gulu
    const kx2 = 96, ky2 = 300;
    x.save(); x.translate(kx2, ky2);
    x.fillStyle = "#111"; x.font = "700 13px Arial"; x.textAlign = "center";
    x.fillText("KUZEY", 0, -30);
    x.beginPath(); x.arc(0,0,17,0,7); x.strokeStyle = "#333"; x.lineWidth = 1.2; x.stroke();
    x.beginPath(); x.moveTo(0,-22); x.lineTo(-8,10); x.lineTo(0,3); x.lineTo(8,10); x.closePath();
    x.fillStyle = "#111"; x.fill();
    x.restore();
  }

  const etiketler = [], dolu = [], bekleyen = [];
  const liste = (parcalar && parcalar.length > 1) ? parcalar : null;
  if(liste){
    const yer = capYerlesim(M, cfg);

    yer.parcalar.forEach((o,i)=>{
      const d = o.poly, ek = d.map(E), bilgi = o.bilgi || liste[i] || {};
      yol(ek);
      const dolguRenk = (!bilgi.renk || bilgi.renk.toUpperCase() === "#FFFFFF") ? "#C6D9A7" : bilgi.renk;
      x.fillStyle = dolguRenk; x.fill();
      x.lineWidth = kucuk ? .8 : 1.15; x.strokeStyle = "#C2AE2B"; x.stroke();   // ornekteki sari hat

      const om = E(agirlikMerkezi(d));
      x.textAlign = "center"; x.textBaseline = "middle";
      if(o.ikizi) return;                      // yol kolu parcayi ikiye bolduyse yaziyi bir kere yaz
      x.font = `700 ${S(21)}px Arial`; x.fillStyle = "#14170F";
      x.fillText(String(bilgi.no || (i+1)), om[0], om[1] - S(11));
      x.font = `400 ${S(15)}px Arial`;
      const m2Deger = isFinite(+bilgi.m2) && +bilgi.m2 > 0 ? +bilgi.m2 : alanHesap(d);
      const m2Metin = nfAkilli(m2Deger) + " m2";
      x.fillText(m2Metin, om[0], om[1] + S(10));
      // no ve m2 blogunu dolu alan olarak isaretle
      const blokGen = Math.max(x.measureText(m2Metin).width, S(30)) + S(10);
      dolu.push({ x1:om[0]-blokGen/2, y1:om[1]-S(26), x2:om[0]+blokGen/2, y2:om[1]+S(20) });

      // kenar olculeri: konumu sonra, carpismaya bakarak belirlenecek
      if(cfg.olculer !== false && !kucuk){
        for(let k=0;k<d.length;k++){
          const j = (k+1) % d.length;
          const uz = Math.hypot(d[j][0]-d[k][0], d[j][1]-d[k][1]);
          if(uz < 4) continue;
          const a1 = ek[k], a2 = ek[j];
          const dx = a2[0]-a1[0], dy = a2[1]-a1[1], u = Math.hypot(dx,dy) || 1;
          if(u < 30) continue;
          bekleyen.push({ a1, a2, dx, dy, u, om, metin: uz.toFixed(1).replace(".",",") + " m" });
        }
      }
    });

    // ---- yollar: bosluk zaten bos; ortasindan kesik cizgi gecer ----
    // Bir yol seridinin orta ekseni: seridin KENDI dogrultusuna gore hesaplanir.
    // (sinir kutusuna gore hesaplamak egik seritlerde ekseni disari tasiriyordu)
    const ortaEksen = poly => {
      const n = poly.length;
      const cx = poly.reduce((t,k)=>t+k[0],0)/n, cy = poly.reduce((t,k)=>t+k[1],0)/n;
      // ana dogrultu: en uzun kenarin yonu
      let ex = 0, ey = 0, enUzun = 0;
      for(let i2 = 0; i2 < n; i2++){
        const j2 = (i2+1) % n;
        const dx = poly[j2][0]-poly[i2][0], dy = poly[j2][1]-poly[i2][1];
        const u = Math.hypot(dx, dy);
        if(u > enUzun){ enUzun = u; ex = dx/u; ey = dy/u; }
      }
      if(!enUzun) return { p1:[cx,cy], p2:[cx,cy], uzunluk:0 };
      const t = poly.map(k=>(k[0]-cx)*ex + (k[1]-cy)*ey);
      const bas = Math.min(...t), son = Math.max(...t);
      return {
        p1: [ cx + ex*bas, cy + ey*bas ],
        p2: [ cx + ex*son, cy + ey*son ],
        uzunluk: son - bas
      };
    };

    const kesikCiz = (p1, p2, kalin) => {
      const e1 = E(p1), e2 = E(p2);
      x.save();
      x.setLineDash(kucuk ? [4,3] : [9,6]);
      x.lineCap = "butt";
      x.lineWidth = kalin || (kucuk ? 1 : 1.6);
      x.strokeStyle = "#1A1A1A";
      x.beginPath(); x.moveTo(e1[0], e1[1]); x.lineTo(e2[0], e2[1]); x.stroke();
      x.restore();
    };

    const yolYazisi = (p1, p2, metin) => {
      if(kucuk) return;
      const e1 = E(p1), e2 = E(p2);
      const uz = Math.hypot(e2[0]-e1[0], e2[1]-e1[1]);
      if(uz < S(90)) return;
      let ac = Math.atan2(e2[1]-e1[1], e2[0]-e1[0]);
      if(ac > Math.PI/2) ac -= Math.PI;
      if(ac < -Math.PI/2) ac += Math.PI;
      x.save();
      x.translate((e1[0]+e2[0])/2, (e1[1]+e2[1])/2);
      x.rotate(ac);
      x.textAlign = "center"; x.textBaseline = "middle";
      x.font = `700 ${S(12)}px Arial`;
      x.lineWidth = S(5); x.strokeStyle = "#FFFFFF"; x.lineJoin = "round";
      x.strokeText(metin, 0, 0);
      x.fillStyle = "#1A1A1A"; x.fillText(metin, 0, 0);
      x.restore();
    };

    // yol eksenleri dolu sayilsin ki kenar olculeri yolun uzerine yazilmasin
    const eksenDolu = (p1, p2) => {
      const e1 = E(p1), e2 = E(p2);
      const uz = Math.hypot(e2[0]-e1[0], e2[1]-e1[1]);
      const adet = Math.max(2, Math.round(uz / S(16)));
      const yari = S(9);
      for(let t = 0; t <= adet; t++){
        const px = e1[0] + (e2[0]-e1[0])*t/adet, py = e1[1] + (e2[1]-e1[1])*t/adet;
        dolu.push({ x1:px-yari, y1:py-yari, x2:px+yari, y2:py+yari });
      }
    };

    // parsel yolu: her seridin ortasindan kesik cizgi
    const yolListesi = (yer.yol||[]).filter(p=>p && p.length > 2).map(ortaEksen);
    yolListesi.forEach(o=>{ kesikCiz(o.p1, o.p2); eksenDolu(o.p1, o.p2); });
    const enUzunYol = yolListesi.sort((a,b2)=>b2.uzunluk - a.uzunluk)[0];
    if(enUzunYol) yolYazisi(enUzunYol.p1, enUzunYol.p2, "PARSEL YOLU");

    // resmi yol: parselin disinda, iki uzun kenari duz cizgi
    if(yer.resmiYol && yer.resmiYol.length > 3){
      const ek = yer.resmiYol.map(E);
      x.save();
      x.lineWidth = kucuk ? 1.1 : 1.8; x.strokeStyle = "#1A1A1A";
      x.beginPath(); x.moveTo(ek[0][0], ek[0][1]); x.lineTo(ek[1][0], ek[1][1]); x.stroke();
      x.beginPath(); x.moveTo(ek[3][0], ek[3][1]); x.lineTo(ek[2][0], ek[2][1]); x.stroke();
      x.restore();
      const r = yer.resmiYol;
      const o1 = [ (r[0][0]+r[3][0])/2, (r[0][1]+r[3][1])/2 ];
      const o2 = [ (r[1][0]+r[2][0])/2, (r[1][1]+r[2][1])/2 ];
      eksenDolu(o1, o2);
      yolYazisi(o1, o2, "RESMİ YOL");
    }

  }else{
    yol(N); x.fillStyle = "#F4F6F0"; x.fill();
  }

  // ---- kenar olculerini carpismadan yerlestir ----
  if(bekleyen.length){
    x.font = `400 ${S(11)}px Arial`; x.textAlign = "center"; x.textBaseline = "middle";
    const konumlar = [0.5, 0.36, 0.64, 0.24, 0.76];
    const uzakliklar = [9, 15, 22, 30];
    bekleyen.forEach(b2=>{
      const nx = -b2.dy/b2.u, ny = b2.dx/b2.u;
      let ac = Math.atan2(b2.dy, b2.dx);
      if(Math.abs(ac) > Math.PI/2) ac += Math.PI;
      const gen = x.measureText(b2.metin).width + 4, yuk = S(13);

      let yerlesti = false;
      for(const uzk of uzakliklar){
        for(const t of konumlar){
          for(const yon of [-1, 1]){
            const ox = b2.a1[0] + b2.dx*t, oy = b2.a1[1] + b2.dy*t;
            const mx = b2.om[0] - ox, my = b2.om[1] - oy;
            const disa = (nx*mx + ny*my) > 0 ? -1 : 1;
            const s2 = yon === -1 ? disa : -disa;      // once disari, olmazsa iceri
            const px = ox + nx*uzk*s2, py = oy + ny*uzk*s2;
            const kutu = yaziKutusu(px, py, gen, yuk, ac);
            if(kutu.x1 < 40 || kutu.y1 < 40 || kutu.x2 > G-40 || kutu.y2 > Y-40) continue;
            if(dolu.some(k=>kutuCakisiyor(kutu, k))) continue;
            dolu.push(kutu);
            x.save(); x.translate(px, py); x.rotate(ac);
            x.fillStyle = "rgba(255,255,255,.75)"; x.fillRect(-gen/2, -yuk/2, gen, yuk);
            x.fillStyle = "#333"; x.fillText(b2.metin, 0, 0);
            x.restore();
            yerlesti = true; break;
          }
          if(yerlesti) break;
        }
        if(yerlesti) break;
      }
    });
  }

  SON_ETIKETLER = etiketler;

  // parcali cizimde dis sinir cizilmez: parcalarin sari hatlari siniri zaten verir,
  // kenar yolu da parselin disindan gecer.
  if(!liste){ yol(N); x.lineWidth = kucuk ? 1.6 : 2.4; x.strokeStyle = "#1A1A1A"; x.stroke(); }

  return c.toDataURL("image/png");
}

async function kmlIndirParsel(parselId){
  const { data:p } = await sb.from("parcels").select("geojson,mahalle,ada,parsel").eq("id",parselId).single();
  if(!p || !p.geojson) return toast("Bu parselin sınır çizimi yok");
  const f = p.geojson;
  const b = new Blob([kmlMetni(f)], { type:"application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `${p.mahalle||"parsel"}-${p.ada||0}-${p.parsel}.kml`.replace(/\s+/g,"_");
  a.click(); URL.revokeObjectURL(a.href);
  toast("KML indirildi");
}

let MINI = null;
async function miniHarita(parselId){
  const kutu = document.getElementById("minikutu");
  if(!kutu) return;
  if(kutu.innerHTML){ kutu.innerHTML = ""; MINI = null; return; }
  kutu.innerHTML = `<div id="minimap" style="margin-top:12px"></div>`;
  const { data:p } = await sb.from("parcels").select("geojson,lat,lng").eq("id",parselId).single();
  MINI = L.map("minimap", { zoomControl:true }).setView([p.lat, p.lng], 16);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:19, attribution:"Uydu: Esri · Parsel: TKGM" }).addTo(MINI);
  if(p.geojson){
    const kat = L.geoJSON(p.geojson, { style:{ color:"#E3C05A", weight:2.5, fillColor:"#E3C05A", fillOpacity:.18 } }).addTo(MINI);
    MINI.fitBounds(kat.getBounds(), { padding:[24,24], maxZoom:18 });
  }
  setTimeout(()=>MINI.invalidateSize(), 200);
}

    if(maskotAcikMi(r)){
      maskotKur(r);
      maskotEkran(r);
    }else{
      document.getElementById("maskot")?.remove();
      clearInterval(window.__maskotSaat);
      clearTimeout(window.__maskotGez);
    }
  }catch(e){}
}

function go(r, arg){
  const son = GEZINTI[GEZINTI.length-1];
  if(!son || son.r !== r || son.arg !== arg){
    GEZINTI.push({ r, arg });
    try{ history.pushState({ n: GEZINTI.length }, ""); }catch(e){}
  }
  ekraniCiz(r, arg);
}

// her ekranin bir ust sekmesi: telefonun geri tusu buraya gider
const UST_EKRAN = {
  harita:"ana", araziler:"ana", ekler:"ana", kml:"ana", cap:"ana", hesap:"ana",
  yaklasan:"ana", yz:"ana", fiyat:"ana", ayarlar:"ana", marka:"ayarlar", tema:"ana", yedek:"ayarlar", tv:"ana", zindan:"ana", carki:"ana", rehber:"ana", yarisma:"ana", esas:"ana", oyunlar:"ana", yeni:"araziler",
  parsel:"araziler", parcalar:"parsel", sunum:"parsel", fiyatDuzen:"fiyat", capAyar:"cap"
};

window.addEventListener("popstate", () => {
  if(!window.__acildi) return;
  const simdi = GEZINTI[GEZINTI.length-1] || { r:"ana" };
  const ust = UST_EKRAN[simdi.r];

  if(!ust || simdi.r === "ana"){
    ekraniCiz("ana");
    GEZINTI = [{ r:"ana", arg:undefined }];
  }else{
    // alt ekranlar ust ekrana parsel kimligiyle doner
    const arg = (ust === "parsel") ? (simdi.arg ? String(simdi.arg).split("|")[0] : undefined) : undefined;
    GEZINTI.pop();
    GEZINTI.push({ r:ust, arg });
    ekraniCiz(ust, arg);
  }
  try{ history.pushState({ n: GEZINTI.length }, ""); }catch(e){}
});

(function(){

    v.play().catch(()=>{
      v.muted = true;

})();

const bekletme = 0;

async function baslat(){
 if(window.__basliyor) return;
 window.__basliyor = true;
 try{
  const { data:{ session } } = await zamanAsimi(sb.auth.getSession(), 8000);
  if(!session){ window.__acildi = true; window.__basliyor = false; return girisEkrani(); }
  let { data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000);
  if(!prof){ await new Promise(r=>setTimeout(r,1200));
    ({ data:prof } = await zamanAsimi(sb.from("profiles").select("*").eq("id", session.user.id).single(), 8000)); }
  window.__acildi = true; window.__basliyor = false;
  if(!prof) return acilisHatasi("Profil kurulamadı. Oturumu sıfırlayıp tekrar gir.");
  // isim mail gibi kalmissa Google'dan gelen ad soyadi yaz
  const gAd = session.user.user_metadata?.full_name || session.user.user_metadata?.name;
  if(gAd && (!prof.full_name || prof.full_name.includes("@"))){
    try{ await sb.from("profiles").update({ full_name: gAd }).eq("id", prof.id); prof.full_name = gAd; }catch(e){}
  }
  ME = prof;
  temaUygula();
  await markaYukle();
  GEZINTI = [{ r:"ana", arg:undefined }];
  try{ history.pushState({ n:1 }, ""); }catch(e){}
  anaMenu();
 }catch(e){ window.__acildi = true; window.__basliyor = false; acilisHatasi(String(e.message||e)); }
}
baslat();
